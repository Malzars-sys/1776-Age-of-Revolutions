l_english:
 phase1_japan_tenpo.1.t: "The Lessons of the Tenmei Famine"
 phase1_japan_tenpo.1.d: "The memory of the Tenmei famine still weighs heavily on villages and domain officials. Even in calmer years, fragile harvests remind the Bakufu that rural hardship can become political danger."
 phase1_japan_tenpo.1.f: "Granaries are counted, riverbanks inspected, and petitions copied in careful hands. The countryside has survived, but few believe it has been made secure."
 phase1_japan_tenpo.1.a: "Strengthen the reserves."
 phase1_japan_tenpo.1.b: "Relieve the hardest-hit villages."
 phase1_japan_tenpo.1.c: "Let the domains handle their own burdens."
 phase1_japan_tenpo.2.t: "Kansei Reforms"
 phase1_japan_tenpo.2.d: "The Bakufu has answered recent hardship with renewed discipline. Frugality, order, and careful administration are presented as the surest ways to preserve the Tokugawa settlement."
 phase1_japan_tenpo.2.f: "In Edo, reform is written in the language of restraint. Luxury is suspect, debt is dangerous, and every official insists that virtue begins with obedience."
 phase1_japan_tenpo.2.a: "Reassert Bakufu discipline."
 phase1_japan_tenpo.2.b: "Make rural relief visible."
 phase1_japan_tenpo.2.c: "Leave more to the domains."
 phase1_japan_tenpo.3.t: "Repel Foreign Vessels"
 phase1_japan_tenpo.3.d: "Unfamiliar sails appear with troubling frequency near Japanese waters. The closed country policy still holds, but each sighting feeds new arguments over vigilance, trade, and coastal defense."
 phase1_japan_tenpo.3.f: "A report from the coast reaches Edo with salt still dried into the paper. The ship did not land, yet everyone who reads the account imagines the day one will."
 phase1_japan_tenpo.3.a: "Enforce the edict strictly."
 phase1_japan_tenpo.3.b: "Respond with caution."
 phase1_japan_tenpo.3.c: "Treat these incidents as distant noise."
 phase1_japan_tenpo.4.t: "Troubling Harvests"
 phase1_japan_tenpo.4.d: "Reports from the countryside speak of poor weather, anxious cultivators, and rice stores that no longer look as comfortable as they should. The signs are not yet a national crisis, but they are difficult to ignore."
 phase1_japan_tenpo.4.f: "The ledgers are dry things until the numbers grow thin. Then each line begins to sound like a household deciding what it can do without."
 phase1_japan_tenpo.4.a: "Watch the granaries closely."
 phase1_japan_tenpo.4.b: "Press the domains for assurances."
 phase1_japan_tenpo.5.t: "The Price of Rice Rises"
 phase1_japan_tenpo.5.d: "Rice prices are climbing faster than officials can explain them away. Merchants blame weather and transport; villagers blame hoarding; the Bakufu hears anger beneath every answer."
 phase1_japan_tenpo.5.f: "In the market, a sack of rice has become a rumor with weight. It passes from hand to hand, always more expensive than it was yesterday."
 phase1_japan_tenpo.5.a: "Open emergency stores."
 phase1_japan_tenpo.5.b: "Control the worst profiteering."
 phase1_japan_tenpo.5.c: "Let local authorities manage the pressure."
 phase1_japan_tenpo.6.t: "The Tenpō Famine Begins"
 phase1_japan_tenpo.6.d: "Years of warning have become a crisis. Bad harvests, high rice prices, and rising unrest now force the Bakufu to confront a famine that threatens both the countryside and the authority built upon it."
 phase1_japan_tenpo.6.f: "The name of the era promises heavenly protection. In the villages, people ask whether heaven has heard them."
 phase1_japan_tenpo.6.a: "The crisis can no longer be delayed."

