l_english:
 combat_unit_group_aor1776_engineers:0 "Engineers"
 combat_unit_group_aor1776_engineers_desc:0 "Sappers and officers trained in siege works and opening assault routes."
 combat_unit_type_aor1776_engineer_corps:0 "Engineer Corps"
 combat_unit_type_aor1776_engineer_corps_desc:0 "Sappers trained to dig approaches, open breaches and cross enemy works. They accompany the infantry with the tools needed for siege operations.\n\nThe reductions shown affect enemy land fortification bonuses in the battle in which these sappers take part."
 unit_aor1776_enemy_fort_territorial_protection_add:0 "Enemy Fort Territorial Protection"
 unit_aor1776_enemy_fort_territorial_protection_add_desc:0 "$aor1776_engineer_fort_reduction_desc$"
 unit_aor1776_enemy_fort_casualty_protection_add:0 "Enemy Fort Casualty Protection"
 unit_aor1776_enemy_fort_casualty_protection_add_desc:0 "$aor1776_engineer_fort_reduction_desc$"
 unit_aor1776_enemy_fort_defense_add:0 "Enemy Fort Defense Bonus"
 unit_aor1776_enemy_fort_defense_add_desc:0 "$aor1776_engineer_fort_reduction_desc$"
 aor1776_engineer_fort_reduction_desc:0 "Each battalion of 1,000 men engaged in the battle removes one percentage point from this protection. It takes 25, 50 or 75 battalions to neutralize five fully garrisoned levels, depending on the fortification method. The effect scales with the men present and cannot exceed the fort bonus."
