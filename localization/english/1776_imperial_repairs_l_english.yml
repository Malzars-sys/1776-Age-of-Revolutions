l_english:
 aor1776_hre.ack:0 "We shall take note before the Diet."
 aor1776_hre_liberate_estate:0 "Liberation of an imperial estate"
 war_goal_aor1776_hre_liberate_estate:0 "Liberation of an imperial estate"
 war_goal_aor1776_hre_liberate_estate_type_name:0 "Liberation of an imperial estate"
 war_goal_aor1776_hre_liberate_estate_name:0 "Liberate [SCOPE.sCountry('target_country').GetName]"
 war_goal_aor1776_hre_liberate_estate_desc:0 "Free [SCOPE.sCountry('target_country').GetName] from its overlord. Occupation requirements concern the targeted estate, not the external overlord’s capital."
 war_goal_aor1776_hre_liberate_estate_on_enforced:0 "[SCOPE.sCountry('target_country').GetName] becomes independent; its wrongly held registered imperial provinces are restored and its imperial membership is re-established."
 dp_aor1776_hre_subject_release_tooltip:0 "Select an imperial subject of the refusing external power. Each targeted subject receives its own primary liberation goal. Occupy the targeted estates, not the foreign capital."
 aor1776_hre_enforce_internal_restitution:0 "Enforce imperial restitution"
 aor1776_hre_enforce_internal_restitution_desc:0 "An imperial estate must immediately restore the listed registered provinces. It cannot refuse unless the Emperor owes it an obligation; that case uses the approval-based request instead."
 aor1776_hre_reply_infamy:0 "[SCOPE.sCountry('hre_reply_new_infamy_holder').GetName] received 5 infamy for this first refusal. The imperial casus belli lasts ten years; existing truces remain binding."
