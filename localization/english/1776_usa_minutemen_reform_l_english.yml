l_english:
 law_aor1776_reorganized_militia:0 "Reorganized National Militia"
 law_aor1776_reorganized_militia_desc:0 "Common registers, permanent cadres and regular service schedules coordinate the state militias. This organization requires greater resources and leaves less room for improvised musters, but can sustain the national military effort for longer."
 aor1776_review_revolutionary_militias:0 "Review the Reorganization of the Militias"
 aor1776_review_revolutionary_militias_desc:0 "Bring a plan for coordinating the state militias before Congress. It may begin a reform process or retain the minuteman companies. Adopting a new organization will depend on the necessary knowledge and political support."
 aor1776_usa_minutemen_reorganization.1.t:0 "The Reorganization of the Revolutionary Militias"
 aor1776_usa_minutemen_reorganization.1.d:0 "The minuteman companies answered the first alarms, but local practices make sustained service difficult to coordinate. Congress is considering a common administration for recruitment, training and service periods. A reorganized national militia would retain the existing forces, with more regular training and recruitment, at the price of higher upkeep and slower mobilization. We may begin this reform or preserve the present companies."
 aor1776_usa_minutemen_reorganization.1.f:0 "The secretary laid two registers on the table. In the first, every town had its own list, dates and promises. In the second, the same names would at last follow the same schedule. A delegate turned a few pages, then asked who would pay the men kept away from their fields."
 aor1776_usa_minutemen_reorganization.1.a:0 "Let us reorganize our militias!"
 aor1776_usa_minutemen_reorganization.1.b:0 "The Minute Men have proven their worth!"
 aor1776_minutemen_reform_technology_tt:0 "Engineer Corps must be researched to unlock the new organization."
 aor1776_minutemen_reform_free_enactment_tt:0 "No other law enactment may be in progress."
 aor1776_minutemen_reform_political_support_tt:0 "The government must have at least 25 legitimacy and enough support for a positive enactment chance."
 aor1776_minutemen_reform_start_tt:0 "Begin enacting the Reorganized National Militia. The Minutemen remain in force until the law is adopted. Compared with the present companies, the new law raises the conscription rate by 1 percentage point and training speed by 5 points, but lowers mobilization speed by 15 points and raises military goods costs by 5 points. Existing units and commanders are retained."
 aor1776_minutemen_reform_keep_tt:0 "Retain the minuteman companies and their current effects. The plan may be revisited later through ordinary military law enactment, once its requirements are met."
