 state_aor1776_imperial_conquest_infamy_mult:0 "Additional infamy for conquering this state"
 state_aor1776_imperial_conquest_infamy_mult_desc:0 "Applied only to the Conquer State war goal. Imperial restitution is exempt."
 aor1776_hre_registered_territory:0 "Registered imperial territory"
 aor1776_hre_registered_territory_desc:0 "This state contains registered imperial provinces, even under foreign control. Conquering it generates 25% additional infamy. The marker does not claim that every province in the entire state region is imperial."
 je_aor1776_hre_situation:0 "Holy Roman Empire"
 je_aor1776_hre_situation_reason:0 "The imperial estates share rights and obligations without becoming provinces of the Emperor. The yellow map shows the registered imperial extent regardless of its occupiers. Consult the list for current holders."
 je_aor1776_hre_situation_status:0 "Provinces under imperial authority: [JournalEntry.GetCountry.MakeScope.Var('aor1776_hre_under_authority').GetValue|0]/278\nOutside imperial authority: [JournalEntry.GetCountry.MakeScope.Var('aor1776_hre_outside_provinces').GetValue|0]\nElectors with negative relations: [JournalEntry.GetCountry.MakeScope.Var('aor1776_hre_hostile_electors').GetValue|0] (−5 each)\nFree cities with negative relations: [JournalEntry.GetCountry.MakeScope.Var('aor1776_hre_hostile_cities').GetValue|0] (−3 each)"
 je_aor1776_hre_vote:0 "The imperial election"
 je_aor1776_hre_vote_status:0 "The electoral crowns deliberate. The majority cannot install an Emperor before thirty days have passed."
 aor1776_hre_vote_button_desc:0 "Cast your vote for this country. A still-binding electoral promise must be respected."
 aor1776_hre_map_legend:0 "Yellow: registered imperial provinces, regardless of owner. Grey: other land; blue: water."
 aor1776_hre_states_heading:0 "Current states containing registered imperial provinces"
 aor1776_hre_map_toggle:0 "Show / hide the imperial map"
 aor1776_hre_elector_card_tt:0 "Recognised imperial elector: [Country.GetName]\nRelations with the Emperor: [Country.MakeScope.Var('aor1776_hre_relation_to_emperor').GetValue|=0]\nOpen this country to negotiate an electoral pledge in the native treaty editor."
 aor1776_hre_emperor_person:0 "Emperor: [JournalEntry.GetCountry.MakeScope.Var('aor1776_hre_ui_person').GetCharacter.GetFullNameNoFormatting]\nImperial country: [JournalEntry.GetCountry.MakeScope.Var('aor1776_hre_ui_emperor').GetCountry.GetName]"
 aor1776_hre_cannot_expel_tt:0 "An imperial estate cannot be expelled by a simple decision of the Emperor. Leaving the Empire requires an enforced secession demand."
 aor1776_hre.41.t:0 "Our imperial rights are upheld"
 aor1776_hre.41.d:0 "Without a recognised secession, our estate remains part of the Empire. An invalid exclusion has been reversed and our membership restored."
 aor1776_hre.41.a:0 "Our place in the Empire is preserved."
