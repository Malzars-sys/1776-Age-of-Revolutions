 aor1776_electoral_promise:0 "Pledge an imperial electoral vote"
 aor1776_electoral_promise_desc:0 "The elector pledges its next imperial ballot to the other treaty party while the binding period lasts. Negotiate money or other articles in exchange. After expiry the elector is free again. The commitment does not make an ineligible candidate eligible."
