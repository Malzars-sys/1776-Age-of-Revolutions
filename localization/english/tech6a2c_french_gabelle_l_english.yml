l_english:
  je_gabelle: "The Gabelle"
  je_gabelle_reason: "The Gabelle is France's long-established tax on salt. It provides the Crown with dependable revenue, but its unequal collection and the burden it places on ordinary households make it deeply unpopular."
  je_gabelle_complete_header: "About this [concept_journal_entry]:\n"
  je_gabelle_desc: "While [ROOT.GetCountry.GetName] levies a [concept_consumption_tax] on @salt! #b $salt$#!, the Gabelle and its effects remain active. Removing the tax ends this phase; restoring it makes the appropriate phase available again at the next administrative check."
  je_gabelle_reform_goal: "The Gabelle has been reformed"
  je_gabelle_reformed: "The Reformed Gabelle"
  je_gabelle_reformed_reason: "The salt tax has been reformed to reduce its burden on ordinary households while preserving part of its fiscal yield."
  je_gabelle_reformed_desc: "The reformed Gabelle remains in force while [ROOT.GetCountry.GetName] levies a [concept_consumption_tax] on @salt! #b $salt$#!. After removal, restoring the tax makes this phase available again at the next administrative check."
  je_gabelle_suspended: "The Suspended Gabelle"
  je_gabelle_suspended_reason: "Legacy transitional phase pending cleanup."
  je_gabelle_suspended_desc: "This technical phase closes once France taxes @salt! #b $salt$#! again. The monthly controller restores the active Gabelle separately."
  je_gabelle_restore_header: "Restoring the Gabelle:\n"
  je_gabelle_restore_goal: "France taxes Salt again"

  gabelle_income:0 "The Gabelle"
  gabelle_income_reformed:0 "Reformed Gabelle"
  gabelle_income_active:0 "The Gabelle"
  gabelle_income_reformed_active:0 "Reformed Gabelle"
  modifier_suppress_dissent:0 "Suppress Dissent"

  lagab_france.1.t: "Crisis of Legitimacy"
  lagab_france.1.d: "The salt tax has become a rallying point for opposition to the government during the unfolding revolutionary crisis."
  lagab_france.1.f: "Protests erupt across the country as citizens denounce the Gabelle and the unequal burdens it imposes. The government faces mounting pressure to restore order or abandon the tax."
  lagab_france.1.a: "Enforce order at all costs."
  lagab_france.1.b: "Make some empty promises."
  lagab_france.1.c: "Abolish the Gabelle."

  lagab_france.2.t: "Voices of Reform"
  lagab_france.2.d: "[SCOPE.sPoliticalMovement('political_movement_scope').GetName] calls for reform of the Gabelle."
  lagab_france.2.f: "Members of [SCOPE.sPoliticalMovement('political_movement_scope').GetName] publicly condemn the salt tax as unfair and excessively burdensome. They demand a system that protects ordinary households without depriving the state of all its revenue."
  lagab_france.2.a: "Negotiate a fairer Gabelle."
  lagab_france.2.b: "Suppress them."
