l_english:
 age_of_revolution_frontend_subtitle:0 "Age of Revolution"

 objective_egalitarian_society_name_USA:0 "#v $dyn_c_thirteen_colonies$#!"
 objective_egalitarian_society_desc_USA:0 "#lore The Thirteen Colonies remain a British colony in law, yet George Washington leads a presidential republic already fighting for independence with French and Spanish support. Wealth governs political participation, and slavery divides the liberty proclaimed by the rebellion. Military survival must be followed by institutions capable of holding the states together.#!"
 objective_egalitarian_society_name_PLC:0 "#v Polish-Lithuanian Commonwealth#!"
 objective_egalitarian_society_desc_PLC:0 "#lore Stanisław August Poniatowski presides over an elective Commonwealth still shaped by magnate oligarchy, serfdom, and the liberties of its nobility. The first partition has strengthened Austria, Prussia, and Russia around its frontiers, while the reform journal calls for the state to recover its strength. Change may preserve the union, but every reform risks resistance at home and intervention abroad.#!"

 objective_hegemon_name_GBR:0 "#v Great Britain#!"
 objective_hegemon_desc_GBR:0 "#lore George III governs a wealthy maritime monarchy whose reach extends through Caribbean colonies, Canadian provinces, chartered companies, and possessions across the oceans. The Thirteen Colonies are nevertheless in open revolt, backed by France and Spain, while those powers remain British rivals. Fleet, credit, and commerce offer formidable strength, but restoring authority may demand choices between coercion, compromise, and wider war.#!"
 objective_hegemon_name_RUS:0 "#v Russia#!"
 objective_hegemon_desc_RUS:0 "#lore Catherine Romanov rules an autocratic empire built upon hereditary administration, serfdom, and peasant levies. Russian influence presses toward the Baltic, the steppe, the Caucasus, and the Black Sea, where rivalry with the Ottoman Empire remains central; protectorates and a chartered Alaskan company extend that reach still farther. Expansion promises stature, but distance and social rigidity may test the state’s cohesion.#!"
