l_english:
 age_of_revolution_frontend_subtitle:0 "Age of Revolution"

 objective_egalitarian_society:0 "Age of Revolutions"
 objective_egalitarian_society_desc:0 "From Philadelphia to Paris, the political order of the Ancien Régime is beginning to fracture. Carry a revolution forward, transform your institutions, and survive the counter-revolutions that will seek to crush it."
 objective_egalitarian_society_name_FRA:0 "#v France#!"
 objective_egalitarian_society_desc_FRA:0 "#lore The French monarchy still appears powerful, but debt, privilege, and social tensions are weakening the foundations of the realm. Will you reform the kingdom, or will Revolution sweep away the Ancien Régime?#!"
 objective_egalitarian_society_name_USA:0 "#v $dyn_c_thirteen_colonies$#!"
 objective_egalitarian_society_desc_USA:0 "#lore The Thirteen Colonies have risen in rebellion against London. Turn a war for independence into a new political order, secure liberty, and give lasting form to the young republic.#!"
 objective_egalitarian_society_name_PLC:0 "#v Polish-Lithuanian Commonwealth#!"
 objective_egalitarian_society_desc_PLC:0 "#lore Caught between noble privilege, reform, and the ambitions of its neighbors, the Commonwealth must transform itself to survive. Reform the state before the surrounding powers decide its future for it.#!"

 objective_hegemon:0 "Imperial Rivalries"
 objective_hegemon_desc:0 "The old order is anything but static. The great powers compete for seas, colonies, subjects, and prestige. Strengthen the state, build alliances, and assert your empire before revolution reshapes the world."
 objective_hegemon_name_GBR:0 "#v Great Britain#!"
 objective_hegemon_desc_GBR:0 "#lore Britain enters 1776 as the leading maritime power, commanding a vast empire while facing rebellion in North America. Preserve the empire, dominate the seas, and contain your rivals.#!"
 objective_hegemon_name_SPA:0 "#v Spain#!"
 objective_hegemon_desc_SPA:0 "#lore Spain still rules a vast transatlantic empire. Reform the state, defend the colonies, and prevent both rival powers and revolutionary ideas from eroding imperial strength.#!"
 objective_hegemon_name_RUS:0 "#v Russia#!"
 objective_hegemon_desc_RUS:0 "#lore Russia is a continental giant whose influence reaches toward Europe, the Black Sea, and Asia. Modernize the state and turn that immense scale into lasting power.#!"
 objective_hegemon_name_PRU:0 "#v Prussia#!"
 objective_hegemon_desc_PRU:0 "#lore Prussia commands a feared army but remains caught between greater powers. Discipline, diplomacy, and expansion must carry it into the first rank of Europe.#!"

 egalitarian_society_welcome:0 "Age of Revolutions"
 egalitarian_society_welcome_desc:0 "Welcome to the Age of Revolutions Player Objective. A series of [Concept('concept_journal_entry', '$concept_journal_entries$')] will guide you as you transform your institutions and build a new political order."
 liberalizing_the_government_complete_desc:0 "With your first Journal Entry complete, the transformation of your institutions has begun."
 liberalizing_the_government_complete_1_desc:0 "Well done! You have completed your first objective and taken a decisive step into the Age of Revolutions."
 egalitarian_society_complete:0 "Age of Revolutions Completed"
 egalitarian_society_complete_desc:0 "Well done! You have completed the Age of Revolutions Objective. Feel free to continue playing or try a different objective."

 hegemon_welcome:0 "Imperial Rivalries"
 hegemon_welcome_desc:0 "Welcome to the Imperial Rivalries Player Objective. A series of [Concept('concept_journal_entry', '$concept_journal_entries$')] will guide you as you strengthen the state and assert your empire."
 je_colonization_laws_reason:0 "The first step toward greater imperial influence is to expand our reach overseas. We should amend our laws to allow colonization and advance our ambitions."
 je_african_colonies_reason:0 "Now that our laws allow colonies, we should acquire new lands in Africa and expand our imperial reach."
 je_the_hegemon:0 "Imperial Supremacy"
 colonization_law_passed_complete_1_desc:0 "Well done! You have completed your first objective and begun to assert your empire."
 hegemon_complete:0 "Imperial Rivalries Completed"
 hegemon_complete_desc:0 "Well done! You have completed the Imperial Rivalries Objective. Feel free to continue playing or try a different objective."
