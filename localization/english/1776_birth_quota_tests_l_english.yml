 birth_quota_tests.1.d: "The nine birth quota amendments:\n\n• $amendment_birth_quota_landowner_authority$\n• $amendment_birth_quota_devout_patronage$\n• $amendment_birth_quota_military_households$\n• $amendment_birth_quota_family_shops$\n• $amendment_birth_quota_rural_exemptions$\n• $amendment_birth_quota_industrial_exemptions$\n• $amendment_birth_quota_education_guarantees$\n• $amendment_birth_quota_worker_protections$\n• $amendment_birth_quota_housewife_wage$\n\nHover over the add button to inspect the effects of any missing amendments. Clicking attaches them to the law: use a test save. Birth quotas must already be in force."
