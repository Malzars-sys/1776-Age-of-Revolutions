l_english:
 ship_type_early_troop_ship:0 "Cog"
 ship_type_early_troop_ship_desc:0 "A merchant vessel of the North and Baltic seas, the cog accompanied the growth of Hanseatic trade during the Middle Ages. Its hull and hold carry substantial cargoes. Requisitioned for naval service, it transports troops, provisions and equipment and supports landings."
