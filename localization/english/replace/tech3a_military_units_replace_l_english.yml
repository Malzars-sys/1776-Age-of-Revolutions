 combat_unit_type_musket_infantry:0 "Musket Infantry"
 combat_unit_type_musket_infantry_desc:0 "Organized infantry equipped with standardized smoothbore muskets, more effective than irregular troops but not yet trained to later line standards."
 combat_unit_type_cannon_artillery:0 "Bombard"
 combat_unit_type_cannon_artillery_desc:0 "Heavy early guns suited to siege and battlefield support, but less effective and less mobile than standardized field cannon."
 combat_unit_type_improved_cannon_artillery:0 "Field Cannon"
 combat_unit_type_improved_cannon_artillery_desc:0 "Standardized field pieces and trained crews provide stronger battlefield fire than early bombards."
