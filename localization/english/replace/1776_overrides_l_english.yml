 # From hotfix_zaibatsu_l_english.yml
 je_zaibatsu: "The Corporate Empire"
 je_zaibatsu_reason: "The rapid industrialization of [ROOT.GetCountry.GetName] has brought much of the economy under the umbrella of the [concept_zaibatsu]. Profiting handsomely from their entanglement with state institutions, these enterprises have become vital organs within the military-industrial structure of #v $JAP$#!.\n\nThe concentrated nature of [ROOT.GetCountry.GetAdjectiveNoFormatting] capital has made the country an international competitor, at the price of placing ever-greater political power in the hands of the Zaibatsu and their military patrons.[SCOPE.GetRootScope.GetCountry.GetCustom('zaibatsu_democracy_snippet')]\n$ZAIBATSU_LIST_HEADER$$ZAIBATSU_LIST_CONTENT$"
 je_zaibatsu_complete_header: "To #b cement#! the Zaibatsu:\n"
 je_zaibatsu_on_complete_header: "On #b cementing#! the Zaibatsu:\n$EFFECT$"
 je_zaibatsu_fail_header: "To #b curtail#! the Zaibatsu:\n"
 je_zaibatsu_on_fail_header: "On #b curtailing#! the Zaibatsu:\n$EFFECT$"
 zaibatsu_democracy_info: "\n\nWhilst this [concept_journal_entry] is active, [concept_electoral_confidence] will decline by #v 0.5%#! per month"
 two_more_more_company_slots_tt: "Can establish more than [SCOPE.ScriptValue('je_zaibatsu_company_slots_threshold')|v0] [Concept('concept_company','$concept_companies$')]"
 glossary_zaibatsu: "A #b #italic Zaibatsu#!#! is a family-owned and vertically-integrated industrial and financial conglomerate.\n\nA typical zaibatsu is organized around a holding company and a bank, which hold ownership shares in several, typically industrial, subsidiary companies. The zaibatsu emerged from family merchant congolomerates of the late Edo period, which made use of their pre-existing wealth and ties to the state to consolidate control of much of Japan's industrial base."
 country_levels_owned_by_zaibatsu_100_tt: "Greater than [SCOPE.ScriptValue('je_zaibatsu_possible_levels_threshold')|v0] [Concept('concept_building_level','$concept_building_levels$')] are owned by the [concept_zaibatsu] (currently [SCOPE.ScriptValue('country_levels_owned_by_zaibatsu')|v0])"
 country_levels_owned_by_zaibatsu_250_tt: "Greater than [SCOPE.ScriptValue('je_zaibatsu_complete_levels_threshold')|v0] [Concept('concept_building_level','$concept_building_levels$')] are owned by the [concept_zaibatsu] (currently [SCOPE.ScriptValue('country_levels_owned_by_zaibatsu')|v0])"
 fraction_of_country_levels_owned_by_zaibatsu_ge_to_10_tt: "[Concept('concept_building_level','$concept_building_levels$')] owned by the [concept_zaibatsu] are greater than or equal to [SCOPE.ScriptValue('je_zaibatsu_possible_fraction_threshold')|v%0] of all [ROOT.GetCountry.GetAdjective] $concept_building_levels$ (currently [SCOPE.ScriptValue('fraction_of_country_levels_owned_by_zaibatsu')|v%])"
 fraction_of_country_levels_owned_by_zaibatsu_ge_to_25_tt: "[Concept('concept_building_level','$concept_building_levels$')] owned by the [concept_zaibatsu] are greater than or equal to [SCOPE.ScriptValue('je_zaibatsu_complete_fraction_threshold')|v%0] of all [ROOT.GetCountry.GetAdjective] $concept_building_levels$ (currently [SCOPE.ScriptValue('fraction_of_country_levels_owned_by_zaibatsu')|v%])"
 fraction_of_country_levels_owned_by_zaibatsu_less_than_10_tt: "[Concept('concept_building_level','$concept_building_levels$')] owned by the [concept_zaibatsu] are less than [SCOPE.ScriptValue('je_zaibatsu_possible_fraction_threshold')|v%0] of all [ROOT.GetCountry.GetAdjective] $concept_building_levels$ (currently [SCOPE.ScriptValue('fraction_of_country_levels_owned_by_zaibatsu')|v%])"
 voting_power_wealth_threshold_below_10_tt: "[concept_wealth] Threshold for Voting is below [SCOPE.ScriptValue('je_zaibatsu_fail_voting_power_threshold')|v0]"
 modifier_zaibatsu_oligarchy: "Zaibatsu Oligarchy"
 modifier_zaibatsu_oligarchy_democratic: "$modifier_zaibatsu_oligarchy$"
 ZAIBATSU_LIST_HEADER: "$TOOLTIP_DELIMITER$\nActive [concept_zaibatsu] in [ROOT.GetCountry.GetName]:"
 ZAIBATSU_LIST_CONTENT: "#indent_newline:3 \n[GetScriptedGui('je_zaibatsu_companies_sgui').ExecuteTooltip(GuiScope.SetRoot(ROOT.GetCountry.MakeScope).End)]#!"
 ZAIBATSU_LIST_ENTRY: "[THIS.GetCompany.GetCompanyType.GetName] ([THIS.GetCompany.GetProsperity|v] [concept_prosperity]): [THIS.GetCompany.GetNumOwnedBuildingLevels|v] owned [Concept('concept_building_level','$concept_building_levels$')]"
 ZAIBATSU_LIST_EMPTY: "No [ROOT.GetCountry.GetAdjectiveNoFlag] [concept_company] is a [concept_zaibatsu]"
 command_economy_or_cooperative_ownership_tt: "Has any variant of [GetLawType('law_command_economy').GetName] or [GetLawType('law_cooperative_ownership').GetName] enacted"
 zaibatsu.1.t: "The Corporate Empire"
 zaibatsu.1.d: "The enduring partnership between the [ROOT.GetCountry.GetAdjective] state and the [SCOPE.gsInterestGroup('zaibatsu_ig').GetName] has cemented the power of the conglomerates within [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]. The politicians may govern, but the generals and executives will rule."
 zaibatsu.1.f: "[SCOPE.sCharacter('pm_scope').GetFullNameNoFormatting] looked down upon the bout from [SCOPE.sCharacter('pm_scope').GetHerHis] covered box. [SCOPE.sCharacter('pm_scope').GetHerHis|U] preferred wrestler's opponent had pushed [SCOPE.sCharacter('pm_scope').GetHerHis] champion to the very edge of the rice-straw ring, and [SCOPE.sCharacter('pm_scope').GetSheHe] had found [SCOPE.sCharacter('pm_scope').GetHerselfHimself] struggling to keep [SCOPE.sCharacter('pm_scope').GetHerHis] knuckles from going white. At the Prime Minister's side, perfectly serene, stood [SCOPE.sCharacter('relevant_zaibatsu_exec').GetFullNameNoFormatting].\n\nThe referee pointed his fan, and cheer rose from the lower seats. A rain of seat cushions flew through the air, showering the ring. [SCOPE.sCharacter('relevant_zaibatsu_exec').GetFirstNameNoFormatting] turned his head towards [SCOPE.sCharacter('pm_scope').GetFirstNameNoFormatting], and smiled. There, on the far side of the ring, stamped into one of the walls, was the #italic mon#! of [SCOPE.sCompany('relevant_zaibatsu').GetNameNoFormatting]."
 zaibatsu.1.a: "Let [ROOT.GetCountry.GetCapital.GetCityHubName] unfold like a sea of light."
 zaibatsu.1.b: "Our supply chain could always be more secure."
 zaibatsu.2.t: "Locked Down"
 zaibatsu.2.t_1: "The Leveling Hand"
 zaibatsu.2.d: "The efforts of the [SCOPE.sCharacter('pm_scope').GetLastName] cabinet have curtailed the abilities of the [SCOPE.gsInterestGroup('zaibatsu_ig').GetName] to exert control over [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]. The politicians will rule, and the executives shall focus on their profits."
 zaibatsu.2.d_1: "The [SCOPE.sCharacter('pm_scope').GetLastName] cabinet's policies of free trade have eroded the network of military-industrial contracts key to the [SCOPE.gsInterestGroup('zaibatsu_ig').GetName]'s control over [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]. The politicians will rule, and the executives shall focus on their profits."
 zaibatsu.2.f: "A flock of executives filtered into the uppermost meeting room of the [SCOPE.sCompany('relevant_zaibatsu').GetNameNoFormatting] headquarters. [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] was third to enter, after the secretaries. [SCOPE.sCharacter('name_a_scope').GetSheHe|U] took [SCOPE.sCharacter('name_a_scope').GetHerHis] seat by the door, and watched [SCOPE.sCharacter('name_a_scope').GetHerHis] seniors pass by. A weak trickle of steam wafted off the cup of tea before [SCOPE.sCharacter('name_a_scope').GetHerHim].\n\n[SCOPE.sCharacter('relevant_zaibatsu_exec').GetFullNameNoFormatting] was the last to enter. [SCOPE.sCharacter('relevant_zaibatsu_exec').GetHerHis|U] gaze passed over each of [SCOPE.sCharacter('relevant_zaibatsu_exec').GetHerHis] employees in turn. There was a look in [SCOPE.sCharacter('relevant_zaibatsu_exec').GetHerHis] eyes, [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] noticed, one that the Baron had never shown before. Exhaustion. The shadows cast on [SCOPE.sCharacter('relevant_zaibatsu_exec').GetHerHis] face seemed deeper than before, and [SCOPE.sCharacter('relevant_zaibatsu_exec').GetHerHis] silver hair ever thinner."
 zaibatsu.2.a: "Sovereign power is ours alone."
 zaibatsu.2.b: "Let the people know-[SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] will not be bought."
