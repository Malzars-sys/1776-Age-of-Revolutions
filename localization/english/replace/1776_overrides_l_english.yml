 # From mod_v2content_l_english.yml
 objective_tutorial_desc: "Learn Victoria 3 through guided challenges while governing a country already shaped by the institutions and rivalries of 1776. Each recommended starting position offers room to practise budgets, construction, politics, diplomacy, technology, and warfare without prescribing a single historical outcome. Stabilize the state you inherit, then decide which parts of the old order should survive the age of revolutions."
 objective_tutorial_name_SWE: "#v $SWE$#!"
 objective_tutorial_desc_SWE: "#lore Sweden is an established northern monarchy whose iron exports, professional navy, and educated institutions provide a firm base for learning the economy. Clergy and landowners dominate an oligarchic and mercantilist order, while serfdom and national supremacy constrain reform. Balance Russia and Prussia, manage the German puppets of Lübeck, Mecklenburg, and Münster, and choose whether disciplined modernization can restore Swedish influence.#!"
 objective_tutorial_name_DAI: "#v $DAI$#!"
 objective_tutorial_desc_DAI: "#lore Đại Nam begins as a traditional, unrecognized kingdom with a landowning elite, debt slavery, freedom of conscience, and an economy strengthened by sericulture. Cambodia pays tribute, while relations with Siam are openly hostile and China regards the court with suspicion. Consolidate the realm, learn to reform laws and production without provoking collapse, and build the diplomatic and military strength needed to defend mainland Southeast Asia.#!"
