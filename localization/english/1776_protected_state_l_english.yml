 subject_type_aor1776_protected_state_desc:0 "A client state acknowledges an unrecognized country’s suzerainty without paying regular tribute. It retains its government, armed forces and diplomatic initiatives, and does not automatically join its overlord’s wars. Closer subordination makes it a tributary, then a vassal before possible integration."
