l_english:
 ship_type_caravel:0 "Caravel"
 ship_type_caravel_desc:0 "Developed in Iberia, caravels accompanied Atlantic exploration during the fifteenth and sixteenth centuries. Their sailing rigs supported long voyages. In the fleet, they provide naval power projection, blockade and support for landings."
 ship_type_galley:0 "Galley"
 ship_type_galley_desc:0 "Long and narrow, galleys combine oars and sails. They served Mediterranean navies for centuries, using rowing power to maneuver near the coast. Bow batteries and boarding troops defend ports and straits; operating far from their bases reduces their effectiveness."
 ship_type_cog:0 "Cog"
 ship_type_cog_desc:0 "A merchant vessel of the North and Baltic seas, the cog accompanied the growth of Hanseatic trade during the Middle Ages. Its hull and hold carry substantial cargoes. Requisitioned for naval service, it transports troops, provisions and equipment and supports landings."
