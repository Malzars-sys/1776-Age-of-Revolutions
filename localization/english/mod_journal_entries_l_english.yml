 je_irish_question: "The Irish Question"
 je_irish_question_reason: "Since the American Revolution these ideals of nationalism and republicanism has spread all across the British Empire. The Irish are overwhelmingly over represented in the British Army, but not in their Island. While the island can provide a springboard for invaders if it goes in the wrong hands, a solution must be found before it's too late."
 
 je_usa_independence: "American Revolution"
 je_usa_independence_reason: "We have declared ourselves independent from Great Britain, who's tyranny restricts what we consume with their insane tariffs, they control what we make and even where we dare to colonise, we will fight till the end!"
 

 je_venetian_empire_reason: "After this long period of decline our rising nationalists call for change, to gain our dominance and overseas territories back, with steel if need be."
 
 je_polish_partitions: "Partition of Poland"
 je_polish_partitions_reason: "Our enemies say the Polish-Lithuanian Commonwealth is an anarchy, a choatic state, weak and divided internally. Holding Ancestral Rus lands, it's clear it's not Polish, Lithuanian or a Commonwealth anymore. We must divide it between us to keep the peace, they say. Either we give into their demands or we're through."
 
 je_polish_partitions_button: "Press Partition"
 je_polish_partitions_button_desc: "We will partition Poland"
 
 je_polish_no_partitions_button: "No Partition"
 je_polish_no_partitions_button_desc: "We won't partake"
 
 polish_partitions.1.t: "An ultamatum!"
 polish_partitions.1.d: "Partition of Poland"
 polish_partitions.1.f: "Delegations arrived of our neighbours, each uncompromising, rhythmically hushed towns and sarcastic wit turned to raging fury, eventually calmed back down to diplomatic tone and then it went almost to blows. They can say all they want, about this will keep the peace, but alls they wanted is to take pieces of a neighbour like it was a birthday cake. The Nobles are in agreement, if we are to give in, we must build our strength after or be wiped off the map. Nor will they blame us for giving in."
 
 polish_partitions.1.a: "We can't fight it, there's no use"
 polish_partitions.1.b: "We won't go down that easily!"
 
 je_upgraded_brazil: "Upgrade Rule for Brazil"
 je_upgraded_brazil_reason: "Brazil has grown from just a colony and many feel it's rule needs to be upgraded to that of equal status within the Transatlantic Relationship, with upgraded rights and autonomy a truly equal political union can form."
 
 upgrade_brazil.1.t: "A New Brazil"
 upgrade_brazil.1.d: "People in Brazil chant for autonomy and equality within the Portugese Empire, a more perfect union"
 upgrade_brazil.1.f: "How can we be a colony, when we are bigger than Portugal in every way? We get bad governor after bad governor, with no way to vote them away, are they appointed out of merit? Why are we treated as just a resource bank to be exploited? Should we have to fight for independence like the USA to have our autonomy and rights. Forbid it comes to that for something so simple!"
 
 upgrade_brazil.1.a: "We will incorporate Brazil into Portugal proper, an equal political union"
 upgrade_brazil.1.b: "Brazil will be in a Personal Union with us, keeping much autonomy"
 upgrade_brazil.1.c: "Ask them what they want?"
 
 upgrade_brazil.2.t: "A New Brazil"
 upgrade_brazil.2.d: "The Portuguese Government says they want to create a more perfect union with us"
 upgrade_brazil.2.f: "How can we be a colony, when we are bigger than Portugal in every way? We get bad governor after bad governor, with no way to vote them away, are they appointed out of merit? Why are we treated as just a resource bank to be exploited? Should we have to fight for independence like the USA to have our autonomy and rights. Forbid it comes to that for something so simple!"
 
 upgrade_brazil.2.a: "Annexation is the way forward"
 upgrade_brazil.2.b: "Upgrade to Kingdom Status"
 
 upgrade_brazil.3.t: "Equality and Fraternity"
 upgrade_brazil.3.d: "Our time and labour have not gone to waste. This is the Portuguese Empires finest hour"
 upgrade_brazil.3.f: "They chant in the streets. We've found the best path and the greatest deal for both parties, we can't go back, colonial rule became outdated. They are our brothers in the Americas, we never doubted that for a second, now it's time to hammer their rights into law..."
 
 upgrade_brazil.3.a: "And it's done!"
 
 je_british_colonialism: "Expanding the Empire"
 je_british_colonialism_reason: "We have concluded our foreign policy goals, using our navy to control the seas and establish colonies for trading. We want the Cape, first made a trading post by the Dutch East India Company, it controls a very important trading route for Europe to reach Asia, we want an Arab proctectorate in the Strait or Hormuz, Ceylon to control routes around India and then we need a presence in the East Indies to control shipping coming from China. After we've gotten it Governments will be set up."
 
 british_colonialism_events.1.t: "Brittania Rules the Waves!"
 british_colonialism_events.1.d: "We now control all important trade routes and now can leverage that so the wealth to flow to our island. Our governors are now arriving to these distant lands."
 british_colonialism_events.1.f: "They jeer, how can we defeat the Britishers? They control the entire trade surplus of Asia! The cheap resources! If we try to fight them for it, they will use their navy to stop all OUR trade, whatevers left that's NOT apart of THEIR Empire anyway, what a dire situation..."
 
 british_colonialism_events.1.c: "It's good to be Emperor"
 
 je_cape_to_cairo: "Cape to Cairo"
 je_cape_to_cairo_reason: "More and more attention is being focused on Africa in the ever growing demand for resources, but we also carry the burden of being such a mighty civilisation and we must start bringing others upto our level of culture and enlightenment, the most momentous and aspirational goal is to build a railroad from the Cape to Cairo, linking Africa from top to bottom, creating trade routes turning harsh lands to developed bustling cities. The people glee in excitement at this idea, no matter how reasonable or unreasonable it is."
 
 british_colonialism_events.2.t: "A New World"
 british_colonialism_events.2.d: "New governments are being set up in Egypt and Sudan..."
 british_colonialism_events.2.f: "Our interests in these areas are protected, we've decided on a Dual Government with the Egyptian Khedive on the issue of Sudan,. Our civilising mission is going great, soon the railway will be built and we will have tremendous trading oppurtunities!"
 
 british_colonialism_events.2.c: "A great day for not only the British Empire, but the world."
 
 je_polish_partition_russia: "Partition of Poland"
 je_polish_partition_russia_reason: "Polish-Lithuanian Commonwealth has developed a client state Relationship with Russia and many European powers find it offensive, the Bar Confederation of Polish Nobles to try and get rid of Russian control failed, it's clear the only way to keep the peace while preserving the balance of power is to partition Polish lands between the Three Powers."
 
 je_polish_partition_prussia: "Partition of Poland"
 je_polish_partition_prussia_reason: "Polish-Lithuanian Commonwealth has developed a client state Relationship with Russia and many European powers find it offensive, the Bar Confederation of Polish Nobles to try and get rid of Russian control failed, it's clear the only way to keep the peace while preserving the balance of power is to partition Polish lands between the Three Powers."
 
 je_polish_partition_austria: "Partition of Poland"
