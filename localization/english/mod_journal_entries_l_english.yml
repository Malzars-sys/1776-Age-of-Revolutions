 revolutions_events_mod.1.t: "The Great Revolution"
 revolutions_events_mod.1.d_france: "The French People demand liberty, equality and democracy"
 revolutions_events_mod.1.d: "The French Revolution has spread to us!"
 revolutions_events_mod.1.f: "The people have trouble eating, they say let us eat cake, we have foreign enemies who are waiting for us to be weakened, they say let them die, this government could not rule a pig pen! We need a strong republic to represent us, the people demand to choose their representatives!"
 je_great_revolution: "The Great Revolution"
 je_great_revolution_reason: "Reform or Revolution, that is our choice"
 revolutions_events_mod.2.f: "We see how well it's working over there, the people have more power than ever, we just need to take power for ourselves now!"
 
 revolutions_events_mod.6.t: "End of the Revolution"
 revolutions_events_mod.6.d: "Through cunning, heart and smarts, we all came through in one piece"
 revolutions_events_mod.6.f: "The people are content, they live in comfort now, this was the Revolution to end all Revolutions. Leaders now clearly know they are there to serve the peoples first and foremost."
 
 revolutions_events_mod.7.t: "The Revolution is Victorious!"
 revolutions_events_mod.7.d: "The people had their say and their say is final"
 revolutions_events_mod.7.f: "The people have changed. The constitution is changed with it, the natural laws we had known our whole lives is thrown to the wind. Hierarchy, replaced with Egality and Fraternity. Loyalty to the Monarch, now loyalty to the nation. The world is forever changed."
 
 revolutions_events_mod.8.t: "The Revolution Vanquished!"
 revolutions_events_mod.8.d: "Honour has prevailed and it is final"
 revolutions_events_mod.8.f: "When they said loyalty should not be to a Crown or any ancestral hierachy, but to the nation and it's peoples, we rebuffed, the Crown and Hierachy protects the nations and it's peoples values, not due to what the mob thinks or due to who has the most money that day. Time will tell when they see the other foolish nations results, but for now we rest."
 
 great_revolution_underway_tt: "The Great Revolution Underway"
 
 revolutions_events_mod.11.t: "Partisan Newspapers"
 revolutions_events_mod.11.d: "The Newspapers print about egalitarian principles showing they are compromised"
 revolutions_events_mod.11.f: "Get your news about how to make makeshift bombs, how to barricade the streets, how the hate your monarch, burn down the nobles house! They talk too plainly!"
 
 revolutions_events_mod.11.a: "Censor the news!"
 revolutions_events_mod.11.b: "Let them be"
 revolutions_events_mod.11.c: "We have our censorship laws for a reason"
 
 revolutions_events_mod.12.t: "An Alternative for Our Lands..."
 revolutions_events_mod.12.d: "In all the choas, a new movement with new ideals arises"
 revolutions_events_mod.12.f: "A strong leader, militarized and regimented society, trains will arrive on time, get rid of the liberal insanity steaming through Europe. We call it ultra nationalism or fascism. They offer their help against the liberal plague."
 
 revolutions_events_mod.12.a: "Not only an ally but these people are heros!"
 revolutions_events_mod.12.b: "Traitors"
 
 revolutions_events_mod.13.t: "The fascists have a plan"
 revolutions_events_mod.13.d: "The Police must act more like a military to stop the brutality"
 revolutions_events_mod.13.f: "We will gather the police and our militias, then fight fire with fire to retain social control. Being too soft just eggs on the folk to go even harder, a harder stance must be taken."
 
 revolutions_events_mod.13.a: "This is the type of thought we need! Welcome them in!"
 revolutions_events_mod.13.b: "What can we do? Just don't write it into law"
 
 revolutions_events_mod.14.t: "Protests at the capital"
 revolutions_events_mod.14.d: "Down with monarchy, down with hierachy, down with injustice!"
 revolutions_events_mod.14.f: "Our demands are simple, just redo the whole system, is it so hard? Why must we scream in the streets and it fall on deaf ears?"
 
 revolutions_events_mod.14.a: "Uh oh"
 revolutions_events_mod.14.b: "Clear the streets!"
 