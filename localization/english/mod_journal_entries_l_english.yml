 je_new_imperialism: "New Imperialism"
 je_new_imperialism_reason: "Colonial governments are not mere administrations, but instruments of mercantilism. By formalizing governance that means tariffs, taxes, and monopolies can be enforced with greater efficiency, ensuring that wealth extracted from the colonies flows back to the metropole rather than lining the pockets of foreign rivals or local elites. Also setting up Citizenship laws for our peoples and creating a glass ceiling, we can create loyalists in these distant colonies."
