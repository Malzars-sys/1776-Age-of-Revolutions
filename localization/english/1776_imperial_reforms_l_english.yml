 country_aor1776_hre_authority_per_estate_add:0 "Authority per other imperial member"
 aor1776_hre_estates_authority:0 "Authority of the imperial estates"
 aor1776_hre_estates_authority_desc:0 "The Diet gives the Emperor 5, 10 or 15 authority per other recognised member actually in the bloc. Non-imperial subjects are excluded."
 aor1776_hre_authority_from_cohesion:0 "Imperial authority from cohesion above 40"
