l_english:
 aor1776_hre_group_diet:0 "Perpetual Diet"
 aor1776_hre_group_diet_desc:0 "Perpetual Diet — three levels of imperial cooperation."
 aor1776_hre_diet_1:0 "Perpetual Diet I"
 aor1776_hre_diet_1_desc:0 "Bonuses are the total for this level, not cumulative with lower tiers. New principles require cohesion above 40. On a change of imperial country, the last-added group is lost, or the sole group loses one level without going below I."
 aor1776_hre_diet_2:0 "Perpetual Diet II"
 aor1776_hre_diet_2_desc:0 "Bonuses are the total for this level, not cumulative with lower tiers. New principles require cohesion above 40. On a change of imperial country, the last-added group is lost, or the sole group loses one level without going below I."
