 aor1776_hre_group_circles:0 "Imperial Circles"
 aor1776_hre_group_circles_desc:0 "Imperial Circles — three levels of imperial cooperation."
 aor1776_hre_circles_1:0 "Imperial Circles I"
 aor1776_hre_circles_1_desc:0 "The Emperor defends all imperial members against outside powers. New principles require cohesion above 40. On a change of imperial country, the last-added group is lost, or the sole group loses one level without going below I."
 aor1776_hre_circles_2:0 "Imperial Circles II"
 aor1776_hre_circles_2_desc:0 "Previous obligation, and the Emperor joins members’ offensive plays against outside powers. New principles require cohesion above 40. On a change of imperial country, the last-added group is lost, or the sole group loses one level without going below I."
 aor1776_hre_circles_3:0 "Imperial Circles III"
 aor1776_hre_circles_3_desc:0 "Previous obligations, and members join the Emperor’s defensive and offensive plays against outside powers. New principles require cohesion above 40. On a change of imperial country, the last-added group is lost, or the sole group loses one level without going below I."
