 movement_anti_natalist_name: "Anti-Natalist Movement"
 movement_anti_natalist_desc: "A militant opposition to birth quotas, defending the autonomy of women and families."
 ideology_anti_natalist_movement: "Anti-Natalist Opposition"
 ideology_anti_natalist_movement_desc: "This movement rejects state-imposed demographic coercion."
 ideology_natalist_intelligentsia: "Institutional Natalism"
 ideology_natalist_intelligentsia_desc: "The Intelligentsia have permanently embraced birth quotas."
 birth_quota_anti_natalist_radicalism_tt: "Militant opposition to quotas during the political trial"
 je_birth_quota_trial: "The Trial of Birth Quotas"
 je_birth_quota_trial_reason: "Birth quotas divide the country. Supporters must persuade society before the anti-natalist movement overturns the law."
 birth_quota_trial_activated_tt: "Activates the journal entry ‘The Trial of Birth Quotas’."
 birth_quota_trial_progress_bar: "Acceptance of Quotas"
 birth_quota_trial_progress_bar_desc: "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]"
 birth_quota_fervor_positive_tt: "Primary cultural fervor above 35"
 birth_quota_fervor_negative_tt: "Primary cultural fervor at or below 35"
 birth_quota_peace_positive_tt: "Neither at war nor in an active diplomatic play"
 birth_quota_peace_negative_tt: "At war or in an active diplomatic play"
 birth_quota_sol_positive_tt: "Standard of living exceeds expectations"
 birth_quota_sol_negative_tt: "Standard of living does not exceed expectations"
 birth_quota_revolution_positive_tt: "No revolution above 75% progress"
 birth_quota_revolution_negative_tt: "A revolution exceeds 75% progress"
 birth_quota_events.11.t: "Quotas Take Root"
 birth_quota_events.11.d: "Year after year, petitions and demonstrations have failed to overturn the quota. Its defenders now hold sway in learned societies and the offices responsible for population policy; the Intelligentsia embrace it as a lasting political principle. The administration also establishes demographic compensation, adjusted in each region to living conditions and literacy."
 birth_quota_events.11.f: "In an office lined with ledgers, a clerk marks the two-hundredth point on a chart. ‘So it is finished?’ asks her colleague. She closes the book without smiling: ‘For us, perhaps. Not for the families written inside it.’"
 birth_quota_events.11.a: "The regime is consolidated"
 birth_quota_victory_ideology_tt: "The Intelligentsia gain the Institutional Natalism ideology."
 birth_quota_victory_modifier_tt: "The country gains the permanent national Institutional Natalist Compensation modifier: a visible +1% birth-rate bonus, supplemented by state-level compensation recalculated from literacy and standard of living. This bonus remains active while birth quotas are in force."
 birth_quota_events.12.t: "Quotas Collapse"
 birth_quota_events.12.d: "Refusals to register, work stoppages, and criticism from physicians have finally stripped the quota of its authority. The government withdraws its instructions to local officials. In place of this coercive experiment, legal guardianship is restored."
 birth_quota_events.12.f: "In the square, a municipal worker peels the rain-soaked quota poster from the wall. A woman stops beside him with her child. ‘Is it over?’ she asks. He rolls the paper: ‘The decree, yes. What it did to people, I cannot say.’"
 birth_quota_events.12.a: "Repeal the quotas"
 birth_quota_failure_guardianship_tt: "The Legal Guardianship law is enacted in place of Birth Quotas."
 birth_quota_events.13.t: "Quotas Abolished by Defeat"
 birth_quota_events.13.d: "Peace is signed before foreign representatives. The victor demands the repeal of birth quotas and the enactment of women's suffrage, already recognized in its own country. The old control registers lose their force of law; a new struggle begins over women's participation in political life."
 birth_quota_events.13.f: "In the treaty room, the defeated delegate's pen trembles above a new clause. ‘Women's votes as well?’ he asks the foreign representative. The other man slides the document forward: ‘It is a condition of peace.’"
 birth_quota_events.13.a: "Accept the treaty"
 birth_quota_intervention_suffrage_tt: "The victor's Women's Suffrage law is enacted in our country in place of Birth Quotas."
 birth_quota_events.14.t: "Quotas Abolished by Defeat"
 birth_quota_events.14.d: "The peace terms require the repeal of birth quotas. In their place comes the victor's law allowing women to work. Government offices cancel the old orders removing women from workshops, while employers prepare for the return of those whose work had been forbidden."
 birth_quota_events.14.f: "At the workshop door, a woman worker finds her old place under the others' gaze. ‘Are we truly allowed back?’ she asks the foreman. He hands her an apron: ‘The law has changed. Now we must start the machines again.’"
 birth_quota_events.14.a: "Accept the treaty"
 birth_quota_intervention_workplace_tt: "The victor's Women in the Workplace law is enacted in our country in place of Birth Quotas."
 birth_quota_housewife_wage_modifier: "Wages for Housewives"
 birth_quota_housewife_wage_modifier_desc: "An allowance raises dependents' income and the birth rate. Taxes on wages fall, while taxes on dividends rise. The policy ends if birth quotas are repealed."
 birth_quota_events.15.t: "Wages for Housewives"
 birth_quota_events.15.d: "The trade unions, now influential enough to be heard, demand an amendment to the birth quota for women driven from their workshops. It would raise dependents' income and reduce tax on wages, in exchange for higher consumption and dividend taxes. Representatives of the wealthy already condemn the transfer and threaten to mobilize."
 birth_quota_events.15.f: "In a union hall with misted windows, a delegate lays the payroll ledger on the table. ‘They lose their wages for obeying the decree,’ she tells the minister. He turns a page beneath the workers' gaze: ‘Then households must be given enough to live on. Who will agree to pay?’"
 birth_quota_events.15.a: "Adopt the wages-for-housewives amendment"
 birth_quota_events.15.b: "Reject the union proposal"
 amendment_birth_quota_landowner_authority: "Authority of Family Heads"
 amendment_birth_quota_landowner_authority_desc: "Landowners secure a modest increase in birth targets and greater political influence for family heads. Their oversight of households curbs radicalism increases at every acceptance level, at the cost of a smaller workforce."
 amendment_birth_quota_devout_patronage: "Patronage of Large Families"
 amendment_birth_quota_devout_patronage_desc: "Religious authorities propose to oversee and encourage large families. Higher targets strengthen their influence but further diminish the available workforce."
 amendment_birth_quota_military_households: "Households of National Duty"
 amendment_birth_quota_military_households_desc: "The armed forces defend higher birth targets in the name of future recruits. The state also grants greater conscription capacity, at the expense of the civilian workforce."
 amendment_birth_quota_family_shops: "Exemptions for Family Shops"
 amendment_birth_quota_family_shops_desc: "The petty bourgeoisie demands support for family businesses and households deprived of a wage. The amendment encourages self-investment, increases minimum worker ownership in the building groups covered by guilds, and raises dependents' income. Exemptions return part of the workforce to family shops at the cost of a modest decrease in births."
 amendment_birth_quota_rural_exemptions: "Priority for Farming Households"
 amendment_birth_quota_rural_exemptions_desc: "Rural representatives demand larger families for the countryside's future. The immediate loss of labor is partly offset by better organization of agricultural holdings."
 amendment_birth_quota_industrial_exemptions: "Manufacturing Exemptions"
 amendment_birth_quota_industrial_exemptions_desc: "Industrialists demand the return of women workers needed to fulfill orders and protect profits. The quota is eased, the workforce expands, and manufacturing output rises."
 amendment_birth_quota_education_guarantees: "Educational Guarantees"
 amendment_birth_quota_education_guarantees_desc: "The Intelligentsia refuse to let demographic targets bar women from education and careers. The amendment eases the quota in favor of schooling and access to work."
 amendment_birth_quota_worker_protections: "Protection for Women Workers"
 amendment_birth_quota_worker_protections_desc: "Trade unions demand exceptions for women workers and support for households deprived of a wage. Demographic pressure eases slightly while more adults can work."
 amendment_birth_quota_housewife_wage: "Wages for Housewives"
 amendment_birth_quota_housewife_wage_desc: "Proposed by the trade unions after the quota is enacted, this amendment raises dependents' income and the birth rate. It cuts the wage tax rate by four percentage points, but adds fifteen points to consumption taxes at normal taxation, adjusted at other tax levels, and four points to dividend taxes. Its adoption radicalizes capitalists and aristocrats."
