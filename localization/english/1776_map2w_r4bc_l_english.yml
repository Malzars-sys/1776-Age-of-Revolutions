 gov_aor1776_fsi_desc:0 "The prince-bishop governs the temporal possessions of Freising, distinct from the lands of his diocese. The cathedral chapter designates his successor.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_aor1776_rbi_desc:0 "The prince-bishop exercises sovereignty over the temporal possessions of his church. The imperial city of Regensburg retains its own institutions; the cathedral chapter elects the prelate.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_aor1776_rci_desc:0 "The urban council administers the free city of Regensburg and upholds its imperial privileges. Its magistrates exercise authority distinct from that of the prince-bishop.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
