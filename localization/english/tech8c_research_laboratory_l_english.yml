l_english:
 raw_industrial_data:0 "Raw industrial data"
 raw_industrial_data_desc:0 "Manufacturing records, mining observations and port reports collected through economic activity."
 organized_research_data:0 "Organized data"
 organized_research_data_desc:0 "Statistical dossiers, commercial surveys and university studies compiled from raw industrial data using paper and clerks."
 building_research_laboratory:0 "Experimental laboratory"
 building_research_laboratory_desc:0 "A publicly funded applied-research building. It raises the innovation cap without generating innovation points. Its orientation accelerates one research category, or all three more modestly through general research. Each level costs 1,000 construction points, with no level limit per state."
 pmg_1776_raw_data_reporting:0 "Extractive operating records"
 pmg_1776_heavy_data_reporting:0 "Heavy industry reports"
 pmg_1776_trade_data_reporting:0 "Commercial surveys"
 pmg_1776_institutional_data_reporting:0 "University dossiers"
 pmg_1776_research_laboratory_equipment:0 "Laboratory equipment"
 pmg_1776_research_laboratory_specialization:0 "Research orientation"
 pm_1776_raw_data_reporting:0 "Operating records"
 pm_1776_raw_data_reporting_desc:0 "Unlocked by Scientific Metrology, these records allow mines, quarries, salt works and ports to produce 1 unit of raw data per fully staffed level alongside their usual activity."
 pm_1776_heavy_data_reporting:0 "Industrial trial reports"
 pm_1776_heavy_data_reporting_desc:0 "Unlocked by Scientific Metrology, these reports allow heavy industry, shipyards and arms factories to produce 4 units of raw data per fully staffed level, compared to 2 in light industry."
 pm_1776_trade_data_reporting:0 "Trade statistics"
 pm_1776_trade_data_reporting_desc:0 "Trade centers compile 1 unit of raw data into 1 unit of organized data per fully staffed level using paper and clerks. Requires $specialized_professional_societies$."
 pm_1776_institutional_data_reporting:0 "Compiled dossiers"
 pm_1776_institutional_data_reporting_desc:0 "Universities compile 2 units of raw data into 2 units of organized data per fully staffed level using paper and clerks. Requires $specialized_professional_societies$."
 pm_1776_no_raw_data_reporting:0 "No technical records"
 pm_1776_no_organized_data_reporting:0 "No additional dossiers"
 pm_1776_manual_research_laboratory:0 "Instrumental experimentation"
 pm_1776_manual_research_laboratory_desc:0 "Each fully staffed, adequately supplied level raises the innovation cap by 5 and consumes 5 units of industrial chemicals, including acids for experiments. This equipment tier consumes no organized data; a specialization requires them separately. Universities provide innovation points."
 pm_1776_electrical_research_laboratory:0 "Electrified laboratory"
 pm_1776_electrical_research_laboratory_desc:0 "Electricity, precision machinery and chemical reagents raise the innovation cap by 10 per fully staffed, adequately supplied level. Consumes 10 units of industrial chemicals per fully staffed level, including acids. This equipment tier consumes no organized data; a specialization requires them separately."
 pm_1776_advanced_research_laboratory:0 "High-precision laboratory"
 pm_1776_advanced_research_laboratory_desc:0 "Radios, telephones, precision machinery and pharmaceuticals support advanced experiments. Consumes both data goods and 20 units of industrial chemicals, including acids, per fully staffed level. Raises the innovation cap by 20 per fully staffed, adequately supplied level."
 pm_1776_general_research:0 "General research"
 pm_1776_general_research_desc:0 "+0.25% production, military and society research speed per fully staffed, adequately supplied level, compared with +1% in a single category for a specialization. No additional organized data consumption; the most advanced equipment tier still consumes organized data. Generates no innovation points."
 pm_1776_production_research:0 "Production research"
 pm_1776_production_research_desc:0 "Consumes 20 additional units of organized data and increases production research speed by 1% per fully staffed, adequately supplied level. Generates no innovation points."
 pm_1776_military_research:0 "Military research"
 pm_1776_military_research_desc:0 "Consumes 20 additional units of organized data and increases military research speed by 1% per fully staffed, adequately supplied level. Generates no innovation points."
 pm_1776_society_research:0 "Society research"
 pm_1776_society_research_desc:0 "Consumes 20 additional units of organized data and increases society research speed by 1% per fully staffed, adequately supplied level. Generates no innovation points."
