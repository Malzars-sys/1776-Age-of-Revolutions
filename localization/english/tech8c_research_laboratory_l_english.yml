 research_laboratory_tests.warning:0 "Development test: this option changes the production methods of all relevant buildings in the country. Use a copy of your save."
 research_laboratory_tests.close:0 "Close without making changes"
 research_laboratory_tests.1.t:0 "Laboratory test: supply"
 research_laboratory_tests.1.d:0 "This manual-only test menu enables or disables both documentary goods, or adds one laboratory level in the capital. Enabling both requires $scientific_metrology$ and $specialized_professional_societies$. It never fires automatically. Creation is free only in this test; normal construction costs 1,000 points per level."
 research_laboratory_tests.1.on:0 "Enable reporting in all producers"
 research_laboratory_tests.1.off:0 "Disable reporting to test shortages"
 research_laboratory_tests.1.build:0 "Create a test laboratory in the capital"
 research_laboratory_tests.2.t:0 "Laboratory test: equipment"
 research_laboratory_tests.2.d:0 "Select the equipment tier for every laboratory in the country. Its technology must be unlocked. Check expenditure, employment and the innovation cap; innovation production must not increase."
 research_laboratory_tests.3.t:0 "Laboratory test: specialization"
 research_laboratory_tests.3.d:0 "Apply an orientation to all laboratories. General research grants +0.25% speed in each of the three categories, without additional organized data consumption. A specialization grants +1% in its category only and consumes 20 additional units of organized data. These bonuses are per fully staffed, adequately supplied level. Only one orientation per building."
 pmg_1776_light_data_reporting:0 "Light industry records"
 pmg_1776_administrative_data_reporting:0 "Administrative dossiers"
 pm_1776_light_data_reporting:0 "Manufacturing reports"
 pm_1776_light_data_reporting_desc:0 "Unlocked by Scientific Metrology, these reports allow light industry to produce 2 units of raw data per fully staffed level, compared to 1 from extraction and 4 from heavy industry."
 pm_1776_administrative_data_reporting:0 "Administrative statistics"
 pm_1776_administrative_data_reporting_desc:0 "Government administrations compile 1 unit of raw data into 1 unit of organized data per fully staffed level using paper and clerks, like trade centers. Requires $specialized_professional_societies$."
 laboratory_data_shortage_warning:0 "Insufficient documentation"
 laboratory_data_shortage_warning_desc:0 "At least one required data good supplies less than 75% of nominal needs. This laboratory’s research benefits are reduced by 50%. Checked every two days."
 laboratory_data_shortage_severe:0 "Severe documentary shortage"
 laboratory_data_shortage_severe_desc:0 "At least one required data good supplies less than 50% of nominal needs, or a local shortage is reported. This laboratory’s research benefits are reduced by 80%. Checked every two days."
 laboratory_data_shortage_critical:0 "Research nearly paralyzed"
 laboratory_equipment_shortage:0 "Missing research inputs"
 research_laboratory_tests.1.raw_off:0 "Disable only raw data collection"
 research_laboratory_tests.1.organized_off:0 "Disable only organized data collection"
 laboratory_equipment_shortage_desc:0 "An input shortage is reported in this laboratory. Its research benefits are reduced by 50%, unless a documentary shortage requires a stronger reduction. Checked every two days."
 laboratory_data_shortage_critical_desc:0 "At least one required data good supplies less than 10% of nominal needs. This laboratory’s research benefits are reduced by 95%. Checked every two days."
 laboratory_operational_innovation_capacity:0 "Operational laboratory capacity"
 laboratory_operational_innovation_capacity_desc:0 "Laboratory contribution to the innovation cap, adjusted for employment and data supply. Generates no innovation points."
 laboratory_operational_production_research:0 "Production research laboratories"
 laboratory_operational_production_research_desc:0 "Contribution per level: +0.25% from general research or +1% from production research. The total is adjusted for employment and input availability."
 laboratory_operational_military_research:0 "Military research laboratories"
 laboratory_operational_military_research_desc:0 "Contribution per level: +0.25% from general research or +1% from military research. The total is adjusted for employment and input availability."
 laboratory_operational_society_research:0 "Society research laboratories"
 laboratory_operational_society_research_desc:0 "Contribution per level: +0.25% from general research or +1% from society research. The total is adjusted for employment and input availability."
 building_1776_laboratory_capacity_add:0 "Potential contribution to innovation cap"
 modifier_building_1776_laboratory_capacity_add:0 "Potential contribution to innovation cap"
 modifier_building_1776_laboratory_capacity_add_desc:0 "Actual output is recalculated every two days from staffing, available data and selected orientation."
