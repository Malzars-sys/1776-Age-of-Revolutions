l_english:
 pm_steam_rail_transport_building_rubber_plantation:0 "Steam Rail Transport"
 coke_smelting:0 "Coke Smelting"
 coke_smelting_desc:0 "Coke-fired furnaces reduce ironmaking's dependence on charcoal and sustain hotter, more regular smelting."
 improved_husbandry:0 "Improved Husbandry"
 improved_husbandry_desc:0 "Closer attention to feeding, shelter, and animal care raises the reliability of livestock farming before deliberate breed improvement becomes widespread."
 improved_agricultural_implements:0 "Improved Farm Tools"
 improved_agricultural_implements_desc:0 "Stronger ploughs, harrows, and other farm tools make cultivation more reliable and reduce the labor needed to prepare the soil."
 turnpike_road_networks:0 "Organized Land Infrastructure"
 turnpike_road_networks_desc:0 "Organized road networks, structured maintenance, and the administration of overland routes provide a common foundation for land infrastructure."
 industrial_acids:0 "Industrial Acids"
 industrial_acids_desc:0 "Organized acid manufacture supplies the reagents needed by early chemical crafts, dyeing, and metalworking."
 advanced_crop_rotations:0 "Advanced Crop Rotations"
 advanced_crop_rotations_desc:0 "Alternating cereals with fodder and soil-restoring crops helps farms maintain fertility without leaving as much land fallow."
 selective_breeding:0 "Selective Breeding"
 selective_breeding_desc:0 "Choosing breeding stock for desired traits turns inherited farming experience into a deliberate means of improving herds."
 industrial_canals:0 "Organized Commercial Waterways"
 industrial_canals_desc:0 "Coordinated canal and navigable-waterway networks connect markets and carry bulk goods without presupposing later industrial engineering."
 mechanized_weaving:0 "Mechanical Looms"
 mechanized_weaving_desc:0 "The adoption of powered looms transforms weaving from skilled manual work into a more standardized industrial process."
 applied_mineralogy:0 "Applied Mineralogy"
 applied_mineralogy_desc:0 "Identifying ores and useful minerals through systematic observation improves the search for deposits and the choice of extraction methods."
 industrial_ceramics:0 "Industrial Ceramics"
 industrial_ceramics_desc:0 "Better control of clays, kilns, and firing produces more consistent ceramics for households and industrial uses."
 precision_boring:0 "Precision Boring"
 precision_boring_desc:0 "Accurate boring and machining of metal parts improve the fit and reliability of tools, engines, and factory machinery."
 condensing_steam_engines:0 "Condensing Steam Engines"
 condensing_steam_engines_desc:0 "Separate condensation wastes less heat, allowing steam engines to pump and drive machinery with less fuel."
 rotative_steam_power:0 "Rotative Steam Power"
 rotative_steam_power_desc:0 "Converting the piston's motion into steady rotation allows steam engines to drive workshop and factory machinery directly."
 advanced_spinning:0 "Sewing Mechanization"
 advanced_spinning_desc:0 "Purpose-built sewing machinery mechanizes garment assembly and prepares textile workshops for later electrically powered equipment."
 puddling_and_rolling:0 "Puddling and Rolling"
 puddling_and_rolling_desc:0 "Puddling refines pig iron in a reverberatory furnace; rolling then shapes the metal into more uniform bars and sheets."
 deep_mine_engineering:0 "Deep Mine Engineering"
 deep_mine_engineering_desc:0 "Deeper shafts require coordinated drainage, ventilation, and supports to reach deposits beyond the limits of shallow workings."
 automated_flour_milling:0 "Automated Flour Milling"
 automated_flour_milling_desc:0 "Linked milling and sifting machinery processes grain more continuously and produces flour of more consistent quality."
 high_pressure_steam:0 "High-Pressure Steam"
 high_pressure_steam_desc:0 "Stronger boilers and controlled high-pressure steam make engines more compact and extend their use beyond fixed pumping sites."
 industrial_alkalis:0 "Industrial Alkalis"
 industrial_alkalis_desc:0 "Regular production of alkalis supports soapmaking, glassmaking, bleaching, and other chemical industries."
 improved_road_engineering:0 "Road Engineering"
 improved_road_engineering_desc:0 "Graded roadbeds, drainage, and durable surfaces create reliable all-season roads."
 systematic_field_drainage:0 "Field Drainage"
 systematic_field_drainage_desc:0 "Planned drains and channels remove excess water from fields, protecting crops and bringing wet land into regular cultivation."
 mine_safety_engineering:0 "Mine Safety Engineering"
 mine_safety_engineering_desc:0 "Ventilation, safer supports, and closer attention to underground hazards reduce the dangers of deep extraction."
 continuous_papermaking:0 "Continuous Papermaking"
 continuous_papermaking_desc:0 "Moving screens and continuous drying replace individual sheets with a steadier flow of paper."
 coal_gasification:0 "Coal Gasification"
 coal_gasification_desc:0 "Processing coal into combustible gas creates a transportable source of heat and light for growing towns and industries."
 professional_civil_engineering:0 "Civil Engineering"
 professional_civil_engineering_desc:0 "Trained engineers combine surveying, mathematics, and practical design to plan durable roads, bridges, and waterways."
 interchangeable_manufacture:0 "Interchangeable Parts"
 interchangeable_manufacture_desc:0 "Standard dimensions and careful gauges let separately made parts fit the same machines, easing assembly and repair."
 geological_surveying:0 "Geological Surveying"
 geological_surveying_desc:0 "Mapping rock strata and mineral deposits gives miners and public authorities a firmer basis for exploration."
 hot_blast_smelting:0 "Hot Blast Smelting"
 hot_blast_smelting_desc:0 "Preheating the air blown into furnaces improves combustion and makes iron smelting less fuel-intensive."
 hydraulic_cements:0 "Hydraulic Cements"
 hydraulic_cements_desc:0 "Cements that harden in damp conditions make stronger harbors, canals, and other works exposed to water possible."
 hydraulic_turbines:0 "Hydraulic Turbines"
 hydraulic_turbines_desc:0 "Turbines extract rotary power from flowing water more efficiently than older waterwheels, broadening the reach of water-driven machinery."
 pressed_glass:0 "Pressed Glass"
 pressed_glass_desc:0 "Pressing molten glass in molds makes common glassware more uniform and easier to produce in quantity."
 scientific_fortification_siegecraft:0 "Fortification and Siegecraft"
 scientific_fortification_siegecraft_desc:0 "Geometric planning of fortifications and siege works turns the attack and defense of strongholds into a specialized military science."
 state_dockyard_systems:0 "State Dockyard Systems"
 state_dockyard_systems_desc:0 "Permanent state dockyards coordinate shipbuilding, repairs, stores, and skilled labor for naval fleets."
 enclosed_dock_systems:0 "Enclosed Dock Systems"
 enclosed_dock_systems_desc:0 "Sheltered basins and enclosed docks give ships safer places to be fitted out, repaired, and supplied."
 regulated_small_arms:0 "Regulated Small Arms"
 regulated_small_arms_desc:0 "Common patterns and calibres make infantry weapons easier to procure, maintain, and supply across an army."
 light_infantry_tactics:0 "Light Infantry Tactics"
 light_infantry_tactics_desc:0 "Trained skirmishers use cover, open formations, and accurate fire where rigid battle lines are less effective."
 standardized_field_artillery:0 "Field Artillery"
 standardized_field_artillery_desc:0 "Standard calibres, carriages, and drill make field guns easier to move, supply, and coordinate in battle."
 permanent_military_hospitals:0 "Military Hospitals"
 permanent_military_hospitals_desc:0 "Permanent hospitals give armies a stable place to treat sickness and wounds instead of relying entirely on improvised wartime care."
 scientific_naval_architecture:0 "Naval Architecture"
 scientific_naval_architecture_desc:0 "Measured hull design and stability studies replace reliance on inherited proportions alone in the construction of warships."
 marine_chronometry:0 "Marine Chronometry"
 marine_chronometry_desc:0 "Reliable timekeepers help navigators determine longitude at sea and make long voyages less uncertain."
 ship_classification_surveying:0 "Ship Classification"
 ship_classification_surveying_desc:0 "Regular surveys record a vessel's condition and construction, making maintenance and comparisons between ships more systematic."
 armament_standardization_inspection:0 "Armament Standards"
 armament_standardization_inspection_desc:0 "Regular inspection and agreed measurements reveal faulty weapons before issue and support more consistent military supply."
 permanent_engineer_services:0 "Engineer Corps"
 permanent_engineer_services_desc:0 "Standing engineer corps retain the skills needed for fortifications, field works, roads, and sieges between campaigns."
 horse_artillery:0 "Horse Artillery"
 horse_artillery_desc:0 "Mounted crews and suitable gun teams let artillery keep pace with cavalry and redeploy quickly across the field."
 military_topographic_surveying:0 "Military Surveying"
 military_topographic_surveying_desc:0 "Dedicated surveys turn roads, relief, and river crossings into usable maps for planning marches and operations."
 copper_sheathing:0 "Copper Sheathing"
 copper_sheathing_desc:0 "Copper plates protect hulls against marine growth and shipworms, allowing sailing vessels to retain speed between refits."
 mysorean_iron_cased_rocketry:0 "Mysorean Rockets"
 mysorean_iron_cased_rocketry_desc:0 "Iron-cased rockets developed in Mysore show how a more durable casing can extend the reach and practical use of military rockets."
 corps_organization:0 "Corps Organization"
 corps_organization_desc:0 "Large standing formations combine infantry, cavalry, artillery, and support troops under commands able to maneuver independently."
 field_engineering_pontoon_trains:0 "Engineers & Pontoons"
 field_engineering_pontoon_trains_desc:0 "Organized sappers and portable bridging equipment help armies cross rivers and overcome obstacles during a campaign."
 explosive_field_ammunition:0 "Explosive Ammunition"
 explosive_field_ammunition_desc:0 "Explosive shells add a bursting effect to field artillery, changing the damage guns can inflict beyond solid shot."
 battlefield_evacuation:0 "Battlefield Evacuation"
 battlefield_evacuation_desc:0 "Organized stretcher bearers and transport move wounded soldiers away from combat and toward medical care sooner."
 military_veterinary_services:0 "Veterinary Services"
 military_veterinary_services_desc:0 "Veterinary care preserves the horses and draft animals on which cavalry, artillery, and military transport depend."
 casemated_fortifications:0 "Casemated Fortifications"
 casemated_fortifications_desc:0 "Protected gun chambers allow forts to maintain fire while sheltering crews and equipment from bombardment."
 hydrographic_surveying:0 "Hydrographic Surveying"
 hydrographic_surveying_desc:0 "Soundings and coastal surveys produce charts of depths, hazards, and approaches needed for safer navigation."
 standardized_naval_signals:0 "Naval Signals"
 standardized_naval_signals_desc:0 "Agreed flag signals and procedures let ships coordinate maneuvers beyond the reach of spoken orders."
 mechanized_naval_dockyards:0 "Mechanized Dockyards"
 mechanized_naval_dockyards_desc:0 "Powered tools and lifting equipment speed the heavy work of building and repairing ships in dockyards."
 diagonal_ship_framing:0 "Diagonal Ship Framing"
 diagonal_ship_framing_desc:0 "Diagonal braces stiffen wooden hulls and help larger ships withstand strain at sea."
 standardized_military_rockets:0 "Military Rockets"
 standardized_military_rockets_desc:0 "Consistent rocket designs, launch equipment, and drill make this weapon less dependent on isolated experiments."
 maritime_safety_standards:0 "Maritime Safety"
 maritime_safety_standards_desc:0 "Shared practices for navigation, seaworthiness, and rescue reduce avoidable losses at sea."
 modern_lighthouse_optics:0 "Modern Lighthouse Optics"
 modern_lighthouse_optics_desc:0 "Improved lenses concentrate lamp light into beams visible farther from dangerous coasts and harbor approaches."
 iron_hull_construction:0 "Iron Hull Construction"
 iron_hull_construction_desc:0 "Iron frames and plates permit stronger hulls and new ship forms beyond the limits of traditional timber construction."
 institutionalized_scientific_exchange:0 "Scientific Exchange"
 institutionalized_scientific_exchange_desc:0 "Correspondence, learned societies, and regular meetings carry observations beyond individual workshops and courtly circles."
 institutionalized_public_credit:0 "Public Credit"
 institutionalized_public_credit_desc:0 "Reliable public accounts and recognized debt instruments let states borrow beyond the immediate resources of their treasuries."
 commercial_insurance_markets:0 "Commercial Insurance"
 commercial_insurance_markets_desc:0 "Merchants pool the risks of voyages and trade through increasingly regular insurance contracts and specialized intermediaries."
 periodical_print_networks:0 "Periodical Press"
 periodical_print_networks_desc:0 "Regularly issued newspapers and journals carry news, debate, and practical knowledge between distant towns."
 systematic_administrative_statistics:0 "State Statistics"
 systematic_administrative_statistics_desc:0 "Repeated surveys and comparable records give governments a clearer view of population, revenue, and productive resources."
 variolation_networks:0 "Variolation Networks"
 variolation_networks_desc:0 "Practitioners spread smallpox variolation through organized contacts and shared procedures before vaccination becomes available."
 codified_practical_knowledge:0 "Codified Knowledge"
 codified_practical_knowledge_desc:0 "Manuals and encyclopedic works record techniques once passed chiefly through apprenticeship, making them easier to compare and teach."
 political_economy:0 "Political Economy"
 political_economy_desc:0 "Writers and administrators examine production, trade, taxation, and wealth as connected parts of a wider economy."
 specialized_technical_academies:0 "Technical Academies"
 specialized_technical_academies_desc:0 "Specialized schools provide sustained instruction in engineering and applied sciences beyond workshop apprenticeship."
 veterinary_science:0 "Veterinary Science"
 veterinary_science_desc:0 "The study of animal anatomy and disease gives livestock owners and armies more reliable ways to care for working animals."
 organized_elementary_schooling:0 "Elementary Schooling"
 organized_elementary_schooling_desc:0 "Organized religious, communal, or state schools extend regular elementary instruction beyond isolated tutors and local custom."
 systematic_population_registration:0 "Population Registers"
 systematic_population_registration_desc:0 "Regular population registers give administrations a durable basis for taxation, recruitment, and public planning."
 classical_political_economy:0 "Classical Economics"
 classical_political_economy_desc:0 "Developed classical doctrines systematize production, exchange, trade, and the limits of state intervention in the economy."
 constitutional_government:0 "Constitutional Rule"
 constitutional_government_desc:0 "Written constitutional rules define public offices and place recognized limits on the exercise of state power."
 national_sovereignty:0 "Popular Sovereignty"
 national_sovereignty_desc:0 "Political authority is increasingly justified in the name of the nation or people rather than the ruler alone."
 organized_reform_movements:0 "Reform Movements"
 organized_reform_movements_desc:0 "Associations, petitions, and public campaigns allow reformers to coordinate demands across local communities."
 abolitionist_mobilization:0 "Abolitionism"
 abolitionist_mobilization_desc:0 "Organized opponents of slavery turn moral arguments into petitions, publications, and sustained political pressure."
 systematic_cadastral_surveying:0 "Cadastral Surveying"
 systematic_cadastral_surveying_desc:0 "Systematic land surveys and cadastral records allow administrations to identify property, assess taxes, and plan territorial development."
 systematic_legal_codification:0 "Legal Codification"
 systematic_legal_codification_desc:0 "A recognized and systematically organized body of law makes rules more consistent across courts, officials, and territories."
 scientific_metrology:0 "Scientific Metrology"
 scientific_metrology_desc:0 "Comparable standards of weight and measure improve experiments, contracts, and exchange between regions."
 polytechnical_education:0 "Polytechnical Education"
 polytechnical_education_desc:0 "Schools joining mathematics, natural science, and engineering train specialists for public works and industry."
 optical_telegraph_networks:0 "Optical Telegraph"
 optical_telegraph_networks_desc:0 "Chains of signal stations relay messages across long distances much faster than couriers can travel."
 central_statistical_offices:0 "Statistical Offices"
 central_statistical_offices_desc:0 "Permanent offices collect and compare official figures, turning occasional surveys into a continuing administrative practice."
 organized_immunization_campaigns:0 "Immunization Campaigns"
 organized_immunization_campaigns_desc:0 "Coordinated vaccination efforts extend protection across larger populations than isolated practitioners can reach."
 mechanized_printing:0 "Mechanized Printing"
 mechanized_printing_desc:0 "Powered presses multiply the number of sheets a printer can produce and widen the circulation of books and newspapers."
 experimental_research_laboratories:0 "Research Laboratories"
 experimental_research_laboratories_desc:0 "Dedicated laboratories make controlled experiments and repeatable observations a regular part of scientific work."
 specialized_professional_societies:0 "Professional Societies"
 specialized_professional_societies_desc:0 "Specialists form lasting associations to exchange findings, debate methods, and establish shared professional practices."
 clinicopathological_medicine:0 "Clinical Pathology"
 clinicopathological_medicine_desc:0 "Physicians relate symptoms observed in life to anatomical changes found after death, sharpening the study of disease."
 active_principle_pharmacy:0 "Active Principles"
 active_principle_pharmacy_desc:0 "Isolating the active substances in remedies makes medicines easier to prepare, compare, and dose consistently."
 professional_civil_policing:0 "Civil Policing"
 professional_civil_policing_desc:0 "Permanent, salaried police forces take over duties once handled by irregular watches and temporary local arrangements."
 mass_circulation_press:0 "Mass-Circulation Press"
 mass_circulation_press_desc:0 "Large print runs and wider distribution bring newspapers and other publications to an expanding reading public."
 liberal_constitutionalism:0 "Liberal Constitution"
 liberal_constitutionalism_desc:0 "Constitutional guarantees and representative institutions place civil liberties and limits on executive authority at the center of political reform."
 early_socialism_cooperativism:0 "Socialism & Cooperatives"
 early_socialism_cooperativism_desc:0 "Reformers and workers propose cooperative ownership and new forms of association in response to the social costs of industrial change."
 traditional_papermaking:0 "Traditional Papermaking"
 traditional_papermaking_desc:0 "Mastery of fibre preparation, pulping, pressing and drying techniques allows for the regular production of paper."

 organized_forestry:0 "Organized Forestry"
 organized_forestry_desc:0 "The organization of logging, timber extraction and transportation allows forests to be exploited regularly on a large scale."
 pm_simple_forestry_desc:0 "Labor-intensive felling and hauling provide a modest supply of timber without modern machinery or industrial equipment."
 pm_organized_forestry:0 "Organized Forestry"
 pm_organized_forestry_desc:0 "Coordinated felling, extraction and timber transport increase forest output while retaining a labor-intensive organization."
 traditional_glassmaking:0 "Traditional Glassmaking"
 traditional_glassmaking_desc:0 "Mastery of furnaces, mineral melting and glass-forming techniques allows for the regular production of glass."

 industrial_paper_bleaching:0 "Industrial Paper Bleaching"
 industrial_paper_bleaching_desc:0 "The systematic application of chemical bleaching processes to mechanized papermaking allows clearer and more uniform paper to be produced on a large scale."

 traditional_food_processing:0 "Traditional Food Processing"
 traditional_food_processing_desc:0 "Established techniques of milling, cooking and processing agricultural products allow food production to be organized on a regular and larger scale."

 organized_workshops:0 "Organized Workshops"
 organized_workshops_desc:0 "Structured manufactories coordinate skilled workshops to produce tools, furniture and other useful household goods without requiring later industrial mechanization."
 
 sugar_refining:0 "Sugar Refining"
 sugar_refining_desc:0 "Improved clarification, concentration and crystallization processes allow refined sugar to be produced more regularly and on a larger scale."
 mechanized_irrigation:0 "Mechanized Irrigation"
 mechanized_irrigation_desc:0 "The use of mechanical pumps and controlled distribution systems makes it possible to irrigate crops reliably on a scale that was previously impossible."
 organized_textile_production:0 "Proto-Industrial Textile Production"
 organized_textile_production_desc:0 "The organization of spinners, weavers, dyers and merchants into guilds, workshops and dispersed production networks allows textile manufacturing to expand beyond individual artisans without requiring industrial machinery."

 building_textile_mill_desc:0 "Textile manufactures gather specialized workers, organized production and early mechanized processes to increase fabric output."


 








 pm_professional_faculties:0 "Professional Faculties"
 pm_professional_faculties_desc:0 "Specialized faculties unite professional training, research, and credential networks within the modern university."
 pm_arc_welded_buildings_desc:0 "Reinforced concrete, welded steel frames, industrial glass, and powered tools are combined in large-scale modern construction."
