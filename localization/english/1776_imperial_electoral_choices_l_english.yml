 aor1776_hre_choose_vote_desc:0 "Choose a country for the next imperial election, including yourself if eligible. During the thirty-day ballot you may change your vote. Breaking a valid treaty pledge as a player costs 10 infamy once; an AI elector must honour its pledge."
 aor1776_hre_choose_vote_result:0 "Record this country as our electoral choice; if a ballot is open, replace our single ballot. A player changing away from a valid treaty pledge receives 10 infamy once."
 aor1776_hre_card_vote_label:0 "Choose for my imperial vote"
 aor1776_hre_choose_electoral_candidate:0 "Choose as imperial candidate"
 aor1776_hre_choose_electoral_candidate_desc:0 "Set our next imperial electoral choice. This is not a treaty pledge and does not require the candidate’s approval."
 aor1776_hre_vote_selected:0 "Chosen for next election: [SCOPE.GetRootScope.GetCountry.MakeScope.Var('aor1776_hre_ui_vote_choice').GetCountry.GetName]"
 je_aor1776_hre_vote_reason:0 "Your anticipated choice is registered when the Emperor dies. Choose or change a candidate below during the thirty-day ballot, including yourself if eligible. Breaking a valid treaty pledge costs a player 10 infamy once. AI electors honour their pledges."
 aor1776_hre_electors_heading:0 "The electors — ballots and anticipated choices"
 aor1776_hre_dashboard_decisions:0 "Electors may choose a candidate now using the cards below or a country’s diplomatic actions; the journal’s candidate buttons also allow a self-vote when eligible. The choice becomes a ballot at the Emperor’s death and may be changed during thirty days. Centralization decisions unlock after all four principles reach III."
 aor1776_hre.1.d:0 "The imperial throne is vacant. Any valid treaty pledge or anticipated choice has already been registered as our ballot. We may choose or change a candidate in the imperial journal during the thirty-day deliberation. Breaking a valid pledge costs us 10 infamy; a free choice may be changed without this penalty. After deliberation, the electoral count seeks an absolute majority, with a runoff if needed."
 aor1776_hre_pledge_accept_base:0 "Reluctance to bind our electoral freedom"
 aor1776_hre_pledge_accept_preference:0 "Historical electoral preference: relations, dynasty, religion, alliances and imperial continuity"
 aor1776_hre_pledge_accept_obligation:0 "Obligation owed to the candidate"
 aor1776_hre_pledge_accept_duration:0 "Long binding period"
 aor1776_hre_pledge_accept_receiving:0 "Receiving an imperial electoral pledge"
