l_english:
 Bertillon: "Bertillon"
 law_birth_quotas: "Birth Quotas"
 law_birth_quotas_desc: "The state imposes a birth target on women, forcing them to stay home to care for children. This law is very difficult to enact and will provoke widespread outrage abroad."
 birth_quota_foreign_reaction_tt: "Other countries will judge our actions."
 birth_quota_demographic_countermodifier: "Natalist Compensation"
 birth_quota_demographic_victory_modifier: "Institutional Natalist Compensation"
 birth_quota_demographic_victory_modifier_desc: "After the quota trial succeeds, this permanent national bonus helps offset the average birth-rate decline associated with literacy and standard of living. The remaining compensation is recalculated in each state. It ends if birth quotas are repealed."
 ideology_natalist_movement: "State Natalism"
 ideology_natalist_movement_desc: "A movement favoring compulsory birth quotas and a hierarchical family order."
 ideology_birth_quota_ig_support: "Birth Quota Supporters"
 ideology_birth_quota_ig_support_desc: "This group accepts state-imposed birth targets."
 ideology_birth_quota_ig_opposition: "Birth Quota Opponents"
 ideology_birth_quota_ig_opposition_desc: "This group rejects coercion of women and families."
 movement_natalist: "Natalist Movement"
 movement_natalist_icon: "@movement_category_natalist!"
 movement_category_natalist_icon: "@movement_category_natalist!"
 movement_natalist_name: "Natalist Movement"
 movement_natalist_desc: "This movement demands birth quotas in the name of the state's demographic strength."
 birth_quota_agitators.1.t: "Jacques Bertillon and the Population Question"
 birth_quota_agitators.1.d: "In Paris, physician and statistician Jacques Bertillon gathers figures on births and deaths. His tables give visible form to fears of demographic decline. Activists seize on his work to demand state intervention, going further than the figures alone can justify."
 birth_quota_agitators.1.f: "In the corridor outside a Paris lecture hall, two listeners stop before the figures Bertillon has left on the board. ‘The curve falls again,’ one murmurs. His neighbor folds her notebook: ‘Figures, yes. But what will they do with our lives?’"
 birth_quota_agitators.1.a: "Hear his arguments"
 birth_quota_events.1.t: "Petitions Against the Quotas"
 birth_quota_events.1.d: "The bill has barely been published, yet petitions are already passing through shopping streets and factory gates. Their signatories reject the idea that state officials should set the number of children expected of each family. The bill's defenders call it a duty to the nation."
 birth_quota_events.1.f: "Beneath the market arcades, a woman worker signs the petition with ink-stained fingers. ‘They mean to count our children before they are born?’ she asks the shopkeeper. He grips the page against the wind: ‘That is what the bill says.’"
 birth_quota_events.1.a: "Keep the bill intact"
 birth_quota_events.1.b: "Negotiate with the notables"
 birth_quota_events.2.t: "The Workforce Protests"
 birth_quota_events.2.d: "Manufacturers calculate how many posts will stand empty if women are made to leave their work. Women workers answer that their wages feed their children too. In the assemblies, supporters of the quota insist that households deprived of that income will nevertheless become more stable."
 birth_quota_events.2.f: "In the workshop, the foreman strikes a name from the payroll while the looms still beat. ‘Who will pay for my children's bread?’ the worker asks. He studies the crossed-out line: ‘No one has told me.’"
 birth_quota_events.2.a: "Press ahead"
 birth_quota_events.2.b: "Pause before the assemblies"
 birth_quota_events.3.t: "Resistance in the Countryside"
 birth_quota_events.3.d: "In several rural districts, officials sent to list households find locked doors and crowded village squares. Families already know the birth registers; they object to turning them into instruments of a new obligation. Local notables waver between obeying the government and calming the anger."
 birth_quota_events.3.f: "In the village square, the official sets his ledger on a rickety table. A mother closes her door before him. ‘I only have to record the names,’ he says. From behind the wood she answers: ‘You did that before. Today you come to give us orders.’"
 birth_quota_events.3.a: "Send the administrators"
 birth_quota_events.3.b: "Seek the scholars' support"
 birth_quota_events.4.t: "The Quotas Take Effect"
 birth_quota_events.4.d: "The bill becomes law. Offices receive their instructions, clerks prepare their lists, and posters announce the targets now imposed on families. Crowds greet the decree with protest; even among the educated professions, the state's authority is openly questioned."
 birth_quota_events.4.f: "Outside the town hall, the decree flaps against a damp wall. A woman takes her sister's arm. ‘They call this the country's future?’ she whispers. Her sister studies the official seal: ‘They never asked about ours.’"
 birth_quota_events.4.a: "The decree must be enforced"
 birth_quota_events.5.t: "Families Refuse Registration"
 birth_quota_events.5.d: "Officials charged with enforcing the quota return from some villages with incomplete lists. Some families hide their papers; others declare together that their private lives are not the administration's to inspect. Local authorities ask for more resources, while fearing the countryside may erupt."
 birth_quota_events.5.f: "In the cold town hall, an agent spreads his unfinished lists before the mayor. Outside, the square is empty and the shutters stay closed. ‘Not one answer from that street?’ asks the mayor. The agent shakes his head: ‘Not one open door.’"
 birth_quota_events.5.a: "Tighten the checks"
 birth_quota_events.5.b: "Grant local exceptions"
 birth_quota_events.6.t: "Disrupted Workshops"
 birth_quota_events.6.d: "The forced withdrawal of women workers unsettles the workshops: orders fall behind, foremen redistribute tasks, and families lose part of their income. Employers and workers blame one another, but all ask who will bear the cost of the new policy."
 birth_quota_events.6.f: "At dawn, the weaving room echoes with stopped machinery; bales wait beside the windows. ‘Three positions still empty,’ counts the foreman. The owner crushes an order in his hand: ‘And our buyers will not wait.’"
 birth_quota_events.6.a: "Demand that workers adapt"
 birth_quota_events.6.b: "Make employers bear the cost"
 birth_quota_events.7.t: "A Medical Controversy"
 birth_quota_events.7.d: "A medical society publishes a memorandum disputing the notion that one birth target can be applied to every household alike. Its members point to mothers' health, housing conditions, and infant mortality. Defenders of the quota promptly accuse the physicians of sowing doubt."
 birth_quota_events.7.f: "In a hospital ward, a doctor closes the casebook of an exhausted young mother. ‘The bureau demands a number,’ says his colleague, pointing to the circular. The doctor moves the paper aside: ‘Here, she is a patient first.’"
 birth_quota_events.7.a: "Dismiss their objections"
 birth_quota_events.7.b: "Open a public consultation"
 birth_quota_events.8.t: "Condemn Foreign Quotas"
 birth_quota_events.8.d: "Dispatches from [SCOPE.sCountry('quota_enacting_country').GetName] describe compulsory birth targets and the removal of women from working life. Reformist newspapers, physicians, and associations demand that our government condemn the policy. The ministry fears silence will be mistaken for approval."
 birth_quota_events.8.f: "At the newspaper office, foreign dispatches pass from hand to hand above the still-warm presses. ‘Do we print this on the front page?’ a reporter asks. Her editor nods: ‘Then let the minister explain his silence.’"
 birth_quota_events.8.a: "Condemn the policy"
 birth_quota_events.9.t: "A Foreign Demographic Model?"
 birth_quota_events.9.d: "News from [SCOPE.sCountry('quota_enacting_country').GetName] animates our governing circles. Some utilitarians hail the quotas as an experiment in the rational administration of population; their opponents see figures won at the expense of family freedom. A declaration of support would tie us to this disputed choice."
 birth_quota_events.9.f: "Under the cabinet lamps, an adviser lines up the columns of a report from abroad. ‘A methodical administration,’ he says. A deputy hands him a family's account: ‘Read what it does behind closed doors as well.’"
 birth_quota_events.9.a: "Express our support"
 birth_quota_events.10.t: "Quotas in a Partner Country"
 birth_quota_events.10.d: "[SCOPE.sCountry('quota_enacting_country').GetName] has adopted birth quotas. Our diplomats report demonstrations, but also its government's determination to keep the law. We must defend our principles without hastily breaking with a partner on whom we still depend."
 birth_quota_events.10.f: "At the foreign ministry, the minister strikes through his third draft of a dispatch to an ally. ‘Shall we condemn the law?’ asks his secretary. The minister lets the ink dry: ‘Say what we cannot accept, without closing tomorrow's door.’"
 birth_quota_events.10.a: "Express our reservations"
