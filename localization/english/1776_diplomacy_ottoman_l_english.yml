 je_group_1776_imperial_crises: "Crises of Imperial Authority"
 je_1776_porte_burden: "The Burden of the Sublime Porte"
 je_1776_porte_burden_reason: "From the offices of Constantinople to distant provinces, the commands of the Sublime Porte encounter hereditary appointments, tax farmers and the privileges of local administrators. Revenues intended for the Treasury disappear among the interests of those who claim to serve the Empire. Reliable accounts, staffed offices and enforceable imperial decisions have become necessities.\n\nThese reforms concern administration and its practices, not the faith of its inhabitants. Every improvement eases the Treasury’s burden; only lasting consolidation will bring this chapter to a close."
 je_1776_porte_burden_status: "Restore the revenues that escape the Treasury.\nAdministrative reforms: [ROOT.GetCountry.MakeScope.Var('ottoman_1776_admin_score').GetValue|v0]/10.\nConsolidation: [ROOT.GetCountry.MakeScope.Var('ottoman_1776_admin_months').GetValue|v0]/12 consecutive months.\nEach fulfilled objective removes 10 percentage points of additional tax waste and 1 percentage point of the bureaucracy penalty at the next weekly pulse. A reversal restores its penalty and resets consolidation.\nConsolidation also requires Rifling, Abolitionism and an end to the slave trade.\n\n#bold Current bonus for fulfilled conditions#!: +[ROOT.GetCountry.MakeScope.Var('ottoman_1776_admin_score').GetValue|v0]% bureaucracy and −[ROOT.GetCountry.MakeScope.ScriptValue('ottoman_1776_current_tax_relief')|v0] percentage points of additional tax waste.\nThis temporary relief varies with the fulfilled objectives and offsets the journal penalty; it is not a permanent reward."
 je_1776_many_masters: "An Empire of Many Masters"
 je_1776_many_masters_reason: "The Sultan’s decrees proclaim a single sovereignty; in the provinces, power is shared among governors, notables and local authorities. Egypt’s beys command their own forces, while the imperial dependencies negotiate the limits of their obedience. Their allegiance is not necessarily lost, but it can no longer be taken for granted.\n\nStrong institutions, a respected settlement or a restored administration may yet bring these authorities together. Without a lasting settlement, their rivalries will invite foreign intervention."
 je_1776_many_masters_status: "Consolidate a settlement between the centre and the provinces.\nStability: [ROOT.GetCountry.MakeScope.Var('ottoman_1776_stability_months').GetValue|v0]/36 consecutive points; 1 point per stable month, 2 after resolving the administrative burden.\nFirm deadline: 1 January 1836. Early failure requires 120 crisis points and continuing severe pressure.\nWhile this entry is active: +0.15 weekly liberty desire for each subject and −15% resistance to foreign support for separatism.\nEvery path now requires police AND education at level 3, Rifling, Abolitionism and an end to the slave trade."
 ottoman_1776_admin_burden: "The Porte’s Scattered Revenues"
 ottoman_1776_admin_relief: "Restoration of Imperial Accounts"
 ottoman_1776_admin_relief_1: "Legacy Partial Administrative Relief"
 ottoman_1776_admin_relief_2: "Legacy Advanced Administrative Relief"
 ottoman_1776_many_masters_pressure: "Contested Imperial Authority"
 ottoman_1776_subjects_50_tt: "Every subject, including indirect subjects, has liberty desire strictly below 50."
 ottoman_1776_path_institutions_tt: "Path I — Centralisation: legitimacy ≥ 60 and police AND education institution level ≥ 3."
 ottoman_1776_path_compromise_tt: "Path II — Settlement: legitimacy ≥ 75 and liberty desire strictly below 25 for ALL subjects."
 ottoman_1776_path_administration_tt: "Path III — Restoration of the state: the Burden of the Sublime Porte permanently resolved and legitimacy ≥ 50."
 ottoman_1776.1.t: "The Accounts of the Empire"
 ottoman_1776.1.d: "For a full year, offices have been staffed, provincial accounts submitted and the state’s resources placed at the service of its institutions. Intermediaries can no longer invoke their privileges to withhold imperial revenues. The Porte at last possesses an administration it can rely upon. Political rivalries must still find their own settlement."
 ottoman_1776.1.a: "Let the accounts now be rendered."
 ottoman_1776.2.t: "Authorities Reconciled"
 ottoman_1776.2.d: "After prolonged negotiations, the centre and the provinces have established a settlement strong enough to withstand local rivalries. Dependencies acknowledge their obligations and governors their limits. Imperial unity rests no longer upon the wording of decrees alone, but upon a balance that has proved itself."
 ottoman_1776.2.a: "A sovereignty at last respected."
 ottoman_1776.3.d: "Accommodation has failed to restore lasting imperial authority. Provincial rivalries and foreign intervention now impose a new ordeal upon the Porte. The political crisis enters another chapter; the work of restoring the state’s accounts continues independently."
 ottoman_1776_goal_offices_tt: "Replace hereditary bureaucrats with another bureaucracy law."
 ottoman_1776_goal_balance_tt: "Maintain a bureaucracy balance of zero or above."
 ottoman_1776_goal_reserve_tt: "Maintain a bureaucracy balance of zero or above AND have no approaching bureaucracy shortage."
 ottoman_1776_goal_supply_tt: "At least 90% of government administrations have no goods shortage; at least one exists."
 ottoman_1776_goal_land_tax_tt: "No longer apply land-based taxation."
 ottoman_1776_goal_consumption_tax_tt: "No longer apply the consumption-based taxation law."
 ottoman_1776_goal_police_tt: "The police institution reaches at least level 3."
 ottoman_1776_goal_schools_tt: "The education institution reaches at least level 3."
 ottoman_1776_goal_tax_capacity_tt: "Tax capacity meets usage in at least 75% of incorporated states; at least one exists."
 ottoman_1776_goal_staff_tt: "At least 90% of government administrations have at least 80% staffing; at least one exists."
 ottoman_1776_admin_completion_tt: "The journal’s administrative penalty and its temporary bonus are removed together: the imperial accounts are permanently restored."
 ottoman_1776.10.t: "An Outworn Bureaucracy"
 ottoman_1776.10.d: "The Porte’s registers enumerate the Sultan’s dues, yet revenues pass through a multitude of intermediaries. Tax farms, sometimes granted for life, advance the Treasury the funds it needs; they also give the holders of provincial revenues an influence that the offices in Constantinople struggle to control. Among exemptions, old claims and overdue accounts, the sum promised is not always the sum received. Staffing offices, verifying receipts and enforcing imperial decisions have become necessities: the Sultan’s seal cannot stand in place of rendered accounts."
 ottoman_1776.10.f: "#italic The old clerk drew from the chest a register whose leather was crumbling. A receipt, folded between two pages, bore three seals and no date. ‘The village has paid,’ he said. ‘So has the tax farmer, or so he assures us.’ His apprentice looked at the empty column. Outside, porters unloaded the Treasury’s sacks; inside the office, the money was still a promise.\n\n— The Registers of the Golden Horn#!"
 ottoman_1776.10.a: "We must restore the accounts and see our orders obeyed."
 ottoman_1776.10.a.tt: "Activates the #bold $je_1776_porte_burden$#! Journal Entry.\nEach fulfilled administrative objective temporarily alleviates this entry’s penalties. Resolution requires all conditions to remain fulfilled for 12 consecutive months."
 ottoman_1776.11.t: "One Throne, a Thousand Masters"
 ottoman_1776.11.d: "From the Balkans to the Arab provinces, the imperial decrees proclaim a single sovereignty. Their execution nevertheless depends on governors, provincial notables and households that command the country’s revenues and manpower. In Egypt, the Mamluk beys maintain their own forces; elsewhere, powerful men negotiate what they owe the centre and what they intend to retain. Their allegiance has not vanished, but a seal alone no longer commands it. The Porte must give these authorities a place within a common order before their rivalries and foreign ambitions tear the imperial edifice apart."
 ottoman_1776.11.f: "#italic The messenger had crossed three provinces under the protection of the same decree. At every gate, they had asked for another name. ‘Does the Sultan’s no longer suffice?’ The guard drew aside the curtain: in the courtyard, the bey’s men were waiting for their pay. ‘Here,’ he replied, ‘we know who provides it.’\n\n— The Sultan’s Gates#!"
 ottoman_1776.11.a: "We must rally the provinces and strengthen our authority."
 ottoman_1776.11.a.tt: "Activates the #bold $je_1776_many_masters$#! Journal Entry.\nThe Empire has until #bold 1 January 1836#!, 60 years from 1776, to resolve this crisis. Prolonged instability accompanied by severe pressure can bring about its downfall before that deadline.\nFailure carries the crisis into #bold $je_sick_man_main$#!. While this entry remains active, its effects increase subjects’ liberty desire and make foreign support for separatism easier."
