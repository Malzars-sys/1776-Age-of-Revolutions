l_english:
 aor1776_r3_acknowledge:0 "So be it."
 aor1776_r3_support_treaty:0 "Convention of Relief and Advances to Congress"
 aor1776_r3_journal_open_tt:0 "Correspondence with the French intermediaries has been opened."
 aor1776_r3_relationship_tt:0 "The independence war continues and relations with France permit negotiations."
 aor1776_r3_negotiations_available_tt:0 "No existing relief agreement, unpaid loan, refusal cooldown or pending negotiations prevent a new request."
 aor1776_r3_debt_peace_tt:0 "The debtor country is at peace."
 aor1776_open_french_support_correspondence:0 "Open the French correspondence"
 aor1776_open_french_support_correspondence_desc:0 "Following the opening authorized by Versailles, receive the intermediaries and consider requesting French aid. Any loan terms remain to be negotiated."
 aor1776_r3_ratification_tt:0 "Ratify a ten-year treaty: £30,000 weekly, supplies and instructors. Congress owes an obligation and acknowledges the capital repayable after the binding period, calculated from the payments scheduled over that term. Peace does not end this financing. Any agreed interest is added to the principal once."
 aor1776_r3_repay_tt:0 "Pay the creditor the amount demanded and settle this agreement. If reserves are insufficient, this expense may increase our public debt."
 aor1776_r3_refuse_tt:0 "Repudiate this claim: +10 infamy and −40 relations with the creditor. Credit ends; the repudiated amount remains recorded, with no repeated automatic demand for this same debt."
 aor1776_american_diplomacy.1.t:0 "Aid from across the Atlantic"
 aor1776_american_diplomacy.1.d:0 "Versailles has authorized its intermediaries to approach Congress. France is willing to consider a request for advances, weapons and instructors to sustain our resistance to London. We may now seek that assistance and discuss the commitments we must offer in return."
 aor1776_american_diplomacy.1.f:0 "The packet had crossed the ocean under a merchant’s address. Inside, between two invoices, a few lines offered more than merchandise. The secretary read them twice before looking up at the Congress table."
 aor1776_american_diplomacy.2.t:0 "What We Can Promise"
 aor1776_american_diplomacy.2.d:0 "Congress requests £30,000 weekly for ten years, weapons and instructors from France. We must pledge an obligation and repayment of the financing at maturity. We may offer an interest-free agreement or 5% interest on the principal. France must still approve and send its offer."
 aor1776_american_diplomacy.2.f:0 "On the draft, the word gift had been crossed out. A delegate rested his finger on the margin: the weapons might help win the war; the figures would be waiting after peace."
 aor1776_american_diplomacy.3.t:0 "The Congressional Request"
 aor1776_american_diplomacy.3.d:0 "Congress requests £30,000 weekly for ten years, fifteen units of small arms, one unit of artillery and instructors. It promises an obligation and an acknowledgement of debt covering the scheduled financing, without interest. Our approval sends an offer it may still refuse."
 aor1776_american_diplomacy.3.f:0 "The letter bore no royal seal. It spoke of barefoot regiments and empty stores, then returned to what mattered in Versailles: Congress would acknowledge every pound advanced."
 aor1776_american_diplomacy.4.t:0 "The Offer from Versailles — No Interest"
 aor1776_american_diplomacy.4.d:0 "Versailles offers £30,000 weekly for ten years, fifteen units of small arms, one unit of artillery and instructors. Congress owes an obligation and repayment of the financing at maturity: approximately £15.6 million, without interest. The acknowledgement of debt covers payments scheduled throughout the binding period; supplies and instructors are excluded."
 aor1776_american_diplomacy.4.f:0 "The courier waited by the door, his coat still damp. On the table lay two copies bearing the same figures. Only the decision of Congress remained."
 aor1776_american_diplomacy.5.t:0 "An Unsealed Convention"
 aor1776_american_diplomacy.5.d:0 "The treaty can no longer be ratified: the war, relations or access for supplies have changed. No new loan or obligation is created. Negotiations may resume if conditions permit."
 aor1776_american_diplomacy.6.t:0 "A Guarded Reply"
 aor1776_american_diplomacy.6.d:0 "The court declines to commit its funds on the proposed terms. We may submit another request in three months."
 aor1776_american_diplomacy.1.a:0 "Lay these letters before Congress."
 aor1776_american_diplomacy.2.a:0 "Promise repayment without interest."
 aor1776_american_diplomacy.2.b:0 "Agree to 5% interest at maturity."
 aor1776_american_diplomacy.2.c:0 "We should make no such commitment."
 aor1776_american_diplomacy.3.a:0 "Send an offer on the requested terms."
 aor1776_american_diplomacy.3.b:0 "Our finances do not permit it."
 aor1776_american_diplomacy.3.c:0 "Require 5% interest at maturity."
 aor1776_american_diplomacy.4.d_high:0 "Versailles offers £30,000 weekly for ten years, fifteen units of small arms, one unit of artillery and instructors. This offer carries 5% interest: scheduled repayment at maturity is approximately £16.4 million, against £15.6 million without interest. The aid received is identical; interest increases the debt. Congress also grants an obligation. Supplies and instructors are excluded from the principal."
 aor1776_american_diplomacy.4.a:0 "Ratify the interest-free loan."
 aor1776_american_diplomacy.4.b:0 "Reject these terms."
 aor1776_debt.1.t:0 "The Time to Settle"
 aor1776_debt.1.d:0 "[SCOPE.sCountry('aor1776_creditor').GetName] demands payment of our acknowledgement of debt now that the binding term has ended. The amount due, including agreed interest, is £[ROOT.GetCountry.MakeScope.Var('aor1776_debt_due').GetValue|0]. We may honour our signature or repudiate the claim at the cost of our reputation and relations."
 aor1776_debt.1.f:0 "The ledger had outlasted changes of ministers. Its pages held the dates, advances and signatures that peace had not erased. The creditor’s messenger did not raise his voice; he waited for an answer."
 aor1776_debt.1.a:0 "Honour our debt."
 aor1776_debt.1.b:0 "We shall no longer acknowledge this claim."
 aor1776_deferred_debt:0 "Deferred Repayment Agreement"
 aor1776_deferred_debt_desc:0 "Lend £10,000 to the target country, with its consent and without interest, for ten years. At maturity, the creditor may demand repayment. Each debtor may have one live creditor agreement. Refusing payment costs 10 infamy and 40 relations."
 aor1776_deferred_debt_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] acknowledges a contractual principal of £[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.MakeScope.Var('aor1776_debt_principal').GetValue|0] owed to [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] at maturity. Repayment cannot be demanded during the binding period. Any agreed interest is added when payment is requested."
 aor1776_demand_debt_repayment:0 "Demand Debt Repayment"
 aor1776_demand_debt_repayment_desc:0 "Demand the agreed principal and any interest after the binding period ends. For the American convention, principal corresponds to £30,000 weekly over the ten-year term. The debtor may pay or refuse; refusal gives it 10 infamy and reduces our relations by 40."
 aor1776_deferred_debt_action_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_propose_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_notification_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] and [TARGET_COUNTRY.GetName] enter into a deferred repayment agreement."
 aor1776_deferred_debt_action_notification_third_party_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] and [TARGET_COUNTRY.GetName] address repayment of their advances."
 aor1776_demand_debt_repayment_action_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_propose_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_notification_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] demands settlement of the advances received."
 aor1776_demand_debt_repayment_action_notification_third_party_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] and [TARGET_COUNTRY.GetName] address repayment of their advances."
 aor1776_deferred_debt_action_break_name:0 "Close the Debt Agreement"
 aor1776_deferred_debt_article:0 "Acknowledgement of Debt"
 aor1776_deferred_debt_article_effects_desc:0 "The debtor undertakes to repay the agreed principal after the binding period ends. American financing is calculated from £30,000 weekly and the treaty’s duration. Any pledged interest is added once when payment is demanded. Refusal causes +10 infamy and −40 relations with the creditor."
 aor1776_deferred_debt_article_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] promises to repay [TARGET_COUNTRY.GetNameNoFormatting] at maturity"
 aor1776_war_credit_moderate:0 "£14,000 War Credit"
 aor1776_war_credit_moderate_effects_desc:0 "France advances £14,000 weekly, without interest. Each payment is deducted from French reserves and added to the principal owed by Congress. Advances pause if reserves are insufficient or France defaults, and end at peace or after 3 September 1783."
 aor1776_war_credit_moderate_article_short_desc:0 "£14,000 in weekly advances from [SOURCE_COUNTRY.GetNameNoFormatting] to [TARGET_COUNTRY.GetNameNoFormatting]"
 aor1776_war_credit_extended:0 "£21,000 War Credit"
 aor1776_war_credit_extended_effects_desc:0 "France advances £21,000 weekly, with 5% interest at settlement. Each payment is deducted from French reserves and added to the principal owed by Congress. Advances pause if reserves are insufficient or France defaults, and end at peace or after 3 September 1783."
 aor1776_war_credit_extended_article_short_desc:0 "£21,000 in weekly advances from [SOURCE_COUNTRY.GetNameNoFormatting] to [TARGET_COUNTRY.GetNameNoFormatting]"
 aor1776_revolution_military_assistance:0 "Instructors for Congress"
 aor1776_revolution_military_assistance_effects_desc:0 "French instructors increase American training speed and unit experience gain by 10%. Supporting them raises French military goods costs by 5%. This assistance accompanies the ten-year commitment."
 aor1776_revolution_military_assistance_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] provides instructors to [TARGET_COUNTRY.GetNameNoFormatting]"
 intervene_in_war:0 "Join an Ongoing War"
 intervene_in_war_action_name:0 "Join the Country’s Wars"
 intervene_in_war_desc:0 "Join wars led by the target country, or wars in which it is already fighting if we are allies. Land or coastal access is required; truces with its enemies prevent intervention."
 intervene_in_war.tt:0 "Join wars led by the supported country."
 intervene_in_war_action_notification_name:0 "A New Intervention"
 intervene_in_war_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] joins the side of [TARGET_COUNTRY.GetName]."
 intervene_in_war_action_notification_third_party_name:0 "A New Intervention"
 intervene_in_war_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] joins the side of [TARGET_COUNTRY.GetName]."
 join_war:0 "War Intervention"
 join_war_effects_desc:0 "The committing country joins wars led by the other country. If both are allied, the supported country may also be a supporting participant. A Family Compact call covers only the American war. Once joined, war participation no longer depends on this treaty."
 join_war_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] joins the side of [TARGET_COUNTRY.GetNameNoFormatting]"
 ai_strategy_aor1776_french_revolution_war:0 "Carry the War to Britain"
 ai_strategy_aor1776_french_revolution_war_desc:0 "Expand the army, fleet and shipyards to defeat Britain. The French war objective requires occupation of its capital."
 ai_strategy_aor1776_spanish_revolution_war:0 "Recover the Disputed Possessions"
 ai_strategy_aor1776_spanish_revolution_war_desc:0 "Strengthen the army and fleet to recover British possessions claimed by Spain."
 aor1776_break_british_power:0 "Break British Power"
 war_goal_aor1776_break_british_power:0 "Break British Power"
 war_goal_aor1776_break_british_power_type_name:0 "Break British Power"
 war_goal_aor1776_break_british_power_desc:0 "Impose humiliation on Britain. This objective requires control of its capital and transfers no territory."
 war_goal_aor1776_break_british_power_type_desc:0 "Impose humiliation on Britain. This objective requires control of its capital and transfers no territory."
 war_goal_aor1776_break_british_power_sway_desc:0 "Impose humiliation on Britain. This objective requires control of its capital and transfers no territory."
 aor1776_support_supplies_effects_desc:0 "$aor1776_support_supplies_desc$"
 aor1776_support_supplies_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] supplies weapons to [TARGET_COUNTRY.GetNameNoFormatting]"
 aor1776_deferred_debt_proposal_notification_name:0 "Offer of a Deferred Repayment Loan"
 aor1776_deferred_debt_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] offers an interest-free £10,000 loan repayable after a ten-year binding period. Refusing payment then will cost us 10 infamy and 40 relations."
 aor1776_deferred_debt_proposal_accepted_name:0 "Loan Accepted"
 aor1776_deferred_debt_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepts our £10,000 loan and repayment after ten years."
 aor1776_deferred_debt_proposal_declined_name:0 "Loan Declined"
 aor1776_deferred_debt_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] declines our loan proposal. No money is advanced."
 aor1776_deferred_debt_proposal_third_party_accepted_name:0 "Credit Agreement Concluded"
 aor1776_deferred_debt_proposal_third_party_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepts a loan from [INITIATOR_COUNTRY.GetName], with deferred repayment."
 aor1776_deferred_debt_proposal_third_party_declined_name:0 "Credit Agreement Declined"
 aor1776_deferred_debt_proposal_third_party_declined_desc:0 "[TARGET_COUNTRY.GetName] declines the loan offered by [INITIATOR_COUNTRY.GetName]."
 aor1776_r3_offer_still_valid_tt:0 "The proposal remains valid, no other credit agreement is open and France has £30,000 in reserves without being in default."
 aor1776_r3_no_existing_debt_tt:0 "The target country has no current deferred repayment credit agreement."
 aor1776_r3_no_pending_demand_tt:0 "No repayment demand for this debt is already awaiting an answer."
 aor1776_american_diplomacy.3.d_high:0 "Congress requests £30,000 weekly for ten years, fifteen units of small arms, one unit of artillery and instructors. It promises an obligation and an acknowledgement of debt covering the scheduled financing, with 5% interest at maturity. Our approval sends an offer it may still refuse."
 aor1776_support_money_effects_desc:0 "$aor1776_support_money_desc$"
 aor1776_support_money_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] pays £30,000 weekly to [TARGET_COUNTRY.GetNameNoFormatting]"
 aor1776_r4_debt_unbound_tt:0 "The ten-year binding term has ended and no treaty carrying this acknowledgement of debt still binds the two countries."
 aor1776_deferred_debt_action_notification_break_name:0 "Debt Agreement Closed"
 aor1776_deferred_debt_action_notification_break_desc:0 "The debt agreement between [INITIATOR_COUNTRY.GetName] and [TARGET_COUNTRY.GetName] has ended."
 aor1776_deferred_debt_action_notification_third_party_break_name:0 "Debt Agreement Closed"
 aor1776_deferred_debt_action_notification_third_party_break_desc:0 "The debt agreement between [INITIATOR_COUNTRY.GetName] and [TARGET_COUNTRY.GetName] has ended."
 aor1776_call_family_compact:0 "Call the Family Compact Ally"
 aor1776_call_family_compact_desc:0 "Ask Spain, our ally, to join our side in the American war. Acceptance ratifies a war intervention article. Spain may decline depending on its circumstances; the call does not force participation before consent."
 aor1776_call_family_compact_action_name:0 "Call Spain to War"
 aor1776_call_family_compact_action_propose_name:0 "Call Spain to War"
 aor1776_call_family_compact_action_notification_name:0 "Spain Answers the Call"
 aor1776_call_family_compact_action_notification_desc:0 "[TARGET_COUNTRY.GetName] accepts the call from [INITIATOR_COUNTRY.GetName] and joins its side in the American war."
 aor1776_call_family_compact_action_notification_third_party_name:0 "Spain Answers the Call"
 aor1776_call_family_compact_action_notification_third_party_desc:0 "[TARGET_COUNTRY.GetName] joins the American war at the request of [INITIATOR_COUNTRY.GetName], under their alliance."
 aor1776_call_family_compact_proposal_notification_name:0 "A Call under the Family Compact"
 aor1776_call_family_compact_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] asks us to join its side in the American war against Britain. The alliance does not compel us to accept this call."
 aor1776_call_family_compact_proposal_accepted_name:0 "The Call to Arms Is Accepted"
 aor1776_call_family_compact_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepts our call and joins our side in the American war."
 aor1776_call_family_compact_proposal_declined_name:0 "The Call to Arms Is Declined"
 aor1776_call_family_compact_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] declines our call and does not join the American war."
 aor1776_call_family_compact_proposal_third_party_accepted_name:0 "Spain Enters the War"
 aor1776_call_family_compact_proposal_third_party_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepts the call of its ally [INITIATOR_COUNTRY.GetName] in the American war."
 aor1776_call_family_compact_proposal_third_party_declined_name:0 "Spain Declines the Call"
 aor1776_call_family_compact_proposal_third_party_declined_desc:0 "[TARGET_COUNTRY.GetName] declines to join its ally [INITIATOR_COUNTRY.GetName] in the American war."
 aor1776_family_compact_call_treaty:0 "Family Compact Call to Arms"
 aor1776_american_diplomacy.4.t_high:0 "The Offer from Versailles — 5% Interest"
 aor1776_american_diplomacy.4.c:0 "Ratify the loan with 5% interest."
 aor1776_r5_ratification_no_interest_tt:0 "Sign the treaty: £30,000 weekly for ten years, fifteen small arms, one artillery and instructors. An obligation is granted to France. Scheduled principal of approximately £15.6 million becomes repayable after the binding period, without interest."
 aor1776_r5_ratification_interest_tt:0 "Sign the treaty: £30,000 weekly for ten years, fifteen small arms, one artillery and instructors. An obligation is granted to France. Scheduled repayment after the binding period is approximately £16.4 million: the same principal plus 5% interest charged once."
 aor1776_r5_american_intervention_stake_tt:0 "To intervene in the American war, a country must have an active interest on the Atlantic Coast, support the insurgents as France or Spain, support the British side as their Portuguese ally, or oppose Britain as a rival."
 aor1776_r6_french_invitation_tt:0 "France has authorized the opening of negotiations with Congress."
 aor1776_american_diplomacy.8.t:0 "Reaching London across the Ocean"
 aor1776_american_diplomacy.8.d:0 "The American colonies are challenging the authority of our rival across the Channel. Sustaining their resistance would force London to commit men and money to that distant quarrel. We may authorize intermediaries to approach Congress about assistance in funds, weapons and instructors. The terms must then be negotiated with the Americans."
 aor1776_american_diplomacy.8.f:0 "A finger traced the American coast on the map before returning to the Channel. At Versailles, the price of defeat was well understood; this time, the dispatches promised to send the bill to London. The secretary waited only to learn where the first letters should be addressed."
 aor1776_american_diplomacy.8.a:0 "Support the insurgents through discreet channels."
 aor1776_american_diplomacy.8.b:0 "Keep out of this undertaking."
 aor1776_american_diplomacy.8.a_tt:0 "Congress will be informed of our willingness to negotiate. It may then request our aid and propose its financial commitments."
 aor1776_american_diplomacy.8.b_tt:0 "No intermediaries will be sent, and requests for French relief will remain unavailable."
