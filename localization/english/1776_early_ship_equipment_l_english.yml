l_english:
 aor_caravel_armor_low: "Carvel planking on frames"
 aor_caravel_armor_low_desc: "Flush planks fastened to frames: a smooth wooden hull, not metal armor."
 aor_caravel_armor_mid: "Double frames and deck clamps"
 aor_caravel_armor_mid_desc: "Paired frames and longitudinal deck clamps distribute deck loads."
 aor_caravel_armor_high: "Diagonal timber bracing"
 aor_caravel_armor_high_desc: "Diagonal timbers resist longitudinal distortion, inspired by nineteenth-century Seppings framing."
 aor_caravel_guns_low: "8 two-pounder swivel falconets"
 aor_caravel_guns_low_desc: "Small swivel-mounted barrels for close defense. Pounds refer to shot weight."
 aor_caravel_guns_mid: "12 six-pounder long guns on truck carriages"
 aor_caravel_guns_mid_desc: "Muzzle-loading smoothbores on deck truck carriages with breeching ropes."
 aor_caravel_guns_high: "8 twelve-pounder carronades on slides"
 aor_caravel_guns_high_desc: "Short broad-muzzled barrels on slides: close-range firepower, a technology later than the 1776 start."
 aor_caravel_propulsion_low: "Square course sail"
 aor_caravel_propulsion_low_desc: "One square course sail on the main mast, without machinery."
 aor_caravel_propulsion_mid: "Course sail and topsail"
 aor_caravel_propulsion_mid_desc: "A topsail is added above the course sail on the same mast."
 aor_caravel_propulsion_high: "Course sail, topsail and topgallant"
 aor_caravel_propulsion_high_desc: "A topgallant above the topsail completes three sail tiers on the same mast, without engines."
 aor_caravel_range_low: "Provisions in hold casks"
 aor_caravel_range_low_desc: "Food and water casks stowed in the existing hold."
 aor_caravel_range_mid: "Quarterdeck and separate provision store"
 aor_caravel_range_mid_desc: "An aft deck and a provision compartment separate from other cargo."
 aor_caravel_range_high: "Campaign platform deck and water stores"
 aor_caravel_range_high_desc: "An internal provision platform and organized water-cask stowage."
 aor_galley_armor_low: "Light carvel planking"
 aor_galley_armor_low_desc: "A narrow framed hull built for rowing and coastal service."
 aor_galley_armor_mid: "Longitudinal stringers and rowing crossbeams"
 aor_galley_armor_mid_desc: "Longitudinal timbers and crossbeams carry rowing-bank loads."
 aor_galley_armor_high: "Doubled keel and continuous keelson"
 aor_galley_armor_high_desc: "Keel reinforcement and a continuous internal beam improve stiffness without iron armor."
 aor_galley_guns_low: "One six-pounder bow gun and 2 swivels"
 aor_galley_guns_low_desc: "A light axial gun and two small swivel pieces support boarding."
 aor_galley_guns_mid: "One twelve-pounder bow chaser and 2 three-pounders"
 aor_galley_guns_mid_desc: "An axial bow-carriage gun accompanied by two smaller pieces."
 aor_galley_guns_high: "One twenty-four-pounder axial gun and 2 six-pounders"
 aor_galley_guns_high_desc: "A forward battery with an axial guided gun carriage; it does not turn the galley into a ship of the line."
 aor_galley_propulsion_low: "Alla sensile rowing: separate oars"
 aor_galley_propulsion_low_desc: "Several rowers share a bench, each handling a separate oar."
 aor_galley_propulsion_mid: "A scaloccio rowing: shared sweep"
 aor_galley_propulsion_mid_desc: "A large sweep is worked by several rowers together."
 aor_galley_propulsion_high: "A scaloccio rowing with two lateen sails"
 aor_galley_propulsion_high_desc: "Shared sweeps supplemented by two lateen-rigged masts; no engine."
 aor_galley_range_low: "Bench lockers and water skins"
 aor_galley_range_low_desc: "Compact provisions for coastal sorties."
 aor_galley_range_mid: "Casks beneath the gangway"
 aor_galley_range_mid_desc: "Casks stowed beneath the central fore-and-aft gangway."
 aor_galley_range_high: "Stern provision store and spare oars"
 aor_galley_range_high_desc: "An organized stern store and spare sweeps. The coastal distance limit remains 1."
 aor_cog_armor_low: "Riveted clinker planking"
 aor_cog_armor_low_desc: "Overlapping riveted planks form a traditional cog hull."
 aor_cog_armor_mid: "Floors tied into a keelson"
 aor_cog_armor_mid_desc: "Structural ties join the hull bottom to an internal keel-aligned beam."
 aor_cog_armor_high: "Hold stringers and through-beams"
 aor_cog_armor_high_desc: "Internal longitudinal stringers and transverse beams carry military cargo loads."
 aor_cog_guns_low: "4 one-pounder swivel guns"
 aor_cog_guns_low_desc: "Small rail-mounted pieces protect the crew; this is not a battle battery."
 aor_cog_guns_mid: "4 three-pounder long guns"
 aor_cog_guns_mid_desc: "Light truck-carriage guns defend the transport."
 aor_cog_guns_high: "4 six-pounder carronades"
 aor_cog_guns_high_desc: "Short defensive pieces: a deliberately limited later refit of an older transport."
 aor_cog_propulsion_low: "Single mast and square sail"
 aor_cog_propulsion_low_desc: "The traditional single-masted square-sail cog rig."
 aor_cog_propulsion_mid: "Square sail with reef bands"
 aor_cog_propulsion_mid_desc: "Reef bands allow controlled sail-area reduction as winds change."
 aor_cog_propulsion_high: "Square mainsail with topsail"
 aor_cog_propulsion_high_desc: "A sail above the mainsail is a later sailing refit, not machinery."
 aor_cog_range_low: "Open hold and deck accommodation"
 aor_cog_range_low_desc: "Basic transport in the existing hold and on deck."
 aor_cog_range_mid: "Berth platform deck and equipment racks"
 aor_cog_range_mid_desc: "Berths on an internal platform, with equipment secured separately."
 aor_cog_range_high: "Troop deck and cargo hatchways"
 aor_cog_range_high_desc: "A dedicated troop deck and organized loading openings prioritize transport."
 aor_landing_launches: "Landing launches"
 aor_landing_launches_desc: "Oared launches connect the transport to the shore."
 aor_caravel_blockade: "Blockade organization"
 aor_caravel_blockade_desc: "Watch parties, signals and control of port approaches."
 aor_caravel_landing: "Launches and landing detachment"
 aor_caravel_landing_desc: "Launches and troop space, dedicated to landing troops. Only one function modification can be fitted."
 aor_galley_coastal_battery: "Coastal fighting battery"
 aor_galley_coastal_battery_desc: "Forward-battery drills for fighting near ports. The out-of-range penalty remains."
 aor_galley_boarding_spur: "Bow boarding spur"
 aor_galley_boarding_spur_desc: "An above-water bow spur helps close and board, not a modern armored ram."
