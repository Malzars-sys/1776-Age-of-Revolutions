l_english:
 bauxite:0 "Bauxite"
 bauxite_desc:0 "An aluminium-rich ore that must be mined and chemically refined before the metal can be produced."
 alloys:0 "Industrial Alloys"
 alloys_desc:0 "Purpose-made mixtures of iron, copper, lead and other metals whose properties suit machinery, structures, vehicles and armaments better than a single pure metal."
 aluminium:0 "Aluminium"
