l_english:
 law_mercantilism_navigation_acts: "Navigation Acts"
 law_mercantilism_navigation_acts_desc: "Navigation Acts are made to boost British Shipping Industry and trade with her colonies but also including with other countries. Primarily following mercantilist principles, it also limits how much foreign countries can trade with her colonies. The Acts require all trading vessels importing or exporting goods must be built in Britain, Ireland or the Colonies, must be owned by the people from these places and must contain atleast at least three-fourths British or Irish (or British colonial) crews and all trading vessels must goto a British port firstly before any colonies or foreign countries."
 law_merchant_banking: "Merchant Banking"
 law_merchant_banking_desc: "A system dominated by merchant oligarchies, commercial credit, maritime trade, and privileged companies. It favors shipbuilding while making direct mining and plantation exploitation in unincorporated territories less efficient. Its strong protection of private property serves compact trading republics well, but makes administering and incorporating vast territories increasingly difficult."
