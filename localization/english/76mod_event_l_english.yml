l_english:
 haiti_independence.1.t: "Through Grit And Chance"
 haiti_independence1.d: "Haiti Has Achieved Freedom"
 haiti_independence.1.f: "Hope is a Haitian verb. It’s not something we wait for; it’s something we create. Now we free the slaves, but now to decide how do we rule ourselves no longer bound by the old way?"
 haiti_independence.1.a: "Declare the Empire of Haiti"
 
 haiti_independence.1.b: "We shall aspire and work towards being under Republican ideals"
 
 irish_question.1.t: "Answering the Irish Question"
 irish_question.1.d: "Ireland has made it's voice heard, now is time to make changes"
 irish_question.1.f: "Parliament is debating heavily on this damning issue, the Personal Union under the Irish Parliament isn't ideal and its clear, do we make an Acts of Union to merge it into Great Britain or give it full Home Rule?"
 irish_question.1.a: "We will do Acts of Union"
 irish_question.1.b: "Give Ireland Home Rule"
 
 je_venetian_empire: "Gaining the Venetian Empire back"
 venetian_empire.1.t: "Regaining our dominance"
 venetian_empire.1.d: "The Merchant Class of the Most Serene Republic of Venice have an idea"
 venetian_empire.1.f: "With losing our Overseas Empire we have lost our dominance of trade, mainly to the Turks, of course it's the Turks, with new nationalist sentiments rising in Venice, we could stoke these flames to our advantage in getting our Empire back and perhaps acquire new ones in Africa. We may need a Great Powers assistance and to balance our alliances nicely."
 
 venetian_empire.1.a: "We strike soon!"
 
 venetian_empire.2.t: "The Empire is back!"
 venetian_empire.2.d: "The Merchants rejoice in the Most Serene Republic of Venice"
 venetian_empire.2.f: "The Venetian Navy rules the meditterean, to move through our backyard you must now talk to a Venetian Merchant, Africa is surely next in growing our dominance even more. But for now we work on incorporating these lands into Venice proper and efficiently taxing our subjects."

 venetian_empire.2.a: "We have won"

 
 irish_nationalism.1.t: "Unrest in Ireland"
 irish_nationalism.1.d: "Raids on armouries, fences tore down, attacks on landlords..."
 irish_nationalism.1.f: "They demand lower taxes, more representation, what's next? Complete independence! We can't have that...right?"
 
 irish_nationalism.1.a: "Now is time to put the boot down"
 irish_nationalism.1.b: "Don't interfere, let them wear themselves out"
 
 irish_nationalism.2.t: "Settlers Arriving in Ulster"
 irish_nationalism.2.d: "New plantations established, new Towns pop up along rivers and roads, Ulsters economy is thriving from the project"
 irish_nationalism.2.f: "The arrival of new communities promises prosperity and innovation, yet also creates the potential for generations of friction over land and faith. The question is how much do we promote the project?"
 
 irish_nationalism.2.a: "Promote Settling with privileges"
 irish_nationalism.2.b: "Let it happen naturally"
 
 
 