l_french:
 organized_military_establishments:0 "Établissements militaires organisés"
 organized_military_establishments_desc:0 "Des pratiques générales de coordination de l’organisation militaire, de la formation, de la logistique et des services spécialisés forment un socle commun pour des pratiques militaires plus avancées, sans représenter une institution formelle particulière."
 organized_naval_establishments:0 "Établissements navals organisés"
 organized_naval_establishments_desc:0 "Des pratiques administratives, techniques et logistiques générales fournissent le socle nécessaire au soutien d’une activité navale organisée, sans impliquer un arsenal ou une institution navale particulière."
 organized_financial_institutions:0 "Institutions financières organisées"
 organized_financial_institutions_desc:0 "Des pratiques générales de comptabilité, de crédit et d’intermédiation financière forment un socle commun pour des systèmes financiers plus spécialisés, sans impliquer une banque centrale ou une bourse moderne."
