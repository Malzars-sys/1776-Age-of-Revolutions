l_french:
 birth_quota_tests.1.t: "Catalogue de test des amendements"
 birth_quota_tests.1.d: "Les neuf amendements du quota de naissance :\n\n• $amendment_birth_quota_landowner_authority$\n• $amendment_birth_quota_devout_patronage$\n• $amendment_birth_quota_military_households$\n• $amendment_birth_quota_family_shops$\n• $amendment_birth_quota_rural_exemptions$\n• $amendment_birth_quota_industrial_exemptions$\n• $amendment_birth_quota_education_guarantees$\n• $amendment_birth_quota_worker_protections$\n• $amendment_birth_quota_housewife_wage$\n\nSurvolez le bouton d'ajout pour consulter les effets des amendements manquants. Cliquer les attache à la loi : utilisez une sauvegarde de test. Le quota doit déjà être en vigueur."
 birth_quota_tests.1.close: "Fermer sans rien modifier"
 birth_quota_tests.1.add: "Ajouter les neuf amendements pour les tester"
 birth_quota_tests.1.warning: "TEST : les amendements manquants seront ajoutés au quota de naissance. Leurs effets se cumulent ; le salaire des femmes au foyer radicalise les classes aisées. Ouvrez ensuite la loi pour consulter chaque amendement. Rechargez votre sauvegarde après le test."
