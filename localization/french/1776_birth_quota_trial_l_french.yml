l_french:
 movement_anti_natalist: "Mouvement anti-nataliste"
 movement_anti_natalist_icon: "@movement_category_anti_natalist!"
 movement_category_anti_natalist_icon: "@movement_category_anti_natalist!"
 movement_anti_natalist_name: "Mouvement anti-nataliste"
 movement_anti_natalist_desc: "Une opposition virulente aux quotas de naissance, qui défend l'autonomie des femmes et des familles."
 ideology_anti_natalist_movement: "Opposition anti-nataliste"
 ideology_anti_natalist_movement_desc: "Ce mouvement rejette la contrainte démographique imposée par l'État."
 ideology_natalist_intelligentsia: "Natalisme institutionnel"
 ideology_natalist_intelligentsia_desc: "Les Intellectuels ont fait du quota de naissance un principe permanent."
 birth_quota_anti_natalist_radicalism_tt: "Opposition virulente au quota pendant l'épreuve politique"
 je_birth_quota_trial: "L'épreuve des quotas de naissance"
 je_birth_quota_trial_reason: "L'application du quota divise le pays. Ses partisans doivent convaincre la société avant que le mouvement anti-nataliste ne parvienne à l'abroger."
 birth_quota_trial_activated_tt: "Active l'entrée du journal « L'épreuve des quotas de naissance »."
 birth_quota_trial_progress_bar: "Acceptation des quotas"
 birth_quota_trial_progress_bar_desc: "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]"
 birth_quota_fervor_positive_tt: "Ferveur culturelle supérieure à 35"
 birth_quota_fervor_negative_tt: "Ferveur culturelle de 35 ou moins"
 birth_quota_peace_positive_tt: "Ni guerre ni coup diplomatique actif"
 birth_quota_peace_negative_tt: "Guerre ou coup diplomatique actif"
 birth_quota_sol_positive_tt: "Niveau de vie supérieur au niveau attendu"
 birth_quota_sol_negative_tt: "Niveau de vie inférieur ou égal au niveau attendu"
 birth_quota_revolution_positive_tt: "Aucune révolution avancée au-delà de 75 %"
 birth_quota_revolution_negative_tt: "Une révolution dépasse 75 % d'avancement"
 birth_quota_events.11.t: "Les quotas s'enracinent"
 birth_quota_events.11.d: "Année après année, pétitions et manifestations n'ont pas suffi à renverser le quota. Ses défenseurs occupent désormais les sociétés savantes et les bureaux chargés de la population ; les Intellectuels en font un principe politique durable. L'administration institue aussi une compensation démographique, ajustée dans chaque région aux conditions de vie et à l'alphabétisation."
 birth_quota_events.11.f: "Dans un bureau aux armoires pleines de registres, une employée reporte le deux-centième point sur le graphique. « C'est donc terminé ? » demande son collègue. Elle ferme le livre sans sourire : « Pour nous, peut-être. Pas pour les familles qui y figurent. »"
 birth_quota_events.11.a: "Le régime se consolide"
 birth_quota_victory_ideology_tt: "Les Intellectuels obtiennent l'idéologie Natalisme institutionnel."
 birth_quota_victory_modifier_tt: "Le pays reçoit le modificateur national permanent Compensation nataliste institutionnelle : +1 % de natalité visible dans les modificateurs, complété par une compensation régionale recalculée selon l'alphabétisation et le niveau de vie. Ce bonus reste actif tant que le quota de naissance est en vigueur."
 birth_quota_events.12.t: "Les quotas s'effondrent"
 birth_quota_events.12.d: "Les refus de déclaration, les arrêts de travail et les critiques venues des médecins ont fini par vider le quota de son autorité. Le gouvernement retire les instructions envoyées aux administrateurs. En lieu et place de cette expérience coercitive, la tutelle légale est rétablie."
 birth_quota_events.12.f: "Sur la place, un employé municipal décolle l'affiche détrempée du quota. Une passante s'arrête avec son enfant. « C'est fini ? » demande-t-elle. Il roule le papier : « Le décret, oui. Ce qu'il a fait aux gens, je ne sais pas. »"
 birth_quota_events.12.a: "Abroger le quota"
 birth_quota_failure_guardianship_tt: "La loi Tutelle légale est promulguée à la place du quota de naissance."
 birth_quota_events.13.t: "Les quotas abolis par la défaite"
 birth_quota_events.13.d: "La paix est signée sous les yeux des représentants étrangers. Le vainqueur exige l'abrogation du quota de naissance et la promulgation du suffrage des femmes, déjà reconnu dans son propre pays. Les anciens registres de contrôle perdent leur force de loi ; une nouvelle lutte s'ouvre autour de la participation des femmes à la vie politique."
 birth_quota_events.13.f: "Dans la salle du traité, la plume du délégué vaincu tremble au-dessus de la clause nouvelle. « Le vote des femmes aussi ? » demande-t-il au représentant étranger. Celui-ci pousse le document vers lui : « C'est la condition de la paix. »"
 birth_quota_events.13.a: "Accepter le traité"
 birth_quota_intervention_suffrage_tt: "La loi Suffrage des femmes du pays vainqueur est promulguée chez nous à la place du quota de naissance."
 birth_quota_events.14.t: "Les quotas abolis par la défaite"
 birth_quota_events.14.d: "Les clauses de paix imposent l'abrogation du quota de naissance. À sa place entre en vigueur la loi du vainqueur autorisant les femmes à travailler. Les bureaux annulent les anciens ordres de retrait des ateliers, tandis que les employeurs préparent le retour de celles dont l'activité avait été interdite."
 birth_quota_events.14.f: "À la porte de l'atelier, une ouvrière retrouve son ancien poste sous le regard des autres. « On nous autorise enfin à revenir ? » demande-t-elle au contremaître. Il lui tend un tablier : « La loi a changé. Il nous reste à rouvrir les machines. »"
 birth_quota_events.14.a: "Accepter le traité"
 birth_quota_intervention_workplace_tt: "La loi Droit des femmes à travailler du pays vainqueur est promulguée chez nous à la place du quota de naissance."
 birth_quota_housewife_wage_modifier: "Salaire des femmes au foyer"
 birth_quota_housewife_wage_modifier_desc: "Une allocation accroît le revenu des personnes à charge et la natalité. Les impôts sur les salaires baissent, tandis que ceux sur les dividendes augmentent. Cette politique prend fin si le quota de naissance est abrogé."
 birth_quota_events.15.t: "Un salaire pour les femmes au foyer"
 birth_quota_events.15.d: "Les syndicats, désormais assez influents pour être entendus, exigent un amendement au quota de naissance pour les femmes écartées des ateliers. Il verserait un revenu aux personnes à charge et allégerait l'impôt sur les salaires, en contrepartie d'une hausse de la taxe de consommation et de l'impôt sur les dividendes. Les représentants des classes aisées dénoncent déjà ce transfert et menacent de se mobiliser."
 birth_quota_events.15.f: "Dans une salle syndicale aux vitres embuées, une déléguée dépose le registre des paies sur la table. « Elles perdent leur salaire pour obéir au décret », dit-elle au ministre. Celui-ci tourne une page, sous le regard des ouvriers : « Alors les foyers devront recevoir de quoi vivre. Qui acceptera de payer ? »"
 birth_quota_events.15.a: "Adopter l'amendement du salaire des femmes au foyer"
 birth_quota_events.15.b: "Refuser la proposition syndicale"
 amendment_birth_quota_landowner_authority: "Autorité des chefs de famille"
 amendment_birth_quota_landowner_authority_desc: "Les propriétaires obtiennent un léger renforcement des objectifs de naissance et une voix politique accrue pour les chefs de famille. Leur encadrement des foyers freine la montée de la radicalisation à tous les niveaux d'acceptation, au prix d'un recul de la main-d'œuvre."
 amendment_birth_quota_devout_patronage: "Patronage des familles nombreuses"
 amendment_birth_quota_devout_patronage_desc: "Les autorités religieuses proposent de surveiller et d'encourager les familles nombreuses. Leurs objectifs plus élevés renforcent leur influence, mais réduisent davantage la main-d'œuvre disponible."
 amendment_birth_quota_military_households: "Foyers du devoir national"
 amendment_birth_quota_military_households_desc: "Les forces armées défendent des objectifs de naissance renforcés au nom des futures recrues. L'État leur accorde aussi une meilleure capacité de conscription, au prix d'un nouveau recul de la main-d'œuvre civile."
 amendment_birth_quota_family_shops: "Dispenses pour les commerces familiaux"
 amendment_birth_quota_family_shops_desc: "La petite bourgeoisie réclame un soutien aux entreprises familiales et aux foyers privés d'un salaire. L'amendement favorise l'auto-réinvestissement, augmente la part minimale détenue par les travailleurs dans les catégories de bâtiments couvertes par les guildes et accroît le revenu des personnes à charge. Les dispenses rendent une partie de la main-d'œuvre aux commerces, au prix d'une légère baisse de la natalité."
 amendment_birth_quota_rural_exemptions: "Priorité aux foyers paysans"
 amendment_birth_quota_rural_exemptions_desc: "Les représentants ruraux réclament des familles plus nombreuses pour l'avenir des campagnes. La perte immédiate de main-d'œuvre est compensée en partie par une meilleure organisation des exploitations agricoles."
 amendment_birth_quota_industrial_exemptions: "Dérogations des manufactures"
 amendment_birth_quota_industrial_exemptions_desc: "Les industriels demandent le retour des ouvrières indispensables aux commandes et aux profits. Le quota est assoupli, la main-d'œuvre s'élargit et les manufactures gagnent en rendement."
 amendment_birth_quota_education_guarantees: "Garanties d'instruction"
 amendment_birth_quota_education_guarantees_desc: "Les Intellectuels refusent que les objectifs démographiques ferment l'école et les carrières aux femmes. L'amendement allège le quota au profit de l'instruction et de l'accès au travail."
 amendment_birth_quota_worker_protections: "Protection des ouvrières"
 amendment_birth_quota_worker_protections_desc: "Les syndicats exigent des exceptions pour les travailleuses et un soutien aux ménages privés d'un salaire. La pression nataliste diminue légèrement tandis que davantage d'adultes peuvent travailler."
 amendment_birth_quota_housewife_wage: "Salaire des femmes au foyer"
 amendment_birth_quota_housewife_wage_desc: "Proposé par les syndicats après la promulgation du quota, cet amendement accroît le revenu des personnes à charge et la natalité. Il réduit le taux de l'impôt sur les salaires de 4 %, mais ajoute 15 % au taux de la taxe de consommation au niveau d'imposition normal, ajustés aux autres niveaux, et 4 % au taux de l'impôt sur les dividendes. Son adoption radicalise les capitalistes et les aristocrates."
