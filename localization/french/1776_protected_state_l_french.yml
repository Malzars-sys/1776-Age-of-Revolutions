 aor1776_protected_state:0 "État client"
 subject_type_aor1776_protected_state:0 "@aor1776_protected_state! $subject_type_aor1776_protected_state_no_icon$"
 subject_type_aor1776_protected_state_no_icon:0 "État client"
 subject_type_aor1776_protected_state_desc:0 "Un État client reconnaît la suzeraineté d’un pays non reconnu sans lui verser de tribut régulier. Il conserve son gouvernement, ses forces et ses initiatives diplomatiques, et ne rejoint pas automatiquement les guerres du suzerain. Le resserrement du lien le transforme en tributaire, puis en vassal avant une éventuelle intégration."
