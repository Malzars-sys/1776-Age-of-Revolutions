 aor1776_protected_state_trigger_desc_first:0 "[TARGET_COUNTRY.GetAltNameNoFormatting('Le')|U][TARGET_COUNTRY.GetName] [TARGET_COUNTRY.GetAltNameNoFormatting('EstSont')] un [concept_aor1776_protected_state|l] [COUNTRY.GetAltAdjectiveNoFlag('MS')|l]"
 aor1776_protected_state_trigger_false_desc_first:0 "Le statut d’[concept_aor1776_protected_state|l] ne s’applique pas à [TARGET_COUNTRY.GetName] vis-à-vis de [COUNTRY.GetName]."
 aor1776_protected_state_trigger_desc_third:0 "[TARGET_COUNTRY.GetAltNameNoFormatting('Le')|U][AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] [TARGET_COUNTRY.GetAltNameNoFormatting('EstSont')] un [concept_aor1776_protected_state|l] [COUNTRY.GetAltNameNoFormatting('Du')][COUNTRY.GetName]"
