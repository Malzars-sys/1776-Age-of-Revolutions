 aor1776_protected_state_proposal_notification_break_effects_desc:0 "L’État client retrouvera son indépendance."
 aor1776_protected_state_effect_desc_global:0 "Est maintenant un [concept_aor1776_protected_state|l]"
 aor1776_protected_state_effect_desc_first:0 "[TARGET_COUNTRY.GetAltNameNoFormatting('Le')|U][TARGET_COUNTRY.GetName] [TARGET_COUNTRY.GetAltNameNoFormatting('EstSont')] maintenant un [concept_aor1776_protected_state|l] [COUNTRY.GetAltAdjectiveNoFlag('MS')|l]"
 aor1776_protected_state_effect_desc_third:0 "[TARGET_COUNTRY.GetAltNameNoFormatting('Le')|U][AddTextIf(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self),TARGET_COUNTRY.GetNameNoFlag)][AddTextIf(Not(ObjectsEqual(GetMetaPlayer.GetPlayedOrObservedCountry.Self, TARGET_COUNTRY.Self)),TARGET_COUNTRY.GetName)] [TARGET_COUNTRY.GetAltNameNoFormatting('EstSont')] maintenant un [concept_aor1776_protected_state|l] [COUNTRY.GetAltNameNoFormatting('Du')][COUNTRY.GetName]"
