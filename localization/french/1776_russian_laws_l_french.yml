 amendment_aor1776_noble_legacy:0 "Héritage noble"
 amendment_aor1776_noble_legacy_desc:0 "Les lignées de la noblesse conservent un accès privilégié aux charges de l’État. Leurs réseaux familiaux et leurs domaines leur assurent une influence durable, même lorsque les postes administratifs sont confiés à des officiers."
