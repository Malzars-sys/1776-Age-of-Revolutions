l_french:
 ship_type_caravel:0 "Caravelle"
 ship_type_caravel_desc:0 "Développées dans la péninsule Ibérique, les caravelles ont accompagné les explorations atlantiques des XVe et XVIe siècles. Leur gréement à voile permet les longues traversées. Dans la flotte, elles assurent la projection navale, le blocus et le soutien des débarquements."
 ship_type_galley:0 "Galère"
 ship_type_galley_desc:0 "Longues et étroites, les galères associent rames et voiles. Elles ont longtemps servi les marines de Méditerranée, où leur propulsion à rames facilite les manœuvres près des côtes. Leur batterie de proue et leurs soldats d'abordage défendent ports et détroits ; l'éloignement des bases réduit leur efficacité."
 ship_type_cog:0 "Cogue"
 ship_type_cog_desc:0 "Navire marchand des mers du Nord et de la Baltique, la cogue a accompagné l'essor du commerce hanséatique au Moyen Âge. Sa coque et sa cale accueillent des cargaisons importantes. Réquisitionnée par la marine, elle transporte troupes, vivres et matériel et soutient les débarquements."
