 HLB:0 "Principauté épiscopale de Lübeck"
 HLB_ADJ:0 "Eutinois"
 gov_aor1776_eutin:0 "Principauté épiscopale"
 gov_aor1776_eutin_desc:0 "Le prince-évêque protestant gouverne ses terres temporelles depuis Eutin. Frédéric-Auguste règne aussi sur Oldenburg par une union personnelle ; les deux États impériaux restent distincts. La ville de Lübeck constitue un autre État."
 law_aor1776_eutin_customs:0 "Douanes épiscopales"
 law_aor1776_eutin_customs_desc:0 "Commerce réglementé d’Ancien Régime, sans accorder de technologie tardive."
 law_aor1776_eutin_free_status:0 "Statut juridique libre"
 law_aor1776_eutin_free_status_desc:0 "Statut juridique de 1776 ; le régime foncier et le servage relèvent de lois distinctes."
