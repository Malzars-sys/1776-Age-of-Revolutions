l_french:
 combat_unit_type_musket_infantry:0 "Infanterie à mousquet"
 combat_unit_type_musket_infantry_desc:0 "Une infanterie organisée équipée de mousquets à âme lisse standardisés, plus efficace que les troupes irrégulières mais pas encore entraînée selon les normes ultérieures de l’infanterie de ligne."
 combat_unit_type_cannon_artillery:0 "Bombarde"
 combat_unit_type_cannon_artillery_desc:0 "De lourdes pièces anciennes adaptées aux sièges et à l’appui sur le champ de bataille, mais moins efficaces et moins mobiles que les canons de campagne standardisés."
 combat_unit_type_improved_cannon_artillery:0 "Canon de campagne"
 combat_unit_type_improved_cannon_artillery_desc:0 "Des pièces de campagne standardisées et leurs servants entraînés fournissent une puissance de feu supérieure à celle des premières bombardes."
