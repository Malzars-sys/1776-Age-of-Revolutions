l_french:
 aor1776_hre_autonomy_reduction_allowed_tt:0 "Seul l’empereur peut renforcer un Lien impérial admissible, en dehors d’une élection impériale. Diminuer l’autonomie d’un État ou d’un Électorat impérial ne permet pas de l’annexer."
 aor1776_hre_link_lower_tooltip:0 "#header Centralisation impériale#!\nDiminuer l’[concept_autonomy|l] d’un [concept_aor1776_hre_protectorate] le transforme en [concept_imperial_estate], ou en [concept_imperial_elector] s’il possède la dignité électorale. Le pays n’est pas annexé. Il conserve son territoire, son dirigeant et ses [Concept('concept_law','$concept_laws$')|l]."
 aor1776_hre_estate_higher_tooltip:0 "#header Lien impérial#!\nAugmenter l’[concept_autonomy|l] d’un [concept_imperial_estate] ou d’un [concept_imperial_elector] le transforme en [concept_aor1776_hre_protectorate]. Cela ne lui accorde pas l’indépendance et ne retire pas sa dignité électorale."
 aor1776_hre_protected_terminal_tooltip:0 "#header Privilèges impériaux#!\nUn [concept_imperial_estate] ou un [concept_imperial_elector] ne peut pas être annexé par une nouvelle réduction de son [concept_autonomy|l]."
 aor1776_vanilla_subject_type_annex_tooltip:0 "#header Annexion#!\nDiminuer l’[concept_autonomy|l] d’un sujet de type [SubjectType.GetName] entraînera son #b annexion#!"
 aor1776_subject_type_annex_tooltip_nonlink:0 "[SelectLocalization(Or(EqualTo_string(SubjectType.GetKey, 'subject_type_imperial_estate'), EqualTo_string(SubjectType.GetKey, 'subject_type_imperial_elector')), 'aor1776_hre_protected_terminal_tooltip', 'aor1776_vanilla_subject_type_annex_tooltip')]"
 SUBJECT_TYPE_ANNEX_TOOLTIP:0 "[SelectLocalization(EqualTo_string(SubjectType.GetKey, 'subject_type_aor1776_hre_protectorate'), 'aor1776_hre_link_lower_tooltip', 'aor1776_subject_type_annex_tooltip_nonlink')]"
 aor1776_vanilla_subject_type_decreased_autonomy_tooltip:0 "#header [SubjectType.GetLowerAutonomySubjectType(GetPlayer.Self).GetName]#!\nDiminuer l’[concept_autonomy|l] d’un sujet de type [SubjectType.GetName] ferait de ce [concept_country|l] un sujet de type [SubjectType.GetLowerAutonomySubjectType(GetPlayer.Self).GetName]"
 SUBJECT_TYPE_DECREASED_AUTONOMY_TOOLTIP:0 "[SelectLocalization(EqualTo_string(SubjectType.GetKey, 'subject_type_aor1776_hre_protectorate'), 'aor1776_hre_link_lower_tooltip', 'aor1776_vanilla_subject_type_decreased_autonomy_tooltip')]"
 aor1776_vanilla_subject_type_independence_tooltip:0 "#header Indépendance#!\nAugmenter l’[concept_autonomy|l] d’un sujet de type [SubjectType.GetName] entraînera son #b indépendance#!"
 SUBJECT_TYPE_INDEPENDENCE_TOOLTIP:0 "[SelectLocalization(Or(EqualTo_string(SubjectType.GetKey, 'subject_type_imperial_estate'), EqualTo_string(SubjectType.GetKey, 'subject_type_imperial_elector')), 'aor1776_hre_estate_higher_tooltip', 'aor1776_vanilla_subject_type_independence_tooltip')]"
 aor1776_vanilla_subject_type_increased_autonomy_tooltip:0 "#header [SubjectType.GetHigherAutonomySubjectType(GetPlayer.Self).GetName]#!\nAugmenter l’[concept_autonomy|l] d’un sujet de type [SubjectType.GetName] ferait de ce [concept_country|l] un sujet de type [SubjectType.GetHigherAutonomySubjectType(GetPlayer.Self).GetName]"
 SUBJECT_TYPE_INCREASED_AUTONOMY_TOOLTIP:0 "[SelectLocalization(Or(EqualTo_string(SubjectType.GetKey, 'subject_type_imperial_estate'), EqualTo_string(SubjectType.GetKey, 'subject_type_imperial_elector')), 'aor1776_hre_estate_higher_tooltip', 'aor1776_vanilla_subject_type_increased_autonomy_tooltip')]"
 aor1776_vanilla_subject_can_not_decrease_own_autonomy_annex_tooltip:0 "#header Diminution de l’[concept_autonomy|l] jusqu’à l’annexion#!\n@red_cross! Seul le [concept_overlord|l] peut effectuer cette action"
 aor1776_subject_can_not_decrease_own_autonomy_annex_tooltip_nonlink:0 "[SelectLocalization(Or(EqualTo_string(SubjectType.GetKey, 'subject_type_imperial_estate'), EqualTo_string(SubjectType.GetKey, 'subject_type_imperial_elector')), 'aor1776_hre_protected_terminal_tooltip', 'aor1776_vanilla_subject_can_not_decrease_own_autonomy_annex_tooltip')]"
 SUBJECT_CAN_NOT_DECREASE_OWN_AUTONOMY_ANNEX_TOOLTIP:0 "[SelectLocalization(EqualTo_string(SubjectType.GetKey, 'subject_type_aor1776_hre_protectorate'), 'aor1776_hre_link_lower_tooltip', 'aor1776_subject_can_not_decrease_own_autonomy_annex_tooltip_nonlink')]"
