 # From mod_v2content_l_french.yml
 objective_tutorial_desc: "Apprenez Victoria 3 au fil de défis guidés en gouvernant un pays déjà façonné par les institutions et les rivalités de 1776. Chaque position recommandée permet d’aborder budget, construction, politique, diplomatie, technologie et guerre sans imposer une unique issue historique. Stabilisez l’État dont vous héritez, puis décidez quelles parties de l’ordre ancien survivront à l’âge des révolutions."
 objective_tutorial_name_SWE: "#v $SWE$#!"
 objective_tutorial_desc_SWE: "#lore La Suède est une monarchie nordique établie dont les exportations de fer, la marine professionnelle et les institutions instruites offrent une base solide pour apprendre l’économie. Clergé et propriétaires dominent un ordre oligarchique et mercantiliste, tandis que servage et suprématie nationale freinent les réformes. Équilibrez Russie et Prusse, administrez les États allemands dépendants de Lübeck, Mecklembourg et Münster, puis choisissez comment moderniser la puissance suédoise.#!"
 objective_tutorial_name_DAI: "#v $DAI$#!"
 objective_tutorial_desc_DAI: "#lore Le Đại Nam commence comme un royaume traditionnel non reconnu, dominé par les propriétaires, où coexistent esclavage pour dettes, liberté de conscience et économie renforcée par la sériciculture. Le Cambodge verse tribut, tandis que les relations avec le Siam sont hostiles et que la Chine se montre méfiante. Consolidez le royaume, apprenez à réformer lois et production sans provoquer l’effondrement, puis bâtissez la force nécessaire pour défendre l’Asie du Sud-Est continentale.#!"
