 modifier_military_industrial_supply_chain: "Garants de la chaine d'approvisionnement"
 amendment_zaibatsu_oligopoly: "Oligopole des zaibatsu"
 amendment_zaibatsu_oligopoly_desc: "L'economie est desormais dominee par un cercle ferme de zaibatsu militaro-industriels prosperes qui entretiennent une relation symbiotique avec l'Etat."
