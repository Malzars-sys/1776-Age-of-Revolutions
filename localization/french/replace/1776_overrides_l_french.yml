 # From tech3a_technology_l_french.yml
 shaft_mining:0 "Puits de mine"
 shaft_mining_desc:0 "En creusant directement jusqu’à la profondeur souhaitée avant de bifurquer, puis en utilisant un système de levage pour faire monter et descendre les matériaux, il est possible de créer une mine bien plus efficace."
 atmospheric_engine:0 "Pompe à feu"
 atmospheric_engine_desc:0 "La pompe à feu est la première machine à vapeur ayant une véritable application pratique. "
 threshing_machine:0 "Batteuse"
 threshing_machine_desc:0 "En supprimant l’aspect physique du battage des céréales, la batteuse à vapeur rend l’agriculture bien plus efficace."
 chemical_bleaching:0 "Blanchiment optique"
 chemical_bleaching_desc:0 "L’ajout de certains sels, minéraux ou produits chimiques aux matières premières permet d’améliorer considérablement l’aspect visuel de produits manufacturés."
 cotton_gin:0 "Égreneuse à coton"
 cotton_gin_desc:0 "L’égreneuse à coton est une machine qui sépare rapidement le coton de ses graines, ce qui permet un traitement bien plus rapide qu’un travail manuel."
 mechanical_tools:0 "Outils mécaniques"
 mechanical_tools_desc:0 "Les produits fabriqués à la main peuvent être d’une qualité exceptionnelle, mais pour assurer l’uniformité du produit et la rapidité de la production, des aides mécaniques sont nécessaires."
 canneries:0 "Conserveries"
 canneries_desc:0 "Les conserveries sont des machines spécialement conçues pour stocker la nourriture dans un récipient hermétique, afin d’en assurer la conservation plus longtemps."
 railways:0 "Chemins de fer"
 railways_desc:0 "Les premiers chemins de fer pour locomotives à vapeur ont été construits pour le transport de passagers, et n’ont été utilisés que plus tard à des fins industrielles. Ce moyen de transport efficace et rapide a rendu les systèmes de canaux obsolètes, parfois seulement quelques années après leur construction onéreuse."
 fractional_distillation:0 "Distillation fractionnée"
 fractional_distillation_desc:0 "La vaporisation et la condensation répétées permettent de séparer les liquides pour obtenir des composants plus purs. Les applications pratiques de ce procédé sont infinies."
 rifling:0 "Rainurage"
 rifling_desc:0 "En gravant des rainures en spirale dans le canon d’une arme, il est possible de donner un mouvement rotatif au projectile, augmentant ainsi la précision du tir."
 logistics:0 "Logistique"
 logistics_desc:0 "Les meilleurs fusils du monde n’ont aucune importance si les soldats qui en sont équipés sont trop épuisés et affamés pour viser, ou si les fusils eux-mêmes n’ont pas de balles à l’intérieur."
 paddle_steamer:0 "Vapeur à roues"
 paddle_steamer_desc:0 "Un bateau à roues à aubes est une embarcation à vapeur, où la vapeur sert à faire tourner les roues à aubes qui permettent au bateau d’avancer."
 percussion_cap:0 "Amorce à percussion"
 percussion_cap_desc:0 "L’amorce à percussion est un dispositif à usage unique qui permet aux armes à feu de fonctionner de façon fiable par tous les temps."
 general_staff:0 "État-major"
 general_staff_desc:0 "Ensemble d’officiers servant d’intermédiaire entre le haut commandement et les troupes, assurant ainsi une meilleure communication et une plus grande efficacité."
 shell_gun:0 "Canon à obus"
 shell_gun_desc:0 "En raison de la nature de ses munitions, le canon à obus est une remarquable pièce d’artillerie. Les projectiles eux-mêmes sont explosifs, ce qui entraîne plus de dégâts qu’un simple morceau de métal."
 international_relations:0 "Relations extérieures"
 international_relations_desc:0 "La formalisation de la diplomatie fournit un cadre solide pour renforcer la cordialité et l’hostilité avec les autres nations."
 stock_exchange:0 "Bourse"
 stock_exchange_desc:0 "Marché organisé où les actions et les obligations peuvent être achetées et vendues, la bourse est un élément central de l’économie de marché moderne."
 medical_degrees:0 "Diplômes en médecine"
 medical_degrees_desc:0 "Des facultés, collèges, examens, licences et titres médicaux reconnus établissent une norme institutionnelle pour former et certifier les praticiens."
 human_rights:0 "Droits de l’Homme"
 human_rights_desc:0 "L’adoption de l’idée de droits universels et inaliénables pour tous invite de nouveaux concepts sur la scène sociale et politique du pays."
 vaccination:0 "Vaccination"
 vaccination_desc:0 "L'inoculation de la vaccine offre un nouveau moyen de protéger contre la variole et transforme la médecine préventive."
 postal_savings:0 "Épargne postale"
 postal_savings_desc:0 "L’épargne postale est une méthode précieuse qui permet aux gens d’épargner de l’argent même s’ils n’ont pas accès à une banque. Elle favorise à la fois le stockage et la circulation de l’argent, même chez les citoyens les plus pauvres."
 labor_movement:0 "Mouvement ouvrier"
 labor_movement_desc:0 "À mesure que le monde s’industrialise, les ouvriers s’organisent et militent pour de meilleurs salaires et de meilleures conditions de travail."
 concept_technology_era_desc:1 "Les ères technologiques classent la période approximative durant laquelle les idées furent développées ou systématisées.\n\nLes ères I à VI couvrent l’Âge des révolutions, de la fin du XVIIe siècle aux années 1830. Les ères VII à XII préservent la progression vanilla ultérieure. Les ères tardives demandent davantage d’innovation et les technologies antérieures manquantes augmentent la pénalité d’avance."
 pm_simple_forestry:0 "Exploitation forestière rudimentaire"
 building_textile_mill:0 "Manufacture textile"
 electrical_capacitors:0 "Condensateurs électriques"
 electrical_capacitors_desc:0 "Les progrès dans le stockage et la régulation du courant électrique permettent l'utilisation industrielle de machines électriques plus fiables."
 pm_sewing_machines:0 "Machines à coudre industrielles"
 pm_electric_sewing_machines:0 "Machines à coudre électriques"
