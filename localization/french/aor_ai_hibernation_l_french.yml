 rule_aor_ai_hibernation:0 "IA des pays mineurs"
 setting_aor_ai_hibernation_full:0 "IA complète"
 setting_aor_ai_hibernation_full_desc:0 "Tous les pays suivent leurs stratégies habituelles."
 setting_aor_ai_hibernation_on:0 "Mise en veille"
 setting_aor_ai_hibernation_on_desc:0 "Certains pays suspendent leurs décisions autonomes au repos pour alléger la simulation. Leur développement peut ralentir et leurs initiatives diplomatiques ou militaires se raréfier. Leur IA se réveille lors d’une interaction directe avec le joueur ou sur demande d’un script. Pour les nouvelles parties solo hors Ironman."
 AOR_AI_DEBUG_RESTORE:0 "Réactiver toutes les IA"
 AOR_AI_DEBUG_RESTORE_TT:0 "Suspend l’hibernation pour cette campagne et demande la réactivation des IA qu’elle a pu désactiver. Le moteur ne confirme pas le résultat."
