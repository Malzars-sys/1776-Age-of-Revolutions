l_french:
 pm_steam_rail_transport_building_rubber_plantation:0 "Transport ferroviaire à vapeur"
 
 coke_smelting:0 "Fonte au coke"
 coke_smelting_desc:0 "Les hauts fourneaux alimentés au coke réduisent la dépendance au charbon de bois et rendent la fonte du fer plus régulière."
 
 
 improved_husbandry:0 "Agriculture améliorée"
 improved_husbandry_desc:0 "Une meilleure alimentation, des abris adaptés et des soins plus réguliers améliorent l'élevage avant la généralisation de la sélection des races."
 
 improved_agricultural_implements:0 "Outils agricoles"
 improved_agricultural_implements_desc:0 "Des charrues, herses et autres outils plus robustes facilitent le travail du sol et rendent les cultures plus régulières."
 
 turnpike_road_networks:0 "Infrastructure terrestre organisée"
 turnpike_road_networks_desc:0 "Des réseaux routiers organisés, un entretien structuré et l'administration des voies terrestres constituent un socle commun pour les infrastructures terrestres."
 
 industrial_acids:0 "Acides industriels"
 industrial_acids_desc:0 "La fabrication organisée d'acides fournit aux premiers métiers chimiques, à la teinture et au travail des métaux des réactifs plus réguliers."
 
 advanced_crop_rotations:0 "Rotations culturales"
 advanced_crop_rotations_desc:0 "L'alternance des céréales, des fourrages et des cultures régénératrices préserve la fertilité des sols tout en réduisant la jachère."
 
 selective_breeding:0 "Élevage sélectif"
 selective_breeding_desc:0 "La sélection volontaire des reproducteurs transforme l'expérience des éleveurs en un moyen méthodique d'améliorer les troupeaux."
 
 industrial_canals:0 "Voies navigables organisées"
 industrial_canals_desc:0 "Des réseaux coordonnés de canaux et de voies navigables relient les marchés et transportent les marchandises pondéreuses sans supposer le génie industriel ultérieur."
 
 mechanized_spinning:0 "Filature mécanisée précoce"
 mechanized_spinning_desc:0 "L'introduction de machines de filature motorisées permet aux producteurs textiles de remplacer progressivement le filage manuel par des procédés mécaniques plus rapides et plus réguliers."
 
 applied_mineralogy:0 "Minéralogie appliquée"
 applied_mineralogy_desc:0 "L'observation méthodique des minerais et des minéraux utiles facilite la recherche des gisements et le choix des méthodes d'extraction."
 
 industrial_ceramics:0 "Céramique industrielle"
 industrial_ceramics_desc:0 "Une meilleure maîtrise des argiles, des fours et de la cuisson permet de produire des céramiques plus régulières pour les ménages et l'industrie."
 
 precision_boring:0 "Alésage de précision"
 precision_boring_desc:0 "L'alésage et l'usinage précis des pièces métalliques améliorent l'ajustement et la fiabilité des outils, des moteurs et des machines d'atelier."
 
 condensing_steam_engines:0 "Vapeur à condensation"
 condensing_steam_engines_desc:0 "La condensation séparée limite les pertes de chaleur et permet aux machines à vapeur de pomper ou d'entraîner des machines avec moins de combustible."
 
 rotative_steam_power:0 "Vapeur rotative"
 rotative_steam_power_desc:0 "La transformation du mouvement du piston en rotation régulière permet à la vapeur d'entraîner directement les machines des ateliers et des fabriques."
 
 advanced_spinning:0 "Couture mécanisée"
 advanced_spinning_desc:0 "Des machines spécialisées mécanisent l'assemblage des vêtements et préparent les ateliers textiles à l'emploi ultérieur d'équipements électriques."
 
 puddling_and_rolling:0 "Puddlage et laminage"
 puddling_and_rolling_desc:0 "Le puddlage affine la fonte dans un four à réverbère, puis le laminage façonne le métal en barres et en tôles plus uniformes."
 
 deep_mine_engineering:0 "Mines profondes"
 deep_mine_engineering_desc:0 "Des puits plus profonds exigent un drainage, une ventilation et un soutènement coordonnés pour atteindre les gisements inaccessibles aux exploitations superficielles."
 
 
 
 
 automated_flour_milling:0 "Meunerie automatisée"
 automated_flour_milling_desc:0 "L'enchaînement mécanique de la mouture et du blutage transforme le grain plus régulièrement et fournit une farine de qualité plus constante."
 
 
 high_pressure_steam:0 "Vapeur haute pression"
 high_pressure_steam_desc:0 "Des chaudières plus robustes et une vapeur mieux maîtrisée permettent de construire des moteurs plus compacts, utilisables au-delà des stations de pompage."
 
 mechanized_weaving:0 "Tissage mécanique"
 mechanized_weaving_desc:0 "L'adoption de métiers à tisser motorisés transforme progressivement le tissage artisanal en un processus industriel plus standardisé."
 
 industrial_alkalis:0 "Alcalis industriels"
 industrial_alkalis_desc:0 "La production régulière d'alcalis soutient la savonnerie, la verrerie, le blanchiment et d'autres activités chimiques."
 
 
 improved_road_engineering:0 "Génie routier"
 improved_road_engineering_desc:0 "Les chaussées nivelées, le drainage et les revêtements durables créent des routes fiables en toute saison."
 
 systematic_field_drainage:0 "Drainage agricole"
 systematic_field_drainage_desc:0 "Des drains et fossés planifiés évacuent l'excès d'eau, protègent les cultures et rendent les terres humides plus faciles à exploiter."
 
 mine_safety_engineering:0 "Sécurité minière"
 mine_safety_engineering_desc:0 "La ventilation, des soutènements plus sûrs et une meilleure prévention des risques souterrains réduisent les dangers de l'exploitation profonde."
 
 continuous_papermaking:0 "Papier continu"
 continuous_papermaking_desc:0 "Des toiles mobiles et un séchage continu remplacent la fabrication feuille par feuille par une production de papier plus régulière."
 
 coal_gasification:0 "Gazéification du charbon"
 coal_gasification_desc:0 "La transformation du charbon en gaz combustible fournit aux villes et aux industries une source d'éclairage et de chaleur distribuable."
 
 professional_civil_engineering:0 "Génie civil"
 professional_civil_engineering_desc:0 "Des ingénieurs formés associent levés, calculs et conception pratique pour aménager des routes, des ponts et des voies navigables durables."
 
 interchangeable_manufacture:0 "Pièces interchangeables"
 interchangeable_manufacture_desc:0 "Des dimensions normalisées et des instruments de contrôle permettent à des pièces fabriquées séparément de s'ajuster aux mêmes machines, facilitant montage et réparation."
 
 
 geological_surveying:0 "Levé géologique"
 geological_surveying_desc:0 "La cartographie des couches rocheuses et des gisements donne aux exploitants et aux autorités une meilleure base pour la prospection."
 
 hot_blast_smelting:0 "Soufflage à chaud"
 hot_blast_smelting_desc:0 "Le préchauffage de l'air insufflé dans les hauts fourneaux améliore la combustion et réduit la consommation de combustible."
 
 hydraulic_cements:0 "Ciments hydrauliques"
 hydraulic_cements_desc:0 "Les ciments capables de durcir en milieu humide permettent de bâtir des ports, des canaux et d'autres ouvrages exposés à l'eau."
 
 hydraulic_turbines:0 "Turbines hydrauliques"
 hydraulic_turbines_desc:0 "Les turbines tirent de l'eau courante une rotation plus efficace que les anciennes roues et étendent l'usage des machines hydrauliques."
 
 pressed_glass:0 "Verre pressé"
 pressed_glass_desc:0 "Le pressage du verre en fusion dans des moules rend les objets courants plus uniformes et plus faciles à produire en série."
 
 
 scientific_fortification_siegecraft:0 "Fortification et poliorcétique"
 scientific_fortification_siegecraft_desc:0 "Le tracé géométrique des fortifications et des travaux de siège fait de l'attaque et de la défense des places fortes une science militaire spécialisée."
 
 state_dockyard_systems:0 "Arsenaux d’État"
 state_dockyard_systems_desc:0 "Des arsenaux permanents coordonnent la construction, la réparation, les réserves et la main-d'œuvre spécialisée des flottes."
 
 enclosed_dock_systems:0 "Bassins fermés"
 enclosed_dock_systems_desc:0 "Des bassins protégés offrent aux navires des lieux plus sûrs pour l'armement, les réparations et l'avitaillement."
 
 regulated_small_arms:0 "Armes réglementaires"
 regulated_small_arms_desc:0 "Des modèles et des calibres communs facilitent l'achat, l'entretien et l'approvisionnement des armes d'infanterie."
 
 light_infantry_tactics:0 "Infanterie légère"
 light_infantry_tactics_desc:0 "Des tirailleurs entraînés utilisent le couvert, les formations dispersées et le tir précis là où les lignes serrées sont moins efficaces."
 
 standardized_field_artillery:0 "Artillerie de campagne"
 standardized_field_artillery_desc:0 "Des calibres, des affûts et des exercices communs facilitent le déplacement, le ravitaillement et la coordination de l'artillerie de campagne."
 
 permanent_military_hospitals:0 "Hôpitaux militaires"
 permanent_military_hospitals_desc:0 "Des hôpitaux permanents permettent aux armées de soigner malades et blessés sans dépendre uniquement de soins improvisés en campagne."
 
 scientific_naval_architecture:0 "Architecture navale"
 scientific_naval_architecture_desc:0 "Le calcul des formes de coque et l'étude de la stabilité complètent les proportions héritées de la tradition dans la construction navale."
 
 marine_chronometry:0 "Chronométrie marine"
 marine_chronometry_desc:0 "Des chronomètres fiables aident les navigateurs à déterminer la longitude en mer et réduisent l'incertitude des longues traversées."
 
 ship_classification_surveying:0 "Classification navale"
 ship_classification_surveying_desc:0 "Des inspections régulières consignent l'état et la construction des navires, rendant leur entretien et leur classement plus méthodiques."
 
 armament_standardization_inspection:0 "Normes d’armement"
 armament_standardization_inspection_desc:0 "Des contrôles réguliers et des mesures communes permettent d'écarter les armes défectueuses et de fiabiliser l'approvisionnement militaire."
 
 permanent_engineer_services:0 "Corps du génie"
 permanent_engineer_services_desc:0 "Des corps permanents du génie entretiennent les compétences nécessaires aux fortifications, aux travaux de campagne, aux routes et aux sièges."
 
 horse_artillery:0 "Artillerie à cheval"
 horse_artillery_desc:0 "Des servants montés et des attelages adaptés permettent aux canons de suivre la cavalerie et de se redéployer rapidement."
 
 military_topographic_surveying:0 "Topographie militaire"
 military_topographic_surveying_desc:0 "Des levés spécialisés transforment routes, reliefs et passages de rivière en cartes utiles à la préparation des marches et des opérations."
 
 copper_sheathing:0 "Doublage en cuivre"
 copper_sheathing_desc:0 "Le doublage de cuivre protège les coques contre les organismes marins et préserve la vitesse des voiliers entre deux radoubs."
 
 mysorean_iron_cased_rocketry:0 "Fusées mysoréennes"
 mysorean_iron_cased_rocketry_desc:0 "Les fusées à enveloppe de fer développées au Mysore montrent comment un corps plus résistant étend la portée et l'usage militaire de ces armes."
 
 
 corps_organization:0 "Corps d’armée"
 corps_organization_desc:0 "De grandes formations permanentes réunissent infanterie, cavalerie, artillerie et soutien sous des commandements capables de manœuvrer séparément."
 
 
 field_engineering_pontoon_trains:0 "Génie et pontons"
 field_engineering_pontoon_trains_desc:0 "Des sapeurs organisés et des équipements de pontage mobiles aident les armées à franchir les cours d'eau et les obstacles."
 
 explosive_field_ammunition:0 "Munitions explosives"
 explosive_field_ammunition_desc:0 "Les obus explosifs ajoutent un effet d'éclatement à l'artillerie de campagne, au-delà des dommages causés par les boulets pleins."
 
 battlefield_evacuation:0 "Évacuation des blessés"
 battlefield_evacuation_desc:0 "Des brancardiers et des moyens de transport organisés évacuent plus vite les blessés vers les lieux de soins."
 
 military_veterinary_services:0 "Services vétérinaires"
 military_veterinary_services_desc:0 "Les soins vétérinaires préservent les chevaux et les animaux de trait dont dépendent la cavalerie, l'artillerie et les transports militaires."
 
 casemated_fortifications:0 "Forts casematés"
 casemated_fortifications_desc:0 "Des chambres de tir protégées permettent aux forts de continuer à tirer tout en abritant leurs servants et leur matériel."
 
 hydrographic_surveying:0 "Levé hydrographique"
 hydrographic_surveying_desc:0 "Les sondages et les levés côtiers cartographient profondeurs, dangers et accès aux ports pour rendre la navigation plus sûre."
 
 standardized_naval_signals:0 "Signaux navals"
 standardized_naval_signals_desc:0 "Des signaux par pavillons et des procédures communes permettent aux navires de coordonner leurs manœuvres à distance."
 
 
 mechanized_naval_dockyards:0 "Arsenaux mécanisés"
 mechanized_naval_dockyards_desc:0 "Des outils motorisés et des appareils de levage accélèrent les lourds travaux de construction et de réparation dans les arsenaux."
 
 diagonal_ship_framing:0 "Charpente diagonale"
 diagonal_ship_framing_desc:0 "Des renforts diagonaux rigidifient les coques en bois et aident les grands navires à résister aux efforts de la mer."
 
 standardized_military_rockets:0 "Fusées militaires"
 standardized_military_rockets_desc:0 "Des modèles de fusées, des dispositifs de lancement et des exercices communs rendent cette arme moins dépendante d'expériences isolées."
 
 
 
 
 maritime_safety_standards:0 "Sécurité maritime"
 maritime_safety_standards_desc:0 "Des pratiques communes de navigation, de navigabilité et de secours réduisent les pertes évitables en mer."
 
 modern_lighthouse_optics:0 "Optique des phares"
 modern_lighthouse_optics_desc:0 "De meilleures lentilles concentrent la lumière des phares en faisceaux visibles plus loin des côtes dangereuses et des ports."
 
 iron_hull_construction:0 "Coques en fer"
 iron_hull_construction_desc:0 "Les membrures et les plaques de fer permettent des coques plus résistantes et de nouvelles formes de navires au-delà des limites du bois."
 
 institutionalized_scientific_exchange:0 "Échanges scientifiques"
 institutionalized_scientific_exchange_desc:0 "La correspondance, les sociétés savantes et les réunions régulières diffusent les observations au-delà des ateliers et des cercles de cour."
 
 
 institutionalized_public_credit:0 "Crédit public"
 institutionalized_public_credit_desc:0 "Des comptes publics fiables et des titres de dette reconnus permettent aux États d'emprunter au-delà des ressources immédiates de leur trésor."
 
 commercial_insurance_markets:0 "Assurance commerciale"
 commercial_insurance_markets_desc:0 "Les négociants répartissent les risques des voyages et du commerce grâce à des contrats d'assurance et à des intermédiaires spécialisés."
 
 periodical_print_networks:0 "Presse périodique"
 periodical_print_networks_desc:0 "Les journaux et périodiques diffusés régulièrement relient les villes par l'information, le débat et les savoirs pratiques."
 
 systematic_administrative_statistics:0 "Statistiques d’État"
 systematic_administrative_statistics_desc:0 "Des enquêtes répétées et des registres comparables donnent aux gouvernements une meilleure connaissance de la population, des recettes et des ressources."
 
 variolation_networks:0 "Réseaux de variolisation"
 variolation_networks_desc:0 "Des praticiens diffusent la variolisation contre la variole par des réseaux et des procédures partagées avant l'arrivée de la vaccination."
 
 codified_practical_knowledge:0 "Savoirs codifiés"
 codified_practical_knowledge_desc:0 "Manuels et ouvrages encyclopédiques consignent des techniques jusque-là surtout transmises par l'apprentissage, ce qui facilite leur comparaison et leur enseignement."
 
 political_economy:0 "Économie politique"
 political_economy_desc:0 "Auteurs et administrateurs étudient production, commerce, fiscalité et richesse comme les composantes liées d'une même économie."
 
 specialized_technical_academies:0 "Académies techniques"
 specialized_technical_academies_desc:0 "Des écoles spécialisées assurent un enseignement suivi du génie et des sciences appliquées au-delà de l'apprentissage en atelier."
 
 veterinary_science:0 "Science vétérinaire"
 veterinary_science_desc:0 "L'étude de l'anatomie et des maladies animales donne aux éleveurs et aux armées des moyens plus fiables de soigner les bêtes de travail."
 
 organized_elementary_schooling:0 "Enseignement primaire"
 organized_elementary_schooling_desc:0 "Des écoles religieuses, communautaires ou publiques organisées étendent l'instruction élémentaire régulière au-delà des précepteurs isolés et des usages locaux."
 
 systematic_population_registration:0 "Registres de population"
 systematic_population_registration_desc:0 "Des registres réguliers de la population donnent à l'administration une base durable pour la fiscalité, le recrutement et la planification publique."
 
 
 classical_political_economy:0 "Économie classique"
 classical_political_economy_desc:0 "Les doctrines classiques développées systématisent la production, les échanges, le commerce et les limites de l'intervention de l'État dans l'économie."
 
 constitutional_government:0 "Régime constitutionnel"
 constitutional_government_desc:0 "Des règles constitutionnelles écrites définissent les pouvoirs publics et imposent des limites reconnues à leur exercice."
 
 
 national_sovereignty:0 "Souveraineté populaire"
 national_sovereignty_desc:0 "L'autorité politique se réclame de plus en plus de la nation ou du peuple, et non plus seulement du souverain."
 
 organized_reform_movements:0 "Mouvements réformistes"
 organized_reform_movements_desc:0 "Associations, pétitions et campagnes publiques permettent aux réformateurs de coordonner leurs revendications au-delà des communautés locales."
 
 abolitionist_mobilization:0 "Abolitionnisme"
 abolitionist_mobilization_desc:0 "Les adversaires organisés de l'esclavage transforment leurs arguments moraux en pétitions, publications et pressions politiques durables."
 
 systematic_cadastral_surveying:0 "Levé cadastral"
 systematic_cadastral_surveying_desc:0 "Les levés fonciers et registres cadastraux systématiques permettent d'identifier les propriétés, d'évaluer l'impôt et de planifier le territoire."
 
 systematic_legal_codification:0 "Codification juridique"
 systematic_legal_codification_desc:0 "Un corpus juridique reconnu et organisé systématiquement rend les règles plus cohérentes entre tribunaux, administrations et territoires."
 
 scientific_metrology:0 "Métrologie scientifique"
 scientific_metrology_desc:0 "Des étalons comparables de poids et de mesure rendent les expériences, les contrats et les échanges entre régions plus fiables."
 
 
 polytechnical_education:0 "Éducation polytechnique"
 polytechnical_education_desc:0 "Des écoles associant mathématiques, sciences naturelles et génie forment des spécialistes pour les travaux publics et l'industrie."
 
 optical_telegraph_networks:0 "Télégraphe optique"
 optical_telegraph_networks_desc:0 "Des chaînes de stations à signaux transmettent les messages à grande distance bien plus vite que les courriers."
 
 central_statistical_offices:0 "Bureaux statistiques"
 central_statistical_offices_desc:0 "Des bureaux permanents recueillent et comparent les chiffres officiels, faisant des enquêtes ponctuelles une pratique administrative suivie."
 
 organized_immunization_campaigns:0 "Campagnes vaccinales"
 organized_immunization_campaigns_desc:0 "Des campagnes de vaccination coordonnées protègent des populations plus vastes que ne peuvent le faire des praticiens isolés."
 
 mechanized_printing:0 "Imprimerie mécanisée"
 mechanized_printing_desc:0 "Les presses motorisées multiplient les feuilles imprimées et élargissent la diffusion des livres et des journaux."
 
 experimental_research_laboratories:0 "Recherche expérimentale"
 experimental_research_laboratories_desc:0 "Des laboratoires spécialisés font des expériences contrôlées et des observations reproductibles une pratique scientifique régulière."
 
 specialized_professional_societies:0 "Sociétés savantes"
 specialized_professional_societies_desc:0 "Des spécialistes créent des associations durables pour échanger leurs résultats, discuter des méthodes et établir des pratiques communes."
 
 clinicopathological_medicine:0 "Médecine anatomoclinique"
 clinicopathological_medicine_desc:0 "Les médecins rapprochent les symptômes observés chez les malades des lésions constatées après la mort, affinant l'étude des maladies."
 
 active_principle_pharmacy:0 "Principes actifs"
 active_principle_pharmacy_desc:0 "L'isolement des substances actives des remèdes facilite la préparation, la comparaison et le dosage régulier des médicaments."
 
 
 professional_civil_policing:0 "Police civile"
 professional_civil_policing_desc:0 "Des forces de police permanentes et rémunérées remplacent progressivement les gardes irrégulières et les arrangements locaux provisoires."
 
 mass_circulation_press:0 "Presse de masse"
 mass_circulation_press_desc:0 "De grands tirages et une distribution élargie mettent journaux et autres publications à la portée d'un lectorat croissant."
 
 liberal_constitutionalism:0 "Constitution libérale"
 liberal_constitutionalism_desc:0 "Les garanties constitutionnelles et les institutions représentatives placent les libertés civiles et les limites du pouvoir exécutif au cœur des réformes."
 
 
 early_socialism_cooperativism:0 "Socialismes coopératifs"
 early_socialism_cooperativism_desc:0 "Réformateurs et travailleurs proposent la propriété coopérative et de nouvelles associations face aux coûts sociaux des transformations industrielles."
 
 
 traditional_papermaking:0 "Papeterie traditionnelle"
 traditional_papermaking_desc:0 "La maîtrise des techniques de préparation des fibres, de mise en pâte, de pressage et de séchage permet une production régulière de papier."

 organized_forestry:0 "Exploitation forestière organisée"
 organized_forestry_desc:0 "L’organisation de l’abattage, du débardage et du transport du bois permet une exploitation forestière régulière à grande échelle."
 pm_simple_forestry_desc:0 "L’abattage et le débardage à forte intensité de main-d’œuvre fournissent une quantité modeste de bois sans machines modernes ni équipement industriel."
 pm_organized_forestry:0 "Exploitation forestière organisée"
 pm_organized_forestry_desc:0 "La coordination de l’abattage, du débardage et du transport augmente la production de bois tout en conservant une organisation exigeante en main-d’œuvre."
 
 traditional_glassmaking:0 "Verrerie traditionnelle"
 traditional_glassmaking_desc:0 "La maîtrise des fours, de la fusion des matières minérales et des techniques de façonnage permet une production régulière de verre."

 industrial_paper_bleaching:0 "Blanchiment papetier industriel"
 industrial_paper_bleaching_desc:0 "L'application systématique des procédés chimiques de blanchiment à une production papetière mécanisée permet d'obtenir un papier plus clair et plus uniforme à grande échelle."

 traditional_food_processing:0 "Transformation alimentaire traditionnelle"
 traditional_food_processing_desc:0 "Les techniques établies de mouture, de cuisson et de transformation des produits agricoles permettent d'organiser une production alimentaire régulière à plus grande échelle."

 organized_workshops:0 "Ateliers organisés"
 organized_workshops_desc:0 "Des manufactures structurées coordonnent les ateliers spécialisés afin de produire outils, meubles et autres biens utiles au foyer sans exiger la mécanisation industrielle ultérieure."
 
 sugar_refining:0 "Raffinage du sucre"
 sugar_refining_desc:0 "Le perfectionnement des procédés de clarification, de concentration et de cristallisation permet de produire du sucre raffiné de manière plus régulière et à plus grande échelle."
 
 mechanized_irrigation:0 "Irrigation mécanisée"
 mechanized_irrigation_desc:0 "L'application de pompes mécaniques et de systèmes de distribution contrôlée permet d'irriguer les cultures de manière régulière à une échelle auparavant impossible."
 
 organized_textile_production:0 "Production textile proto-industrielle"
 organized_textile_production_desc:0 "L'organisation des fileurs, tisserands, teinturiers et marchands au sein de guildes, d'ateliers spécialisés et de réseaux de travail dispersés permet d'étendre la production textile au-delà de l'artisanat individuel sans nécessiter de machines industrielles."

 building_textile_mill_desc:0 "Les manufactures textiles regroupent artisans spécialisés, métiers organisés et premiers procédés mécanisés afin d'accroître la production de tissus."


 








 pm_professional_faculties:0 "Facultés professionnelles"
 pm_professional_faculties_desc:0 "Les facultés spécialisées réunissent la formation professionnelle, la recherche et les réseaux de certification au sein de l’université moderne."
 pm_arc_welded_buildings_desc:0 "Le béton armé, les ossatures métalliques soudées, le verre industriel et les outils motorisés sont réunis dans la construction moderne à grande échelle."
