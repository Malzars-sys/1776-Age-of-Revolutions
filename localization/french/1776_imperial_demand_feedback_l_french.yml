 aor1776_hre_enforce_internal_restitution_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] exige que les provinces impériales listées ci-dessous soient rendues à leurs titulaires légitimes enregistrés. Examinez les territoires et les conséquences d’un accord ou d’un refus avant de répondre."
