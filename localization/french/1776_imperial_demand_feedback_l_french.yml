 aor1776_hre_enforce_internal_restitution_proposal_third_party_declined_desc:0 "[TARGET_COUNTRY.GetName] a refusé la demande impériale de [INITIATOR_COUNTRY.GetName]."
 aor1776_hre_enforce_internal_restitution_proposal_declined_name:0 "Rétrocession impériale — Refusée"
 aor1776_hre_enforce_internal_restitution_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] a refusé la sommation territoriale. Utilisez Rétrocession impériale sur l’État impérial disputé. Un membre protégé par une obligation peut refuser sans ouvrir de casus belli. Les trêves existantes restent applicables."
