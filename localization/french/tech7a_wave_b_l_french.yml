l_french:
 pmg_land_transport_canals: "Réseau de canaux"
 pm_no_canal_network: "Pas de réseau de canaux"
 pm_no_canal_network_desc: "Aucun réseau entretenu de canaux intérieurs ne soutient le système de transport terrestre de l'État."
 pm_industrial_canals: "Canaux industriels"
 pm_industrial_canals_desc: "Des voies d'eau, des écluses et des chemins de halage aménagés facilitent le transport des marchandises lourdes et permettent à de plus grands pôles industriels de profiter des économies d'échelle."
 pm_engineered_canals: "Canaux aménagés"
 pm_engineered_canals_desc: "Des tracés relevés par des professionnels, des écluses renforcées et un entretien systématique permettent aux industries locales de profiter des économies d'échelle à un niveau plus élevé."
