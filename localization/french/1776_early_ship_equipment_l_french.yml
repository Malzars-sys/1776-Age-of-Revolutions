l_french:
 aor_caravel_armor_low: "Bordage à franc-bord sur membrures"
 aor_caravel_armor_low_desc: "Planches jointives fixées sur les membrures : coque lisse, sans blindage métallique."
 aor_caravel_armor_mid: "Couples doubles et serre-bauquières"
 aor_caravel_armor_mid_desc: "Couples doublés et longues pièces soutenant les baux : meilleure reprise des efforts du pont."
 aor_caravel_armor_high: "Charpente à renforts diagonaux"
 aor_caravel_armor_high_desc: "Pièces diagonales contre la déformation longitudinale, inspirées des travaux de Seppings au XIXe siècle."
 aor_caravel_guns_low: "8 fauconneaux pivotants de 2 livres"
 aor_caravel_guns_low_desc: "Petits tubes sur fourches pivotantes pour la défense rapprochée. Les livres désignent le poids du boulet."
 aor_caravel_guns_mid: "12 canons longs de 6 livres sur affûts à roulettes"
 aor_caravel_guns_mid_desc: "Canons à âme lisse chargés par la bouche, avec affûts de pont et recul contrôlé par bragues."
 aor_caravel_guns_high: "8 carronades de 12 livres sur glissières"
 aor_caravel_guns_high_desc: "Tubes courts à large bouche, montés sur glissières : puissance à courte distance, technologie postérieure au départ de 1776."
 aor_caravel_propulsion_low: "Grand-voile carrée"
 aor_caravel_propulsion_low_desc: "Une grand-voile carrée sur le mât principal, sans machine."
 aor_caravel_propulsion_mid: "Grand-voile et hunier"
 aor_caravel_propulsion_mid_desc: "Un hunier est ajouté au-dessus de la grand-voile, sur le même mât."
 aor_caravel_propulsion_high: "Grand-voile, hunier et perroquet"
 aor_caravel_propulsion_high_desc: "Un perroquet complète le hunier au sommet du même mât : trois étages de voiles, sans moteur."
 aor_caravel_range_low: "Tonneaux de vivres en cale"
 aor_caravel_range_low_desc: "Vivres et eau stockés dans la cale existante."
 aor_caravel_range_mid: "Gaillard arrière et cambuse séparée"
 aor_caravel_range_mid_desc: "Pont arrière et réserve de vivres distincte des autres charges."
 aor_caravel_range_high: "Faux-pont de campagne et soutes à eau"
 aor_caravel_range_high_desc: "Plateforme intérieure réservée aux provisions et rangement structuré des tonneaux d’eau."
 aor_galley_armor_low: "Bordage léger à franc-bord"
 aor_galley_armor_low_desc: "Coque étroite sur membrures, conçue pour la nage et le cabotage."
 aor_galley_armor_mid: "Serres longitudinales et traverses de nage"
 aor_galley_armor_mid_desc: "Longues pièces de charpente et traverses reprenant l’effort des bancs de nage."
 aor_galley_armor_high: "Quille doublée et carlingue continue"
 aor_galley_armor_high_desc: "Renfort de la quille et poutre intérieure continue : rigidité accrue sans blindage en fer."
 aor_galley_guns_low: "1 pièce de proue de 6 livres et 2 pierriers"
 aor_galley_guns_low_desc: "Une pièce axiale légère, complétée par deux petites armes pivotantes pour l’abordage."
 aor_galley_guns_mid: "1 canon de chasse de 12 livres et 2 canons de 3 livres"
 aor_galley_guns_mid_desc: "Canon axial sur affût de proue, accompagné de deux pièces plus petites."
 aor_galley_guns_high: "1 canon axial de 24 livres et 2 canons de 6 livres"
 aor_galley_guns_high_desc: "Batterie concentrée à l’avant, avec affût guidé dans l’axe du navire ; elle ne transforme pas la galère en vaisseau de ligne."
 aor_galley_propulsion_low: "Nage alla sensile : avirons séparés"
 aor_galley_propulsion_low_desc: "Plusieurs rameurs par banc, chacun maniant son propre aviron."
 aor_galley_propulsion_mid: "Nage a scaloccio : aviron collectif"
 aor_galley_propulsion_mid_desc: "Un grand aviron manœuvré ensemble par plusieurs rameurs."
 aor_galley_propulsion_high: "Nage a scaloccio et deux voiles latines"
 aor_galley_propulsion_high_desc: "Avirons collectifs complétés par deux mâts à antennes ; aucun moteur."
 aor_galley_range_low: "Coffres de banc et outres d’eau"
 aor_galley_range_low_desc: "Réserves compactes pour les sorties côtières."
 aor_galley_range_mid: "Tonneaux sous coursie"
 aor_galley_range_mid_desc: "Rangement de tonneaux sous le passage central reliant proue et poupe."
 aor_galley_range_high: "Cambuse de poupe et avirons de rechange"
 aor_galley_range_high_desc: "Magasin arrière organisé et réserve d’avirons. La portée côtière reste limitée à 1."
 aor_cog_armor_low: "Bordage à clins riveté"
 aor_cog_armor_low_desc: "Planches superposées et fixées par rivets, sur la coque traditionnelle de la cogue."
 aor_cog_armor_mid: "Varangues liées à une carlingue"
 aor_cog_armor_mid_desc: "Liaisons structurelles entre le fond et une poutre intérieure dans l’axe de la quille."
 aor_cog_armor_high: "Serres de cale et baux traversants"
 aor_cog_armor_high_desc: "Longerons intérieurs et baux transversaux reprennent les charges du transport militaire."
 aor_cog_guns_low: "4 pierriers pivotants de 1 livre"
 aor_cog_guns_low_desc: "Petites armes sur le plat-bord : défense de l’équipage, pas une batterie de combat."
 aor_cog_guns_mid: "4 canons longs de 3 livres"
 aor_cog_guns_mid_desc: "Pièces légères sur affûts de pont pour protéger le transport."
 aor_cog_guns_high: "4 carronades de 6 livres"
 aor_cog_guns_high_desc: "Pièces courtes défensives ; adaptation tardive et volontairement limitée d’un transport ancien."
 aor_cog_propulsion_low: "Mât unique et voile carrée"
 aor_cog_propulsion_low_desc: "Le gréement traditionnel de la cogue, à un seul mât."
 aor_cog_propulsion_mid: "Voile carrée à bandes de ris"
 aor_cog_propulsion_mid_desc: "Bandes de ris permettant de réduire la toile plus proprement selon le vent."
 aor_cog_propulsion_high: "Grand-voile carrée et hunier"
 aor_cog_propulsion_high_desc: "Ajout d’une voile au-dessus de la grand-voile : adaptation à voile tardive, sans machine."
 aor_cog_range_low: "Cale libre et logements sur le pont"
 aor_cog_range_low_desc: "Transport rudimentaire dans la cale et sur le pont existants."
 aor_cog_range_mid: "Faux-pont de couchettes et râteliers"
 aor_cog_range_mid_desc: "Couchettes sur plateforme intérieure et équipements arrimés séparément."
 aor_cog_range_high: "Pont de troupes et panneaux de chargement"
 aor_cog_range_high_desc: "Pont adapté aux soldats et ouvertures de chargement organisées ; priorité au transport."
 aor_landing_launches: "Chaloupes de débarquement"
 aor_landing_launches_desc: "Chaloupes à avirons pour relier le transport à la côte."
 aor_caravel_blockade: "Organisation de blocus"
 aor_caravel_blockade_desc: "Bordées de veille, signaux et contrôle des approches portuaires."
 aor_caravel_landing: "Chaloupes et détachement de débarquement"
 aor_caravel_landing_desc: "Chaloupes et place réservée aux soldats, cumulables avec l’organisation de blocus."
 aor_galley_coastal_battery: "Batterie de combat côtier"
 aor_galley_coastal_battery_desc: "Service de la batterie avant pour le combat près des ports. La pénalité hors de portée est conservée."
 aor_galley_boarding_spur: "Éperon d’étrave pour l’abordage"
 aor_galley_boarding_spur_desc: "Saillie d’étrave au-dessus de l’eau pour approcher et aborder ; ce n’est pas un bélier blindé moderne."
