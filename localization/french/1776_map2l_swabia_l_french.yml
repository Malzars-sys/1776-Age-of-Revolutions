 law_aor1776_swabian_free_status:0 "Statut libre dans les États impériaux"
 law_aor1776_ulm_council:0 "République impériale patricienne"
 law_aor1776_swabian_customs_desc:0 "Commerce réglementé local, sans technologie tardive accordée."
 law_aor1776_swabian_free_status_desc:0 "Statut juridique libre de départ ; servage distinct."
 law_aor1776_ulm_council_desc:0 "Conseil d’une ville impériale établie, pas une république nationale moderne."
 aor1776_hoh_first:0 "Joseph-Frédéric-Guillaume"
 aor1776_hoh_last:0 "de Hohenzollern-Hechingen"
 gov_aor1776_swabian_principality:0 "Principauté"
 gov_aor1776_swabian_principality_desc:0 "Une branche de la maison de Hohenzollern gouverne cette principauté héréditaire du Saint-Empire. Le prince exerce son autorité sur ses propres possessions, distinctes de celles des autres branches de la dynastie."
