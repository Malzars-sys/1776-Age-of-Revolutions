 gov_aor1776_ulm_council:0 "Conseil urbain patricien"
 gov_aor1776_ulm_council_desc:0 "Ville libre du Saint-Empire, Ulm est administrée par son conseil urbain. Ses institutions municipales exercent le gouvernement de la ville et de ses possessions, sans dépendre d’un prince territorial."
 gov_aor1776_baden_margraviate:0 "Margraviat"
 gov_aor1776_baden_margraviate_desc:0 "Le margrave gouverne les possessions badoises réunies sous une même dynastie depuis 1771. Prince du Saint-Empire, il exerce son autorité territoriale dans le cadre des institutions impériales."
 aor1776_baden_margrave_title:0 "Margrave"
