 aor1776_hre_group_diet:0 "Diète perpétuelle"
 aor1776_hre_group_diet_desc:0 "Diète perpétuelle — trois niveaux de coopération impériale."
 aor1776_hre_diet_1:0 "Diète perpétuelle I"
 aor1776_hre_diet_1_desc:0 "Les bonus sont les totaux de ce niveau, sans cumul avec les niveaux inférieurs. Une cohésion supérieure à 40 est nécessaire pour choisir un principe. Au changement de pays impérial, le dernier groupe ajouté est perdu, ou le groupe unique recule d’un niveau sans descendre sous I."
 aor1776_hre_diet_2:0 "Diète perpétuelle II"
 aor1776_hre_diet_2_desc:0 "Les bonus sont les totaux de ce niveau, sans cumul avec les niveaux inférieurs. Une cohésion supérieure à 40 est nécessaire pour choisir un principe. Au changement de pays impérial, le dernier groupe ajouté est perdu, ou le groupe unique recule d’un niveau sans descendre sous I."
