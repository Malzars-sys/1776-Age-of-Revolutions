 aor1776_hre_group_circles:0 "Cercles impériaux"
 aor1776_hre_group_circles_desc:0 "Cercles impériaux — trois niveaux de coopération impériale."
 aor1776_hre_circles_1:0 "Cercles impériaux I"
 aor1776_hre_circles_1_desc:0 "L’empereur défend tous les membres contre les puissances extérieures. Une cohésion supérieure à 40 est nécessaire pour choisir un principe. Au changement de pays impérial, le dernier groupe ajouté est perdu, ou le groupe unique recule d’un niveau sans descendre sous I."
 aor1776_hre_circles_2:0 "Cercles impériaux II"
 aor1776_hre_circles_2_desc:0 "Obligation précédente, plus participation de l’empereur aux manœuvres offensives des membres contre les puissances extérieures. Une cohésion supérieure à 40 est nécessaire pour choisir un principe. Au changement de pays impérial, le dernier groupe ajouté est perdu, ou le groupe unique recule d’un niveau sans descendre sous I."
 aor1776_hre_circles_3:0 "Cercles impériaux III"
 aor1776_hre_circles_3_desc:0 "Obligations précédentes, plus participation des membres aux manœuvres défensives et offensives de l’empereur contre les puissances extérieures. Une cohésion supérieure à 40 est nécessaire pour choisir un principe. Au changement de pays impérial, le dernier groupe ajouté est perdu, ou le groupe unique recule d’un niveau sans descendre sous I."
