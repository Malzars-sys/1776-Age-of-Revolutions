 country_aor1776_hre_authority_per_estate_add:0 "Autorité par autre membre impérial"
 aor1776_hre_estates_authority:0 "Autorité des États impériaux"
 aor1776_hre_estates_authority_desc:0 "La Diète donne à l’empereur 5, 10 ou 15 d’autorité par autre membre reconnu effectivement dans le bloc. Les sujets non impériaux sont exclus."
 aor1776_hre_authority_from_cohesion:0 "Autorité impériale issue de la cohésion au-dessus de 40"
 aor1776_hre_authority_from_size:0 "Coût de coordination : 1 + ln(nombre de membres)"
 aor1776_hre_reforms_ui:0 "Autorité impériale gagnée par semaine : [JournalEntry.GetCountry.MakeScope.Var('aor1776_hre_ui_emperor').GetCountry.MakeScope.Var('aor1776_hre_ui_authority_gain').GetValue|2]\nAucun gain ni achat de principe à une cohésion ≤40. Le nombre de membres ralentit le gain logarithmiquement, sans retirer de points."
