 je_aor1776_hre_centralization:0 "La réforme de l’Empire"
 je_aor1776_hre_centralization_reason:0 "La Diète examine le renforcement des obligations entre l’empereur et les États. Leurs privilèges demeurent garantis et la dignité impériale reste élective."
 je_aor1776_hre_centralization_status:0 "Une résolution de la Diète doit précéder toute centralisation."
 aor1776_hre.60.t:0 "L’Empire considère son avenir"
 aor1776_hre.60.d:0 "La Diète, les cercles, les tribunaux et les bureaux disposent désormais d’un socle commun. Une constitution plus étroite est possible, mais les États n’ont pas encore abandonné leur autonomie."
 aor1776_hre.60.a:0 "Nous préserverons l’Empire par son renouvellement."
 aor1776_hre.61.t:0 "La protection de la couronne impériale"
 aor1776_hre.61.d:0 "Les États impériaux sont désormais placés sous la protection de l’empereur comme sujets autonomes sans tribut. Leurs dirigeants demeurent en place."
 aor1776_hre.61.a:0 "Nous préserverons l’Empire par son renouvellement."
 aor1776_hre.62.t:0 "Les États sous une même couronne"
 aor1776_hre.62.d:0 "Les États demeurent distincts, mais leur politique extérieure et leurs obligations militaires sont désormais subordonnées à la couronne impériale."
 aor1776_hre.62.a:0 "Nous préserverons l’Empire par son renouvellement."
 aor1776_hre.63.t:0 "Un seul État impérial"
 aor1776_hre.63.d:0 "Les terres de la couronne impériales restantes sont réunies sous un seul gouvernement. Leurs habitants et leurs territoires appartiennent désormais à l’État impérial unifié."
 aor1776_hre.63.a:0 "Nous préserverons l’Empire par son renouvellement."
