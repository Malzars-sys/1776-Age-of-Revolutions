l_french:
 raw_industrial_data:0 "Données brutes industrielles"
 raw_industrial_data_desc:0 "Relevés de fabrication, observations des mines et rapports portuaires, recueillis au cours de l’activité économique."
 organized_research_data:0 "Données organisées"
 organized_research_data_desc:0 "Dossiers statistiques, enquêtes commerciales et travaux universitaires compilés à partir de données brutes industrielles, avec du papier et du personnel de bureau."
 building_research_laboratory:0 "Laboratoire expérimental"
 building_research_laboratory_desc:0 "Un établissement public de recherche appliquée. Il relève le plafond d’innovation sans produire de points d’innovation. Son orientation accélère une catégorie de recherche, ou les trois plus modérément en recherche générale. Chaque niveau coûte 1 000 points de construction ; le nombre de niveaux par État n’est pas plafonné."
 pmg_1776_raw_data_reporting:0 "Relevés des exploitations"
 pmg_1776_heavy_data_reporting:0 "Relevés de l’industrie lourde"
 pmg_1776_trade_data_reporting:0 "Enquêtes commerciales"
 pmg_1776_institutional_data_reporting:0 "Dossiers universitaires"
 pmg_1776_research_laboratory_equipment:0 "Équipement du laboratoire"
 pmg_1776_research_laboratory_specialization:0 "Orientation de la recherche"
 pm_1776_raw_data_reporting:0 "Registres d’exploitation"
 pm_1776_raw_data_reporting_desc:0 "Débloqués par la métrologie scientifique, ces relevés permettent aux mines, carrières, exploitations salines et ports de produire 1 unité de données brutes par niveau pleinement employé, en complément de leur activité habituelle."
 pm_1776_heavy_data_reporting:0 "Rapports d’essais industriels"
 pm_1776_heavy_data_reporting_desc:0 "Débloqués par la métrologie scientifique, ces rapports permettent à l’industrie lourde, aux chantiers navals et aux manufactures d’armement de produire 4 unités de données brutes par niveau pleinement employé, contre 2 pour l’industrie légère."
 pm_1776_trade_data_reporting:0 "Statistiques du commerce"
 pm_1776_trade_data_reporting_desc:0 "Les centres de commerce compilent 1 unité de données brutes en 1 unité de données organisées par niveau pleinement employé, avec du papier et du personnel de bureau. Nécessite la technologie $specialized_professional_societies$."
 pm_1776_institutional_data_reporting:0 "Compilation des dossiers"
 pm_1776_institutional_data_reporting_desc:0 "Les universités compilent 2 unités de données brutes en 2 unités de données organisées par niveau pleinement employé, avec du papier et du personnel de bureau. Nécessite la technologie $specialized_professional_societies$."
 pm_1776_no_raw_data_reporting:0 "Sans relevés techniques"
 pm_1776_no_organized_data_reporting:0 "Sans dossiers supplémentaires"
 pm_1776_manual_research_laboratory:0 "Expérimentation instrumentale"
 pm_1776_manual_research_laboratory_desc:0 "Sans pénurie et à plein emploi, chaque niveau relève le plafond d’innovation de 5 et consomme 5 unités de produits chimiques industriels, dont des acides pour les expériences. Ce niveau d’équipement ne consomme pas de données organisées ; une spécialisation en demande séparément. Les universités fournissent les points d’innovation."
 pm_1776_electrical_research_laboratory:0 "Laboratoire électrifié"
 pm_1776_electrical_research_laboratory_desc:0 "L’électricité, les machines de précision et les réactifs chimiques permettent de relever le plafond d’innovation de 10 par niveau pleinement employé, sans pénurie. Consomme 10 unités de produits chimiques industriels par niveau à plein emploi, dont des acides. Ce niveau d’équipement ne consomme pas de données organisées ; une spécialisation en demande séparément."
 pm_1776_advanced_research_laboratory:0 "Laboratoire de haute précision"
 pm_1776_advanced_research_laboratory_desc:0 "Des radios, des téléphones, des machines de précision et des produits pharmaceutiques équipent les expériences les plus exigeantes. Consomme les deux types de données et 20 unités de produits chimiques industriels, dont des acides, par niveau à plein emploi. Relève le plafond d’innovation de 20 par niveau pleinement employé, sans pénurie."
 pm_1776_general_research:0 "Recherche générale"
 pm_1776_general_research_desc:0 "+0,25 % de vitesse de recherche en production, militaire et société par niveau pleinement employé et approvisionné, contre +1 % dans son seul domaine pour une spécialisation. Aucune consommation supplémentaire de données organisées ; le niveau d’équipement le plus avancé continue néanmoins d’en consommer. Aucun point d’innovation produit."
 pm_1776_production_research:0 "Recherche appliquée à la production"
 pm_1776_production_research_desc:0 "Consomme 20 unités supplémentaires de données organisées et accélère la recherche de production de 1 % par niveau pleinement employé, sans pénurie. Ne crée aucun point d’innovation."
 pm_1776_military_research:0 "Recherche militaire"
 pm_1776_military_research_desc:0 "Consomme 20 unités supplémentaires de données organisées et accélère la recherche militaire de 1 % par niveau pleinement employé, sans pénurie. Ne crée aucun point d’innovation."
 pm_1776_society_research:0 "Recherche sur la société"
 pm_1776_society_research_desc:0 "Consomme 20 unités supplémentaires de données organisées et accélère la recherche de société de 1 % par niveau pleinement employé, sans pénurie. Ne crée aucun point d’innovation."
 goods_input_raw_industrial_data_add:0 "Consommation de données brutes industrielles"
 modifier_goods_input_raw_industrial_data_add:0 "Consommation de données brutes industrielles"
