 goods_output_raw_industrial_data_mult:0 "Production de données brutes industrielles"
 modifier_goods_output_raw_industrial_data_mult:0 "Production de données brutes industrielles"
 goods_input_organized_research_data_add:0 "Consommation de données organisées"
 modifier_goods_input_organized_research_data_add:0 "Consommation de données organisées"
 goods_input_organized_research_data_mult:0 "Consommation de données organisées"
 modifier_goods_input_organized_research_data_mult:0 "Consommation de données organisées"
 goods_output_organized_research_data_add:0 "Production de données organisées"
 modifier_goods_output_organized_research_data_add:0 "Production de données organisées"
 goods_output_organized_research_data_mult:0 "Production de données organisées"
 modifier_goods_output_organized_research_data_mult:0 "Production de données organisées"
 research_laboratory_tests.warning:0 "Test de développement : cette option modifie les méthodes de production de tous les bâtiments concernés du pays. Utilisez une copie de votre sauvegarde."
 research_laboratory_tests.close:0 "Fermer sans rien changer"
 research_laboratory_tests.1.t:0 "Essai des laboratoires : approvisionnement"
 research_laboratory_tests.1.d:0 "Ce menu de test permet d’activer ou de couper la collecte des deux biens documentaires, ou d’ajouter un laboratoire de niveau 1 dans la capitale. L’activation commune nécessite $scientific_metrology$ et $specialized_professional_societies$. Il ne se déclenche jamais automatiquement. La création est gratuite uniquement dans ce test ; la construction normale coûte 1 000 points par niveau."
 research_laboratory_tests.1.on:0 "Activer la collecte dans tous les établissements"
 research_laboratory_tests.1.off:0 "Couper la collecte pour tester les pénuries"
 research_laboratory_tests.1.build:0 "Créer un laboratoire d’essai dans la capitale"
 research_laboratory_tests.2.t:0 "Essai des laboratoires : équipement"
 research_laboratory_tests.2.d:0 "Sélectionnez le niveau d’équipement de tous les laboratoires du pays. L’option reste soumise à son déblocage technologique. Vérifiez les dépenses, les emplois et le plafond d’innovation ; la production d’innovation ne doit pas augmenter."
 research_laboratory_tests.3.t:0 "Essai des laboratoires : spécialisation"
 research_laboratory_tests.3.d:0 "Appliquez une orientation à tous les laboratoires. La recherche générale donne +0,25 % de vitesse dans chacun des trois domaines, sans consommation supplémentaire de données organisées. Une spécialisation donne +1 % dans son seul domaine et consomme 20 unités de données organisées supplémentaires. Ces bonus sont par niveau pleinement employé et approvisionné. Une seule orientation par bâtiment."
 pmg_1776_light_data_reporting:0 "Relevés de l’industrie légère"
 pmg_1776_administrative_data_reporting:0 "Dossiers administratifs"
 pm_1776_light_data_reporting:0 "Rapports des manufactures"
 pm_1776_light_data_reporting_desc:0 "Débloqués par la métrologie scientifique, ces rapports permettent à l’industrie légère de produire 2 unités de données brutes par niveau pleinement employé, contre 1 pour les exploitations et 4 pour l’industrie lourde."
 pm_1776_administrative_data_reporting:0 "Statistiques administratives"
 pm_1776_administrative_data_reporting_desc:0 "Les administrations compilent 1 unité de données brutes en 1 unité de données organisées par niveau pleinement employé, avec du papier et du personnel de bureau, comme les centres de commerce. Nécessite la technologie $specialized_professional_societies$."
 laboratory_data_shortage_warning:0 "Documentation insuffisante"
 laboratory_data_shortage_warning_desc:0 "La disponibilité d’au moins un type de données requis est inférieure à 75 % des besoins. Les bénéfices de recherche de ce laboratoire sont réduits de 50 %. Contrôle tous les deux jours."
 laboratory_data_shortage_severe:0 "Pénurie documentaire grave"
 laboratory_data_shortage_severe_desc:0 "La disponibilité d’au moins un type de données requis est inférieure à 50 % des besoins, ou une pénurie locale est signalée. Les bénéfices de recherche de ce laboratoire sont réduits de 80 %. Contrôle tous les deux jours."
 laboratory_data_shortage_critical:0 "Recherche presque paralysée"
 laboratory_equipment_shortage:0 "Intrants de recherche manquants"
 research_laboratory_tests.1.raw_off:0 "Couper uniquement les données brutes"
 research_laboratory_tests.1.organized_off:0 "Couper uniquement les données organisées"
 laboratory_equipment_shortage_desc:0 "Une pénurie d’intrants est signalée dans ce laboratoire. Ses bénéfices de recherche sont réduits de 50 %, sauf si une pénurie documentaire impose une réduction plus forte. Contrôle tous les deux jours."
 laboratory_data_shortage_critical_desc:0 "La disponibilité d’au moins un type de données requis est inférieure à 10 % des besoins. Les bénéfices de recherche de ce laboratoire sont réduits de 95 %. Contrôle tous les deux jours."
 laboratory_operational_innovation_capacity:0 "Capacité des laboratoires en activité"
 laboratory_operational_innovation_capacity_desc:0 "Contribution des laboratoires au plafond d’innovation, ajustée à leur emploi et à leur approvisionnement en données. Ne produit aucun point d’innovation."
 laboratory_operational_production_research:0 "Recherche en production des laboratoires"
 laboratory_operational_production_research_desc:0 "Contribution par niveau : +0,25 % en recherche générale ou +1 % en recherche appliquée à la production. Le total est ajusté à l’emploi et à la disponibilité des intrants."
 laboratory_operational_military_research:0 "Recherche militaire des laboratoires"
 laboratory_operational_military_research_desc:0 "Contribution par niveau : +0,25 % en recherche générale ou +1 % en recherche militaire. Le total est ajusté à l’emploi et à la disponibilité des intrants."
 laboratory_operational_society_research:0 "Recherche en société des laboratoires"
 laboratory_operational_society_research_desc:0 "Contribution par niveau : +0,25 % en recherche générale ou +1 % en recherche sur la société. Le total est ajusté à l’emploi et à la disponibilité des intrants."
 building_1776_laboratory_capacity_add:0 "Contribution potentielle au plafond d’innovation"
 modifier_building_1776_laboratory_capacity_add:0 "Contribution potentielle au plafond d’innovation"
 modifier_building_1776_laboratory_capacity_add_desc:0 "La contribution réelle est recalculée tous les deux jours selon l’emploi, les données disponibles et l’orientation choisie."
 building_1776_production_research_add:0 "Accélération potentielle de recherche en production"
 modifier_building_1776_production_research_add:0 "Accélération potentielle de recherche en production"
 modifier_building_1776_production_research_add_desc:0 "La contribution réelle est recalculée tous les deux jours selon l’emploi, les données disponibles et l’orientation choisie."
 building_1776_military_research_add:0 "Accélération potentielle de recherche militaire"
 modifier_building_1776_military_research_add:0 "Accélération potentielle de recherche militaire"
 modifier_building_1776_military_research_add_desc:0 "La contribution réelle est recalculée tous les deux jours selon l’emploi, les données disponibles et l’orientation choisie."
 building_1776_society_research_add:0 "Accélération potentielle de recherche en société"
 modifier_building_1776_society_research_add:0 "Accélération potentielle de recherche en société"
 modifier_building_1776_society_research_add_desc:0 "La contribution réelle est recalculée tous les deux jours selon l’emploi, les données disponibles et l’orientation choisie."
 building_1776_laboratory_data_efficiency_add:0 "Efficacité de recherche du laboratoire"
 modifier_building_1776_laboratory_data_efficiency_add:0 "Efficacité de recherche du laboratoire"
 modifier_building_1776_laboratory_data_efficiency_add_desc:0 "La contribution réelle est recalculée tous les deux jours selon l’emploi, les données disponibles et l’orientation choisie."
