l_french:
 treaty_1776_capitulations: "Capitulations françaises de 1740"
 treaty_1776_versailles: "Premier traité de Versailles"
 treaty_1776_windsor: "Alliance anglo-portugaise"
 formation_1776_mamluk_egypt: "Armée mamelouke d’Égypte"
 name_1776_ibrahim: "Ibrahim"
 name_1776_murad: "Murad"
 name_1776_bey: "Bey"
 je_group_1776_imperial_crises: "Crises de l’autorité impériale"
 je_1776_porte_burden: "Le fardeau de la Sublime Porte"
 je_1776_porte_burden_reason: "Des bureaux de Constantinople aux provinces lointaines, les décisions de la Sublime Porte se heurtent aux charges héréditaires, aux fermiers d’impôts et aux privilèges des administrateurs locaux. Les revenus destinés au Trésor s’égarent parmi les intérêts de ceux qui prétendent servir l’Empire. Rendre les comptes vérifiables, pourvoir les offices et faire respecter les décisions impériales devient une nécessité.\n\nCes réformes concernent l’administration et ses pratiques, non la foi de ses habitants. Chaque progrès soulage le Trésor ; seule leur consolidation durable permettra de tourner cette page."
 je_1776_porte_burden_status: "Rendre au Trésor les revenus qui lui échappent.\nRéformes administratives : [ROOT.GetCountry.MakeScope.Var('ottoman_1776_admin_score').GetValue|v0]/10.\nConsolidation : [ROOT.GetCountry.MakeScope.Var('ottoman_1776_admin_months').GetValue|v0]/12 mois consécutifs.\nChaque objectif satisfait retire 10 points de gaspillage fiscal supplémentaire et 1 point de malus bureaucratique, à la prochaine impulsion hebdomadaire. Une régression rétablit sa pénalité et remet la consolidation à zéro.\nLa consolidation exige aussi Rainurage, Abolitionnisme et l’arrêt du commerce d’esclaves.\n\n#bold Bonus actuel pour les conditions remplies#! : +[ROOT.GetCountry.MakeScope.Var('ottoman_1776_admin_score').GetValue|v0] % de bureaucratie et −[ROOT.GetCountry.MakeScope.ScriptValue('ottoman_1776_current_tax_relief')|v0] points de gaspillage fiscal supplémentaire.\nCet allégement est temporaire, varie avec les objectifs satisfaits et compense le malus du journal ; ce n’est pas une récompense permanente."
 je_1776_many_masters: "Un empire aux multiples maîtres"
 je_1776_many_masters_reason: "Les firmans du sultan proclament une seule souveraineté ; dans les provinces, le pouvoir se partage entre gouverneurs, notables et autorités locales. Les beys d’Égypte disposent de leurs propres forces, et les dépendances impériales négocient les limites de leur obéissance. Leur fidélité n’est pas nécessairement perdue, mais elle ne peut plus être tenue pour acquise.\n\nDes institutions solides, un compromis respecté ou une administration rétablie peuvent encore rassembler ces autorités. Sans règlement durable, leurs rivalités ouvriront la voie aux interventions étrangères."
 je_1776_many_masters_status: "Consolider un accord entre le centre et les provinces.\nStabilité : [ROOT.GetCountry.MakeScope.Var('ottoman_1776_stability_months').GetValue|v0]/36 points consécutifs ; 1 point par mois stable, 2 après résolution du fardeau administratif.\nÉchéance ferme : 1er janvier 1836. Un échec anticipé exige 120 points de crise et une pression grave persistante.\nTant que ce journal est actif : +0,15 de désir de liberté hebdomadaire pour chaque sujet et −15 % de résistance au soutien étranger au séparatisme.\nToutes les voies exigent désormais police ET éducation au niveau 3, Rainurage, Abolitionnisme et l’arrêt du commerce d’esclaves."
 ottoman_1776_admin_burden: "Les revenus dispersés de la Porte"
 ottoman_1776_admin_relief: "Restauration des comptes impériaux"
 ottoman_1776_admin_relief_1: "Ancien allégement administratif partiel"
 ottoman_1776_admin_relief_2: "Ancien allégement administratif avancé"
 ottoman_1776_many_masters_pressure: "L’autorité impériale disputée"
 ottoman_1776_subjects_50_tt: "Tous les sujets, y compris indirects, ont un désir de liberté strictement inférieur à 50."
 ottoman_1776_path_institutions_tt: "Voie I — Centralisation : légitimité ≥ 60 et police ET éducation au niveau ≥ 3."
 ottoman_1776_path_compromise_tt: "Voie II — Compromis : légitimité ≥ 75 et désir de liberté strictement inférieur à 25 pour TOUS les sujets."
 ottoman_1776_path_administration_tt: "Voie III — Rétablissement de l’État : fardeau de la Sublime Porte définitivement résolu et légitimité ≥ 50."
 ottoman_1776.1.t: "Les comptes de l’Empire"
 ottoman_1776.1.d: "Depuis une année entière, les offices sont pourvus, les provinces rendent leurs comptes et les ressources de l’État soutiennent ses institutions. Les intermédiaires ne peuvent plus invoquer leurs privilèges pour retenir les recettes impériales. La Porte dispose enfin d’une administration sur laquelle elle peut compter. Les rivalités politiques, elles, devront trouver leur propre règlement."
 ottoman_1776.1.a: "Que les comptes soient désormais rendus."
 ottoman_1776.2.t: "Des autorités réconciliées"
 ottoman_1776.2.d: "Au terme de négociations prolongées, le centre et les provinces ont établi un accord assez solide pour résister aux rivalités locales. Les dépendances reconnaissent leurs obligations et les gouverneurs leurs limites. L’unité de l’Empire ne tient plus à la seule formule des firmans, mais à un équilibre qui a fait ses preuves."
 ottoman_1776.2.a: "Une souveraineté enfin respectée."
 ottoman_1776.3.d: "Les accommodements n’ont pas suffi à rétablir durablement l’autorité impériale. Rivalités provinciales et interventions étrangères imposent désormais une autre épreuve à la Porte. La crise politique entre dans un nouveau chapitre ; le travail entrepris pour restaurer les comptes de l’État se poursuit indépendamment."
 ottoman_1776_goal_offices_tt: "Remplacer les bureaucrates héréditaires par une autre loi bureaucratique."
 ottoman_1776_goal_balance_tt: "Disposer d’un solde bureaucratique supérieur ou égal à zéro."
 ottoman_1776_goal_reserve_tt: "Disposer d’un solde bureaucratique supérieur ou égal à zéro ET ne pas être menacé d’une pénurie imminente de bureaucratie."
 ottoman_1776_goal_supply_tt: "Au moins 90 % des administrations gouvernementales sont sans pénurie de biens ; il en existe au moins une."
 ottoman_1776_goal_land_tax_tt: "Ne plus appliquer l’imposition foncière traditionnelle."
 ottoman_1776_goal_consumption_tax_tt: "Ne plus appliquer la loi de fiscalité fondée sur la consommation."
 ottoman_1776_goal_police_tt: "L’institution de maintien de l’ordre atteint au moins le niveau 3."
 ottoman_1776_goal_schools_tt: "L’institution éducative atteint au moins le niveau 3."
 ottoman_1776_goal_tax_capacity_tt: "La capacité de taxation couvre les besoins dans au moins 75 % des États incorporés ; il en existe au moins un."
 ottoman_1776_goal_staff_tt: "Au moins 90 % des administrations gouvernementales ont au moins 80 % de leurs emplois pourvus ; il en existe au moins une."
 ottoman_1776_admin_completion_tt: "Le malus administratif du journal et son bonus temporaire sont retirés ensemble : les comptes impériaux sont définitivement rétablis."
 ottoman_1776.10.t: "Une bureaucratie désuète"
 ottoman_1776.10.d: "Les registres de la Porte recensent les droits du sultan, mais les recettes passent par une multitude d’intermédiaires. Les fermes fiscales, parfois concédées à vie, avancent au Trésor des sommes dont il a besoin ; elles donnent aussi aux détenteurs des revenus provinciaux une influence que les bureaux de Constantinople peinent à contrôler. Entre exemptions, créances anciennes et comptes tardifs, la somme promise n’est pas toujours la somme reçue. Pourvoir les offices, vérifier les recettes et faire appliquer les décisions impériales devient une nécessité : le sceau du sultan ne peut tenir lieu de comptes rendus."
 ottoman_1776.10.f: "#italic Le vieux commis tira du coffre un registre dont le cuir s’effritait. Une quittance, pliée entre deux feuillets, portait trois sceaux et pas une date. « Le village a payé, dit-il. Le fermier aussi, à ce qu’il assure. » Son apprenti regarda la colonne vide. Au-dehors, les portefaix déchargeaient les sacs du Trésor ; dans le bureau, l’argent n’était encore qu’une promesse.\n\n— Les Registres de la Corne d’Or#!"
 ottoman_1776.10.a: "Nous devons rétablir les comptes et faire respecter nos ordres."
 ottoman_1776.10.a.tt: "Active l’entrée de journal #bold $je_1776_porte_burden$#!.\nChaque objectif administratif satisfait allège temporairement les malus de ce journal. Sa résolution exige que toutes les conditions soient maintenues pendant 12 mois consécutifs."
 ottoman_1776.11.t: "Un trône, mille maîtres"
 ottoman_1776.11.d: "Des Balkans aux provinces arabes, les firmans proclament une seule souveraineté. Leur exécution dépend pourtant des gouverneurs, des notables provinciaux et des maisons qui disposent des revenus et des hommes du pays. En Égypte, les beys mamelouks possèdent leurs propres forces ; ailleurs, les puissants négocient ce qu’ils doivent au centre et ce qu’ils entendent conserver. Leur fidélité n’a pas disparu, mais elle ne se commande plus par un sceau seul. La Porte doit donner à ces autorités une place dans un ordre commun, avant que leurs rivalités et les ambitions étrangères ne déchirent l’édifice impérial."
 ottoman_1776.11.f: "#italic Le messager avait traversé trois provinces sous la protection du même firman. À chaque porte, on lui avait demandé un autre nom. « Celui du sultan ne vous suffit donc pas ? » Le garde écarta le rideau : dans la cour, les hommes du bey attendaient leur solde. « Ici, répondit-il, nous savons qui la verse. »\n\n— Les Portes du Sultan#!"
 ottoman_1776.11.a: "Nous devons rallier les provinces et affermir notre autorité."
 ottoman_1776.11.a.tt: "Active l’entrée de journal #bold $je_1776_many_masters$#!.\nL’Empire dispose jusqu’au #bold 1er janvier 1836#!, soit 60 ans à compter de 1776, pour résoudre cette crise. Une instabilité prolongée accompagnée d’une pression grave peut provoquer la déchéance avant cette échéance.\nEn cas d’échec, la crise se prolonge dans #bold $je_sick_man_main$#!. Tant que le journal reste actif, ses effets augmentent le désir de liberté des sujets et facilitent le soutien étranger au séparatisme."
