 aor1776_hre_choose_vote_desc:0 "Choisir un pays pour la prochaine élection impériale, y compris soi-même si éligible. Pendant les trente jours du scrutin, vous pouvez modifier votre vote. Un joueur qui rompt une promesse valide subit une fois 10 d’infamie ; un électeur IA doit respecter sa promesse."
 aor1776_hre_choose_vote_result:0 "Enregistrer ce pays comme notre choix électoral ; si le scrutin est ouvert, remplacer notre unique bulletin. Un joueur qui quitte le candidat d’une promesse valide reçoit une fois 10 d’infamie."
 aor1776_hre_card_vote_label:0 "Choisir pour mon vote impérial"
 aor1776_hre_choose_electoral_candidate:0 "Choisir comme candidat impérial"
 aor1776_hre_choose_electoral_candidate_desc:0 "Définir notre choix pour la prochaine élection impériale. Ce n’est pas une promesse par traité et le candidat n’a pas à l’approuver."
 aor1776_hre_vote_selected:0 "Choix pour la prochaine élection : [SCOPE.GetRootScope.GetCountry.MakeScope.Var('aor1776_hre_ui_vote_choice').GetCountry.GetName]"
 je_aor1776_hre_vote_reason:0 "Votre choix anticipé est enregistré au décès de l’empereur. Choisissez ou changez de candidat ci-dessous pendant les trente jours du scrutin, y compris vous-même si éligible. Rompre une promesse valide coûte une fois 10 d’infamie à un joueur. Les électeurs IA respectent leurs promesses."
 aor1776_hre_electors_heading:0 "Les électeurs — bulletins et choix anticipés"
 aor1776_hre_dashboard_decisions:0 "Les électeurs peuvent choisir un candidat dès maintenant depuis les fiches ci-dessous ou les actions diplomatiques du pays ; les boutons de candidats du journal permettent aussi de choisir son propre pays s’il est éligible. Le choix devient un bulletin au décès de l’empereur et peut être modifié pendant trente jours. Les décisions de centralisation s’ouvrent après les quatre principes III."
 aor1776_hre.1.d:0 "Le trône impérial est vacant. Notre promesse valide ou notre choix anticipé a déjà été enregistré comme bulletin. Nous pouvons choisir ou changer de candidat dans le journal impérial pendant les trente jours de délibération. Rompre une promesse valide nous coûte 10 d’infamie ; un choix libre peut être modifié sans cette pénalité. À l’issue de la délibération, le dépouillement recherche une majorité absolue, avec un second tour si nécessaire."
 aor1776_hre_pledge_accept_base:0 "Réticence à engager notre liberté électorale"
 aor1776_hre_pledge_accept_preference:0 "Préférence électorale historique : relations, dynastie, religion, alliances et continuité impériale"
 aor1776_hre_pledge_accept_obligation:0 "Obligation due au candidat"
 aor1776_hre_pledge_accept_duration:0 "Longue durée d’engagement"
 aor1776_hre_pledge_accept_receiving:0 "Obtention d’une promesse de voix impériale"
