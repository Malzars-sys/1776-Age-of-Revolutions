l_french:
 law_mercantilism_navigation_acts: "Actes de navigation"
 law_mercantilism_navigation_acts_desc: "Les actes de navigation visent à renforcer la marine marchande britannique et le commerce avec les colonies, tout en encadrant les échanges avec les autres pays. Inspirés par des principes mercantilistes, ils limitent le commerce étranger avec les colonies et imposent que les navires marchands soient construits, possédés et équipés principalement par des Britanniques, des Irlandais ou des sujets coloniaux britanniques."
 law_merchant_banking: "Banque marchande"
 law_merchant_banking_desc: "Ce système économique est fortement tourné vers l'activité maritime, notamment l'assurance."
