l_french:
 aor1776_hre.ack:0 "Nous en prendrons acte devant la Diète."
 aor1776_hre_liberate_estate:0 "Libération d’un État impérial"
 war_goal_aor1776_hre_liberate_estate:0 "Libération d’un État impérial"
 war_goal_aor1776_hre_liberate_estate_type_name:0 "Libération d’un État impérial"
 war_goal_aor1776_hre_liberate_estate_name:0 "Libérer [SCOPE.sCountry('target_country').GetName]"
 war_goal_aor1776_hre_liberate_estate_desc:0 "Libérer [SCOPE.sCountry('target_country').GetName] de son suzerain. Les exigences d’occupation concernent l’État visé, et non la capitale du suzerain extérieur."
 war_goal_aor1776_hre_liberate_estate_on_enforced:0 "[SCOPE.sCountry('target_country').GetName] devient indépendant ; ses provinces impériales enregistrées détenues indûment sont restituées et son appartenance impériale est rétablie."
 dp_aor1776_hre_subject_release_tooltip:0 "Sélectionner un sujet impérial de la puissance extérieure ayant refusé. Chaque sujet visé reçoit son propre objectif principal de libération. Occuper les États visés, et non la capitale étrangère."
 aor1776_hre_enforce_internal_restitution:0 "Imposer la rétrocession impériale"
 aor1776_hre_enforce_internal_restitution_desc:0 "Un État impérial doit immédiatement restituer les provinces enregistrées indiquées. Il ne peut refuser que si l’empereur lui doit une obligation ; ce cas utilise alors la demande soumise à approbation."
 aor1776_hre_reply_infamy:0 "[SCOPE.sCountry('hre_reply_new_infamy_holder').GetName] a reçu 5 points d’infamie pour ce premier refus. Le casus belli impérial dure dix ans ; les trêves existantes restent applicables."
