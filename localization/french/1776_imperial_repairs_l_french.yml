 aor1776_hre_atlas_help:0 "Jaune : provinces impériales enregistrées, quel que soit leur propriétaire actuel. Il s’agit d’un atlas dédié, pas d’un filtre de la carte principale. Le journal impérial liste les propriétaires actuels et les États cliquables."
