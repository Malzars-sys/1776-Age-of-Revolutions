l_french:
 Bertillon: "Bertillon"
 law_birth_quotas: "Quota de naissance"
 law_birth_quotas_desc: "L'État impose un objectif de natalité aux femmes, les forçant à rester à la maison pour s'occuper des enfants. Cette loi est très difficile à promulguer et créera beaucoup d'indignation sur la scène internationale."
 birth_quota_foreign_reaction_tt: "Les autres pays jugeront notre action."
 birth_quota_demographic_countermodifier: "Compensation nataliste"
 birth_quota_demographic_victory_modifier: "Compensation nataliste institutionnelle"
 birth_quota_demographic_victory_modifier_desc: "Après la victoire des quotas, ce bonus national permanent contribue à compenser la baisse moyenne de natalité liée à l'alphabétisation et au niveau de vie. Le reste de la compensation est recalculé dans chaque État. Il cesse si le quota de naissance est abrogé."
 ideology_natalist_movement: "Natalisme d'État"
 ideology_natalist_movement_desc: "Un courant favorable à l'imposition de quotas de naissance et à un ordre familial hiérarchique."
 ideology_birth_quota_ig_support: "Partisans des quotas de naissance"
 ideology_birth_quota_ig_support_desc: "Ce groupe accepte que l'État fixe des objectifs de natalité."
 ideology_birth_quota_ig_opposition: "Opposants aux quotas de naissance"
 ideology_birth_quota_ig_opposition_desc: "Ce groupe rejette la contrainte exercée sur les femmes et les familles."
 movement_natalist: "Mouvement nataliste"
 movement_natalist_icon: "@movement_category_natalist!"
 movement_category_natalist_icon: "@movement_category_natalist!"
 movement_natalist_name: "Mouvement nataliste"
 movement_natalist_desc: "Ce mouvement réclame des quotas de naissance au nom de la puissance démographique de l'État."
 birth_quota_agitators.1.t: "Jacques Bertillon et la question démographique"
 birth_quota_agitators.1.d: "À Paris, le médecin et statisticien Jacques Bertillon rassemble les chiffres des naissances et des décès. Ses tableaux donnent une forme visible à la crainte du déclin démographique. Des militants s'emparent de ses travaux pour réclamer une intervention de l'État, au-delà de ce que les chiffres peuvent démontrer."
 birth_quota_agitators.1.f: "Dans le couloir d'une salle de conférences parisienne, deux auditeurs s'arrêtent devant le tableau que Bertillon vient de couvrir de chiffres. « La courbe descend encore », murmure l'un. Sa voisine replie son carnet : « Des chiffres, oui. Mais que feront-ils de nos vies ? »"
 birth_quota_agitators.1.a: "Écoutons ses arguments"
 birth_quota_events.1.t: "Des pétitions contre les quotas"
 birth_quota_events.1.d: "À peine le projet de loi rendu public, des pétitions circulent dans les quartiers commerçants et aux portes des ateliers. Leurs signataires refusent que des agents de l'État fixent le nombre d'enfants attendu de chaque famille. Les défenseurs du texte y voient, au contraire, un devoir envers la nation."
 birth_quota_events.1.f: "Sous les arcades du marché, une ouvrière signe la pétition d'une main encore tachée d'encre. « Ils veulent compter nos enfants avant même leur naissance ? » demande-t-elle au marchand. Il retient la feuille dans le vent : « C'est bien ce que dit le projet. »"
 birth_quota_events.1.a: "Maintenir le texte sans concession"
 birth_quota_events.1.b: "Négocier avec les notables"
 birth_quota_events.2.t: "La main-d'œuvre proteste"
 birth_quota_events.2.d: "Les fabricants calculent déjà les postes qui resteraient vacants si les femmes devaient abandonner leur ouvrage. Des ouvrières rappellent que leur salaire nourrit aussi leurs enfants. Au sein des assemblées, les partisans du quota soutiennent qu'un ménage privé de ces revenus gagnerait malgré tout en stabilité."
 birth_quota_events.2.f: "Dans l'atelier, le contremaître barre un nom sur le registre de paie tandis que les métiers battent encore. « Qui paiera le pain de mes enfants ? » demande l'ouvrière. Il regarde la ligne effacée : « On ne m'a donné aucune réponse. »"
 birth_quota_events.2.a: "Faire avancer le projet"
 birth_quota_events.2.b: "Temporiser devant les assemblées"
 birth_quota_events.3.t: "Résistance dans les campagnes"
 birth_quota_events.3.d: "Dans plusieurs campagnes, les administrateurs venus dresser les listes des ménages trouvent portes closes et places de village pleines. Les familles connaissent déjà les registres des naissances ; elles contestent qu'ils deviennent l'instrument d'une obligation nouvelle. Les notables locaux hésitent entre obéir et apaiser la colère."
 birth_quota_events.3.f: "Sur la place du village, l'administrateur pose son registre sur une table boiteuse. Une mère referme sa porte devant lui. « Je dois seulement noter les noms », dit-il. Derrière le battant, elle répond : « Vous les notiez déjà ; aujourd'hui, vous venez nous donner des ordres. »"
 birth_quota_events.3.a: "Envoyer les administrateurs"
 birth_quota_events.3.b: "Chercher l'appui des savants"
 birth_quota_events.4.t: "Les quotas entrent en vigueur"
 birth_quota_events.4.d: "Le texte est promulgué. Les bureaux reçoivent leurs instructions, les agents préparent leurs listes et des affiches annoncent les nouveaux objectifs imposés aux familles. Dans les rues, la foule accueille le décret par des protestations ; jusque dans les professions instruites, l'autorité de l'État est mise en cause."
 birth_quota_events.4.f: "Au pied de la mairie, l'affiche du décret claque contre le mur humide. Une femme serre le bras de sa sœur. « Ils appellent cela l'avenir du pays ? » souffle-t-elle. Sa sœur fixe le sceau officiel : « Ils n'ont pas demandé le nôtre. »"
 birth_quota_events.4.a: "Le décret doit être appliqué"
 birth_quota_events.5.t: "Des familles refusent le recensement"
 birth_quota_events.5.d: "Les agents chargés d'appliquer le quota reviennent de certains villages avec des listes incomplètes. Des familles cachent leurs papiers, d'autres répondent collectivement qu'elles ne livreront pas leur vie privée à l'administration. Les autorités locales demandent des moyens supplémentaires, mais redoutent d'enflammer la campagne."
 birth_quota_events.5.f: "Dans la mairie froide, l'agent étale ses feuilles incomplètes devant le maire. Dehors, la place est vide et les volets restent clos. « Pas une réponse dans cette rue ? » demande le maire. L'agent secoue la tête : « Pas une porte ouverte. »"
 birth_quota_events.5.a: "Renforcer les contrôles"
 birth_quota_events.5.b: "Accorder des exceptions locales"
 birth_quota_events.6.t: "Des ateliers désorganisés"
 birth_quota_events.6.d: "Le retrait forcé de travailleuses bouleverse les ateliers : les commandes prennent du retard, les contremaîtres redistribuent les tâches et les familles perdent une partie de leurs revenus. Employeurs et ouvriers s'accusent mutuellement, mais tous demandent qui paiera le prix de la nouvelle politique."
 birth_quota_events.6.f: "À l'aube, la salle des métiers résonne de machines arrêtées ; des ballots attendent près des fenêtres. « Trois postes encore vides », compte le contremaître. Le patron froisse une commande : « Et les acheteurs, eux, n'attendront pas. »"
 birth_quota_events.6.a: "Exiger des adaptations des ouvriers"
 birth_quota_events.6.b: "Faire porter le coût aux employeurs"
 birth_quota_events.7.t: "Une controverse médicale"
 birth_quota_events.7.d: "Une société de médecins publie un mémoire contestant l'idée qu'un objectif de naissances puisse s'appliquer de la même manière à chaque foyer. Ses membres évoquent la santé des mères, les conditions de logement et la mortalité des nourrissons. Les défenseurs du quota accusent aussitôt ces praticiens de semer le doute."
 birth_quota_events.7.f: "Dans une salle de l'hôpital, un médecin referme le dossier d'une jeune mère épuisée. « Le bureau réclame un chiffre », dit son collègue en désignant la circulaire. Le médecin écarte le papier : « Ici, c'est d'abord une patiente. »"
 birth_quota_events.7.a: "Écarter leurs critiques"
 birth_quota_events.7.b: "Ouvrir une consultation publique"
 birth_quota_events.8.t: "Condamner les quotas étrangers"
 birth_quota_events.8.d: "Les dépêches venues de [SCOPE.sCountry('quota_enacting_country').GetName] décrivent des obligations de naissance et le retrait de femmes de la vie professionnelle. Journaux réformateurs, médecins et associations exigent que notre gouvernement condamne cette politique. Le ministère craint qu'un silence soit pris pour une approbation."
 birth_quota_events.8.f: "À la rédaction, les dépêches étrangères passent de main en main au-dessus des presses encore chaudes. « Nous imprimons cela en première page ? » demande une journaliste. Son rédacteur acquiesce : « Que le ministre explique alors son silence. »"
 birth_quota_events.8.a: "Dénoncer cette politique"
 birth_quota_events.9.t: "Un modèle démographique étranger ?"
 birth_quota_events.9.d: "Les nouvelles venues de [SCOPE.sCountry('quota_enacting_country').GetName] alimentent nos cercles gouvernementaux. Certains utilitaristes présentent les quotas comme une expérience d'administration rationnelle de la population ; leurs adversaires y voient des chiffres obtenus au prix de la liberté des familles. Une déclaration de soutien nous lierait à ce choix contesté."
 birth_quota_events.9.f: "Sous les lampes du cabinet, un conseiller aligne les colonnes d'un rapport venu de l'étranger. « Voilà une administration méthodique », dit-il. Une députée lui tend le témoignage d'une famille : « Lisez aussi ce qu'elle fait derrière les portes. »"
 birth_quota_events.9.a: "Exprimer notre soutien"
 birth_quota_events.10.t: "Des quotas chez un partenaire"
 birth_quota_events.10.d: "[SCOPE.sCountry('quota_enacting_country').GetName] vient d'adopter un quota de naissance. Nos diplomates rapportent des manifestations, mais aussi la détermination de son gouvernement à conserver cette loi. Il nous faut défendre nos principes sans rompre précipitamment avec un partenaire dont nous dépendons encore."
 birth_quota_events.10.f: "À la chancellerie, le ministre rature une troisième fois la dépêche destinée à son partenaire. « Condamnons-nous le texte ? » demande son secrétaire. Le ministre laisse sécher l'encre : « Disons ce que nous refusons, sans fermer la porte demain. »"
 birth_quota_events.10.a: "Faire connaître nos réserves"
