l_french:
 dp_end_birth_quotas: "Interdire les quotas de naissance"
 dp_end_birth_quotas_tooltip: "Lancer un coup diplomatique pour mettre fin aux quotas de naissance."
 dp_end_birth_quotas_desc: "Impose au pays visé la loi sur les droits des femmes du pays initiateur : travail des femmes ou suffrage féminin. Ce coup est disponible pendant l'épreuve des quotas et réduit l'infamie de 10 au lancement."
 war_goal_end_birth_quotas_type_name: "Interdire les quotas de naissance"
 war_goal_end_birth_quotas_type_desc: "En cas de victoire, la loi du pays vainqueur sur les droits des femmes — Droit des femmes à travailler ou Suffrage des femmes — est promulguée dans le pays vaincu à la place du quota de naissance."
 war_goal_end_birth_quotas: "Interdire les quotas de naissance en [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_end_birth_quotas_desc: "En cas de victoire, la loi sur les droits des femmes de [WAR_GOAL_DRAFT.GetHolder.GetName] est promulguée en [WAR_GOAL_DRAFT.GetTarget.GetName] à la place du quota de naissance."
 war_goal_end_birth_quotas_sway_desc: "Soutenir la fin des quotas de naissance dans le pays ciblé."
