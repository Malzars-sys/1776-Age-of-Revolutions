l_french:
 bauxite:0 "Bauxite"
 bauxite_desc:0 "Minerai riche en aluminium qui doit être extrait puis raffiné chimiquement avant de pouvoir produire le métal."
 alloys:0 "Alliages industriels"
 alloys_desc:0 "Mélanges de fer, de cuivre, de plomb et d'autres métaux conçus pour offrir aux machines, structures, véhicules et armements de meilleures propriétés qu'un métal pur."
 aluminium:0 "Aluminium"
 aluminium_desc:0 "Métal industriel léger produit à partir de bauxite raffinée, d'abord par réduction chimique puis par électrolyse intensive."
 building_bauxite_mine:0 "Mine de bauxite"
 building_bauxite_mine_desc:0 "Complexe minier qui extrait la bauxite, un minerai riche en aluminium."
 building_bauxite_mine_lens_option:0 "Agrandir la $building_bauxite_mine$"
 building_bauxite_mine_throughput_add:0 "[concept_throughput] des bâtiments de type $building_bauxite_mine$"
 building_bauxite_mine_throughput_add_desc:0 "Un bonus ou une pénalité à la consommation et à la production des bâtiments de type $building_bauxite_mine$."
 building_alloys_plant:0 "Usine d'alliages"
 building_alloys_plant_desc:0 "Industrie lourde produisant des alliages spécialisés et, une fois les procédés nécessaires maîtrisés, raffinant la bauxite en aluminium."
 building_alloys_plant_lens_option:0 "Agrandir l'$building_alloys_plant$"
 pmg_alloys_process:0 "Production d'alliages"
 pmg_aluminiummaking_process:0 "Production d'aluminium"
 pm_basic_smelting_process:0 "Alliages de fonderie"
 pm_basic_smelting_process_desc:0 "Des fonderies chauffées au charbon combinent fer, cuivre et plomb pour produire des alliages industriels fiables."
 pm_electric_arc_process_alloying:0 "Alliages au four électrique"
 pm_electric_arc_process_alloying_desc:0 "Les fours électriques contrôlent assez précisément la température et la composition pour produire davantage d'alliages plus résistants."
 pm_no_aluminium_production:0 "Aucune production d'aluminium"
 pm_wohler_deville_process:0 "Procédé Wöhler-Deville"
 pm_wohler_deville_process_desc:0 "La bauxite est réduite à haute température avec des réactifs soufrés et du carbone afin d'obtenir de l'aluminium."
 pm_hall_heroult_process:0 "Procédé Hall-Héroult"
 pm_hall_heroult_process_desc:0 "La bauxite purifiée est réduite par électrolyse, ce qui accroît fortement la production d'aluminium."
 pm_all_metal_aircraft:0 "Avions entièrement métalliques"
 pm_all_metal_aircraft_desc:0 "Les cellules en aluminium remplacent la construction ancienne en bois et en toile."
 pmg_electrical_conductors_building_power_plant:0 "Conducteurs électriques"
 pm_copper_conductors_building_power_plant:0 "Conducteurs en cuivre"
 pm_copper_conductors_building_power_plant_desc:0 "Les réseaux électriques utilisent des câbles en cuivre hautement conducteurs."
 pm_aluminium_conductors_building_power_plant:0 "Conducteurs en aluminium"
 pm_aluminium_conductors_building_power_plant_desc:0 "Des conducteurs en aluminium plus légers remplacent le cuivre dans les réseaux électriques tardifs."
 pm_aluminium_housewares:0 "Articles ménagers en aluminium"
 pm_aluminium_housewares_desc:0 "L'aluminium et l'acier sont façonnés en biens ménagers durables par des machines électriques."
 pm_aluminium_passenger_carriages:0 "Voitures voyageurs en aluminium"
 pm_aluminium_passenger_carriages_desc:0 "Des voitures légères en aluminium augmentent la capacité de transport des voyageurs sans alourdir les trains."
