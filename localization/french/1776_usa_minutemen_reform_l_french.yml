l_french:
 law_aor1776_reorganized_militia:0 "Milice nationale réorganisée"
 law_aor1776_reorganized_militia_desc:0 "Des registres communs, des cadres permanents et un calendrier de service régulier coordonnent les milices des États. Cette organisation demande davantage de moyens et laisse moins de place aux départs improvisés, mais soutient plus durablement l’effort militaire national."
 aor1776_review_revolutionary_militias:0 "Examiner la réorganisation des milices"
 aor1776_review_revolutionary_militias_desc:0 "Présenter au Congrès un projet de coordination des milices des États. Il pourra engager une procédure de réforme ou conserver les compagnies de minutemen. L’adoption d’une nouvelle organisation dépendra des connaissances et des soutiens politiques nécessaires."
 aor1776_usa_minutemen_reorganization.1.t:0 "La réorganisation des milices révolutionnaires"
 aor1776_usa_minutemen_reorganization.1.d:0 "Les compagnies de minutemen ont répondu aux premières alertes, mais leurs usages locaux rendent difficile la coordination d’un service prolongé. Le Congrès examine une administration commune du recrutement, de l’instruction et des périodes de service. Une milice nationale réorganisée conserverait les forces existantes, avec une meilleure instruction et un recrutement plus structuré, au prix d’un entretien accru et d’une mobilisation moins rapide. Nous pouvons engager cette réforme ou maintenir les compagnies actuelles."
 aor1776_usa_minutemen_reorganization.1.f:0 "Le secrétaire posa deux registres sur la table. Dans le premier, chaque bourg avait sa liste, ses dates et ses promesses. Dans le second, les mêmes noms devaient enfin obéir au même calendrier. Un délégué tourna quelques pages, puis demanda qui paierait les hommes retenus loin de leurs champs."
 aor1776_usa_minutemen_reorganization.1.a:0 "Réorganisons nos milices !"
 aor1776_usa_minutemen_reorganization.1.b:0 "Les Minutemen ont fait leurs preuves !"
 aor1776_minutemen_reform_technology_tt:0 "La technologie Corps du génie doit être recherchée pour débloquer la nouvelle organisation."
 aor1776_minutemen_reform_free_enactment_tt:0 "Aucune autre promulgation ne doit être en cours."
 aor1776_minutemen_reform_political_support_tt:0 "Le gouvernement doit avoir au moins 25 de légitimité et un soutien permettant une chance de promulgation positive."
 aor1776_minutemen_reform_start_tt:0 "Engager la promulgation de la Milice nationale réorganisée. Les Minutemen restent en vigueur jusqu’à l’adoption effective. Par rapport aux compagnies actuelles, la nouvelle loi augmente le taux de conscription de 1 point et la vitesse d’instruction de 5 points, mais réduit la vitesse de mobilisation de 15 points et augmente le coût des biens militaires de 5 points. Les unités et leurs commandants sont conservés."
 aor1776_minutemen_reform_keep_tt:0 "Conserver les compagnies de minutemen et leurs effets actuels. Le projet pourra être repris plus tard par la promulgation normale des lois militaires, lorsque ses conditions seront réunies."
