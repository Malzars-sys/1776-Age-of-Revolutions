  # India
 BIC_FLAVOR_TEXT:0 "Originally establised as a factory, India is becoming the jewel in the crown of the rising British Empire. With the fastly déclining Mughal’Empire and Maratha Confederacy gaining ground, can the East India Company gain hegemony and rule over this vast landscape while appeasing its shareholders?"
