l_french:
  # Modded Countries
 IREK_FLAVOR_TEXT:0 "L’Irlande vit dans une union mal assurée avec la Grande-Bretagne, liée par la Couronne au-delà de la mer d’Irlande. Le Parlement irlandais siège a Dublin, mais le pouvoir appartient a l’Ascendance protestante."

 DEI_FLAVOR_TEXT:0 "La Compagnie néerlandaise des Indes orientales est devenue un succès éclatant et suscite la jalousie de l’Europe. Son objectif est de monopoliser les routes commerciales et le commerce des épices."

 DWI_FLAVOR_TEXT:0 "La Compagnie néerlandaise des Indes occidentales détient un monopole des Amériques a l’Afrique de l’Ouest, afin de défier les Portugais et les Espagnols dans l’Atlantique."

 LOU_FLAVOR_TEXT:0 "Ancienne colonie fran’aise remise a l’Espagne, la Louisiane se trouve juste a côté des colonies rebelles des États-Unis. Quelle sera sa place dans l’Empire espagnol ?"

 PLC_FLAVOR_TEXT:0 "La République des Deux Nations, autrefois grande puissance européenne, a décliné jusqu’à devenir presque un protectorat de la Russie tsariste. Sans réforme, peut-elle survivre a ce siècle ?"

 CRI_FLAVOR_TEXT:0 "Le khanat de Crimée est tout ce qui reste de la Horde d’Or, désormais sous protection ottomane. La Russie convoite ses terres ; ce vieux vestige de l’empire mongol peut-il durer ?"

 VEN_FLAVOR_TEXT:0 "La République marchande de Venise traverse une période réactionnaire après un fort déclin. Venise peut-elle ressurgir et redevenir la grande puissance commerciale de l’Europe ?"

 MLT_FLAVOR_TEXT:0 "L’Ordre souverain militaire de Malte est le dernier État croise de son espèce. Les chevaliers et l’Église tiennent fermement l’île. Sa souveraineté survivra-t-elle ?"

 DUR_FLAVOR_TEXT:0 "L’Empire durrani, mosaïque de confederations afghanes, s est impose au Moyen-Orient. Mais ses fondations restent fragiles face a la Perse, aux Sikhs et aux Marathes."

 MARATH_FLAVOR_TEXT:0 "La Confédération marathe est devenue un acteur majeur de la lutte pour l’hégémonie sur le sous-continent indien. Peut-elle maintenir l’équilibre des puissances en Inde ?"
 
 # Base Game Countries
 
 GBR_FLAVOR_TEXT:0 "La Grande-Bretagne est entrée dans le XVIIIe siècle en remportant la guerre de Sept Ans. Protegee par les mers et par sa marine, elle est bien placee pour l’empire outre-mer, mais les Treize Colonies se sont revoltees."

 BEL_FLAVOR_TEXT:0 "In Belgium the industrial révolution is in full swing. The yoke of Dutch oppression was cast aside just six years ago and the country is bounding ahead of their former masters, with the construction of the first railroad in continental Europe. What does the future hold for them?"

 CHI_FLAVOR_TEXT:1 "La dynastie Qing contrôle environ un tiers de la population mondiale après l’apogée de sa puissance sous l’empereur Qianlong. Mais l’isolationnisme et l’avance technologique européenne menacent son équilibre."

 TIB_FLAVOR_TEXT:0 "Le jeune dalaï-lama est le chef théocratique du Tibet. Le bouddhisme restera-t-il au cœur du pouvoir politique ?"

 FRA_FLAVOR_TEXT:0 "La France panse encore ses plaies après l’humiliante d’faite de la guerre de Sept Ans. Louis XV peut-il la ramenér parmi les grandes puissances, ou l’avenir sera-t-il plus libéral ?"

 RUS_FLAVOR_TEXT:0 "Catherine la Grande a saisi le trône russe et ouvre une période de modernisation et d’expansion. La Russie vivra-t-elle a la hauteur de sa réputation ?"

 PRU_FLAVOR_TEXT:0 "La Prusse est un cœur technologique et militaire du Saint-Empire, tout en étant une grande puissance indépendante. Peut-elle unifiér l’Allemagne ?"

 JAP_FLAVOR_TEXT:0 "Le shogunat Tokugawa a unifié le Japon sous ses seigneurs féodaux, mais le monde change autour d’un Japon isolationniste. Peut-il préserver sa culture et sa souveraineté ?"

 PER_FLAVOR_TEXT:0 "La Perse se remet de quarante années de guerre civile. Karim Khan Zand a ramené la stabilité, mais survivra-t-elle à sa mort ?"

 AUS_FLAVOR_TEXT:0 "L’Autriche est de jure empereur du Saint-Empire, mais le déclin de l’Empire inquiète. Peut-elle le relever ou tout est-il perdu ?"

 USA_FLAVOR_TEXT:1 "Les Treize Colonies se sont declarees États-Unis d’Amerique indépendants. Obtiendront-elles la liberté, ou la mort ?"

 TUR_FLAVOR_TEXT:0 "L’Empire ottoman recule depuis l’échec du siège de Vienne. Peut-il survivre à cette époque, voire prospérer ?"

 SPA_FLAVOR_TEXT:1 "Charles III a apporté l’esprit des Lumières a l’Espagne et renforce la couronne. Mais avec la Révolution américaine, l’Espagne peut-elle garder ses possessions américaines ?"

 BRZ_FLAVOR_TEXT:0 "Le Brésil est la plus précieuse possession coloniale du Portugal, vaste et riche en ressources. Obtiendra-t-il le statut de royaume ou suivra-t-il sa propre voie ?"

 MEX_FLAVOR_TEXT:0 "La Nouvelle-Espagne est l’un des joyaux de la Couronne espagnole. Restera-t-elle loyale avec les États-Unis rebelles à sa porte ?"

 NET_FLAVOR_TEXT:0 "Les Pays-Bas se trouvent au cœur de l’Europe et possèdent encore un empire outre-mer par leurs compagnies. Peuvent-ils retrouver leur grandeur commerciale ?"

 POR_FLAVOR_TEXT:0 "Le Portugal possède un vaste empire, mais celui-ci exige une vaste protection. Peut-il revenir plus fort ?"

 SAR_FLAVOR_TEXT:0 "Dirigée par la maison de Savoie entre les grandes puissances européennes, la Sardaigne-Piémont peut-elle survivre et nourrir de grandes ambitions ?"

 PAN_FLAVOR_TEXT:0 "L’Empire sikh est en période de conquête. Que lui réserve l’avenir ?"

 DENNOR_FLAVOR_TEXT:0 "Le Danemark-Norvège forme un État unitaire qui pèse plus lourd que sa taille grâce au commerce, aux détroits et a ses colonies. Peut-il poursuivre ses succès ?"

 SWE_FLAVOR_TEXT:0 "La Suède a perdu son statut de grande puissance après ses affrontements avec la Russie. Le regagnera-t-elle ou est-il perdu pour toujours ?"
  
  # South-East Asia
 LAN_FLAVOR_TEXT:0 "The Republic of Lanfang was established by a democratic syndicate of Chinese miners hoping to exploit the gold réserves of Borneo. Can Lanfang resist the advances of the Dutch and achieve the prosperity it seeks?"
 ACE_FLAVOR_TEXT:0 "The Aceh Sultanate is experiencing a resurgence in power due to the efforts of the Raja Muda. Can Aceh restore its empire and assert its independence in the face of Dutch expansion?"
 BRU_FLAVOR_TEXT:0 "Brunei has so far repelled the attempts of colonial powers to infringe upon its sovereignty. Will Brunei fall into décline and obscurity, or could it once more become a regional power?"
 JOH_FLAVOR_TEXT:0 "Johor occupies a precarious position as both the British and the Dutch greedily eye their territory. Will Johor manage to retain what little sovereignty it has left?"
 SIA_FLAVOR_TEXT:0 "Siam has established itself as the dominant regional power in South-East Asia under the Rattanakosin dynasty. But will Siam manage to reform its economy and society for the modern age?"
 DAI_FLAVOR_TEXT:0 "A newly réunited Vietnam emerges from centuries of division and strife. Will Dai Nam consolidate itself and build a great nation, or is it destined to be divided once more?"
 BUR_FLAVOR_TEXT:0 "It took many bloody conflicts to establish the Third Burmese Empire, and it seems that the struggle is far from over as the British Empire makes its ambitions known. Will Burma become yet another British colony, or will it stand strong against the foreign invaders?"
 CAM_FLAVOR_TEXT:0 "Cambodia has fallen far since the golden age of the Khmer Empire. Can the Khmer state rise once more, or will this dark age last forever?"
 LUA_FLAVOR_TEXT:0 "Once the seat of the mighty Kingdom of Lan Xang, Luang Prabang is a shadow of its former self. Split between the regional powers of Dai Nam and Siam, can the Lao people emerge strong and independent?"
  
  # Australia
 UNT_FLAVOR_TEXT:0 "$GENERIC_FLAVOR_TEXT$"
 NSW_FLAVOR_TEXT:0 "In its transition from penal colony to Crown Colony, New South Wales has seen its territory reduced as the other provinces gained their own administrations. What does the future hold for Australia?"
 SAS_FLAVOR_TEXT:0 "South Australia was granted its own administration only two years ago, separating from New South Wales. What does the future hold for Australia?"
 WAS_FLAVOR_TEXT:0 "The Swan River colonists impose upon the traditional lands of the aboriginal people, culminating in the Pinjarra massacre only two years ago. How will the colony settle this conflict?"
 TAS_FLAVOR_TEXT:0 "Van Diemen's Land is the primary penal colony in British Australia. What does the future hold for this colony of convicts?"

  # Balkans
 SER_FLAVOR_TEXT:0 "Serbia has been under Ottoman control for centuries and despises Ottoman rule. Wedged between great powers, will Serbia become the powder keg of Europe?"
 GRE_FLAVOR_TEXT:0 "Through a bloody struggle, Greece has won its independence from the Ottoman Empire. Can Greece expand its borders?"
 WAL_FLAVOR_TEXT:0 "Calls for Romanian unification and political independence complicate regional politics, as both Russia and the Ottomans have an interest in enforcing the status quo. Can Romania win its freedom?"
 MOL_FLAVOR_TEXT:0 "Calls for Romanian unification and political independence complicate regional politics, as both Russia and the Ottomans have an interest in enforcing the status quo. Can Romania win its freedom?"
 ION_FLAVOR_TEXT:0 "The Islands have passed from Ottoman to Russian, French and finally British control within the past 30 years. Can the Islanders achieve Enosis with the new Greek state or will they seek a new path forward under British guidance?"
  
  # Italy
 PAP_FLAVOR_TEXT:0 "Though the political power of the Catholic Church has waned over the centuries, the Pope still presides over the Papal States. Does faith still rule the hearts of men?"
 TUS_FLAVOR_TEXT:0 "$GENERIC_FLAVOR_TEXT$"
 SIC_FLAVOR_TEXT:0 "Sicily and Naples is ruled by a Cadet Branch of the Bourbons, nominally under Spanish control. Can this Kingdom use this powerful Familial Alliance to rise the ranks?"
 PAR_FLAVOR_TEXT:0 "$GENERIC_FLAVOR_TEXT$"
 LUC_FLAVOR_TEXT:1 "$GENERIC_FLAVOR_TEXT$"
 MOD_FLAVOR_TEXT:1 "The Duchy of Modena is both ruled by, and politically subservient to, the Hapsburgs and the Austrian Empire. Will Modena shake off these chains of family loyalty, or do the ties that bind restrict too much?"
  
  # Germans
 BAV_FLAVOR_TEXT:0 "$GERMAN_FLAVOR_TEXT$"
 SWI_FLAVOR_TEXT:0 "Switzerland has a strict foreign policy as a neutral power, affording some degree of safety in the th?être of European politics. Will Switzerland préserve its neutrality, or strike a différent path?"
 HAN_FLAVOR_TEXT:0 "Hanover through inheritence now rules over the British Empire, but is effectively a state in it's own right, will this luxirious position be kept?"
 GERMAN_FLAVOR_TEXT:0 "Les États allemands font en pratique partie du Saint-Empire romain, mais l’Empire est très faible et ils agissent comme des États indépendants. Ces petits États peuvent-ils survivre ?"

