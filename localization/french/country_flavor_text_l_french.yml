 KOR_FLAVOR_TEXT:0 "Known as Little China. Korea under the Joseon dynasty looks inward, consumed by its factional politics. Will changing times force Korea to consider the outside world’"
 NOR_FLAVOR_TEXT:0 "Norway has spent centuries under Danish and Swedish rule, but now dreams of sovereignty. What will it take for Norway to win its independence?"
 FIN_FLAVOR_TEXT:0 "Finland has thus far enjoyed relative autonomy under the Swedish Empire. But the Sweden has been losing it's power, will Finland need a new protector?"
  
