 # Poland
 KRA_FLAVOR_TEXT:1 "The legacy of the Polish people rests heavily on the shoulders of the Free State of Krakow, distrusted by its constituting powers and occupied by Austria. Can a new Polish state rise from the ashes once again?"
  
  # North America
 QUE_FLAVOR_TEXT:0 "Once the colony of New France, Lower Canada has fallen under British rule. Tensions between the predominantly French population and the colonial government threaten to escalate in the near future, with little chance of peaceful resolution. Will Quebec win its freedom?"
 ONT_FLAVOR_TEXT:0 "Emboldened by rising tensions in Lower Canada, the people of Upper Canada prepare to resist the colonial government. Will Ontario win its freedom?"
 HBC_FLAVOR_TEXT:0 "The Hudson’s Bay Company is prepared to protect its monopoly on the fur trade by any means necessary. Agreements are made and broken with the First Nations as the Company sees fit, with little regard to any motive but profit. Will ruthlessness be enough to safeguard the Company?"
 NBS_FLAVOR_TEXT:0 "The colony of New Brunswick is establishing a thriving shipbuilding industry, with colonists arriving from Scotland and Ireland to work with timber. Will New Brunswick lead a united Canada?"
 ORG_FLAVOR_TEXT:0 "Currently under relatively autonomous administration, both the Hudson’s Bay Company and the US government have set their eyes on the disputed Columbia district. Will either power succeed, or will an independent Oregon emerge?"
 TEX_FLAVOR_TEXT:0 "The newly declared Republic of Texas fights a seemingly impossible war against its Mexican overlords. Will a miracle save the Lone Star State?"
 HAI_FLAVOR_TEXT:0 "Haiti is a colonial slave state that is particulary brutal, with French Slave Owners in constant fear of a rebellion, will it stay as a resource piggy bank or perhaps a more libéral future?"
 CUB_FLAVOR_TEXT:0 "Cuban relations with their Spanish overlords have become strained. Calls for representation in the Spanish parliament and resistance to the abolition of slavery have met with hostility from Madrid. Is a Cuban révolution inevitable?"
  
  #Central Asia
 KHI_FLAVOR_TEXT:0 "In defiance of both Persia and Russia, Khiva is an independent power flourishing under the rule of the Khan. Can Khiva protect its independence?"
 BUK_FLAVOR_TEXT:0 "Unlike the neighboring Khanates, the Emirs of Bukhara embrace Islamic rule rather than basing their legitimacy on descent from Genghis Khan. Will faith win the day?"
 KOK_FLAVOR_TEXT:0 "Kokand struggles with disunity and discord within the Khan's court. Can Kokand become a dominant power in Central Asia?"
 KAB_FLAVOR_TEXT:1 "The fall of the Durrani Empire has left its realm in a state of perpetual civil war between claimants to the throne. Can the ambitious Emir Dost Mohammad réunify Afghanistan, and cement the Barakzai Dynasty as its rulers?"
 HER_FLAVOR_TEXT:1 "The civil war in Afghanistan has left the Emirate of Herat as the last bastion of Durrani rule. Can the heirs to the dynasty resist Persian incursions, and réunify Afghanistan under their restored Empire?"
 KAN_FLAVOR_TEXT:1 "The Principality of Kandahar declared independence from Afghanistan in 1818, but soon fell into infighting between its confederal rulers. Can the reigning Dil brothers settle their differences, and eclipse the Emir of Kabul’"
 AFGHAN_MINOR_FLAVOR_TEXT: "The fall of the Durrani Empire has left its realm in a state of perpetual civil war between claimants to the throne. Can the Khanates of the North assert their independence amidst the warring Afghan princes, and carve out empires of their own?"
 MAI_FLAVOR_TEXT: "$AFGHAN_MINOR_FLAVOR_TEXT$"
 KUN_FLAVOR_TEXT: "$AFGHAN_MINOR_FLAVOR_TEXT$"
 CHT_FLAVOR_TEXT: "The fall of the Durrani Empire has left its realm in a state of perpetual civil war between claimants to the throne. Can the Chitrali state defend itself from both the Sikh Empire, resurgent Afghan states and British expansion into the Hindu Kush?"
 KAF_FLAVOR_TEXT: "Surrounded by increasingly bellicose Islamic states, the so-called 'infidels' of the Hindu Kush are facing an uncertain future. Can the realm of Kafiristan maintain its ways, or will it be resigned to the footnotes of history?"
 MAK_FLAVOR_TEXT: "The Khanate of Kalat has carved out a sphere of influence of its own in the wake of the collapse of the Durrani Empire. Will the tribes of Makran be able to préserve their territory in the face of threats from Persia and the Afghan princes?"
 KAL_FLAVOR_TEXT: "The Khanate of Kalat has carved out a sphere of influence of its own in the wake of the collapse of the Durrani Empire. Can it maintain its long-sought-after sovereignty, and grow its empire to rival its neighbors?"
 TRM_FLAVOR_TEXT: "$DECENTRALIZED_FLAVOR_TEXT$"
 ZHUZ_FLAVOR_TEXT: "The Russian expansion into the Kazakh steppe has taken a new character, with the Russian Tsar recently issuing dictates abolishing the position and powers of the Khans. Will the Kazakh zhuzes break free, or will they slip further under Russian domination?"
 KZH_FLAVOR_TEXT: "$ZHUZ_FLAVOR_TEXT$"
 OZH_FLAVOR_TEXT: "$ZHUZ_FLAVOR_TEXT$"
 UZH_FLAVOR_TEXT: "$ZHUZ_FLAVOR_TEXT$"
 ARB_FLAVOR_TEXT: "The rule of Sheikh Jaber al-Kaabi has led the sheikhdom of Muhammarah to a period of de facto sovereignty. Will Muhammarah maintain its privileged status, and grow into a power center of its own?"
  
  # Maghreb
 TRI_FLAVOR_TEXT:1 "Following a long period of de facto independence, Tripolitania has once again fallen under Ottoman rule. Will the Barbary Pirates sail again?"
 TUN_FLAVOR_TEXT:0 "After being forced to end its sponsorship of piratical raids, the Tunisian economy has taken a turn for the worse. Can the Bey restore prosperity?"
 ALD_FLAVOR_TEXT:0 "Algeria lost much of its coastline to the French in the aftermath of the Barbary Wars. Can the remnants of this nation fend off further French incursions?"
 MOR_FLAVOR_TEXT:0 "No longer under Ottoman protection, Morocco is vulnerable to French and Spanish expansionism. Can Morocco survive the imperialist onslaught?"
  # Africa
 SOK_FLAVOR_TEXT:0 "Under the banner of the Fulani Jihad, the Sokoto Caliphate is expanding rapidly. Can Sokoto unite West Africa and resist the Western powers?"
 GREAT_LAKES_FLAVOR_TEXT:0 "Les peuples des Grands Lacs ont établi de jeunes empires, dominant l’eau comme la terre. Une grande nation naîtra-t-elle parmi eux ?"
