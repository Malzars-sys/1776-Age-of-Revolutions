 BCE_FLAVOR_TEXT:0 "Following the conclusion of the Kandyan Wars, Ceylon's fertile uplands have witnessed the rise of numerous plantations, fueled in part by the importation of Tamil laborers from the mainland. Can Ceylon sustain this momentum, or will it fall to internal strife?"
 MLD_FLAVOR_TEXT:0 "Existing in relative isolation, the Maldives has thrived under British protection, shielded from the pirates that once threatened its shores. Will change ever come to this small island nation?"
  
  # Middle-East
 EGY_FLAVOR_TEXT:0 "Under the Mamluks Egypt has a lot of autonomy in it's internal affairs, with the Ottoman Empire seemingly on décline can Egypt become more than a Ottoman Province?"
 HDJ_FLAVOR_TEXT:0 "À mesure que l’Empire ottoman décline, l’avenir de l’Arabie devient plus incertain. Une nouvelle puissance surgira-t-elle du désert ?"
