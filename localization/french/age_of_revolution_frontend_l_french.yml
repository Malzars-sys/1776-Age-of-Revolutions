l_french:
 age_of_revolution_frontend_subtitle:0 "Age of Revolution"

 objective_egalitarian_society:0 "Âge des Révolutions"
 objective_egalitarian_society_desc:0 "De Philadelphie à Paris, l’ordre politique de l’Ancien Régime commence à se fissurer. Portez une révolution, transformez les institutions et survivez aux contre-révolutions qui chercheront à l’étouffer."
 objective_egalitarian_society_name_FRA:0 "#v France#!"
 objective_egalitarian_society_desc_FRA:0 "#lore La monarchie française paraît encore puissante, mais la dette, les privilèges et les tensions sociales fragilisent l’édifice. Réformerez-vous le royaume, ou la Révolution balaiera-t-elle l’Ancien Régime ?#!"
 objective_egalitarian_society_name_USA:0 "#v $dyn_c_thirteen_colonies$#!"
 objective_egalitarian_society_desc_USA:0 "#lore Les Treize Colonies sont entrées en rébellion contre Londres. Transformez une guerre d’indépendance en un nouvel ordre politique, obtenez la liberté et donnez une forme durable à la jeune république.#!"
 objective_egalitarian_society_name_PLC:0 "#v République des Deux Nations#!"
 objective_egalitarian_society_desc_PLC:0 "#lore Entre privilèges nobiliaires, réformes et ambitions de ses voisins, la République doit se transformer pour survivre. Réformez l’État avant que les puissances environnantes ne décident de son avenir à sa place.#!"

 objective_hegemon:0 "Rivalités impériales"
 objective_hegemon_desc:0 "L’ordre ancien n’est pas immobile. Les grandes puissances se disputent les mers, les colonies, les sujets et le prestige. Renforcez l’État, bâtissez des alliances et imposez votre empire avant que les révolutions ne bouleversent le monde."
 objective_hegemon_name_GBR:0 "#v Grande-Bretagne#!"
 objective_hegemon_desc_GBR:0 "#lore Première puissance maritime de son temps, la Grande-Bretagne entre en 1776 avec un vaste empire mais une rébellion en Amérique du Nord. Préservez l’empire, dominez les mers et contenez vos rivaux.#!"
 objective_hegemon_name_SPA:0 "#v Espagne#!"
 objective_hegemon_desc_SPA:0 "#lore L’Espagne règne encore sur un immense empire transatlantique. Réformez l’État, défendez les colonies et empêchez vos rivaux comme les idées révolutionnaires d’éroder la puissance impériale.#!"
 objective_hegemon_name_RUS:0 "#v Russie#!"
 objective_hegemon_desc_RUS:0 "#lore La Russie est un géant continental dont l’influence s’étend vers l’Europe, la mer Noire et l’Asie. Modernisez l’État et transformez cette immensité en puissance durable.#!"
 objective_hegemon_name_PRU:0 "#v Prusse#!"
 objective_hegemon_desc_PRU:0 "#lore La Prusse dispose d’une armée redoutée mais demeure prise entre de grandes puissances. Discipline, diplomatie et expansion devront la porter au premier rang de l’Europe.#!"

 egalitarian_society_welcome:0 "Âge des Révolutions"
 egalitarian_society_welcome_desc:0 "Bienvenue dans l’objectif de joueur Âge des Révolutions. Une série d’[Concept('concept_journal_entry', '$concept_journal_entries$')|l] vous guidera pour transformer vos institutions et bâtir un nouvel ordre politique."
 liberalizing_the_government_complete_desc:0 "Votre première entrée du journal est terminée : la transformation de vos institutions a commencé."
 liberalizing_the_government_complete_1_desc:0 "Bon travail ! Vous avez terminé votre premier objectif et franchi une étape décisive dans l’Âge des Révolutions."
 egalitarian_society_complete:0 "Âge des Révolutions terminé"
 egalitarian_society_complete_desc:0 "Bon travail ! Vous avez terminé l’objectif Âge des Révolutions. Vous pouvez continuer à jouer ou essayer un autre objectif."

 hegemon_welcome:0 "Rivalités impériales"
 hegemon_welcome_desc:0 "Bienvenue dans l’objectif de joueur Rivalités impériales. Une série d’[Concept('concept_journal_entry', '$concept_journal_entries$')|l] vous guidera pour renforcer l’État et imposer votre empire."
 je_colonization_laws_reason:0 "La première étape vers une influence impériale accrue consiste à étendre notre présence outre-mer. Nous devrions modifier nos lois pour permettre la colonisation et poursuivre nos ambitions."
 je_african_colonies_reason:0 "Maintenant que nos lois autorisent les colonies, nous devrions acquérir de nouvelles terres en Afrique et étendre notre influence impériale."
 je_the_hegemon:0 "Suprématie impériale"
 colonization_law_passed_complete_1_desc:0 "Bon travail ! Vous avez terminé votre premier objectif et commencé à imposer votre empire."
 hegemon_complete:0 "Rivalités impériales terminées"
 hegemon_complete_desc:0 "Bon travail ! Vous avez terminé l’objectif Rivalités impériales. Vous pouvez continuer à jouer ou essayer un autre objectif."
