l_french:
 age_of_revolution_frontend_subtitle:0 "Age of Revolution"

 objective_egalitarian_society:0 "Âge des Révolutions"
 objective_egalitarian_society_desc:0 "En 1776, le langage des droits naturels traverse l’Atlantique tandis que les institutions de l’Ancien Régime dominent encore l’Europe. Indépendance, réforme et représentation promettent des ordres nouveaux, mais privilèges, esclavage et interventions étrangères pèsent sur chaque expérience. Guidez un État dans cet âge incertain sans tenir pour acquise la victoire d’une révolution."
 objective_egalitarian_society_name_FRA:0 "#v France#!"
 objective_egalitarian_society_desc_FRA:0 "#lore Louis XVI règne sur une monarchie absolue où la cour, le clergé et la noblesse conservent une immense autorité, tandis que l’impôt et les obligations croissantes éprouvent le royaume. La France est entrée dans la guerre d’Amérique aux côtés des insurgés, défiant la Grande-Bretagne au prix de nouvelles dépenses. La réforme pourrait réconcilier la Couronne et le pays, ou aviver les conflits qui menacent l’Ancien Régime.#!"
 objective_egalitarian_society_name_USA:0 "#v $dyn_c_thirteen_colonies$#!"
 objective_egalitarian_society_desc_USA:0 "#lore Les Treize Colonies demeurent juridiquement une colonie britannique, mais George Washington dirige déjà une république présidentielle en guerre pour son indépendance avec l’appui de la France et de l’Espagne. La richesse détermine la participation politique, tandis que l’esclavage contredit la liberté proclamée. À la survie militaire devra succéder un ordre capable de maintenir l’union des États.#!"
 objective_egalitarian_society_name_PLC:0 "#v République des Deux Nations#!"
 objective_egalitarian_society_desc_PLC:0 "#lore Stanisław August Poniatowski préside une République élective encore façonnée par l’oligarchie des magnats, le servage et les libertés nobiliaires. Le premier partage a renforcé l’Autriche, la Prusse et la Russie sur ses frontières, tandis qu’un journal de réforme appelle l’État à retrouver sa vigueur. Le changement pourrait préserver l’union, mais chaque réforme risque la résistance intérieure et l’intervention étrangère.#!"

 objective_hegemon:0 "Rivalités impériales"
 objective_hegemon_desc:0 "En 1776, l’équilibre des puissances s’étend des cours européennes à l’Atlantique, à la mer Noire et aux compagnies commerciales d’Asie. Les États dynastiques commandent armées, flottes, colonies et peuples dépendants, mais la guerre et les charges fiscales révèlent les limites de l’autorité impériale. Consolidez votre puissance et maîtrisez vos rivalités sans présumer que l’ordre ancien perdurera."
 objective_hegemon_name_GBR:0 "#v Grande-Bretagne#!"
 objective_hegemon_desc_GBR:0 "#lore George III gouverne une riche monarchie maritime dont l’influence s’étend aux colonies caribéennes, aux provinces canadiennes, aux compagnies à charte et aux possessions d’outre-mer. Les Treize Colonies sont pourtant en révolte ouverte, soutenues par la France et l’Espagne, toutes deux rivales de Londres. Flotte, crédit et commerce offrent une force redoutable, mais rétablir l’autorité exigera de choisir entre contrainte, compromis et guerre élargie.#!"
 objective_hegemon_name_SPA:0 "#v Espagne#!"
 objective_hegemon_desc_SPA:0 "#lore Charles III règne sur une monarchie bourbonienne absolue dont les colonies s’étendent de la Nouvelle-Espagne et des Caraïbes à l’Amérique du Sud et aux Philippines. L’Espagne a rejoint le conflit américain contre sa rivale britannique, convoitant la Floride et les Baléares tout en défendant un immense système impérial. La réforme administrative peut affermir la Couronne, mais la distance, les intérêts locaux et le coût de la guerre menacent l’autorité de Madrid.#!"
 objective_hegemon_name_RUS:0 "#v Russie#!"
 objective_hegemon_desc_RUS:0 "#lore Catherine Romanov règne sur un empire autocratique fondé sur l’administration héréditaire, le servage et les levées paysannes. L’influence russe avance vers la Baltique, la steppe, le Caucase et la mer Noire, où la rivalité avec l’Empire ottoman demeure centrale ; protectorats et compagnie d’Alaska prolongent encore cette portée. L’expansion promet le prestige, mais distances et rigidités sociales peuvent éprouver la cohésion de l’État.#!"
 objective_hegemon_name_PRU:0 "#v Prusse#!"
 objective_hegemon_desc_PRU:0 "#lore La Prusse est une monarchie autocratique dotée d’une armée professionnelle et de possessions dispersées du Brandebourg et de la Silésie à la Prusse-Orientale, à la Westphalie et à la Rhénanie. Ses gains lors du partage de la République ont accru l’hostilité polonaise, tandis que l’Autriche et la Russie la dépassent encore en terres et en hommes. Administration et discipline militaire peuvent élever le royaume, si la diplomatie protège ses territoires exposés.#!"

 egalitarian_society_welcome:0 "Âge des Révolutions"
