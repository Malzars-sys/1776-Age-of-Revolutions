 gov_aor1776_fsi_desc:0 "Le prince-évêque gouverne les possessions temporelles de Freising, distinctes des terres de son diocèse. Le chapitre cathédral désigne son successeur.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_aor1776_rbi_desc:0 "Le prince-évêque exerce sa souveraineté sur les possessions temporelles de son Église. La ville impériale de Ratisbonne conserve ses propres institutions ; le chapitre cathédral élit le prélat.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_aor1776_rci_desc:0 "Le conseil urbain administre la ville libre de Ratisbonne et veille à ses privilèges impériaux. Ses magistrats exercent une autorité distincte de celle du prince-évêque.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
