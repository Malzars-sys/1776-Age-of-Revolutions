  # Most 2.1.0 Content down here
  
 je_plc_reform_reason: "Our system of strong Nobles has led us to an anarchy who needs to rely upon the goodwill of our neighbours, mainly Russia, to survive. The Liberum Veto is regularly abused, the îlective monarchy undermines the Kings authority by not having a strong Royal Family and our low military strength makes little sense in this world. The Fatherland is being destroyed. We must adjust and create a strong Urban class to challenge the landowners, who's power rests in their vast farming estates."
 
