 objective_battle_for_india: "Bataille pour l’Inde"
 objective_battle_for_india_desc: "L’Empire moghol ne contrôle plus vraiment que Delhi. Diverses puissances indiennes luttent pour la suprématie, tandis que les compagnies commerciales européennes entrent elles aussi dans la course."
 objective_battle_for_india_name_FRA: "France"
 objective_battle_for_india_desc_FRA: "La France a perdu sa puissance en Inde après la guerre de Sept Ans et ne possède plus que de petites enclaves. Peut-elle redevenir la puissance européenne dominante en Inde ?"
 objective_battle_for_india_name_BIC: "Compagnie des Indes orientales"
 objective_battle_for_india_desc_BIC: "La Compagnie britannique des Indes orientales possède une solide base au Bengale. Peut-elle continuer à étendre son influence ?"
 objective_battle_for_india_name_MARATH: "Confédération marathe"
 objective_battle_for_india_desc_MARATH: "La Confédération marathe est un réseau complexe d’allégeances et la plus grande puissance indienne. Peut-elle atteindre la grandeur de l’Empire moghol ?"
 objective_battle_for_india_name_DUR: "Empire durrani"
 objective_battle_for_india_desc_DUR: "L’Empire afghan durrani progresse de l’Asie centrale vers l’Inde, tandis que l’empereur moghol est sous protection. Avec cette culture guerrière et cette légitimité, qui peut l’arrêter ?"
 objective_battle_for_india_name_HYD: "Hyderabad"
 objective_battle_for_india_desc_HYD: "Hyderabad est devenu une puissance majeure du Sud. Avec de bonnes alliances, il pourrait s élevér encore davantage."
 objective_battle_for_india_name_DEI: "Indes orientales neerlandaises"
 objective_battle_for_india_desc_DEI: "Les Néerlandais possèdent de nombreux comptoirs autour de l’Inde, notamment Ceylan. Leur commerce est lucratif, mais les routes sont menacées par les Européens mercantilistes."
 objective_tutorial_name_DENNOR: "Danemark-Norvège"
