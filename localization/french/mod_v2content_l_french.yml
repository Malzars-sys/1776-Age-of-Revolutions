 florida.1.t: "An Offer For Florida"
 florida.1.d: "Finally, a blessing for our coffers!"
 florida.1.f_spa: "They said they need it for their...Continental Security? Bleh, we need it for our monetary security! We have a globe spanning Empire and even WE wouldn't be so arrogant about needing that wasteland.\n\nBleed them."
