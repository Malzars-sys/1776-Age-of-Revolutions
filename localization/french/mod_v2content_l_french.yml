 florida.3.t: "Failed Florida Purchase"
 florida.3.d: "Well I'd be damned..."
 florida.3.f: ""Okay time to write the letter saying I got their response, I'm so angry I was about to let them know, we'll get it the easy way or, the hard way. Patience though, patience...""
 
 florida.3.a: ""WE WILL GET IT THE HARD WAY""
 florida.3.b: ""My friend, I understand, maybe you want a swamp vacation once in a while?""
 
 florida.4.t: "Making an Offer For Florida..."
 florida.4.d: "This might be hard, they might wonder why we'd want the damn thing..."
 florida.4.f: "...maybe there's magic beans there and the Mosquitos are a magical guardian to chase you away, that's what they'll think when they see how much we're willing to pay up, I swear!"
 
