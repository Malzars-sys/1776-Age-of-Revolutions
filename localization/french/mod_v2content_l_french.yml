 qajar_pulse_events.2.t: "Worried Landowners"
 qajar_pulse_events.2.d: "An unstable realm means assets at risk, if the Shah can't bring peace what's the point of the Shah?"
 qajar_pulse_events.2.f: ""If they take power they may seize our land and give it to their family members, their loyalists, for supporting the regime and for sure Allah knows, the peasants would be just as happy to get rid of me aswell, I see them happier to get to work as ever now and whispering as I walk past, my days are numbered...""
 
 qajar_pulse_events.2.a: "Put extra resources into stabilising the realm"
 qajar_pulse_events.2.b: "Treat your peasants better"
 
 qajar_pulse_events.3.t: "A Suspicious Death..."
 qajar_pulse_events.3.d: "A powerful person was found in a ditch outside the walls being eaten by dogs, some say he supported the Qajar's, others say he supported the current regime..."
 qajar_pulse_events.3.f: ""The fellow was being eaten by the stray dogs!"\n\n"Really? I swear I had heard him last night drukenly talking about how the realm is weak since Kham Karim's death!"\n\n" No! He was talking about how the Qajar's were the problem! That we just need to give the young Zand heir some time!"\n\n"Are you boys mad’ A scorned lover, his son wanted his inheritance, it could be anything!"\n\n\"It is...strange,\" said the nearby tradesmen, cautiously testing each word. \"The way his body was just left there, for the stray dogs, it just seems so much like a warning...\""
 
 qajar_pulse_events.3.a: "Cleary the man just got too drunk and fell into the ditch!"
 qajar_pulse_events.3.b: "Don't worry people, we will get to the bottom of this."
 
 qajar_pulse_events.4.t: "The Killer!"
 qajar_pulse_events.4.d: "Who killed the young noblemen? Was it drinking or something darker?"
 qajar_pulse_events.4.f: "By the orders of the Shah, of the Guarded Domains of Iran, our thorough investigation has revealed the killer to be..."
 
 qajar_pulse_events.4.a: "...By rogue supporters of the Shahs regime"
 qajar_pulse_events.4.b: "...Natural causes"
 
 coup_advance_20_tt: "#Coup Advances Hugely...#"
 
 qajar_pulse_events.5.t: "Devout Come To You..."
 qajar_pulse_events.5.d: "The Devout can offer help to garner support for your Family"
 qajar_pulse_events.5.f: ""We hold the hearts and minds of the people, if Allah guides you correctly, you'd use us correctly in giving us more say in the government, then we're with you""
 
 qajar_pulse_events.5.a: "Of course!"
 qajar_pulse_events.5.b: "Corruption?! You think I'd tolerate this?"
 qajar_pulse_events.5.c: "Politely décline"
 
 coup_retreat_20_tt: "#Coup Retreats By 20#"
 
  # Don't worry if there's any missing numbers
 
 qajar_pulse_events.7.t: "Successful Raid"
 qajar_pulse_events.7.d: "Our men were overran and were forced to route, the rebels gain ground"
 qajar_pulse_events.7.f: "They say they didn't expect it, weren't able to get the correct formation, but what good is the excuses at this point? I've heard enough."
 qajar_pulse_events.7.a: "Damnit!"
 
 qajar_pulse_events.8.t: "Unsuccèssful Raid"
 qajar_pulse_events.8.d: "Our men chased them into the mountains!"
 qajar_pulse_events.8.f: "The arrogant enemy lined up, they are said to have fought like Lions, but led by donkeys. While our side were Lions led by Lions! In a fell swoop they were surrounded and forced to flee to live another day."
 
 victory_mod: "Bataille victorieuse"
 
 qajar_pulse_events.9.t: "Supply Convoy Attacked"
 qajar_pulse_events.9.d: "An ambush on our supply routes hurts our campaign"
 qajar_pulse_events.9.f: "This type of warfare can hurt the enemy without taking much damage to themselves, as they can just run off into the wilderness, we do not have that luxury."
 
 iran_conclusion.1.t: "The True Heir"
 iran_conclusion.1.d: "Squables within the Zand dynasty has the uncles supporting différent young Zands as the true heir"
 iran_conclusion.1.f: "Luckily for the pretenders to the throne of Iran, the Zand dynasty is completely split, the young sons of Karim Khan are again being used as as chess pieces in this power struggle!"
 
 iran_conclusion.1.a: "What can be done?"
 
 modifier_squables_for_power_mod: "Further Seperation in the Zand Dynasty"
 
 modifier_young_heirs_zand_mod: "Young Zand Heirs Pitted Against Eachother"
 
 battle_begins_tt_mod: "#The Battle Begins...#"
 
 qajar_pulse_events.10.t: "Power Strugle in the Zand Dynasty"
 qajar_pulse_events.10.d: "The Uncles of the Heirs have pitted the heirs against eachother in a power struggle"
 qajar_pulse_events.10.f: "As soon as Karim Khan died the ruling class got power suspicious and now it's a scramble for Iran, this instability can ruin the young Zand Royal Family from within"
 
 qajar_pulse_events.10.a: "Interesting"
 
 iran_conclusion.2.t: "A Secured Dynasty"
 iran_conclusion.2.d: "The Power Struggle Has Ended, With The Zand Dynasty On Top"
 iran_conclusion.2.f: ""May we rule 100 years!"\n\n"No, 200!"\n\n"Fools! 1000"\n\n"Hahaha!""
 
 iran_conclusion.2.a: "Our liege deserves the credit"
 iran_conclusion.2.b: "Our legitimacy is now paramount"
 
 iran_conclusion.3.t: "A New Iran"
 iran_conclusion.3.d: "The Power Struggle Has Ended, With The Qajar Dynasty On Top"
 iran_conclusion.3.f: ""We have won, gentlemen. But. Our struggle has not ended, the Qajar Dynasty must focus on Modernizing Iran"\n\n"Under your leadership, my liege, we can do anything. May we rule 100 years!"\n\n"No, 200!"\n\n"Fools! 1000"\n\n"Hahaha!""
 
 iran_conclusion.3.a: "We will first focus on construction of the Railway system"
 iran_conclusion.3.b: "Reforms on éducation is paramount"
 
