 je_plc_reform_reason: "Notre système de nobles puissants nous a menés à une anarchie qui doit compter sur la bonne volonté de nos voisins, surtout la Russie, pour survivre. La République ne peut durer ainsi ; il faut la réformer de fond en comble."

 zand: "Zand"
 Agha_Mohammed: "Agha Mohammed"

 je_deputy_of_the_people: "Vakil al-Raaya"
 je_deputy_of_the_people_reason: "La Perse a retrouvé la stabilité après quarante ans de guerre grâce a Karim Khan Zand, qui se presentait comme Vakil al-Raaya, le délégué du peuple."
 je_deputy_of_the_people_lobby: "#v Débloqué par le mod : 1776 - Age of Revolutions#!\nLa Perse a retrouvé la stabilité après quarante ans de guerre grâce à Karim Khan Zand, qui se présente comme Vakil al-Ra‘aya, le Délégué du peuple. Mais la légitimité du royaume repose sur sa grandeur : cette nouvelle famille royale pourra-t-elle vraiment durer ?"

 khan_karim_dies: "Karim Khan meurt"
 qajar_ascends: "La tribu qajare monte sur le trône"

 je_qajar_coup_progress_bar: "Stabilite de l’Iran"
 je_qajar_coup_progress_bar_desc: "Nous devons apaiser le pays et ramenér la stabilité, ou la dynastie zand sera renversee !"

 appeased_mod_igs_tt: "Groupes d’intérêt apaisés"
 qajar_coup_army_sumport_strength_tt: "Generaux soutenant la tribu qajare"


 qajar_pulse_events.2.t: "Propriétaires inquiets"
 qajar_pulse_events.2.d: "Un royaume instable met les biens en péril ; si le shah ne peut ramener la paix, à quoi sert le shah ?"
 qajar_pulse_events.2.f: "S’ils prennent le pouvoir, ils saisiront peut-être nos terres pour les donner à leurs parents et à leurs fidèles, en récompense de leur soutien au régime. Allah le sait, les paysans seraient tout aussi heureux de se débarrasser de moi ; je les vois plus joyeux que jamais au travail, et je les entends chuchoter quand je passe. Mes jours sont comptés..."

 qajar_pulse_events.2.a: "Consacrer davantage de ressources à la stabilisation du royaume"
 qajar_pulse_events.2.b: "Traitez mieux vos paysans"

 qajar_pulse_events.3.t: "Une mort suspecte..."
 qajar_pulse_events.3.d: "Un homme puissant a été trouvé dans un fossé hors des murs, dévoré par les chiens. Certains disent qu’il soutenait les Qajars, d’autres le régime actuel..."
 qajar_pulse_events.3.f: "Le pauvre homme était dévoré par les chiens errants !\n\nVraiment ? Je jurerais l’avoir entendu hier soir, ivre, parler de la faiblesse du royaume depuis la mort de Khan Karim !\n\nNon ! Il disait que les Qajars étaient le problème, et qu’il suffisait de laisser un peu de temps au jeune héritier zand !\n\nVous êtes fous ? Un amant éconduit, un fils impatient d’hériter, cela pourrait être n’importe quoi !\n\nC’est... étrange, dit le marchand voisin en pesant chaque mot. La manière dont son corps a été laissé là, aux chiens errants, ressemble tellement à un avertissement..."

 qajar_pulse_events.3.a: "Il est clair que cet homme a simplement trop bu et qu’il est tombé dans le fossé !"
 qajar_pulse_events.3.b: "Ne vous inquiétez pas, nous tirerons cette affaire au clair."

 qajar_pulse_events.4.t: "Le meurtrier !"
 qajar_pulse_events.4.d: "Qui a tué le jeune noble ? L’ivresse, ou quelque chose de plus sombre ?"
 qajar_pulse_events.4.f: "Par ordre du shah des domaines gardés d’Iran, notre enquête approfondie a révélé que le meurtrier est..."

 qajar_pulse_events.4.a: "...des partisans incontrôlés du régime du shah"
 qajar_pulse_events.4.b: "...des causes naturelles"

 coup_advance_20_tt: "#Le coup progresse fortement...#"

 qajar_pulse_events.5.t: "Les dévots viennent à vous..."
 qajar_pulse_events.5.d: "Les dévots peuvent aider à rassembler du soutien pour votre famille."
 qajar_pulse_events.5.f: "Nous tenons les cœurs et les esprits du peuple. Si Allah vous guide justement, vous nous utiliserez justement en nous donnant davantage voix au gouvernement ; alors nous serons avec vous."

 qajar_pulse_events.5.a: "Bien entendu !"
 qajar_pulse_events.5.b: "De la corruption ?! Vous pensez que je tolérerais cela ?"
 qajar_pulse_events.5.c: "Politely décline"

 coup_retreat_20_tt: "#Le coup recule de 20#"

  # Don't worry if there's any missing numbers

 qajar_pulse_events.7.t: "Raid réussi"
 qajar_pulse_events.7.d: "Nos hommes ont été submergés et contraints à la déroute ; les rebelles gagnent du terrain."
 qajar_pulse_events.7.f: "On dit qu’ils ne s’y attendaient pas et qu’ils n’ont pas pu adopter la bonne formation. Mais à quoi servent encore ces excuses ? J’en ai assez entendu."
 qajar_pulse_events.7.a: "Maudit soit-il !"

 qajar_pulse_events.8.t: "Unsuccèssful Raid"
 qajar_pulse_events.8.d: "Nos hommes les ont poursuivis jusque dans les montagnes !"
 qajar_pulse_events.8.f: "L’ennemi arrogant s’est rangé en bataille ; on dit qu’ils combattaient comme des lions menés par des ânes. Les nôtres, eux, étaient des lions menés par des lions ! D’un seul mouvement, ils furent encerclés et contraints de fuir pour vivre un jour de plus."

 victory_mod: "Bataille victorieuse"

 qajar_pulse_events.9.t: "Convoi de ravitaillement attaqué"
 qajar_pulse_events.9.d: "Une embuscade contre nos routes de ravitaillement nuit à notre campagne."
 qajar_pulse_events.9.f: "Ce type de guerre peut nuire à l’ennemi sans exposer ses auteurs à de lourdes pertes, puisqu’ils peuvent simplement disparaître dans les terres sauvages. Nous n’avons pas ce luxe."

 iran_conclusion.1.t: "Le véritable héritier"
 iran_conclusion.1.d: "Les querelles au sein de la dynastie Zand voient les oncles soutenir différents jeunes Zand comme véritable héritier."
 iran_conclusion.1.f: "Par chance pour les prétendants au trône d’Iran, la dynastie Zand est complètement divisée ; les jeunes fils de Karim Khan servent une fois encore de pions dans cette lutte de pouvoir !"

 iran_conclusion.1.a: "Que peut-on faire ?"

 modifier_squables_for_power_mod: "Nouvelles divisions dans la dynastie Zand"

 modifier_young_heirs_zand_mod: "Jeunes héritiers zand dressés les uns contre les autres"

 battle_begins_tt_mod: "#La bataille commence...#"

 qajar_pulse_events.10.t: "Lutte de pouvoir dans la dynastie Zand"
 qajar_pulse_events.10.d: "Les oncles des héritiers ont dressé ceux-ci les uns contre les autres dans une lutte de pouvoir."
 qajar_pulse_events.10.f: "Dès la mort de Karim Khan, la classe dirigeante s’est méfiée de tout pouvoir, et voilà l’Iran livré à la ruée. Cette instabilité peut ruiner de l’intérieur la jeune famille royale zand."

 qajar_pulse_events.10.a: "Intéressant"

 iran_conclusion.2.t: "Une dynastie assurée"
 iran_conclusion.2.d: "La lutte de pouvoir est terminée, et la dynastie Zand l’emporte."
 iran_conclusion.2.f: "Puissions-nous régner cent ans !\n\nNon, deux cents !\n\nFous ! Mille !\n\nHahaha !"

 iran_conclusion.2.a: "Notre suzerain mérite le crédit de cette victoire."
 iran_conclusion.2.b: "Notre légitimité est désormais primordiale."

 iran_conclusion.3.t: "Un nouvel Iran"
 iran_conclusion.3.d: "La lutte de pouvoir est terminée, et la dynastie qajare l’emporte."
 iran_conclusion.3.f: "Nous avons gagné, messieurs. Mais notre lutte n’est pas terminée : la dynastie qajare doit se consacrer à la modernisation de l’Iran.\n\nSous votre conduite, mon suzerain, nous pouvons tout accomplir. Puissions-nous régner cent ans !\n\nNon, deux cents !\n\nFous ! Mille !\n\nHahaha !"

 iran_conclusion.3.a: "Nous nous concentrerons d’abord sur la construction du réseau ferroviaire."
 iran_conclusion.3.b: "Reforms on éducation is paramount"

