 plc_reform_modevents.1.t: "Réformer le gouvernement"
 plc_reform_modevents.1.d: "Une fois la nation réformée, les [SCOPE.gsInterestGroup('pole_landowners').GetName] ne pourront plus se livrer impunément à leur despotisme."
 plc_reform_modevents.1.f: "Le peuple demande une bonne gouvernance ; devenir fort, c’est pouvoir résister aux avancées de nos voisins. Une [ROOT.GetCountry.GetName] forte suppose de mettre fin aux privilèges des [SCOPE.gsInterestGroup('pole_landowners').GetName], dont ils savent parfaitement avoir abusé.\n\nLa question est maintenant de savoir quel système de gouvernement le remplacera."

 plc_reform_modevents.1.a: "Seule une monarchie autocratique peut contenir les propriétaires fonciers."
 plc_reform_modevents.1.b: "Faire entrer des [SCOPE.gsInterestGroup('pole_landowners').GetName] réformés au gouvernement."
 plc_reform_modevents.1.c: "Une théocratie religieuse nous rassemblera tous."

 plc_reform_modevents.2.t: "Les industriels offrent leur aide"
 plc_reform_modevents.2.d: "Les chemins de fer sont les veines du capitalisme : des investissements de long terme qui rapportent massivement."
 plc_reform_modevents.2.f: "Nous admirons vos efforts pour moderniser l’État ; nous vous offrons une part de notre main-d’œuvre et de notre expertise sur cette question."

 plc_reform_modevents.2.b: "Il serait stupide de refuser..."

 plc_reform_modevents.3.t: "Les ruraux mécontents de la modernisation"
 plc_reform_modevents.3.d: "Le mode de vie traditionnel est bouleversé par le changement, et beaucoup n’en voient pas encore les avantages."
 plc_reform_modevents.3.f: "Cette maudite voie ferrée traverse mes terres !\n\nIls disaient que l’industrie nous permettrait de gagner un revenu supplémentaire en ville pendant la morte-saison, mais c’est comme si vous nous arrachiez à notre mode de vie...\n\n"

 plc_reform_modevents.3.a: "Offrir des subventions agricoles"
 plc_reform_modevents.3.b: "Votre mode de vie est arriéré et détestable."

