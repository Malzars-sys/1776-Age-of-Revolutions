 florida.2.t: "Sale of Florida"
 florida.2.f: "With Florida, we can begin to shape the Americas in our own image, the values of Freedom and Democracy, rather than resources flowing to the métropole."
 florida.2.d: "A blessing for our Continental Security!"
 
