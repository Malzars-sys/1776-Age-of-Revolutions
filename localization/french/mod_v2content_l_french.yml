 plc_reform_modevents.1.t: "Reforming the Government"
 plc_reform_modevents.1.d: "With a reformed nation the [SCOPE.gsInterestGroup('pole_landowners').GetName] can no longer get away with it's despotism"
 plc_reform_modevents.1.f: "The people ask for good governance, to become strong is to be able to resist our neighbours advances. A strong [ROOT.GetCountry.GetName] means getting rid of the [SCOPE.gsInterestGroup('pole_landowners').GetName] privileges, which they know full well they've abused.\n\nThe question is now, what system of governance replaces it?"
 
 plc_reform_modevents.1.a: "Only a Autocratic Monarchy can hold back the Landowners"
 plc_reform_modevents.1.b: "Bring a reformed [SCOPE.gsInterestGroup('pole_landowners').GetName] into government"
 plc_reform_modevents.1.c: "A Religious Theocracy will bring us all together"
 
 plc_reform_modevents.2.t: "Industrialists Offer Help"
 plc_reform_modevents.2.d: "Railways are the veins of capitalism, long term investments that pay off massively"
 plc_reform_modevents.2.f: ""We admire your efforts on modernising the state, we offer you part of our workforce and expertise on this issue""
 
 plc_reform_modevents.2.b: "I'd be dumb not to take that..."
 
 plc_reform_modevents.3.t: "Rural Folk Unhappy With Modernisation"
 plc_reform_modevents.3.d: "The traditional way of life is being interrupted by change and a lot don't see the benefits of it yet"
 plc_reform_modevents.3.f: ""That damn railway goes through my land!"\n\n"They said industry would mean we could go earn extra pay on the off season in the cities, but it's like you're forcing us out our way of life like..."\n\n"
 
 plc_reform_modevents.3.a: "Offer farming subsidies"
 plc_reform_modevents.3.b: "Your way of life is backwards and awful"
 
