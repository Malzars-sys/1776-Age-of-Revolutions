 je_deputy_of_the_people_lobby: "#v Unlocked by Mod: 1776 - Age of Revolutions#!\nPersia has been brought stability after 40 years of war by Karim Khan Zand, who styles himself as 'Vakil al-Ra‘aya' or 'Deputy of the People', but the legitimacy of the realm revovles around his Greatness, can this new Royal Family truly last?"
 
