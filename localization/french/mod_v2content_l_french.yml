 je_usa_independence_fra: "American Révolution"
 je_usa_independence_fra_reason: "France has put it's military and financial weight behind the American Patriots against Britain, but if the Americans lose or fail to pay back the loans France will surely enter a financial crisis."
 je_usa_independence_fra_lobby: "#v Unlocked by Mod: 1776 - Age of Revolutions#!\nFrance has put it's military and financial weight behind the American Patriots against Britain, but if the Americans lose or fail to pay back the loans then France will surely enter a financial crisis."
 
 french_revolution_mod_events.1.t: "American Révolution Failed"
 french_revolution_mod_events.1.d: "The word has been sent to the Patriots, France can't help any longer"
 french_revolution_mod_events.1.f: ""A question, how in the hell do we get our money back?"\n"Well, The Estates would be happy to help!"\n"Oh, Monsieur, the naïveté...""
 
 french_revolution_mod_events.1.a: "Summon the Estates"
 
 je_fr_rev_summon_estates: "Summon The Estates (Beta)"
 je_fr_rev_summon_estates_reason: "The First Estate [SCOPE.gsInterestGroup('clergy_fra_scope').GetName] and Second Estate [SCOPE.gsInterestGroup('second_estate_fra_scope').GetName] have many privileges and the most wealth but pay almost no taxes, which is put on the Third Estate [SCOPE.gsInterestGroup('third_estate_fra_scope').GetName] who make up the majority. This unequal system can't survive a crisis like this one now, it's time for reform.\n\nPass Liberal Laws to improve Reform Progress"
 je_fr_rev_summon_estates_lobby: "#v Unlocked by Mod: 1776 - Age of Revolutions#!\nFrance is in a fiscal crisis after years of wars and unpaid loans by the United States of America, it requires the help of the First (Clergy), Second (Landowners) and Third Estates (Commoners) to alleviate it's funding problem, will they be succèssful’"
 
 french_revolution_mod_events.2.t: "American Révolution: Paying Debts"
 french_revolution_mod_events.2.d: "The French gave us much financial help through our struggle, but now they want payment"
 french_revolution_mod_events.2.f: "Our young nation may be too burdened financially to pay back these loans, we might have to just snuff them, then forget Europe all together, to be honest..."
 
 french_revolution_mod_events.2.a: "We simply aren't paying"
 french_revolution_mod_events.2.b: "To not pay back these loans would be a crime"
 
