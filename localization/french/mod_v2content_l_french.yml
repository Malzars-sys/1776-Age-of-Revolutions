 je_sale_of_florida_mod: "Vente de la Floride"
 je_sale_of_florida_mod_reason: "La Floride, beaucoup ont tenté de l’apprivoiser. La perspective des grandes richesses de l’Amérique du Nord a attiré de nombreux colons et capitalistes, mais ce n’est qu’un marécage infesté de moustiques dont l’entretien coûte cher. Les conseillers disent qu’il vaudrait mieux la vendre plutôt que de gaspiller nos efforts, même pour la défendre."

