 florida.1.t: "Une offre pour la Floride"
 florida.1.d: "Enfin, une bénédiction pour nos coffres !"
 florida.1.f_spa: "Ils disent en avoir besoin pour leur... sécurité continentale ? Bah, nous en avons besoin pour notre sécurité financière ! Nous possédons un empire mondial, et même nous ne serions pas assez arrogants pour prétendre avoir besoin de ce terrain perdu.\n\nFaites-les payer."
 florida.1.f: "Ils disent en avoir besoin pour leur... sécurité continentale ? Bah, nous en avons besoin pour notre sécurité financière ! Héhé."

 florida.1.a: "Accepter l’offre"
 florida.1.b: "Refuser l’offre"

 # Wrong, this was meant to be for the buyer
 florida.2.t: "Vente de la Floride"
 florida.2.f: "Avec la Floride, nous pouvons commencer à façonner les Amériques à notre image, selon les valeurs de liberté et de démocratie, plutôt que de laisser les ressources affluer vers la métropole."
 florida.2.d: "Une bénédiction pour notre sécurité continentale !"

 florida.2.a: "Accepter le prix"

 florida_spa_big_money: "Vente de la Floride"
 florida_usa_big_money: "Achat de la Floride"

 florida.3.t: "Échec de l’achat de la Floride"
 florida.3.d: "Eh bien, que je sois maudit..."
 florida.3.f: "Bon, il est temps d’écrire la lettre disant que j’ai reçu leur réponse. Je suis si furieux que j’allais leur faire savoir que nous l’obtiendrons par la manière douce ou par la manière forte. Patience, toutefois, patience..."

 florida.3.a: "NOUS L’OBTIENDRONS PAR LA FORCE"
 florida.3.b: "Mon ami, je comprends ; peut-être voulez-vous des vacances dans les marais de temps à autre ?"

 florida.4.t: "Faire une offre pour la Floride..."
 florida.4.d: "Ce sera peut-être difficile ; ils se demanderont sûrement pourquoi nous voulons cette maudite terre..."
 florida.4.f: "...peut-être y trouve-t-on des haricots magiques, et les moustiques seraient des gardiens enchantés chargés de vous chasser. Voilà ce qu’ils penseront en voyant combien nous sommes prêts à payer, j’en fais le serment !"

 florida.4.a: "Offrir 3 millions sur un an"

 florida.4.c: "Peut-être une autre fois"

