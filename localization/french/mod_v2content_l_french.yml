 je_plc_reform_industry: "Réforme : industrialisation"
 je_plc_reform_industry_reason: "Le temps où le pays comptant le plus de serfs était le plus fort est révolu. Désormais, la force vient de l’industrie. Qui possède l’industrie possède la richesse, et qui possède la plus grande industrie gagnera la guerre. Pour redevenir une grande puissance, nous devons concentrer nos efforts sur cet objectif."

 je_plc_reform_trade: "Réforme : commerce"
 je_plc_reform_trade_reason: "[ROOT.GetCountry.GetName] a pris du retard dans le commerce international, malgré de grandes richesses en ressources. Nous devons changer cela : vendre d’abord nos produits agricoles, puis notre fer, notre acier et nos textiles."

 je_plc_reform_military: "Réforme : armée"
 je_plc_reform_military_reason: ""

 je_plc_reform_education: "Reform: éducation"
 je_plc_reform_education_reason: "Une population instruite et hautement qualifiée obtient des emplois mieux payés ; une forte innovation nous permet de devancer nos rivaux. Pour montrer notre sérieux, il nous faut créer une grande université, et notre peuple saura que nous voulons vraiment changer."

 je_plc_reform_railways: "Réforme : chemins de fer"
 je_plc_reform_railways_reason: "Si la capitale est le cœur de la nation, les chemins de fer font circuler son sang et répandent la richesse partout."

 je_plc_reform_farming: "Réforme : agriculture"
 je_plc_reform_farming_reason: "Le travail manuel des serfs pour une subsistance misérable est arriéré. Des méthodes agricoles industrialisées élèveront le niveau de vie et nourriront nos populations urbaines croissantes."

 je_plc_reform_great_power: "Réforme : la Pologne peut-elle redevenir une grande puissance ?"
 je_plc_reform_great_power_reason: "La Pologne a longtemps été écartée de la table des négociations et utilisée comme marionnette par ses voisins. En cette ère d’expansion outre-mer rapide, il est temps de retrouver ce statut et d’obtenir enfin un siège à la table."

