 je_plc_reform_industry: "Reform: Industrialise"
 je_plc_reform_industry_reason: "The days of a country with the most serfs being the strongest is long gone, now the strength comes from industry. Whomever has the industry has the wealth and whomever has the most industry will win the war. To truly become a Great Power once more we must pull our efforts to this."
 
 je_plc_reform_trade: "Reform: Trade"
 je_plc_reform_trade_reason: "The [ROOT.GetCountry.GetName] has fallen behind when it comes to international trade, despite being very resource rich. We must change that, we can first sell our agriculture, then our iron, then our steel and textiles."
 
 je_plc_reform_military: "Reform: Military"
 je_plc_reform_military_reason: ""
 
 je_plc_reform_education: "Reform: éducation"
 je_plc_reform_education_reason: "An educated and highly skilled populace leads to high paying jobs, high innovation means we can pull ahead of our rivals. The only way to show we're serious is creating a Great University and our people will know we're serious about changing."
 
 je_plc_reform_railways: "Reform: Railways"
 je_plc_reform_railways_reason: "If the Capital is the heart of the nation, the Railways circulate the blood around it, bringing wealth throughout."
 
 je_plc_reform_farming: "Reform: Farming"
 je_plc_reform_farming_reason: "Serfs working by hand for substinence is backwards, industrialised farming methods will raise standards of living and feed our growing Urban Populations."
 
 je_plc_reform_great_power: "Reform: Poland Can Into Great Power?"
 je_plc_reform_great_power_reason: "Poland has long been shunned at the negotiation table and used as a puppet by it's neighbours, especially in this era of rapid overseas expansion it's time to gain back that status and finally have a seat at the table."
 
