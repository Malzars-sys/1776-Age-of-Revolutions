 amendment_1776_prussian_military_austerity:0 "Rigueur budgétaire militaire"
 amendment_1776_prussian_military_austerity_desc:0 "Les achats de fournitures et la solde des troupes sont soumis à une stricte discipline budgétaire. Les études, les essais d’armement et les travaux sur les nouvelles doctrines reçoivent moins de moyens, ce qui ralentit les innovations militaires."
