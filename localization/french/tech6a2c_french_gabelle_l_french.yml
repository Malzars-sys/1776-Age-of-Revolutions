l_french:
  je_gabelle: "La Gabelle"
  je_gabelle_reason: "La gabelle est un ancien impôt français sur le sel. Elle procure à la Couronne des revenus réguliers, mais l'inégalité de sa perception et le poids qu'elle fait peser sur les ménages ordinaires la rendent profondément impopulaire."
  je_gabelle_complete_header: "À propos de cette [concept_journal_entry|l] :\n"
  je_gabelle_desc: "Tant que [ROOT.GetCountry.GetName] impose une [concept_consumption_tax|l] sur le @salt! #b $salt$#!, la gabelle et ses effets restent actifs. La suppression de la taxe met fin à cette phase ; son rétablissement rend de nouveau la phase appropriée disponible lors du prochain contrôle administratif."
  je_gabelle_reform_goal: "La gabelle a été réformée"
  je_gabelle_reformed: "La Gabelle réformée"
  je_gabelle_reformed_reason: "La taxe sur le sel a été réformée afin d'alléger le fardeau des ménages ordinaires tout en conservant une partie de son rendement fiscal."
  je_gabelle_reformed_desc: "La gabelle réformée reste en vigueur tant que [ROOT.GetCountry.GetName] impose une [concept_consumption_tax|l] sur le @salt! #b $salt$#!. Après une suppression, son rétablissement rend de nouveau cette phase disponible lors du prochain contrôle administratif."
  je_gabelle_suspended: "La Gabelle suspendue"
  je_gabelle_suspended_reason: "Ancienne phase transitoire en cours de fermeture."
  je_gabelle_suspended_desc: "Cette phase technique disparaît dès que la France taxe de nouveau le @salt! #b $salt$#!. Le contrôleur mensuel restaure séparément la Gabelle active."
  je_gabelle_restore_header: "Rétablissement de la gabelle :\n"
  je_gabelle_restore_goal: "La France taxe de nouveau le Sel"

  gabelle_income:0 "Gabelle"
  gabelle_income_reformed:0 "Gabelle réformée"
  gabelle_income_active:0 "Gabelle"
  gabelle_income_reformed_active:0 "Gabelle réformée"
  modifier_suppress_dissent:0 "Réprimer la dissidence"

  lagab_france.1.t: "Crise de légitimité"
  lagab_france.1.d: "La taxe sur le sel est devenue un point de ralliement contre le gouvernement au cours de la crise révolutionnaire."
  lagab_france.1.f: "Des protestations éclatent à travers le pays : la population dénonce la gabelle et l'inégalité de ses charges. Le gouvernement subit une pression croissante pour rétablir l'ordre ou abandonner l'impôt."
  lagab_france.1.a: "Maintenir l'ordre à tout prix."
  lagab_france.1.b: "Faire quelques promesses sans lendemain."
  lagab_france.1.c: "Abolir la gabelle."

  lagab_france.2.t: "Voix de réforme"
  lagab_france.2.d: "[SCOPE.sPoliticalMovement('political_movement_scope').GetName] réclame une réforme de la gabelle."
  lagab_france.2.f: "Les membres de [SCOPE.sPoliticalMovement('political_movement_scope').GetName] dénoncent publiquement une taxe sur le sel injuste et excessivement lourde. Ils réclament un système qui protège les ménages ordinaires sans priver l'État de toutes ses recettes."
  lagab_france.2.a: "Négocier une gabelle plus équitable."
  lagab_france.2.b: "Les réprimer."
