l_french:
 combat_unit_group_aor1776_engineers:0 "Génie"
 combat_unit_group_aor1776_engineers_desc:0 "Sapeurs et officiers spécialisés dans les travaux de siège et l’ouverture des voies d’assaut."
 combat_unit_type_aor1776_engineer_corps:0 "Corps du génie"
 combat_unit_type_aor1776_engineer_corps_desc:0 "Sapeurs instruits pour creuser les approches, ouvrir des brèches et franchir les ouvrages ennemis. Ils accompagnent l’infanterie avec les outils nécessaires aux travaux de siège.\n\nLes réductions affichées concernent les bonus des fortifications terrestres adverses dans la bataille à laquelle ces sapeurs participent."
 unit_aor1776_enemy_fort_territorial_protection_add:0 "Protection du terrain des forts adverses"
 unit_aor1776_enemy_fort_territorial_protection_add_desc:0 "$aor1776_engineer_fort_reduction_desc$"
 unit_aor1776_enemy_fort_casualty_protection_add:0 "Protection contre les pertes des forts adverses"
 unit_aor1776_enemy_fort_casualty_protection_add_desc:0 "$aor1776_engineer_fort_reduction_desc$"
 unit_aor1776_enemy_fort_defense_add:0 "Bonus de défense des forts adverses"
 unit_aor1776_enemy_fort_defense_add_desc:0 "$aor1776_engineer_fort_reduction_desc$"
 aor1776_engineer_fort_reduction_desc:0 "Chaque bataillon de 1 000 hommes engagé dans la bataille retire un point de pourcentage à cette protection. Il faut 25, 50 ou 75 bataillons pour neutraliser cinq niveaux à garnison complète, selon la méthode de fortification. L’effet dépend des hommes présents et ne dépasse pas le bonus du fort."
