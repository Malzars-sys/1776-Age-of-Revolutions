l_french:
 haiti_independence.1.t: "Par courage et par hasard"
 haiti_independence1.d: "Haiti a obtenu sa liberté"
 haiti_independence.1.f: "L’espoir est un verbe haïtien. Ce n’est pas une chose que nous attendons ; c’est une chose que nous créons. Nous avons libéré les esclaves ; il nous faut maintenant décider comment nous gouverner nous-mêmes, sans rester liés à l’ancien ordre."
 haiti_independence.1.a: "Declarer l’Empire d’Haiti"
 
 haiti_independence.1.b: "Aspirer a des ideaux republicains"
 
 irish_question.1.t: "Repondre a la question irlandaise"
 irish_question.1.d: "L’Irlande a fait entendre sa voix ; il est temps de changer les choses"
 irish_question.1.f: "Le Parlement débat vivement de cette question accablante. L’union personnelle sous le Parlement irlandais n’est pas idéale, et chacun le voit bien : devons-nous adopter des Actes d’Union pour l’intégrer à la Grande-Bretagne, ou lui accorder une pleine autonomie ?"
 irish_question.1.a: "Adopter les Actes d’Union"
 irish_question.1.b: "Accorder l’autonomie a l’Irlande"
 
 je_venetian_empire: "Retrouver l’Empire venitien"
 venetian_empire.1.t: "Retrouver notre domination"
 venetian_empire.1.d: "La classe marchande de la Serenissime République de Venise a une idee"
 venetian_empire.1.f: "En perdant notre empire d’outre-mer, nous avons perdu notre domination commerciale, principalement au profit des Turcs. Bien entendu, des Turcs. Alors que de nouveaux sentiments nationalistes montent à Venise, nous pourrions attiser ces flammes pour restaurer notre empire, et peut-être en acquérir de nouveaux en Afrique. Il nous faudra sans doute l’aide d’une grande puissance et des alliances soigneusement équilibrées."
 
 venetian_empire.1.a: "Nous frapperons bientot !"
 
 venetian_empire.2.t: "L’Empire est de retour !"
 venetian_empire.2.d: "Les marchands se rejouissent dans la Serenissime République de Venise"
 venetian_empire.2.f: "La marine vénitienne règne sur la Méditerranée : pour traverser notre arrière-cour, il faut désormais parler à un marchand vénitien. L’Afrique sera sûrement la prochaine étape de notre domination. Pour l’heure, nous devons intégrer ces terres à Venise et imposer efficacement nos sujets."

 venetian_empire.2.a: "Nous avons gagne"

 
 irish_nationalism.1.t: "Agitation en Irlande"
 irish_nationalism.1.d: "Raids contre les armureries, clôtures abattues, attaques contre les propriétaires..."
 irish_nationalism.1.f: "Ils exigent moins d’impôts, davantage de représentation ; quelle sera la suite ? L’indépendance complète ? Nous ne pouvons pas l’accepter... n’est-ce pas ?"
 
 irish_nationalism.1.a: "Il est temps de serrer la vis"
 irish_nationalism.1.b: "Ne pas intervenir, les laisser s epuiser"
 
 irish_nationalism.2.t: "Arrivee de colons en Ulster"
 irish_nationalism.2.d: "De nouvelles plantations sont établies, de nouvelles villes apparaissent le long des rivières et des routes, et l’économie d’Ulster prospère grâce au projet."
 irish_nationalism.2.f: "L’arrivée de nouvelles communautés promet prospérité et innovation, mais elle porte aussi le risque de frictions pendant des générations autour de la terre et de la foi. Reste à savoir jusqu’où nous voulons encourager ce projet."
 
 irish_nationalism.2.a: "Encourager l’installation avec des privileges"
 irish_nationalism.2.b: "Laisser les choses suivre leur cours"
 
 
 
