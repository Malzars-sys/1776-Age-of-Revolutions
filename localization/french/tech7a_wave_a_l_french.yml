 bg_land_transport_network:0 "Réseau de transport terrestre"
 building_land_transport_network:0 "Réseau de transport terrestre"
 building_land_transport_network_lens_option:0 "Développer $building_land_transport_network$"
 building_land_transport_network_desc:0 "Un réseau entretenu par l'État pouvant accueillir les routes puis, au fil de son développement, les canaux et les voies ferrées."
 pmg_base_building_land_transport_network:0 "Réseau de transport"
 pmg_base_building_land_transport_network_desc:0 "Le principal système de transport entretenu par ce réseau."
 pm_traditional_road_network:0 "Routes en terre"
 pm_traditional_road_network_desc:0 "Un réseau de routes en terre entretenu localement et exigeant en main-d'œuvre fournit une infrastructure limitée mais fiable."
 pm_turnpike_road_network:0 "Routes à péage"
 pm_turnpike_road_network_desc:0 "Les péages et l'entretien régulier rendent les axes principaux plus fiables sans remplacer les futurs systèmes de transport."
 pm_engineered_road_network:0 "Routes pavées"
 pm_engineered_road_network_desc:0 "Les chaussées nivelées, le drainage et la pierre concassée assurent des liaisons terrestres fiables."
 pm_paved_road_network:0 "Routes goudronnées"
 pm_paved_road_network_desc:0 "Des revêtements durables et des liants modernes accroissent la capacité d'un réseau routier déjà développé."
