 je_irish_question: "La question irlandaise"
 je_irish_question_reason: "Depuis la Révolution américaine, les ideaux de nationalisme et de republicanisme se sont repandus dans tout l’Empire britannique. Une solution a la question irlandaise doit être trouvee avant qu il ne soit trop tard."

 je_usa_independence: "Révolution américaine"
 je_usa_independence_reason: "Nous nous sommes déclarés indépendants de la Grande-Bretagne, dont la tyrannie limite notre consommation, contrôle ce que nous produisons et meme ou nous pouvons coloniser. Nous nous battrons jusqu au bout !"


 je_venetian_empire_reason: "Après cette longue période de déclin, nos nationalistes réclament le changement afin de retrouver notre domination et nos territoires d’outre-mer, par l’acier s’il le faut."

 je_polish_partitions: "Partage de la Pologne"
 je_polish_partitions_reason: "Nos ennemis affirment que la République des Deux Nations est une anarchie faible et divisee. Ils veulent la partager entre eux pour préserver la paix."

 je_polish_partitions_button: "Imposer le partage"
 je_polish_partitions_button_desc: "Nous partagerons la Pologne"

 je_polish_no_partitions_button: "Pas de partage"
 je_polish_no_partitions_button_desc: "Nous n y participerons pas"

 polish_partitions.1.t: "Un ultimatum !"
 polish_partitions.1.d: "Partage de la Pologne"
 polish_partitions.1.f: "Des délégations de nos voisins sont arrivées, chacune inflexible. Les villes, d’abord réduites au silence, ont laissé l’ironie se changer en fureur, avant que le ton diplomatique ne reprenne et que l’on manque presque d’en venir aux mains. Ils peuvent bien prétendre que tout cela préservera la paix ; ils ne voulaient que découper un voisin comme un gâteau d’anniversaire. Les nobles s’accordent sur un point : si nous cédons, il nous faudra rebâtir notre force, sans quoi nous serons effacés de la carte. Et ils ne nous blâmeront pas d’avoir cédé."

 polish_partitions.1.a: "Nous ne pouvons pas lutter, cela ne sert a rien"
 polish_partitions.1.b: "Nous ne tomberons pas si facilement !"

 je_upgraded_brazil: "Élever le statut du Brésil"
 je_upgraded_brazil_reason: "Le Brésil n’est plus une simple colonie et beaucoup estiment que son statut doit être élevé a une position égale dans la relation transatlantique."

 upgrade_brazil.1.t: "Un nouveau Brésil"
 upgrade_brazil.1.d: "Au Brésil, le peuple réclame autonomie et égalité au sein de l’Empire portugais."
 upgrade_brazil.1.f: "Comment pouvons-nous être une colonie, alors que nous sommes plus grands que le Portugal à tous égards ? Gouverneur médiocre après gouverneur médiocre, sans aucun moyen de les écarter par le vote : sont-ils nommés au mérite ? Pourquoi sommes-nous traités comme une simple banque de ressources à exploiter ? Devrons-nous lutter pour notre indépendance comme les États-Unis afin d’obtenir notre autonomie et nos droits ? Puissions-nous éviter d’en arriver là pour une chose aussi simple !"

 upgrade_brazil.1.a: "Intégrer le Brésil au Portugal dans une union politique égale"
 upgrade_brazil.1.b: "Le Brésil sera en union personnelle avec nous"
 upgrade_brazil.1.c: "Leur demander ce qu’ils veulent ?"

 upgrade_brazil.2.t: "Un nouveau Brésil"
 upgrade_brazil.2.d: "Le gouvernement portugais propose une union plus parfaite avec nous"
 upgrade_brazil.2.f: "Comment pouvons-nous être une colonie, alors que nous sommes plus grands que le Portugal à tous égards ? Gouverneur médiocre après gouverneur médiocre, sans aucun moyen de les écarter par le vote : sont-ils nommés au mérite ? Pourquoi sommes-nous traités comme une simple banque de ressources à exploiter ? Devrons-nous lutter pour notre indépendance comme les États-Unis afin d’obtenir notre autonomie et nos droits ? Puissions-nous éviter d’en arriver là pour une chose aussi simple !"

 upgrade_brazil.2.a: "L’annexion est la voie a suivre"
 upgrade_brazil.2.b: "Élever au rang de royaume"

 upgrade_brazil.3.t: "égalité et fraternite"
 upgrade_brazil.3.d: "Notre temps et notre travail n’ont pas été vains. C’est la plus belle heure de l’Empire portugais."
 upgrade_brazil.3.f: "Ils scandent leur joie dans les rues. Nous avons trouvé la meilleure voie et le meilleur accord pour les deux parties ; il n’est plus possible de revenir en arrière, le régime colonial appartient au passé. Ce sont nos frères des Amériques, nous n’en avons jamais douté. Il est temps d’inscrire leurs droits dans la loi."

 upgrade_brazil.3.a: "Et c est fait !"

 je_british_colonialism: "Etendre l’Empire"
 je_british_colonialism_reason: "Nous avons défini nos objectifs de politique étrangère : employer notre marine pour contrôler les mers et établir des colonies commerciales."

 british_colonialism_events.1.t: "Britannia domine les flots !"
 british_colonialism_events.1.d: "Nous controlons désormais toutes les routes commerciales importantes."
 british_colonialism_events.1.f: "Ils ricanent : comment pourrions-nous vaincre les Britanniques ? Ils contrôlent tout l’excédent commercial de l’Asie, toutes ces ressources bon marché ! Si nous tentons de nous battre pour cela, leur marine coupera tout notre commerce, du moins ce qui ne relève pas déjà de leur empire. Quelle situation funeste..."

 british_colonialism_events.1.c: "Il est bon d’être empereur"

 je_cape_to_cairo: "Du Cap au Caire"
 je_cape_to_cairo_reason: "L’Afrique attire de plus en plus l’attention avec la demande croissante de ressources. L’objectif le plus ambitieux est de construire une voie ferrée du Cap au Caire."

 british_colonialism_events.2.t: "Un nouveau monde"
 british_colonialism_events.2.d: "De nouveaux gouvernements sont mis en place en Égypte et au Soudan..."
 british_colonialism_events.2.f: "Nos intérêts dans ces régions sont protégés. Nous avons choisi un double gouvernement avec le khédive d’Égypte sur la question du Soudan. Notre mission civilisatrice progresse ; le chemin de fer sera bientôt construit, et les occasions commerciales seront immenses."

 british_colonialism_events.2.c: "Un grand jour, non seulement pour l’Empire britannique, mais pour le monde."

 je_polish_partition_russia: "Partage de la Pologne"
 je_polish_partition_russia_reason: "La République des Deux Nations a développé une relation d’État client avec la Russie, ce que nombre de puissances européennes jugent offensant. La confédération de Bar, formée par des nobles polonais pour se défaire du contrôle russe, a échoué. Il devient clair que la seule manière de préserver la paix et l’équilibre des puissances est de partager les terres polonaises entre les trois puissances."

 je_polish_partition_prussia: "Partage de la Pologne"
 je_polish_partition_prussia_reason: "La République des Deux Nations a développé une relation d’État client avec la Russie, ce que nombre de puissances européennes jugent offensant. La confédération de Bar, formée par des nobles polonais pour se défaire du contrôle russe, a échoué. Il devient clair que la seule manière de préserver la paix et l’équilibre des puissances est de partager les terres polonaises entre les trois puissances."

 je_polish_partition_austria: "Partage de la Pologne"
 je_polish_partition_austria_reason: "La République des Deux Nations a développé une relation d’État client avec la Russie, ce que nombre de puissances européennes jugent offensant. La confédération de Bar, formée par des nobles polonais pour se défaire du contrôle russe, a échoué. Il devient clair que la seule manière de préserver la paix et l’équilibre des puissances est de partager les terres polonaises entre les trois puissances."

 revolutions_events_mod.1.t: "La Grande Révolution"
 revolutions_events_mod.1.d_france: "Le peuple fran’ais réclame liberté, égalité et democratie"
 revolutions_events_mod.1.d: "La Révolution française s’est propagée chez nous !"
 revolutions_events_mod.1.f: "Le peuple peine à manger ; on lui répond qu’il mange de la brioche. Nos ennemis étrangers attendent que nous soyons affaiblis ; on dit qu’ils n’ont qu’à mourir. Ce gouvernement ne saurait pas diriger une porcherie ! Il nous faut une république forte pour nous représenter : le peuple exige de choisir ses représentants !"
 je_great_revolution: "La Grande Révolution"
 je_great_revolution_reason: "Réforme ou révolution : tel est notre choix."
 revolutions_events_mod.2.f: "Nous voyons bien que cela fonctionne là-bas : le peuple a plus de pouvoir que jamais. Il ne nous reste qu’à prendre nous-mêmes le pouvoir."

 revolutions_events_mod.6.t: "Fin de la Révolution"
 revolutions_events_mod.6.d: "Par la ruse, le courage et l’intelligence, nous nous en sommes tous sortis indemnes."
 revolutions_events_mod.6.f: "Le peuple est satisfait ; il vit désormais dans le confort. Ce fut la Révolution destinée à mettre fin à toutes les révolutions. Les dirigeants savent désormais clairement qu’ils sont là pour servir, et non pour régner sans partage."

 revolutions_events_mod.7.t: "La Révolution est victorieuse !"
 revolutions_events_mod.7.d: "Le peuple s’est exprimé, et sa parole est définitive."
 revolutions_events_mod.7.f: "Le peuple a changé. La constitution change avec lui ; les lois naturelles que nous avions connues toute notre vie sont jetées au vent. La hiérarchie cède la place à l’égalité et à la fraternité. La loyauté envers le monarque devient loyauté envers la nation. Le monde a changé pour toujours."

 revolutions_events_mod.8.t: "La Révolution est vaincue !"
 revolutions_events_mod.8.d: "L’honneur a prévalu, et le verdict est sans appel."
 revolutions_events_mod.8.f: "Lorsqu’ils ont dit que la loyauté ne devait aller ni à une couronne ni à une hiérarchie ancestrale, mais à la nation et à ses peuples, nous avons refusé. La couronne et la hiérarchie protègent les nations et leurs valeurs, non les caprices de la foule ni les fortunes du moment. Le temps dira ce qu’il adviendra des autres nations imprudentes ; pour l’heure, nous pouvons souffler."

 great_revolution_underway_tt: "La Grande Révolution est en cours"

 revolutions_events_mod.11.t: "Journaux partisans"
 revolutions_events_mod.11.d: "Les journaux publient des principes égalitaires et montrent leur compromission"
 revolutions_events_mod.11.f: "Lisez les nouvelles : comment fabriquer des bombes de fortune, comment barricader les rues, comment haïr votre monarque, comment incendier les demeures nobles ! Ils parlent trop clairement."

 revolutions_events_mod.11.a: "Censurer la presse !"
 revolutions_events_mod.11.b: "Les laisser faire"
 revolutions_events_mod.11.c: "Nos lois de censure existent pour une raison."

 revolutions_events_mod.12.t: "Une autre voie pour nos terres..."
 revolutions_events_mod.12.d: "Dans tout ce chaos, un nouveau mouvement porteur de nouveaux idéaux apparaît."
 revolutions_events_mod.12.f: "Un chef fort, une société militarisée et disciplinée, des trains qui arrivent à l’heure : chassons la folie libérale qui se répand en Europe. Nous devons mettre de l’ordre dans ce désordre."

 revolutions_events_mod.12.a: "Non seulement un allié, mais des héros !"
 revolutions_events_mod.12.b: "Des traîtres"

 revolutions_events_mod.13.t: "Les fascistes ont un plan"
 revolutions_events_mod.13.d: "La police doit agir davantage comme une armée pour mettre fin à la brutalité."
 revolutions_events_mod.13.f: "Nous rassemblerons la police et nos milices, puis nous combattrons le feu par le feu pour conserver le contrôle social. Trop de douceur ne fait qu’encourager le peuple à aller plus loin ; une ligne plus dure s’impose."

 revolutions_events_mod.13.a: "Voilà le genre d’idées dont nous avons besoin ! Accueillons-les !"
 revolutions_events_mod.13.b: "Que pouvons-nous faire ? Ne l’inscrivons simplement pas dans la loi."

 revolutions_events_mod.14.t: "Manifestations dans la capitale"
 revolutions_events_mod.14.d: "A bas la monarchie, a bas la hierarchie, a bas l’injustice !"
 revolutions_events_mod.14.f: "Nos exigences sont simples : refaire tout le système. Est-ce si difficile ? Pourquoi devons-nous crier dans les rues pour que nos paroles tombent dans des oreilles sourdes ?"

 revolutions_events_mod.14.a: "Oups"
 revolutions_events_mod.14.b: "Degager les rues !"

