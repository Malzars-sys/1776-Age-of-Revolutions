 je_irish_question: "La question irlandaise"
 je_irish_question_reason: "Depuis la Révolution américaine, les ideaux de nationalisme et de republicanisme se sont repandus dans tout l’Empire britannique. Une solution a la question irlandaise doit être trouvee avant qu il ne soit trop tard."
 
 je_usa_independence: "Révolution américaine"
 je_usa_independence_reason: "Nous nous sommes déclarés indépendants de la Grande-Bretagne, dont la tyrannie limite notre consommation, contrôle ce que nous produisons et meme ou nous pouvons coloniser. Nous nous battrons jusqu au bout !"
 

 je_venetian_empire_reason: "Après cette longue période de déclin, nos nationalistes réclament le changement afin de retrouver notre domination et nos territoires d’outre-mer, par l’acier s’il le faut."
 
 je_polish_partitions: "Partage de la Pologne"
 je_polish_partitions_reason: "Nos ennemis affirment que la République des Deux Nations est une anarchie faible et divisee. Ils veulent la partager entre eux pour préserver la paix."
 
 je_polish_partitions_button: "Imposer le partage"
 je_polish_partitions_button_desc: "Nous partagerons la Pologne"
 
 je_polish_no_partitions_button: "Pas de partage"
 je_polish_no_partitions_button_desc: "Nous n y participerons pas"
 
 polish_partitions.1.t: "Un ultimatum !"
 polish_partitions.1.d: "Partage de la Pologne"
 polish_partitions.1.f: "Delegations arrived of our neighbours, each uncompromising, rhythmically hushed towns and sarcastic wit turned to raging fury, eventually calmed back down to diplomatic tone and then it went almost to blows. They can say all they want, about this will keep the peace, but alls they wanted is to take pieces of a neighbour like it was a birthday cake. The Nobles are in agreement, if we are to give in, we must build our strength after or be wiped off the map. Nor will they blame us for giving in."
 
 polish_partitions.1.a: "Nous ne pouvons pas lutter, cela ne sert a rien"
 polish_partitions.1.b: "Nous ne tomberons pas si facilement !"
 
 je_upgraded_brazil: "Élever le statut du Brésil"
 je_upgraded_brazil_reason: "Le Brésil n’est plus une simple colonie et beaucoup estiment que son statut doit être élevé a une position égale dans la relation transatlantique."
 
 upgrade_brazil.1.t: "Un nouveau Brésil"
 upgrade_brazil.1.d: "Au Brésil, le peuple réclame autonomie et égalité au sein de l’Empire portugais."
 upgrade_brazil.1.f: "How can we be a colony, when we are bigger than Portugal in every way? We get bad governor after bad governor, with no way to vote them away, are they appointed out of merit? Why are we treated as just a resource bank to be exploited’ Should we have to fight for independence like the USA to have our autonomy and rights. Forbid it comes to that for something so simple!"
 
 upgrade_brazil.1.a: "Intégrer le Brésil au Portugal dans une union politique égale"
 upgrade_brazil.1.b: "Le Brésil sera en union personnelle avec nous"
 upgrade_brazil.1.c: "Leur demander ce qu ils veulent ?"
 
 upgrade_brazil.2.t: "Un nouveau Brésil"
 upgrade_brazil.2.d: "Le gouvernement portugais propose une union plus parfaite avec nous"
 upgrade_brazil.2.f: "How can we be a colony, when we are bigger than Portugal in every way? We get bad governor after bad governor, with no way to vote them away, are they appointed out of merit? Why are we treated as just a resource bank to be exploited’ Should we have to fight for independence like the USA to have our autonomy and rights. Forbid it comes to that for something so simple!"
 
 upgrade_brazil.2.a: "L’annexion est la voie a suivre"
 upgrade_brazil.2.b: "Élever au rang de royaume"
 
 upgrade_brazil.3.t: "égalité et fraternite"
 upgrade_brazil.3.d: "Our time and labour have not gone to waste. This is the Portuguese Empires finest hour"
 upgrade_brazil.3.f: "They chant in the streets. We've found the best path and the greatest deal for both parties, we can't go back, colonial rule became outdated. They are our brothers in the Americas, we never doubted that for a second, now it's time to hammer their rights into law..."
 
 upgrade_brazil.3.a: "Et c est fait !"
 
 je_british_colonialism: "Etendre l’Empire"
 je_british_colonialism_reason: "Nous avons défini nos objectifs de politique étrangère : employer notre marine pour contrôler les mers et établir des colonies commerciales."
 
 british_colonialism_events.1.t: "Britannia domine les flots !"
 british_colonialism_events.1.d: "Nous controlons désormais toutes les routes commerciales importantes."
 british_colonialism_events.1.f: "They jeer, how can we defeat the Britishers? They control the entire trade surplus of Asia! The cheap resources! If we try to fight them for it, they will use their navy to stop all OUR trade, whatevers left that's NOT apart of THEIR Empire anyway, what a dire situation..."
 
 british_colonialism_events.1.c: "Il est bon d’être empereur"
 
 je_cape_to_cairo: "Du Cap au Caire"
 je_cape_to_cairo_reason: "L’Afrique attire de plus en plus l’attention avec la demande croissante de ressources. L’objectif le plus ambitieux est de construire une voie ferrée du Cap au Caire."
 
 british_colonialism_events.2.t: "A New World"
 british_colonialism_events.2.d: "New governments are being set up in Egypt and Sudan..."
 british_colonialism_events.2.f: "Our interests in these areas are protected, we've decided on a Dual Government with the Egyptian Khedive on the issue of Sudan,. Our civilising mission is going great, soon the railway will be built and we will have tremendous trading oppurtunities!"
 
 british_colonialism_events.2.c: "A great day for not only the British Empire, but the world."
 
 je_polish_partition_russia: "Partition of Poland"
 je_polish_partition_russia_reason: "Polish-Lithuanian Commonwealth has developed a client state Relationship with Russia and many European powers find it offensive, the Bar Confederation of Polish Nobles to try and get rid of Russian control failed, it's clear the only way to keep the peace while preserving the balance of power is to partition Polish lands between the Three Powers."
 
 je_polish_partition_prussia: "Partition of Poland"
 je_polish_partition_prussia_reason: "Polish-Lithuanian Commonwealth has developed a client state Relationship with Russia and many European powers find it offensive, the Bar Confederation of Polish Nobles to try and get rid of Russian control failed, it's clear the only way to keep the peace while preserving the balance of power is to partition Polish lands between the Three Powers."
 
 je_polish_partition_austria: "Partition of Poland"
 je_polish_partition_austria_reason: "Polish-Lithuanian Commonwealth has developed a client state Relationship with Russia and many European powers find it offensive, the Bar Confederation of Polish Nobles to try and get rid of Russian control failed, it's clear the only way to keep the peace while preserving the balance of power is to partition Polish lands between the Three Powers."
 
 revolutions_events_mod.1.t: "La Grande Révolution"
 revolutions_events_mod.1.d_france: "Le peuple fran’ais réclame liberté, égalité et democratie"
 revolutions_events_mod.1.d: "La Révolution fran’aise s est propagee chez nous !"
 revolutions_events_mod.1.f: "The people have trouble eating, they say let us eat cake, we have foreign enemies who are waiting for us to be weakened, they say let them die, this government could not rule a pig pen! We need a strong republic to represent us, the people demand to choose their representatives!"
 je_great_revolution: "La Grande Révolution"
 je_great_revolution_reason: "Réforme ou révolution : tel est notre choix."
 revolutions_events_mod.2.f: "We see how well it's working over there, the people have more power than ever, we just need to take power for ourselves now!"
 
 revolutions_events_mod.6.t: "Fin de la Révolution"
 revolutions_events_mod.6.d: "Through cunning, heart and smarts, we all came through in one piece"
 revolutions_events_mod.6.f: "The people are content, they live in comfort now, this was the Révolution to end all Revolutions. Leaders now clearly know they are there to serve the peoples first and foremost."
 
 revolutions_events_mod.7.t: "La Révolution est victorieuse !"
 revolutions_events_mod.7.d: "The people had their say and their say is final"
 revolutions_events_mod.7.f: "The people have changed. The constitution is changed with it, the natural laws we had known our whole lives is thrown to the wind. Hierarchy, replaced with Egality and Fraternity. Loyalty to the Monarch, now loyalty to the nation. The world is forever changed."
 
 revolutions_events_mod.8.t: "La Révolution est vaincue !"
 revolutions_events_mod.8.d: "Honour has prevailed and it is final"
 revolutions_events_mod.8.f: "When they said loyalty should not be to a Crown or any ancestral hierachy, but to the nation and it's peoples, we rebuffed, the Crown and Hierachy protects the nations and it's peoples values, not due to what the mob thinks or due to who has the most money that day. Time will tell when they see the other foolish nations results, but for now we rest."
 
 great_revolution_underway_tt: "La Grande Révolution est en cours"
 
 revolutions_events_mod.11.t: "Journaux partisans"
 revolutions_events_mod.11.d: "Les journaux publient des principes égalitaires et montrent leur compromission"
 revolutions_events_mod.11.f: "Get your news about how to make makeshift bombs, how to barricade the streets, how the hate your monarch, burn down the nobles house! They talk too plainly!"
 
 revolutions_events_mod.11.a: "Censurer la presse !"
 revolutions_events_mod.11.b: "Les laisser faire"
 revolutions_events_mod.11.c: "We have our censorship laws for a reason"
 
 revolutions_events_mod.12.t: "Une autre voie pour nos terres..."
 revolutions_events_mod.12.d: "In all the choas, a new movement with new ideals arises"
 revolutions_events_mod.12.f: "A strong leader, militarized and regimented society, trains will arrive on time, get rid of the libéral insanity steaming through Europe. We call it ultra nationalism or fascism. They offer their help against the libéral plague."
 
 revolutions_events_mod.12.a: "Not only an ally but these people are heros!"
 revolutions_events_mod.12.b: "Traitors"
 
 revolutions_events_mod.13.t: "Les fascistes ont un plan"
 revolutions_events_mod.13.d: "The Police must act more like a military to stop the brutality"
 revolutions_events_mod.13.f: "We will gather the police and our militias, then fight fire with fire to retain social control. Being too soft just eggs on the folk to go even harder, a harder stance must be taken."
 
 revolutions_events_mod.13.a: "This is the type of thought we need! Welcome them in!"
 revolutions_events_mod.13.b: "What can we do? Just don't write it into law"
 
 revolutions_events_mod.14.t: "Manifestations dans la capitale"
 revolutions_events_mod.14.d: "A bas la monarchie, a bas la hierarchie, a bas l’injustice !"
 revolutions_events_mod.14.f: "Our demands are simple, just redo the whole system, is it so hard’ Why must we scream in the streets and it fall on deaf ears?"
 
 revolutions_events_mod.14.a: "Oups"
 revolutions_events_mod.14.b: "Degager les rues !"
 
