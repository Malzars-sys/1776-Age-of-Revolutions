l_french:
 # Zaibatsu
 je_zaibatsu: "L'empire des grandes entreprises"
 je_zaibatsu_reason: "L'industrialisation rapide [ROOT.GetCountry.GetAltNameNoFormatting('Du')][ROOT.GetCountry.GetName] a place une grande partie de l'economie sous l'egide des [concept_zaibatsu|l]. Profitant largement de leurs liens etroits avec les institutions de l'Etat, ces entreprises sont devenues des elements essentiels du complexe militaro-industriel du #v $JAP$#!.\n\nLa concentration du capital [ROOT.GetCountry.GetAltAdjectiveNoFormatting('MS')|l] a fait de ce pays un concurrent serieux sur le plan international, au prix d'un pouvoir politique toujours plus important entre les mains des zaibatsu et de leurs soutiens militaires.[SCOPE.GetRootScope.GetCountry.GetCustom('zaibatsu_democracy_snippet')]\n$ZAIBATSU_LIST_HEADER$$ZAIBATSU_LIST_CONTENT$"
 je_zaibatsu_complete_header: "Pour #b implanter#! les zaibatsu :\n"
 je_zaibatsu_on_complete_header: "Lors de #b l'implantation#! des zaibatsu :\n$EFFECT$"
 je_zaibatsu_fail_header: "Pour #b limiter#! les zaibatsu :\n"
 je_zaibatsu_on_fail_header: "Lors de la #b limitation#! des zaibatsu :\n$EFFECT$"
 zaibatsu_democracy_info: "\n\nTant que cette [concept_journal_entry|l] sera active, la [concept_electoral_confidence|l] diminuera de #v 0,5 %#! par mois"
 two_more_more_company_slots_tt: "Peut fonder plus de [SCOPE.ScriptValue('je_zaibatsu_company_slots_threshold')|v0] [Concept('concept_company','$concept_companies$')|l]"
 glossary_zaibatsu: "Un #b #italic zaibatsu#!#! est un conglomerat financier et industriel familial verticalement integre.\n\nUn zaibatsu classique s'organise autour d'une holding et d'une banque qui detiennent des parts dans plusieurs filiales, generalement industrielles. Les zaibatsu proviennent de conglomerats commerciaux familiaux de la fin de l'epoque d'Edo, qui ont mis a profit leur richesse et leurs liens avec l'Etat pour renforcer leur controle sur une grande partie de la base industrielle du Japon."
 country_levels_owned_by_zaibatsu_100_tt: "Plus de [SCOPE.ScriptValue('je_zaibatsu_possible_levels_threshold')|v0] [Concept('concept_building_level','$concept_building_levels$')|l] sont detenus par les [concept_zaibatsu|l] (actuellement [SCOPE.ScriptValue('country_levels_owned_by_zaibatsu')|v0])"
 country_levels_owned_by_zaibatsu_250_tt: "Plus de [SCOPE.ScriptValue('je_zaibatsu_complete_levels_threshold')|v0] [Concept('concept_building_level','$concept_building_levels$')|l] sont detenus par les [concept_zaibatsu|l] (actuellement [SCOPE.ScriptValue('country_levels_owned_by_zaibatsu')|v0])"
 fraction_of_country_levels_owned_by_zaibatsu_ge_to_10_tt: "Les [Concept('concept_building_level','$concept_building_levels$')|l] detenus par les [concept_zaibatsu|l] sont superieurs ou egaux a [SCOPE.ScriptValue('je_zaibatsu_possible_fraction_threshold')|v%0] de tous les niveaux de batiment [ROOT.GetCountry.GetAltAdjective('MP')|l] (actuellement [SCOPE.ScriptValue('fraction_of_country_levels_owned_by_zaibatsu')|v%])"
 fraction_of_country_levels_owned_by_zaibatsu_ge_to_25_tt: "Les [Concept('concept_building_level','$concept_building_levels$')|l] detenus par les [concept_zaibatsu|l] sont superieurs ou egaux a [SCOPE.ScriptValue('je_zaibatsu_complete_fraction_threshold')|v%0] de tous les niveaux de batiment [ROOT.GetCountry.GetAltAdjective('MP')|l] (actuellement [SCOPE.ScriptValue('fraction_of_country_levels_owned_by_zaibatsu')|v%])"
 fraction_of_country_levels_owned_by_zaibatsu_less_than_10_tt: "Les [Concept('concept_building_level','$concept_building_levels$')|l] detenus par les [concept_zaibatsu|l] sont inferieurs a [SCOPE.ScriptValue('je_zaibatsu_possible_fraction_threshold')|v%0] de tous les niveaux de batiment [ROOT.GetCountry.GetAltAdjective('MP')|l] (actuellement [SCOPE.ScriptValue('fraction_of_country_levels_owned_by_zaibatsu')|v%])"
 voting_power_wealth_threshold_below_10_tt: "Le seuil de [concept_wealth|l] des electeurs est inferieur a [SCOPE.ScriptValue('je_zaibatsu_fail_voting_power_threshold')|v0]"
 modifier_zaibatsu_oligarchy: "Oligarchie des zaibatsu"
 modifier_zaibatsu_oligarchy_democratic: "$modifier_zaibatsu_oligarchy$"
 ZAIBATSU_LIST_HEADER: "$TOOLTIP_DELIMITER$\n[concept_zaibatsu] actifs [ROOT.GetCountry.GetAltNameNoFormatting('En')][ROOT.GetCountry.GetName] :"
 ZAIBATSU_LIST_CONTENT: "#indent_newline:3  [GetScriptedGui('je_zaibatsu_companies_sgui').ExecuteTooltip(GuiScope.SetRoot(ROOT.GetCountry.MakeScope).End)] #!"
 ZAIBATSU_LIST_ENTRY: "[THIS.GetCompany.GetCompanyType.GetName] ([THIS.GetCompany.GetProsperity|v] de [concept_prosperity|l]) : [THIS.GetCompany.GetNumOwnedBuildingLevels|v] [Concept('concept_building_level','$concept_building_levels$')|l] detenus"
 ZAIBATSU_LIST_EMPTY: "Aucune [concept_company|l] [ROOT.GetCountry.GetAltAdjectiveNoFlag('FS')|l] n'est un [concept_zaibatsu|l]"
 command_economy_or_cooperative_ownership_tt: "A promulgue une variante de la loi sur l'[GetLawType('law_command_economy').GetName|l] ou la [GetLawType('law_cooperative_ownership').GetName|l]"
 zaibatsu.1.t: "L'empire des grandes entreprises"
 zaibatsu.1.d: "Le partenariat durable entre l'Etat [ROOT.GetCountry.GetAltAdjective('MS')|l] et les [SCOPE.gsInterestGroup('zaibatsu_ig').GetName|l] a consolide le pouvoir des conglomerats dans [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')|l]. Certes, ce sont les politiciens qui gouverneront, mais les generaux et les cadres qui feront la loi."
 zaibatsu.1.f: "[SCOPE.sCharacter('pm_scope').GetFullNameNoFormatting] regardait le combat depuis sa loge. L'adversaire de son lutteur prefere avait reussi a repousser son champion tout au bord du ring recouvert de paille de riz, et [SCOPE.sCharacter('pm_scope').GetCustom('FR_IlElle')] avait bien du mal a garder son calme. Aux cotes du Premier ministre se tenait [SCOPE.sCharacter('relevant_zaibatsu_exec').GetFullNameNoFormatting], calme et serein[SCOPE.sCharacter('relevant_zaibatsu_exec').GetCustom('FR_E')].\n\nL'arbitre brandit son eventail, provoquant un tonnerre d'acclamations dans les gradins du bas d'ou des coussins se mirent a voler dans les airs, avant de retomber sur le ring. [SCOPE.sCharacter('relevant_zaibatsu_exec').GetFirstNameNoFormatting] tourna la tete vers [SCOPE.sCharacter('pm_scope').GetFirstNameNoFormatting] et lui sourit. La, a l'autre bout du ring, grave sur l'un des murs, se trouvait le #italic mon#! de [SCOPE.sCompany('relevant_zaibatsu').GetNameNoFormatting]."
 zaibatsu.1.a: "[ROOT.GetCountry.GetCapital.GetCityHubName] s'ouvrira comme un ocean de lumiere."
 zaibatsu.1.b: "Notre chaine d'approvisionnement pourrait toujours etre plus sure."
 zaibatsu.2.t: "Verrouillage"
 zaibatsu.2.t_1: "Le nivellement"
 zaibatsu.2.d: "Les efforts consentis par le gouvernement [SCOPE.sCharacter('pm_scope').GetLastName] ont limite la capacite des [SCOPE.gsInterestGroup('zaibatsu_ig').GetName|l] a exercer leur emprise sur [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')|l]. Les politiciens gouverneront, et les cadres se concentreront sur leurs profits."
 zaibatsu.2.d_1: "La politique de libre-echange du gouvernement [SCOPE.sCharacter('pm_scope').GetLastName] a mis a mal le reseau de contrats militaro-industriels essentiels aux [SCOPE.gsInterestGroup('zaibatsu_ig').GetName|l] pour exercer leur emprise sur [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')|l]. Les politiciens gouverneront, et les cadres se concentreront sur leurs profits."
 zaibatsu.2.f: "Les cadres s'etaient rassembles dans la salle de reunion situee au dernier etage du siege social de [SCOPE.sCompany('relevant_zaibatsu').GetNameNoFormatting]. [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] entra en troisieme, juste apres les secretaires. [SCOPE.sCharacter('name_a_scope').GetSheHe|U] s'installa pres de la porte et regarda ses superieurs passer devant [SCOPE.sCharacter('name_a_scope').GetCustom('FR_LuiElle')]. De legeres volutes de vapeur s'echappaient de la tasse de the posee devant [SCOPE.sCharacter('name_a_scope').GetCustom('FR_LuiElle')].\n\n[SCOPE.sCharacter('relevant_zaibatsu_exec').GetFullNameNoFormatting] entra en dernier et regarda chacun de ses employes tour a tour. Son regard avait quelque chose de nouveau, remarqua [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting], une expression que le Baron n'avait jamais laissee transparaitre : l'epuisement. Les traits qui se dessinaient sur son visage semblaient plus creuses qu'auparavant, et ses cheveux grisonnants plus clairsemes que jamais."
 zaibatsu.2.a: "L'autorite souveraine revient a nous et a nous seuls."
 zaibatsu.2.b: "Prevenez le peuple : [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')|l] ne s'achete pas."
 country_electoral_confidence_over_time: "Changement mensuel de [concept_electoral_confidence|l]"
 country_electoral_confidence_over_time_desc: "Une augmentation ou une diminution mensuelle de la [concept_electoral_confidence|l] d'un [concept_country|l]."
