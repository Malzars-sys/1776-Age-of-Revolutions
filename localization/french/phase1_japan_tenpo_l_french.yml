l_french:
 phase1_japan_tenpo.1.t: "Les leçons de la famine Tenmei"
 phase1_japan_tenpo.1.d: "Le souvenir de la famine Tenmei pèse encore sur les villages et les administrateurs des domaines. Même lorsque les années sont plus calmes, la fragilité des récoltes rappelle au Bakufu que la misère rurale peut devenir un danger politique."
 phase1_japan_tenpo.1.f: "On compte les greniers, on inspecte les berges, on recopie les pétitions d’une main appliquée. La campagne a survécu, mais peu de gens pensent qu’elle est réellement à l’abri."
 phase1_japan_tenpo.1.a: "Renforcer les réserves."
 phase1_japan_tenpo.1.b: "Secourir les villages les plus touchés."
 phase1_japan_tenpo.1.c: "Laisser les domaines porter leurs propres fardeaux."
 phase1_japan_tenpo.2.t: "Les réformes Kansei"
 phase1_japan_tenpo.2.d: "Le Bakufu répond aux difficultés récentes par un regain de discipline. Frugalité, ordre et administration prudente sont présentés comme les moyens les plus sûrs de préserver l’équilibre Tokugawa."
 phase1_japan_tenpo.2.f: "À Edo, la réforme s’écrit dans la langue de la retenue. Le luxe est suspect, la dette est dangereuse, et chaque fonctionnaire affirme que la vertu commence par l’obéissance."
 phase1_japan_tenpo.2.a: "Réaffirmer la discipline du Bakufu."
 phase1_japan_tenpo.2.b: "Rendre le secours rural visible."
 phase1_japan_tenpo.2.c: "Laisser davantage aux domaines."
 phase1_japan_tenpo.3.t: "Repousser les navires étrangers"
 phase1_japan_tenpo.3.d: "Des voiles inconnues apparaissent de plus en plus souvent près des eaux japonaises. La politique du pays fermé tient encore, mais chaque signalement nourrit de nouveaux débats sur la vigilance, le commerce et la défense des côtes."
 phase1_japan_tenpo.3.f: "Un rapport côtier arrive à Edo, le sel encore séché dans le papier. Le navire n’a pas débarqué, mais tous ceux qui lisent le compte rendu imaginent le jour où l’un d’eux le fera."
 phase1_japan_tenpo.3.a: "Appliquer strictement l’édit."
 phase1_japan_tenpo.3.b: "Répondre avec prudence."
 phase1_japan_tenpo.3.c: "Traiter ces incidents comme un bruit lointain."
 phase1_japan_tenpo.4.t: "Des récoltes inquiétantes"
 phase1_japan_tenpo.4.d: "Les rapports venus des campagnes parlent d’un mauvais temps persistant, de cultivateurs anxieux et de réserves de riz moins confortables qu’elles ne devraient l’être. Ce n’est pas encore une crise nationale, mais les signes deviennent difficiles à ignorer."
 phase1_japan_tenpo.4.f: "Les registres sont des objets secs, jusqu’au moment où les chiffres s’amincissent. Alors chaque ligne ressemble à un foyer qui décide de ce dont il devra se passer."
 phase1_japan_tenpo.4.a: "Surveiller les greniers de près."
 phase1_japan_tenpo.4.b: "Exiger des assurances des domaines."
 phase1_japan_tenpo.5.t: "Le prix du riz grimpe"
 phase1_japan_tenpo.5.d: "Le prix du riz monte plus vite que les fonctionnaires ne peuvent l’expliquer. Les marchands accusent le climat et le transport ; les villageois accusent les accapareurs ; le Bakufu entend la colère sous chaque réponse."
 phase1_japan_tenpo.5.f: "Au marché, un sac de riz est devenu une rumeur qui pèse. Il passe de main en main, toujours plus cher qu’hier."
 phase1_japan_tenpo.5.a: "Ouvrir les réserves d’urgence."
 phase1_japan_tenpo.5.b: "Contrôler les profits les plus abusifs."
 phase1_japan_tenpo.5.c: "Laisser les autorités locales gérer la pression."
 phase1_japan_tenpo.6.t: "La famine Tenpō commence"
 phase1_japan_tenpo.6.d: "Les années d’avertissements deviennent une crise. Mauvaises récoltes, prix du riz élevés et agitation croissante obligent désormais le Bakufu à affronter une famine qui menace à la fois les campagnes et l’autorité construite sur elles."
 phase1_japan_tenpo.6.f: "Le nom de l’ère promet une protection céleste. Dans les villages, on se demande si le ciel les entend."
 phase1_japan_tenpo.6.a: "La crise ne peut plus être retardée."

