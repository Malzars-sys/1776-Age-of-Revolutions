l_english:
 building_aor1776_visual_rail_probe: "PROTOTYPE — Rail diagnostic marker"
 building_aor1776_visual_rail_probe_desc: "Technical marker with no production, jobs or infrastructure output. One level tests the engine’s track selection only. Not for a real campaign."
 bg_aor1776_visual_rail_probe: "PROTOTYPE — Rail diagnostic"
 pmg_aor1776_visual_rail_probe: "Landscape diagnostic"
 pm_aor1776_visual_rail_probe: "No economic activity"
 aor1776_ilp_force_rails: "PROTOTYPE — Force the rail marker in the capital"
 aor1776_ilp_force_rails_desc: "Creates a level-one marker without changing real PMs or infrastructure. Observe the tracks, not only the trains. Track appearance is the hypothesis being tested, not a guaranteed result."
 aor1776_ilp_remove_rails: "PROTOTYPE — Remove the rail marker from the capital"
 aor1776_ilp_remove_rails_desc: "Removes only the diagnostic building. Real buildings remain intact. Check whether tracks disappear; allow a tick and zoom out and back in."
 aor1776_ilp_auto_rails: "PROTOTYPE — Restore automatic PM tracking"
 aor1776_ilp_auto_rails_desc: "The capital’s marker follows the actual rail PM. Other states already use automatic tracking."
 aor1776_bridge_export: "PROTOTYPE — Export capital diagnostics to the local bridge"
 aor1776_bridge_export_desc: "Writes active PMs, regional infrastructure levels and the rail marker to debug.log. Does not change buildings or technologies. The local bridge reads this record; it cannot observe rendered tracks."
