l_english:
 building_aor1776_land_fortification:0 "Land Fortifications"
 bg_aor1776_land_fortification:0 "Land Fortifications"
 pmg_aor1776_land_fortification:0 "Land Defenses"
 pm_aor1776_land_fortification_basic:0 "Basic Land Fortifications"
 pm_aor1776_land_fortification_reinforced:0 "Reinforced Land Fortifications"
 pm_aor1776_land_fortification_advanced:0 "Advanced Land Fortifications"
 state_building_aor1776_land_fortification_max_level_add:0 "Maximum Land Fortification Level"
 state_building_aor1776_land_fortification_max_level_add_desc:0 "The maximum number of land fortification levels that can be built in a state."
 state_aor1776_land_fortification_strength_add:0 "Land Fortification Strength"
 state_aor1776_land_fortification_strength_add_desc:0 "Strength is rounded to the nearest point, up to fifteen points. Each point reduces provinces lost after a defensive defeat by 10%, up to a maximum of 85% from fortifications. It also reduces casualties taken by 5% and raises army defense by 5%. This protection applies in defensive battles fought in provinces of the state owned and controlled by the country. Strength depends on the works and the garrison actually employed."
 aor1776_land_fort_stance_name:0 "Fortified Position"
 aor1776_land_fort_stance_desc:0 "The defenders use the state's fortifications to shelter their men and organize resistance. The garrison limits losses and covers the routes of retreat."
 aor1776_land_fort_pursuit_name:0 "Pursuit from the Fortifications"
 aor1776_land_fort_pursuit_desc:0 "The defenders pursue the enemy while retaining support from their works. The usual pursuit effects apply alongside the protection of the stronghold."
 aor1776_land_fort_panicked_retreat_name:0 "Rout under the Cover of the Forts"
 aor1776_land_fort_panicked_retreat_desc:0 "The troops scatter. The fortifications cover their retreat and limit losses without restoring cohesion."
 aor1776_land_fort_controlled_retreat_name:0 "Retreat Covered by the Forts"
 aor1776_land_fort_controlled_retreat_desc:0 "The troops withdraw in order under the protection of their works. The usual controlled retreat effects apply alongside the garrison's cover."
 battle_condition_aor1776_land_fort_abandoned:0 "Abandoned Fortified Position"
 battle_condition_aor1776_land_fort_abandoned_desc:0 "The works no longer support this position. The protection of the garrison has ended."
