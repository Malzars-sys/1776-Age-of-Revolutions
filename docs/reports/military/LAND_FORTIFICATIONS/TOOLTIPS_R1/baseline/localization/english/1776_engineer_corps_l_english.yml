l_english:
 combat_unit_group_aor1776_engineers:0 "Engineers"
 combat_unit_group_aor1776_engineers_desc:0 "Sappers and officers trained in siege works and opening assault routes."
 combat_unit_type_aor1776_engineer_corps:0 "Engineer Corps"
 combat_unit_type_aor1776_engineer_corps_desc:0 "Sappers trained to dig approaches, open breaches and cross enemy works. They fight alongside the infantry and carry the tools needed for siege operations.\n\nEach full-strength battalion engaged in the battle subtracts one percentage point from the local army defense, casualty reduction and territorial protection bonuses of land fortifications. It takes 25, 50 or 75 battalions to neutralize five fully staffed levels of basic, reinforced or advanced fortifications. The effect depends on the men present and cannot turn the fort’s protection into a penalty."
