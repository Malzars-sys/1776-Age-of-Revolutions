l_french:
 building_aor1776_land_fortification:0 "Fortifications terrestres"
 bg_aor1776_land_fortification:0 "Fortifications terrestres"
 pmg_aor1776_land_fortification:0 "Défenses terrestres"
 pm_aor1776_land_fortification_basic:0 "Fortifications terrestres simples"
 pm_aor1776_land_fortification_reinforced:0 "Fortifications terrestres renforcées"
 pm_aor1776_land_fortification_advanced:0 "Fortifications terrestres avancées"
 state_building_aor1776_land_fortification_max_level_add:0 "Niveau maximum des fortifications terrestres"
 state_building_aor1776_land_fortification_max_level_add_desc:0 "Nombre maximal de niveaux de fortifications terrestres pouvant être construits dans un État."
 state_aor1776_land_fortification_strength_add:0 "Puissance des fortifications terrestres"
 state_aor1776_land_fortification_strength_add_desc:0 "À garnison complète, chaque niveau réduit les provinces perdues après une défaite défensive de 5 % avec les fortifications simples, de 10 % avec les fortifications renforcées et de 15 % avec les fortifications avancées, soit respectivement 25 %, 50 % et 75 % pour cinq niveaux. La puissance dépend des ouvrages et des effectifs employés ; elle est arrondie au point le plus proche, jusqu’à quinze points. Chaque point réduit de 5 % les pertes subies et augmente de 5 % la défense terrestre. Cette protection s’applique aux combats défensifs dans les provinces de l’État possédées et contrôlées par le pays. Les bataillons du génie engagés par l’adversaire retranchent un point de pourcentage à ces trois protections par millier d’hommes, jusqu’à leur annulation. Les effets habituels du combat et des retraites sont conservés."
 aor1776_land_fort_stance_name:0 "Position fortifiée"
 aor1776_land_fort_stance_desc:0 "Les défenseurs s’appuient sur les ouvrages de l’État pour couvrir leurs hommes et organiser leur résistance. La garnison limite les pertes et protège les voies de repli."
 aor1776_land_fort_pursuit_name:0 "Poursuite depuis les fortifications"
 aor1776_land_fort_pursuit_desc:0 "Les défenseurs poursuivent l’adversaire en conservant l’appui de leurs ouvrages. Les effets habituels de la poursuite s’appliquent, avec la protection de la place forte."
 aor1776_land_fort_panicked_retreat_name:0 "Déroute sous le couvert des forts"
 aor1776_land_fort_panicked_retreat_desc:0 "Les troupes se dispersent. Les ouvrages couvrent leur recul et limitent les pertes, sans rétablir leur cohésion."
 aor1776_land_fort_controlled_retreat_name:0 "Retraite protégée par les forts"
 aor1776_land_fort_controlled_retreat_desc:0 "Les troupes se replient en ordre sous la protection de leurs ouvrages. Les effets habituels de la retraite contrôlée se cumulent avec la couverture de la garnison."
 battle_condition_aor1776_land_fort_abandoned:0 "Position fortifiée abandonnée"
 battle_condition_aor1776_land_fort_abandoned_desc:0 "Les ouvrages ne soutiennent plus cette position. La protection de la garnison a cessé."
