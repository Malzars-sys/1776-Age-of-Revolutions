l_french:
 combat_unit_group_aor1776_engineers:0 "Génie"
 combat_unit_group_aor1776_engineers_desc:0 "Sapeurs et officiers spécialisés dans les travaux de siège et l’ouverture des voies d’assaut."
 combat_unit_type_aor1776_engineer_corps:0 "Corps du génie"
 combat_unit_type_aor1776_engineer_corps_desc:0 "Sapeurs instruits pour creuser les approches, ouvrir des brèches et franchir les ouvrages ennemis. Ils combattent avec l’infanterie et emportent les outils nécessaires aux travaux de siège.\n\nChaque bataillon à plein effectif engagé dans la bataille retranche un point de pourcentage aux bonus locaux de défense, de réduction des pertes et de protection du terrain des fortifications terrestres. Il faut 25, 50 ou 75 bataillons pour neutraliser cinq niveaux entièrement employés de fortifications simples, renforcées ou avancées. L’effet dépend des hommes présents et ne peut pas transformer la protection du fort en malus."
