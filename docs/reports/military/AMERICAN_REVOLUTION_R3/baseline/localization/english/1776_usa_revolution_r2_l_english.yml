l_english:
 je_aor1776_french_support:0 "Quiet Channels of Support"
 je_aor1776_french_support_reason:0 "Congress spends faster than the assemblies replenish its coffers. Across the Atlantic, London’s rivals seek ways to sustain our resistance without committing themselves to open war. Merchant houses can channel funds and weapons, but their patrons expect a diplomatic commitment in return. Each further grant will depend on their willingness, their finances, and the routes still open across the ocean."
 aor1776_request_french_support:0 "Request French Support"
 aor1776_request_french_support_desc:0 "Send our requirements to French intermediaries. France may refuse, fund a moderate grant, or undertake a larger effort. Congress remains free to accept the proposed terms."
 aor1776_end_french_support:0 "End the Support Agreement"
 aor1776_end_french_support_desc:0 "Close the current agreement’s credits and supplies. Its articles cease to operate when the treaty updates. An existing diplomatic obligation retains its normal duration."
 aor1776_support_commercial_cover:0 "Atlantic Merchant Houses’ Convention"
 aor1776_support_money:0 "Subsidies to the Insurgents"
 aor1776_support_money_desc:0 "France channels a subsidy to Congress through merchants. This support is neither a loan nor recognition of sovereignty."
 aor1776_support_supplies:0 "Supplies to the Insurgents"
 aor1776_support_supplies_desc:0 "French purchases finance deliveries of small arms and artillery to the insurgents. Their passage depends on available markets and sea routes."
 aor1776_french_support.1.t:0 "Credits for the Insurgents"
 aor1776_french_support.1.d:0 "The American assemblies seek money to pay their men and maintain their supplies. Financial support would weaken Britain’s position without committing our armies. The proposed credits run for twenty-six weeks, alongside separate deliveries of small arms and guns. Congress must grant a diplomatic obligation; these subsidies will not become a debt when peace returns."
 aor1776_french_support.1.f:0 "Expense accounts lie beside the merchants’ letters. A signature may open a purse; keeping it open requires a more difficult judgment."
 aor1776_french_support.1.a:0 "Offer £14,000 a week, six units of small arms, and one of artillery."
 aor1776_french_support.1.b:0 "Offer £21,000 a week and twelve units of small arms."
 aor1776_french_support.1.c:0 "Our finances cannot bear this commitment."
 aor1776_french_support.2.t:0 "An Offer from France"
 aor1776_french_support.2.d:0 "Our intermediaries report a French offer: £14,000 each week for twenty-six weeks, alongside six units of small arms and one unit of artillery a week. France bears the cost. In return, it asks for an American diplomatic obligation, without an automatic alliance or rights over our territory. These subsidies and supplies are not a loan. Maritime difficulties may interrupt deliveries; funding also ends when the war or the agreement’s conditions cease."
 aor1776_french_support.2.d_high:0 "France offers increased support: £21,000 each week for twenty-six weeks, twelve units of small arms, and one unit of artillery a week, at French expense. Congress must grant a diplomatic obligation. These subsidies require no financial repayment; the convention creates neither an alliance nor a territorial concession. Sea routes, French finances, and the continuation of the war determine whether support can be maintained."
 aor1776_french_support.2.f:0 "The merchants have left official seals at the bottom of their chests. They have nevertheless made certain that every condition is read."
 aor1776_french_support.2.a:0 "Accept the support and our diplomatic commitment."
 aor1776_french_support.2.b:0 "We will not undertake this obligation."
 aor1776_french_support.3.t:0 "Routes Still Closed"
 aor1776_french_support.3.d:0 "The convention cannot yet enter into force under the present diplomatic or trading conditions. No new payment or delivery has been created, and no obligation has been incurred. Review the markets, sea access, and relations between the two countries before renewing the request."
 aor1776_french_support.3.a:0 "Prepare another approach."
 aor1776_negotiate_public_treaty:0 "Negotiate a Treaty with France"
 aor1776_negotiate_public_treaty_desc:0 "Propose an open relationship: an alliance and reciprocal trade privileges, subject to our diplomatic position. France may accept or refuse. This proposal imposes no entry into war."
 aor1776_public_treaty_name:0 "Franco-American Treaty of Alliance and Commerce"
 aor1776_french_support.5.t:0 "From Discretion to Treaty"
 aor1776_french_support.5.d:0 "American representatives propose making our relationship public. An alliance would allow our military interests to be coordinated, while reciprocal trade privileges would open new ties between our merchants. It falls to us to judge the risks. War subsidies remain separate commitments with a limited duration."
 aor1776_french_support.5.f:0 "This time, the governments’ names will appear on the parchment. The intermediaries’ discretion gives way to the work of plenipotentiaries."
 aor1776_french_support.5.a:0 "Sign the alliance and reciprocal privileges."
 aor1776_french_support.5.b:0 "Retain our present arrangements for now."
 aor1776_legacy_debt.t:0 "Accounts Without an Established Claim"
 aor1776_legacy_debt.d:0 "The old repayment accounts do not establish a coherent contractual claim. Their flat charges and receipts are closed. French subsidies will not become debt merely because peace has arrived. A diplomatic obligation remains distinct from a loan."
 aor1776_legacy_debt.a:0 "Keep separate accounts."
 ship_type_aor1776_armed_merchantman:0 "Armed Merchantman"
 ship_type_aor1776_armed_merchantman_desc:0 "A merchant vessel adapted for war by carrying small guns and additional sailors. Its hull and rig remain those of a trading ship; it can escort a convoy or threaten enemy transports without taking the place of a large ship of the line."
 aor1776_merchant_1:0 "Merchant Planking"
 aor1776_merchant_2:0 "Light Shipboard Guns"
 aor1776_merchant_3:0 "Merchant Rig"
 aor1776_merchant_4:0 "Passage Provisions"
 aor1776_merchant_5:0 "Interception Fitting"
 law_aor1776_minutemen:0 "Minuteman Companies"
 law_aor1776_minutemen_desc:0 "Local companies maintain their training and stand ready to join the Continental forces. Recruitment draws on communities rather than peasant levies alone, while retaining a limited standing army. The assemblies must fund this preparation and may later choose a professional organization."
 aor1776_organize_minutemen:0 "Organize the Local Companies"
 aor1776_organize_minutemen_desc:0 "Replace peasant levies with an American organization of trained companies ready for rapid service. Their preparation increases military goods expenses; their availability does not remove the need for manpower and weapons."
 je_aor1776_revolutionary_spirit:0 "The Insurgents’ Commitment"
 je_aor1776_revolutionary_spirit_reason:0 "The men taking up arms cannot live on proclamations alone. A success against the British may steady their companies; a reverse, an unfulfilled promise, or an empty pay chest weakens their confidence. French support lends weight to our cause, but Congress must still persuade men to remain under arms. The state of their commitment appears among the country’s modifiers."
 aor1776_fervour_low:0 "Shaken Commitment"
 aor1776_fervour_high:0 "Renewed Commitment"
 aor1776_fervour_steady:0 "Steady Commitment"
 aor1776_renew_enlistments:0 "Renew Enlistments"
 aor1776_renew_enlistments_desc:0 "Meet the companies’ representatives to discuss bounties and continued service. A financial commitment can sustain the men’s resolve; postponing promises may weaken it."
 aor1776_usa_content.1.t:0 "Remaining Under Arms"
 aor1776_usa_content.1.d:0 "The companies seek assurances before extending their service. Congress can devote £7,500 to enlistment bounties or ask the men to wait longer. Existing troops will not be replaced by new battalions: it is their confidence that we seek to preserve."
 aor1776_usa_content.1.f:0 "The rolls pass from hand to hand. An officer has placed a fresh mark beside some names; other lines remain empty."
 aor1776_usa_content.1.a:0 "Honor the promised bounties."
 aor1776_usa_content.1.b:0 "Ask the companies for more time."
 aor1776_founder_benjamin:0 "Benjamin"
 aor1776_founder_franklin:0 "Franklin"
 aor1776_founder_john:0 "John"
 aor1776_founder_adams:0 "Adams"
 aor1776_founder_thomas:0 "Thomas"
 aor1776_founder_jefferson:0 "Jefferson"
 aor1776_appoint_franklin_envoy:0 "Entrust Franklin with a Mission"
 aor1776_appoint_franklin_envoy_desc:0 "Ask Benjamin Franklin to present our cause to French interlocutors. We will bear the mission’s expenses; a favorable reception may bring the countries closer without committing France to a treaty."
 aor1776_convene_founders_commission:0 "Convene a Congressional Commission"
 aor1776_convene_founders_commission_desc:0 "After independence, consider John Adams’s and Thomas Jefferson’s proposals for the republic’s accounts and safeguards. Entrusting this work to one of them will temporarily shape our administration at a cost to government authority."
 aor1776_adams_accounts:0 "Accounts Submitted to Congress"
 aor1776_jefferson_guarantees:0 "Safeguards of the Assemblies"
 aor1776_echo_french_debate:0 "Debating the American Example"
 aor1776_echo_british_reassurance:0 "Colonial Authority Reaffirmed"
 aor1776_echo_colonial_debate:0 "News from Congress"
 aor1776_echo_colonial_caution:0 "Caution in the Assemblies"
 aor1776_echo_european_reform:0 "Discussing American Institutions"
 aor1776_usa_founders.1.t:0 "An Envoy to Paris"
 aor1776_usa_founders.1.d:0 "Benjamin Franklin’s standing among scholars and merchants may serve American interests. Funding his mission would give our approaches to France greater weight. Congress must decide whether it can devote £5,000 to travel, correspondence, and the upkeep of this representation."
 aor1776_usa_founders.1.f:0 "Among the packets bound for Europe, letters of introduction take up almost as much space as dispatches. No seal can replace an acquaintance willing to open a door."
 aor1776_usa_founders.1.a:0 "Fund the mission and its approaches."
 aor1776_usa_founders.1.b:0 "Postpone this expense."
 aor1776_usa_founders.2.t:0 "The Republic at Work"
 aor1776_usa_founders.2.d:0 "The proposals submitted to Congress set out two tasks for the young republic. John Adams calls for closer scrutiny of public accounts; Thomas Jefferson emphasizes safeguards for the assemblies. A temporary commission can pursue one of these tasks, provided its chair remains in service and the government retains its republican form."
 aor1776_usa_founders.2.f:0 "Military maps no longer cover the table alone. In the margins of the minutes, delegates mark disputed expenses and powers they hesitate to entrust."
 aor1776_usa_founders.2.a:0 "Entrust Adams with reviewing the accounts."
 aor1776_usa_founders.2.b:0 "Entrust Jefferson with the assemblies’ safeguards."
 aor1776_usa_founders.2.c:0 "Let Congress continue its deliberations."
 aor1776_usa_echoes.1.t:0 "What America Brings Home"
 aor1776_usa_echoes.1.d_win:0 "American independence gives French support a new resonance. Circles that once exchanged news of the insurgents now discuss their institutions. The government may let this debate feed hopes of reform or confine itself to the diplomatic result achieved across the Atlantic."
 aor1776_usa_echoes.1.d_loss:0 "Peace has left the Americans under another power’s authority. Merchants and supporters of their cause ask what remains of our commitments. This reverse does not settle France’s own debates; it requires us to consider the limits of our support."
 aor1776_usa_echoes.1.f:0 "The gazettes change their headlines; printers’ bills and unanswered letters remain on the desks. To each reader, the word America carries a different hope."
 aor1776_usa_echoes.1.a:0 "Allow their arguments to circulate."
 aor1776_usa_echoes.1.b:0 "Keep our policy separate from their institutions."
 aor1776_usa_echoes.2.t:0 "After the American War"
 aor1776_usa_echoes.2.d_win:0 "The former insurgents have secured their independence. In London, the war’s outcome opens debate over ministerial conduct and relations with the other possessions. The Crown’s interests must now reckon with this example."
 aor1776_usa_echoes.2.d_loss:0 "The Americans remain subject to an outside power. Defenders of the colonial order see proof that assemblies cannot always enforce their claims by arms. The government may draw on their satisfaction, although tensions elsewhere in the possessions remain."
 aor1776_usa_echoes.2.a:0 "Reassure the defenders of colonial order."
 aor1776_usa_echoes.2.b:0 "Consider the lessons of this war."
 aor1776_usa_echoes.3.t:0 "News from Overseas"
 aor1776_usa_echoes.3.d_win:0 "News of American independence reaches our assemblies and merchant houses. Those calling for greater rights find new matter for discussion. The government may give them room or avoid lending local meaning to a peace concluded elsewhere."
 aor1776_usa_echoes.3.d_loss:0 "The American war ends without independence for the insurgents. Some who have followed their affairs now counsel caution. The government may encourage this reading of events or let local debates take their own course."
 aor1776_usa_echoes.3.f:0 "The sheet crossed the sea folded inside a merchant’s letter. Before the countinghouse closes, three readers have already asked for a copy."
 aor1776_usa_echoes.3.a:0 "Let the assemblies discuss this example."
 aor1776_usa_echoes.3.b:0 "Give the arguments for caution a hearing."
 aor1776_usa_echoes.3.c:0 "Attend to the business at hand."
 aor1776_usa_echoes.4.t:0 "The Institutions of a New Republic"
 aor1776_usa_echoes.4.d:0 "Our American correspondents report that their independence is secured. Scholars and advocates of reform turn their attention to the republic’s institutions. Opening the discussion may assist legislative projects at home, but will offend some defenders of the established order."
 aor1776_usa_echoes.4.a:0 "Welcome this discussion into our work."
 aor1776_usa_echoes.4.b:0 "Leave the debate to the gazettes."
 aor1776_propose_french_support:0 "Offer Support to the Insurgents"
 aor1776_propose_french_support_desc:0 "Open negotiations with Congress to finance subsidies and supplies. We will choose the scale of our support; the Americans must then accept its terms."
 aor1776_independence_resolved_tt:0 "The American War of Independence has reached its outcome."
 aor1776_support_relationship_valid_tt:0 "The United States is fighting Britain for independence. France is neither in default nor hostile to Congress, and their relations are at least −25."
 aor1776_support_no_active_tranche_tt:0 "No tranche of French support is currently active."
 aor1776_support_cooldown_finished_tt:0 "The waiting period between negotiations has ended."
 aor1776_support_no_pending_offer_tt:0 "No French offer is already awaiting a reply."
 aor1776_support_below_six_tranches_tt:0 "The limit of six tranches has not been reached."
 aor1776_support_finances_available_tt:0 "France has at least £84,000 in reserves and its weekly balance is not negative."
 aor1776_support_no_pending_request_tt:0 "No request is already under consideration in France."
 aor1776_support_offer_pending_tt:0 "A French proposal is awaiting consideration."
 aor1776_french_support.4.t:0 "Credits Refused"
 aor1776_french_support.4.d:0 "The French intermediaries will not pursue our request for credits. No support has been committed and no obligation has been granted. Congress may renew its approaches after ninety days, if the war and both countries’ circumstances permit."
 aor1776_french_support.4.a:0 "Find the means to hold on in the meantime."
