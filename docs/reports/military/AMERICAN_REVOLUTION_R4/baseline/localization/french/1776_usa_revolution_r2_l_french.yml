l_french:
 je_aor1776_french_support:0 "Les voies discrètes du secours"
 je_aor1776_french_support_reason:0 "Les lettres venues de France ne contiennent encore ni argent ni promesse signée. Le Congrès peut demander des armes, des instructeurs et des avances ; il lui faudra offrir une obligation et reconnaître la dette des sommes reçues. Une fois les conditions choisies, Versailles répondra et nous resterons libres de ratifier sa convention. La paix fermera les crédits, sans effacer les comptes."
 aor1776_request_french_support:0 "Solliciter un concours français"
 aor1776_request_french_support_desc:0 "Choisir les promesses à proposer à la France : une obligation et le remboursement des avances, avec ou sans intérêts selon le crédit demandé. Après la réponse française, le Congrès décidera de ratifier ou de refuser le traité."
 aor1776_end_french_support:0 "Mettre fin au concours financier"
 aor1776_end_french_support_desc:0 "Fermer les avances, les fournitures et l’assistance de l’accord en cours. Les clauses cessent lors de la mise à jour du traité. La dette déjà contractée et l’obligation diplomatique subsistent."
 aor1776_support_commercial_cover:0 "Convention des maisons de commerce atlantiques"
 aor1776_support_money:0 "Subsides aux insurgés"
 aor1776_support_money_desc:0 "La France verse une subvention au Congrès par l’intermédiaire de négociants. Ce secours n’est ni un prêt ni une reconnaissance de souveraineté."
 aor1776_support_supplies:0 "Fournitures aux insurgés"
 aor1776_support_supplies_desc:0 "La France transmet des armes légères et de l’artillerie par les voies commerciales. Les livraisons sont suspendues si la route est coupée ou la capacité d’exportation dépassée. Elles cessent à la paix ou après le 3 septembre 1783, sans être ajoutées à la dette monétaire."
 aor1776_french_support.1.t:0 "Des crédits pour les insurgés"
 aor1776_french_support.1.d:0 "Les assemblées américaines cherchent de quoi payer leurs hommes et entretenir leurs approvisionnements. Un concours financier affaiblirait la position britannique sans engager nos armées. Les crédits proposés courront vingt-six semaines, avec des livraisons distinctes d’armes et de canons. Le Congrès devra consentir une obligation diplomatique ; ces subsides ne seront pas transformés en dette à la paix."
 aor1776_french_support.1.f:0 "Sur le bureau, les états de dépenses voisinent avec les lettres des négociants. Il suffit parfois d’une signature pour ouvrir une caisse ; il en faut davantage pour savoir jusqu’où l’on pourra la tenir ouverte."
 aor1776_french_support.1.a:0 "Proposer 14 000 £ par semaine, six unités d’armes et une d’artillerie."
 aor1776_french_support.1.b:0 "Porter l’effort à 21 000 £ par semaine et douze unités d’armes."
 aor1776_french_support.1.c:0 "Nos finances ne permettent pas cet engagement."
 aor1776_french_support.2.t:0 "Une offre venue de France"
 aor1776_french_support.2.d:0 "Nos intermédiaires annoncent une proposition française : 14 000 £ chaque semaine pendant vingt-six semaines, auxquels s’ajoutent six unités d’armes légères et une unité d’artillerie par semaine. La France en supportera le coût. En retour, elle demande une obligation diplomatique américaine, sans alliance automatique ni droit sur notre territoire. Les subsides et les fournitures ne constituent pas un prêt. Les livraisons peuvent être interrompues par les difficultés maritimes ; le financement s’arrêtera aussi si la guerre ou les conditions de l’accord prennent fin."
 aor1776_french_support.2.d_high:0 "La France propose un effort renforcé : 21 000 £ chaque semaine pendant vingt-six semaines, douze unités d’armes légères et une unité d’artillerie par semaine, à ses frais. Le Congrès doit consentir une obligation diplomatique. Aucun remboursement financier n’est prévu pour ces subsides ; aucune alliance ni cession territoriale ne découle de cette convention. Les voies maritimes, les finances françaises et la poursuite de la guerre en conditionnent le maintien."
 aor1776_french_support.2.f:0 "Les marchands ont laissé les sceaux officiels au fond de leurs coffres. Ils n’en ont pas moins pris soin de faire lire chaque condition."
 aor1776_french_support.2.a:0 "Accepter ce secours et notre engagement diplomatique."
 aor1776_french_support.2.b:0 "Nous ne prendrons pas cet engagement."
 aor1776_french_support.3.t:0 "Des routes encore fermées"
 aor1776_french_support.3.d:0 "La convention ne peut pas encore entrer en vigueur dans la situation diplomatique ou commerciale présente. Aucun versement ni aucune livraison nouvelle n’ont été créés, et aucune obligation n’a été engagée. Examiner les marchés, les accès maritimes et les relations entre les deux pays avant de renouveler la demande."
 aor1776_french_support.3.a:0 "Préparer d’autres voies."
 aor1776_negotiate_public_treaty:0 "Négocier un traité avec la France"
 aor1776_negotiate_public_treaty_desc:0 "Proposer de porter au grand jour notre entente : une alliance et des privilèges commerciaux réciproques, dans les limites de notre situation diplomatique. La France pourra accepter ou refuser. Aucune entrée en guerre n’est imposée par cette proposition."
 aor1776_public_treaty_name:0 "Traité franco-américain d’alliance et de commerce"
 aor1776_french_support.5.t:0 "De la discrétion au traité"
 aor1776_french_support.5.d:0 "Les représentants américains proposent de donner une forme publique à notre rapprochement. Une alliance permettrait de coordonner nos intérêts militaires ; des privilèges commerciaux réciproques ouvriraient de nouvelles relations entre nos négociants. Il nous appartient d’en juger les risques. Les crédits de guerre restent des engagements distincts, limités dans le temps."
 aor1776_french_support.5.f:0 "Cette fois, les noms des gouvernements figureront sur le parchemin. La prudence des intermédiaires fait place au travail des plénipotentiaires."
 aor1776_french_support.5.a:0 "Signer l’alliance et les privilèges réciproques."
 aor1776_french_support.5.b:0 "Conserver pour l’instant nos arrangements actuels."
 aor1776_legacy_debt.t:0 "Des comptes sans créance établie"
 aor1776_legacy_debt.d:0 "Les anciens états de remboursement ne permettent pas d’établir une créance contractuelle cohérente. Les prélèvements et versements forfaitaires qui en découlaient sont clos. Les subsides français ne seront pas convertis en dette par la seule arrivée de la paix. Une obligation diplomatique conserve une nature distincte d’un prêt."
 aor1776_legacy_debt.a:0 "Faire tenir des comptes distincts."
 ship_type_aor1776_armed_merchantman:0 "Marchand armé"
 ship_type_aor1776_armed_merchantman_desc:0 "Navire marchand adapté au service de guerre par l’embarquement de petits canons et de marins supplémentaires. Sa coque et son gréement restent ceux du commerce ; il peut escorter un convoi ou inquiéter les transports ennemis, sans tenir la place d’un grand bâtiment de ligne."
 aor1776_merchant_1:0 "Bordage marchand"
 aor1776_merchant_2:0 "Petits canons de bord"
 aor1776_merchant_3:0 "Gréement marchand"
 aor1776_merchant_4:0 "Provisions de traversée"
 aor1776_merchant_5:0 "Armement pour l’interception"
 law_aor1776_minutemen:0 "Compagnies de minutemen"
 law_aor1776_minutemen_desc:0 "Des compagnies locales entretiennent leur instruction et se tiennent prêtes à rejoindre les forces continentales. Le recrutement s’appuie sur les communautés plutôt que sur les seules levées de paysans, tout en conservant une armée permanente limitée. Les assemblées doivent financer cette préparation et pourront choisir plus tard une organisation professionnelle."
 aor1776_organize_minutemen:0 "Organiser les compagnies locales"
 aor1776_organize_minutemen_desc:0 "Remplacer les levées paysannes par une organisation américaine de compagnies entraînées et disponibles rapidement. Leurs frais de préparation augmentent la dépense en biens militaires ; leurs capacités ne dispensent pas d’entretenir les effectifs et les armes."
 je_aor1776_revolutionary_spirit:0 "L’engagement des insurgés"
 je_aor1776_revolutionary_spirit_reason:0 "Les hommes qui prennent les armes ne vivent pas de proclamations seules. Un succès contre les Britanniques peut raffermir les compagnies ; un revers, des engagements mal tenus ou des caisses fermées entament leur confiance. Le concours français donne du poids à notre cause, mais le Congrès doit encore persuader chacun de rester sous les drapeaux. L’état de cet engagement apparaît parmi les modificateurs du pays."
 aor1776_fervour_low:0 "Engagement ébranlé"
 aor1776_fervour_high:0 "Engagement raffermi"
 aor1776_fervour_steady:0 "Engagement tenu"
 aor1776_renew_enlistments:0 "Renouveler les engagements"
 aor1776_renew_enlistments_desc:0 "Réunir les représentants des compagnies pour discuter des primes et de la poursuite du service. Une décision financière peut soutenir l’engagement des hommes ; différer les promesses peut l’ébranler."
 aor1776_usa_content.1.t:0 "Rester sous les drapeaux"
 aor1776_usa_content.1.d:0 "Les compagnies réclament des assurances avant de prolonger leur service. Le Congrès peut consacrer 7 500 £ aux primes d’engagement, ou demander aux hommes de patienter encore. Les troupes existantes ne sont pas remplacées par de nouveaux bataillons : c’est leur confiance que nous cherchons à conserver."
 aor1776_usa_content.1.f:0 "Les listes passent de main en main. Près de certains noms, un officier a tracé un nouveau signe ; d’autres lignes restent vides."
 aor1776_usa_content.1.a:0 "Honorer les primes promises."
 aor1776_usa_content.1.b:0 "Demander encore du temps aux compagnies."
 aor1776_founder_benjamin:0 "Benjamin"
 aor1776_founder_franklin:0 "Franklin"
 aor1776_founder_john:0 "John"
 aor1776_founder_adams:0 "Adams"
 aor1776_founder_thomas:0 "Thomas"
 aor1776_founder_jefferson:0 "Jefferson"
 aor1776_appoint_franklin_envoy:0 "Confier une mission à Franklin"
 aor1776_appoint_franklin_envoy_desc:0 "Charger Benjamin Franklin de défendre notre cause auprès des interlocuteurs français. Les frais de mission seront à notre charge ; un accueil favorable peut rapprocher les deux pays, sans engager la France à signer un traité."
 aor1776_convene_founders_commission:0 "Réunir une commission du Congrès"
 aor1776_convene_founders_commission_desc:0 "Après l’indépendance, examiner les propositions de John Adams et de Thomas Jefferson pour les comptes et les garanties de la république. Confier cette tâche à l’un d’eux orientera temporairement notre administration, avec des concessions sur l’autorité du gouvernement."
 aor1776_adams_accounts:0 "Comptes soumis au Congrès"
 aor1776_jefferson_guarantees:0 "Garanties des assemblées"
 aor1776_echo_french_debate:0 "L’exemple américain en débat"
 aor1776_echo_british_reassurance:0 "L’autorité coloniale réaffirmée"
 aor1776_echo_colonial_debate:0 "Des nouvelles venues du Congrès"
 aor1776_echo_colonial_caution:0 "La prudence des assemblées"
 aor1776_echo_european_reform:0 "Discuter les institutions américaines"
 aor1776_usa_founders.1.t:0 "Un envoyé à Paris"
 aor1776_usa_founders.1.d:0 "Le crédit de Benjamin Franklin auprès des savants et des négociants peut servir les intérêts américains. Financer sa mission donnerait davantage de poids à nos démarches auprès de la France. Le Congrès doit décider s’il peut consacrer 5 000 £ au voyage, à la correspondance et à l’entretien de cette représentation."
 aor1776_usa_founders.1.f:0 "Dans les paquets destinés à l’Europe, les lettres de recommandation prennent presque autant de place que les dépêches. Aucun sceau ne remplace une connaissance qui accepte d’ouvrir sa porte."
 aor1776_usa_founders.1.a:0 "Financer la mission et ses démarches."
 aor1776_usa_founders.1.b:0 "Différer cette dépense."
 aor1776_usa_founders.2.t:0 "La république au travail"
 aor1776_usa_founders.2.d:0 "Les propositions remises au Congrès dessinent deux tâches pour la jeune république. John Adams demande un examen plus étroit des comptes publics ; Thomas Jefferson insiste sur les garanties laissées aux assemblées. Une commission temporaire pourra conduire l’un de ces travaux, à condition de conserver un président disponible et la forme républicaine du gouvernement."
 aor1776_usa_founders.2.f:0 "La table n’est plus couverte de cartes militaires seulement. Aux bords des procès-verbaux, les délégués inscrivent les dépenses contestées et les pouvoirs qu’ils hésitent à confier."
 aor1776_usa_founders.2.a:0 "Confier à Adams l’examen des comptes."
 aor1776_usa_founders.2.b:0 "Confier à Jefferson les garanties des assemblées."
 aor1776_usa_founders.2.c:0 "Laisser le Congrès poursuivre ses délibérations."
 aor1776_usa_echoes.1.t:0 "Ce que rapporte l’Amérique"
 aor1776_usa_echoes.1.d_win:0 "L’indépendance américaine donne un retentissement nouveau au concours français. Dans les cercles où circulaient les nouvelles des insurgés, on discute désormais de leurs institutions. Le gouvernement peut laisser ce débat nourrir les espoirs de réforme, ou s’en tenir au résultat diplomatique obtenu outre-Atlantique."
 aor1776_usa_echoes.1.d_loss:0 "La paix a laissé les Américains sous tutelle. Les négociants et les partisans de leur cause cherchent ce qu’il restera de nos engagements. Ce revers ne tranche pas les débats de la France ; il oblige à mesurer les limites de notre concours."
 aor1776_usa_echoes.1.f:0 "Les gazettes changent de titre ; les dettes d’imprimerie et les lettres à répondre restent sur les bureaux. Pour chacun, le mot Amérique porte un espoir différent."
 aor1776_usa_echoes.1.a:0 "Laisser circuler leurs arguments."
 aor1776_usa_echoes.1.b:0 "Distinguer notre politique de leurs institutions."
 aor1776_usa_echoes.2.t:0 "Après la guerre américaine"
 aor1776_usa_echoes.2.d_win:0 "Les anciens insurgés ont obtenu leur indépendance. À Londres, le résultat de la guerre ouvre une discussion sur la conduite des ministres et les rapports avec les autres possessions. Les intérêts de la Couronne doivent désormais composer avec cet exemple."
 aor1776_usa_echoes.2.d_loss:0 "Les Américains restent soumis à une puissance extérieure. Les défenseurs de l’ordre colonial y voient la preuve que les assemblées ne peuvent pas toujours imposer leurs prétentions par les armes. Le gouvernement peut s’appuyer sur leur satisfaction, sans que les tensions des autres possessions disparaissent pour autant."
 aor1776_usa_echoes.2.a:0 "Rassurer les défenseurs de l’ordre colonial."
 aor1776_usa_echoes.2.b:0 "Examiner les leçons de cette guerre."
 aor1776_usa_echoes.3.t:0 "Une nouvelle d’outre-mer"
 aor1776_usa_echoes.3.d_win:0 "La nouvelle de l’indépendance américaine atteint nos assemblées et nos maisons de commerce. Ceux qui réclament davantage de droits y trouvent matière à discussion. Le gouvernement peut leur laisser cet espace ou éviter de donner une portée locale à une paix conclue ailleurs."
 aor1776_usa_echoes.3.d_loss:0 "La guerre américaine s’achève sans indépendance pour les insurgés. Parmi ceux qui suivent leurs affaires, certains prêchent désormais la prudence. Le gouvernement peut favoriser cette lecture des événements ou laisser les débats locaux suivre leur propre cours."
 aor1776_usa_echoes.3.f:0 "La feuille a traversé la mer pliée dans une lettre de commerce. Avant la fermeture du comptoir, trois lecteurs en ont déjà demandé une copie."
 aor1776_usa_echoes.3.a:0 "Laisser les assemblées discuter cet exemple."
 aor1776_usa_echoes.3.b:0 "Faire entendre les arguments de prudence."
 aor1776_usa_echoes.3.c:0 "S’en tenir aux affaires présentes."
 aor1776_usa_echoes.4.t:0 "Les institutions d’une république nouvelle"
 aor1776_usa_echoes.4.d:0 "Nos correspondants américains annoncent que leur indépendance est acquise. Dans les milieux savants et parmi les partisans des réformes, l’attention se porte sur les institutions de cette république. Ouvrir la discussion peut faciliter des projets de loi chez nous, mais heurtera certains défenseurs de l’ordre établi."
 aor1776_usa_echoes.4.a:0 "Accueillir cette discussion dans nos travaux."
 aor1776_usa_echoes.4.b:0 "Laisser les gazettes en débattre seules."
 aor1776_propose_french_support:0 "Proposer des secours aux insurgés"
 aor1776_propose_french_support_desc:0 "Ouvrir une négociation avec le Congrès pour financer des subsides et des fournitures. Nous choisirons le niveau de notre concours ; les Américains devront ensuite en accepter les conditions."
 aor1776_independence_resolved_tt:0 "La guerre d’indépendance américaine a trouvé son issue."
 aor1776_support_relationship_valid_tt:0 "Les États-Unis combattent la Grande-Bretagne pour leur indépendance. La France n’est ni en défaut ni ennemie du Congrès, et leurs relations sont au moins de −25."
 aor1776_support_no_active_tranche_tt:0 "Aucune tranche de secours français n’est en cours."
 aor1776_support_cooldown_finished_tt:0 "Le délai entre deux négociations est écoulé."
 aor1776_support_no_pending_offer_tt:0 "Aucune offre française n’attend déjà une réponse."
 aor1776_support_below_six_tranches_tt:0 "Le plafond de six tranches n’est pas atteint."
 aor1776_support_finances_available_tt:0 "La France dispose d’au moins 84 000 £ de réserves et son solde hebdomadaire n’est pas déficitaire."
 aor1776_support_no_pending_request_tt:0 "Aucune demande n’est déjà en cours d’examen en France."
 aor1776_support_offer_pending_tt:0 "Une proposition française reste à examiner."
 aor1776_french_support.4.t:0 "Le refus des crédits"
 aor1776_french_support.4.d:0 "Les intermédiaires français ne donneront pas suite à notre demande de crédits. Aucun secours n’a été engagé et aucune obligation n’a été consentie. Le Congrès pourra reprendre ses démarches après quatre-vingt-dix jours, si la guerre et la situation des deux pays le permettent."
 aor1776_french_support.4.a:0 "Chercher de quoi tenir en attendant."
