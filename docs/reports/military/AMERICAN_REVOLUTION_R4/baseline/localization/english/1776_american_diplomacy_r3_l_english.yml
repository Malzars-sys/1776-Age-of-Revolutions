l_english:
 aor1776_r3_acknowledge:0 "So be it."
 aor1776_r3_support_treaty:0 "Convention of Relief and Advances to Congress"
 aor1776_r3_journal_open_tt:0 "Correspondence with the French intermediaries has been opened."
 aor1776_r3_relationship_tt:0 "The independence war continues, France is not our enemy and 3 September 1783 has not passed."
 aor1776_r3_negotiations_available_tt:0 "No existing relief agreement, unpaid loan, refusal cooldown or pending negotiations prevent a new request."
 aor1776_r3_debt_peace_tt:0 "The debtor country is at peace."
 aor1776_open_french_support_correspondence:0 "Open the French correspondence"
 aor1776_open_french_support_correspondence_desc:0 "Receive the intermediaries’ first letters and open the French relief journal. This does not accept a loan."
 aor1776_r3_ratification_tt:0 "A bilateral treaty binds both countries for ten years. Credit, weapons and instructors end at peace or after 3 September 1783. Each cash advance adds the amount actually received to our debt; the debt and obligation survive the end of aid."
 aor1776_r3_repay_tt:0 "Pay the creditor the amount demanded and settle this agreement. If reserves are insufficient, this expense may increase our public debt."
 aor1776_r3_refuse_tt:0 "Repudiate this claim: +10 infamy and −40 relations with the creditor. Credit ends; the repudiated amount remains recorded, with no repeated automatic demand for this same debt."
 aor1776_american_diplomacy.1.t:0 "Letters from the Other Shore"
 aor1776_american_diplomacy.1.d:0 "French merchants are prepared to carry our requests to the court. Before making any promises, Congress must decide whether to seek their assistance."
 aor1776_american_diplomacy.1.f:0 "The packet had crossed the ocean under a merchant’s address. Inside, between two invoices, a few lines offered more than merchandise. The secretary read them twice before looking up at the Congress table."
 aor1776_american_diplomacy.2.t:0 "What We Can Promise"
 aor1776_american_diplomacy.2.d:0 "The intermediaries require definite commitments. We can offer an obligation and repayment of advances, or add interest in return for a larger credit line. France must still approve and send its offer."
 aor1776_american_diplomacy.2.f:0 "On the draft, the word gift had been crossed out. A delegate rested his finger on the margin: the weapons might help win the war; the figures would be waiting after peace."
 aor1776_american_diplomacy.3.t:0 "The Congressional Request"
 aor1776_american_diplomacy.3.d:0 "Congress requests £14,000 in weekly advances, six units of small arms, one unit of artillery and instructors. It promises an obligation and repayment of cash advances without interest. Our approval will send an offer it may still refuse."
 aor1776_american_diplomacy.3.f:0 "The letter bore no royal seal. It spoke of barefoot regiments and empty stores, then returned to what mattered in Versailles: Congress would acknowledge every pound advanced."
 aor1776_american_diplomacy.4.t:0 "The Offer from Versailles"
 aor1776_american_diplomacy.4.d:0 "Versailles offers £14,000 in weekly advances, six units of small arms, one unit of artillery and instructors. In return, Congress owes an obligation and repayment of cash advances actually received, without interest. Supplies and instructors are not added to this debt."
 aor1776_american_diplomacy.4.f:0 "The courier waited by the door, his coat still damp. On the table lay two copies bearing the same figures. Only the decision of Congress remained."
 aor1776_american_diplomacy.5.t:0 "An Unsealed Convention"
 aor1776_american_diplomacy.5.d:0 "The treaty can no longer be ratified: the war, relations or access for supplies have changed. No new loan or obligation is created. Negotiations may resume if conditions permit."
 aor1776_american_diplomacy.6.t:0 "A Guarded Reply"
 aor1776_american_diplomacy.6.d:0 "The court declines to commit its funds on the proposed terms. We may submit another request in three months."
 aor1776_american_diplomacy.1.a:0 "Lay these letters before Congress."
 aor1776_american_diplomacy.2.a:0 "A £14,000 credit line, without interest."
 aor1776_american_diplomacy.2.b:0 "A £21,000 credit line, with 5% interest."
 aor1776_american_diplomacy.2.c:0 "We should make no such commitment."
 aor1776_american_diplomacy.3.a:0 "Send an offer on the requested terms."
 aor1776_american_diplomacy.3.b:0 "Our finances do not permit it."
 aor1776_american_diplomacy.4.d_high:0 "Versailles offers £21,000 in weekly advances, twelve units of small arms, one unit of artillery and instructors. In return, Congress owes an obligation, repayment of cash advances received and 5% interest on that principal, charged once at settlement. Supplies and instructors are not added to this debt."
 aor1776_american_diplomacy.4.a:0 "Ratify the convention and acknowledge our debt."
 aor1776_american_diplomacy.4.b:0 "Reject these terms."
 aor1776_debt.1.t:0 "The Time to Settle"
 aor1776_debt.1.d:0 "[SCOPE.sCountry('aor1776_creditor').GetName] demands repayment of our loan. The amount due is £[ROOT.GetCountry.MakeScope.Var('aor1776_debt_due').GetValue|0], including any agreed interest. We may honour our commitment or repudiate the claim at the cost of our reputation and relations."
 aor1776_debt.1.f:0 "The ledger had outlasted changes of ministers. Its pages held the dates, advances and signatures that peace had not erased. The creditor’s messenger did not raise his voice; he waited for an answer."
 aor1776_debt.1.a:0 "Honour our debt."
 aor1776_debt.1.b:0 "We shall no longer acknowledge this claim."
 aor1776_deferred_debt:0 "Deferred Repayment Agreement"
 aor1776_deferred_debt_desc:0 "Lend £10,000 to the target country, with its consent and without interest. The creditor may demand repayment once the debtor is at peace. Each debtor may have one live creditor agreement. Refusing payment costs 10 infamy and 40 relations."
 aor1776_deferred_debt_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] owes [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] the advances received. Principal: £[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.MakeScope.Var('aor1776_debt_principal').GetValue|0]. The creditor may demand payment once the debtor is at peace."
 aor1776_demand_debt_repayment:0 "Demand Debt Repayment"
 aor1776_demand_debt_repayment_desc:0 "Present the debtor with the actual advances disbursed and agreed interest. It may pay or refuse; refusal gives it 10 infamy and reduces our relations by 40."
 aor1776_deferred_debt_action_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_propose_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_notification_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] and [TARGET_COUNTRY.GetName] enter into a deferred repayment agreement."
 aor1776_deferred_debt_action_notification_third_party_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] and [TARGET_COUNTRY.GetName] address repayment of their advances."
 aor1776_demand_debt_repayment_action_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_propose_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_notification_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] demands settlement of the advances received."
 aor1776_demand_debt_repayment_action_notification_third_party_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] and [TARGET_COUNTRY.GetName] address repayment of their advances."
 aor1776_deferred_debt_action_break_name:0 "Close the Debt Agreement"
 aor1776_deferred_debt_article:0 "Deferred Repayment of Advances"
 aor1776_deferred_debt_article_effects_desc:0 "Cash advances actually disbursed constitute a debt. The creditor may demand repayment once the debtor is at peace. Ending aid or the treaty does not erase the claim. Outside American relief, first conclude the diplomatic loan agreement."
 aor1776_deferred_debt_article_article_short_desc:0 "[TARGET_COUNTRY.GetNameNoFormatting] acknowledges advances owed to [SOURCE_COUNTRY.GetNameNoFormatting]"
 aor1776_war_credit_moderate:0 "£14,000 War Credit"
 aor1776_war_credit_moderate_effects_desc:0 "France advances £14,000 weekly, without interest. Each payment is deducted from French reserves and added to the principal owed by Congress. Advances pause if reserves are insufficient or France defaults, and end at peace or after 3 September 1783."
 aor1776_war_credit_moderate_article_short_desc:0 "£14,000 in weekly advances from [SOURCE_COUNTRY.GetNameNoFormatting] to [TARGET_COUNTRY.GetNameNoFormatting]"
 aor1776_war_credit_extended:0 "£21,000 War Credit"
 aor1776_war_credit_extended_effects_desc:0 "France advances £21,000 weekly, with 5% interest at settlement. Each payment is deducted from French reserves and added to the principal owed by Congress. Advances pause if reserves are insufficient or France defaults, and end at peace or after 3 September 1783."
 aor1776_war_credit_extended_article_short_desc:0 "£21,000 in weekly advances from [SOURCE_COUNTRY.GetNameNoFormatting] to [TARGET_COUNTRY.GetNameNoFormatting]"
 aor1776_revolution_military_assistance:0 "Instructors for Congress"
 aor1776_revolution_military_assistance_effects_desc:0 "French instructors increase American training speed and unit experience gain by 10%. Supporting them raises French military goods costs by 5%. This assistance ends at peace or after 3 September 1783."
 aor1776_revolution_military_assistance_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] provides instructors to [TARGET_COUNTRY.GetNameNoFormatting]"
 intervene_in_war:0 "Join an Ongoing War"
 intervene_in_war_action_name:0 "Join the Country’s Wars"
 intervene_in_war_desc:0 "Join wars in which the target country leads a side. Land or coastal access is required; truces with its enemies prevent intervention. America may receive this support during its independence war."
 intervene_in_war.tt:0 "Join wars led by the supported country."
 intervene_in_war_action_notification_name:0 "A New Intervention"
 intervene_in_war_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] joins the wars led by [TARGET_COUNTRY.GetName]."
 intervene_in_war_action_notification_third_party_name:0 "A New Intervention"
 intervene_in_war_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] joins the wars led by [TARGET_COUNTRY.GetName]."
 join_war:0 "War Intervention"
 join_war_effects_desc:0 "The committing country joins wars in which the other country leads a side, subject to access and truces. This clause does not establish a permanent alliance."
 join_war_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] joins the wars led by [TARGET_COUNTRY.GetNameNoFormatting]"
 ai_strategy_aor1776_french_revolution_war:0 "Carry the War to Britain"
 ai_strategy_aor1776_french_revolution_war_desc:0 "Expand the army, fleet and shipyards to defeat Britain. The French war objective requires occupation of its capital."
 ai_strategy_aor1776_spanish_revolution_war:0 "Recover the Disputed Possessions"
 ai_strategy_aor1776_spanish_revolution_war_desc:0 "Strengthen the army and fleet to recover British possessions claimed by Spain."
 aor1776_break_british_power:0 "Break British Power"
 war_goal_aor1776_break_british_power:0 "Break British Power"
 war_goal_aor1776_break_british_power_type_name:0 "Break British Power"
 war_goal_aor1776_break_british_power_desc:0 "Impose humiliation on Britain. This objective requires control of its capital and transfers no territory."
 war_goal_aor1776_break_british_power_type_desc:0 "Impose humiliation on Britain. This objective requires control of its capital and transfers no territory."
 war_goal_aor1776_break_british_power_sway_desc:0 "Impose humiliation on Britain. This objective requires control of its capital and transfers no territory."
 aor1776_support_supplies_effects_desc:0 "$aor1776_support_supplies_desc$"
 aor1776_support_supplies_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] supplies weapons to [TARGET_COUNTRY.GetNameNoFormatting]"
 aor1776_deferred_debt_proposal_notification_name:0 "Offer of a Deferred Repayment Loan"
 aor1776_deferred_debt_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] offers to lend us £10,000 without interest. It may demand repayment once we are at peace. Refusing payment then will cost us 10 infamy and 40 relations."
 aor1776_deferred_debt_proposal_accepted_name:0 "Loan Accepted"
 aor1776_deferred_debt_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepts our £10,000 loan and undertakes to repay it on demand after the war."
 aor1776_deferred_debt_proposal_declined_name:0 "Loan Declined"
 aor1776_deferred_debt_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] declines our loan proposal. No money is advanced."
 aor1776_deferred_debt_proposal_third_party_accepted_name:0 "Credit Agreement Concluded"
 aor1776_deferred_debt_proposal_third_party_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepts a loan from [INITIATOR_COUNTRY.GetName], with deferred repayment."
 aor1776_deferred_debt_proposal_third_party_declined_name:0 "Credit Agreement Declined"
 aor1776_deferred_debt_proposal_third_party_declined_desc:0 "[TARGET_COUNTRY.GetName] declines the loan offered by [INITIATOR_COUNTRY.GetName]."
 aor1776_r3_offer_still_valid_tt:0 "The request or offer remains valid, no competing credit agreement is open and France has at least £84,000 in reserves without being in default. The war and our relations still permit aid."
 aor1776_r3_no_existing_debt_tt:0 "The target country has no current deferred repayment credit agreement."
 aor1776_r3_no_pending_demand_tt:0 "No repayment demand for this debt is already awaiting an answer."
 aor1776_american_diplomacy.3.d_high:0 "Congress requests £21,000 in weekly advances, twelve units of small arms, one unit of artillery and instructors. It promises an obligation and repayment of cash advances with 5% interest, charged once at settlement. Our approval will send an offer it may still refuse."
