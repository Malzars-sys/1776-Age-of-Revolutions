l_french:
 aor1776_r3_acknowledge:0 "Prenons-en acte."
 aor1776_r3_support_treaty:0 "Convention de secours et d’avances au Congrès"
 aor1776_r3_journal_open_tt:0 "La correspondance avec les intermédiaires français a été ouverte."
 aor1776_r3_relationship_tt:0 "La guerre d’indépendance se poursuit et les relations avec la France permettent une négociation."
 aor1776_r3_negotiations_available_tt:0 "Aucun accord de secours, crédit impayé, délai de refus ou échange de propositions n’empêche de nouvelles négociations."
 aor1776_r3_debt_peace_tt:0 "Le pays débiteur est en paix."
 aor1776_open_french_support_correspondence:0 "Ouvrir la correspondance française"
 aor1776_open_french_support_correspondence_desc:0 "Recevoir les premières lettres des intermédiaires et ouvrir le journal du secours français. Cette démarche n’accepte aucun prêt."
 aor1776_r3_ratification_tt:0 "Ratifier un traité de dix ans : transfert de 30 000 £ par semaine, fournitures et instructeurs. Le Congrès consent une obligation et reconnaît le capital à rembourser après l’engagement, calculé à partir des versements prévus pendant cette durée. La paix ne met pas fin à ce financement. Les intérêts convenus s’ajoutent une seule fois au capital."
 aor1776_r3_repay_tt:0 "Verser au créancier la somme réclamée et solder cet accord. Si nos réserves sont insuffisantes, cette dépense peut accroître notre dette publique."
 aor1776_r3_refuse_tt:0 "Répudier cette créance : +10 d’infamie et −40 de relations avec le créancier. Le crédit cesse ; la somme répudiée reste consignée, sans nouvelle demande automatique pour cette même dette."
 aor1776_american_diplomacy.1.t:0 "Des lettres venues de l’autre rive"
 aor1776_american_diplomacy.1.d:0 "Des négociants français se disent disposés à transmettre nos demandes à la cour. Avant de promettre quoi que ce soit, le Congrès doit décider s’il souhaite rechercher ce secours."
 aor1776_american_diplomacy.1.f:0 "Le pli avait traversé l’océan sous une adresse de commerce. À l’intérieur, entre deux factures, quelques lignes offraient davantage que des marchandises. Le secrétaire les lut deux fois avant de lever les yeux vers la table du Congrès."
 aor1776_american_diplomacy.2.t:0 "Ce que nous pouvons promettre"
 aor1776_american_diplomacy.2.d:0 "Le Congrès demande à la France 30 000 £ par semaine pendant dix ans, des armes et des instructeurs. Il faut lui promettre une obligation et le remboursement du financement à l’échéance. Nous pouvons proposer un crédit sans intérêts ou consentir 5 % d’intérêts sur le capital. La France devra encore approuver, puis nous adresser son offre."
 aor1776_american_diplomacy.2.f:0 "Sur le brouillon, le mot don avait été rayé. Un député posa son doigt sur la marge : les armes pouvaient nous aider à gagner la guerre ; les chiffres, eux, nous attendraient après la paix."
 aor1776_american_diplomacy.3.t:0 "La demande du Congrès"
 aor1776_american_diplomacy.3.d:0 "Le Congrès demande 30 000 £ par semaine pendant dix ans, quinze unités d’armes légères, une unité d’artillerie et des instructeurs. Il promet une obligation et une reconnaissance de dette sur le financement prévu, sans intérêts. Notre accord lui adressera une offre qu’il pourra encore refuser."
 aor1776_american_diplomacy.3.f:0 "La lettre ne portait aucun sceau royal. Elle parlait de régiments sans souliers et de magasins vides, puis revenait à l’essentiel pour Versailles : chaque livre avancée serait reconnue par le Congrès."
 aor1776_american_diplomacy.4.t:0 "L’offre de Versailles — sans intérêts"
 aor1776_american_diplomacy.4.d:0 "Versailles propose un transfert de 30 000 £ par semaine pendant dix ans, quinze unités d’armes légères, une unité d’artillerie et des instructeurs. Le Congrès doit en échange une obligation et le remboursement du financement à l’échéance : environ 15,6 millions de livres, sans intérêts. La reconnaissance de dette couvre les versements prévus pendant tout l’engagement ; les fournitures et les instructeurs n’en font pas partie."
 aor1776_american_diplomacy.4.f:0 "Le courrier attendait près de la porte, son manteau encore humide. Sur la table, deux exemplaires portaient les mêmes chiffres. Il ne manquait plus que la décision du Congrès."
 aor1776_american_diplomacy.5.t:0 "Une convention restée sans sceau"
 aor1776_american_diplomacy.5.d:0 "Les conditions du traité ne permettent plus sa ratification : la guerre, les relations ou l’acheminement des fournitures ont changé. Aucun nouvel emprunt ni nouvelle obligation ne sont créés. Les négociations pourront reprendre si les conditions le permettent."
 aor1776_american_diplomacy.6.t:0 "Une réponse réservée"
 aor1776_american_diplomacy.6.d:0 "La cour refuse d’engager ses fonds dans les conditions proposées. Nous pourrons présenter une nouvelle demande dans trois mois."
 aor1776_american_diplomacy.1.a:0 "Portons ces lettres devant le Congrès."
 aor1776_american_diplomacy.2.a:0 "Promettre le remboursement sans intérêts."
 aor1776_american_diplomacy.2.b:0 "Consentir 5 % d’intérêts à l’échéance."
 aor1776_american_diplomacy.2.c:0 "Ne prenons pas cet engagement."
 aor1776_american_diplomacy.3.a:0 "Adresser une offre conforme à leur demande."
 aor1776_american_diplomacy.3.b:0 "Nos finances ne nous le permettent pas."
 aor1776_american_diplomacy.3.c:0 "Exiger 5 % d’intérêts à l’échéance."
 aor1776_american_diplomacy.4.d_high:0 "Versailles propose un transfert de 30 000 £ par semaine pendant dix ans, quinze unités d’armes légères, une unité d’artillerie et des instructeurs. Cette offre porte 5 % d’intérêts : le remboursement prévu à l’échéance atteint environ 16,4 millions de livres, contre 15,6 millions sans intérêts. Le secours reçu est le même ; les intérêts augmentent la dette. Le Congrès consent aussi une obligation. Les fournitures et les instructeurs ne sont pas ajoutés au capital."
 aor1776_american_diplomacy.4.a:0 "Ratifier le prêt sans intérêts."
 aor1776_american_diplomacy.4.b:0 "Refuser ces conditions."
 aor1776_debt.1.t:0 "Le temps des comptes"
 aor1776_debt.1.d:0 "[SCOPE.sCountry('aor1776_creditor').GetName] réclame le paiement de notre reconnaissance de dette, dont l’engagement est arrivé à son terme. La somme due, intérêts convenus compris, s’élève à [ROOT.GetCountry.MakeScope.Var('aor1776_debt_due').GetValue|0] £. Nous pouvons honorer notre signature ou répudier la créance au prix de notre réputation et de nos relations."
 aor1776_debt.1.f:0 "Le registre avait survécu aux changements de ministres. On y retrouvait les dates, les avances et les signatures que la paix n’avait pas effacées. Le messager du créancier n’éleva pas la voix ; il attendait une réponse."
 aor1776_debt.1.a:0 "Acquitter notre dette."
 aor1776_debt.1.b:0 "Nous ne reconnaîtrons plus cette créance."
 aor1776_deferred_debt:0 "Accord de remboursement différé"
 aor1776_deferred_debt_desc:0 "Prêter 10 000 £ au pays destinataire, avec son accord et sans intérêts, pour dix ans. À l’échéance, le créancier peut demander le remboursement. Un seul créancier peut détenir un accord en cours avec le même débiteur. Refuser le paiement coûte 10 d’infamie et 40 points de relations."
 aor1776_deferred_debt_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] reconnaît devoir à [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName] un capital contractuel de [SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.MakeScope.Var('aor1776_debt_principal').GetValue|0] £ à l’échéance. Le remboursement ne peut être réclamé pendant l’engagement. Les intérêts convenus s’ajoutent lors de la demande."
 aor1776_demand_debt_repayment:0 "Réclamer le remboursement de la dette"
 aor1776_demand_debt_repayment_desc:0 "Demander le capital convenu et les intérêts éventuels après la fin de l’engagement. Pour la convention américaine, le capital correspond à 30 000 £ par semaine sur la durée des dix ans. Le débiteur peut payer ou refuser ; son refus lui inflige 10 d’infamie et réduit nos relations de 40 points."
 aor1776_deferred_debt_action_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_propose_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_notification_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] et [TARGET_COUNTRY.GetName] concluent un accord de remboursement différé."
 aor1776_deferred_debt_action_notification_third_party_name:0 "$aor1776_deferred_debt$"
 aor1776_deferred_debt_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] et [TARGET_COUNTRY.GetName] traitent du remboursement de leurs avances."
 aor1776_demand_debt_repayment_action_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_propose_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_notification_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] nous demande de solder les avances reçues."
 aor1776_demand_debt_repayment_action_notification_third_party_name:0 "$aor1776_demand_debt_repayment$"
 aor1776_demand_debt_repayment_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] et [TARGET_COUNTRY.GetName] traitent du remboursement de leurs avances."
 aor1776_deferred_debt_action_break_name:0 "Clore l’accord de dette"
 aor1776_deferred_debt_article:0 "Reconnaissance de dette"
 aor1776_deferred_debt_article_effects_desc:0 "Le pays débiteur s’engage à rembourser le capital convenu à la fin de l’engagement. Le financement américain est calculé à partir de 30 000 £ par semaine et de la durée du traité. Les intérêts éventuellement promis s’ajoutent une seule fois lors de la demande. Un refus entraîne +10 d’infamie et −40 de relations avec le créancier."
 aor1776_deferred_debt_article_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] promet de rembourser [TARGET_COUNTRY.GetNameNoFormatting] à l’échéance"
 aor1776_war_credit_moderate:0 "Crédit de guerre de 14 000 £"
 aor1776_war_credit_moderate_effects_desc:0 "La France avance 14 000 £ par semaine, sans intérêts. Chaque versement est prélevé dans ses réserves et ajouté au capital dû par le Congrès. Les avances sont suspendues si ses réserves sont insuffisantes ou en cas de défaut. Elles cessent à la paix ou après le 3 septembre 1783."
 aor1776_war_credit_moderate_article_short_desc:0 "14 000 £ d’avances hebdomadaires de [SOURCE_COUNTRY.GetNameNoFormatting] à [TARGET_COUNTRY.GetNameNoFormatting]"
 aor1776_war_credit_extended:0 "Crédit de guerre de 21 000 £"
 aor1776_war_credit_extended_effects_desc:0 "La France avance 21 000 £ par semaine, avec 5 % d’intérêts à la clôture. Chaque versement est prélevé dans ses réserves et ajouté au capital dû par le Congrès. Les avances sont suspendues si ses réserves sont insuffisantes ou en cas de défaut. Elles cessent à la paix ou après le 3 septembre 1783."
 aor1776_war_credit_extended_article_short_desc:0 "21 000 £ d’avances hebdomadaires de [SOURCE_COUNTRY.GetNameNoFormatting] à [TARGET_COUNTRY.GetNameNoFormatting]"
 aor1776_revolution_military_assistance:0 "Instructeurs au service du Congrès"
 aor1776_revolution_military_assistance_effects_desc:0 "Les instructeurs français augmentent de 10 % la vitesse de formation et le gain d’expérience des unités américaines. Leur entretien augmente de 5 % le coût des biens militaires français. Cette assistance accompagne l’engagement de dix ans."
 aor1776_revolution_military_assistance_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] fournit des instructeurs à [TARGET_COUNTRY.GetNameNoFormatting]"
 intervene_in_war:0 "Rejoindre une guerre en cours"
 intervene_in_war_action_name:0 "Rejoindre les guerres du pays"
 intervene_in_war_desc:0 "Rejoindre les guerres dirigées par le pays destinataire, ou les guerres dans lesquelles il combat déjà si nous sommes alliés. Un accès terrestre ou côtier est nécessaire ; les trêves avec ses ennemis empêchent l’intervention."
 intervene_in_war.tt:0 "Rejoindre les guerres dirigées par le pays soutenu."
 intervene_in_war_action_notification_name:0 "Une nouvelle intervention"
 intervene_in_war_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] rejoint le camp de [TARGET_COUNTRY.GetName]."
 intervene_in_war_action_notification_third_party_name:0 "Une nouvelle intervention"
 intervene_in_war_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] rejoint le camp de [TARGET_COUNTRY.GetName]."
 join_war:0 "Entrée en guerre"
 join_war_effects_desc:0 "Le pays qui s’engage rejoint les guerres dirigées par l’autre pays. Si les deux pays sont alliés, le pays soutenu peut aussi être un participant de second rang. Une clause d’appel au Pacte de famille ne porte que sur la guerre américaine. Cette entrée ne dépend plus du traité une fois la guerre rejointe."
 join_war_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] rejoint le camp de [TARGET_COUNTRY.GetNameNoFormatting]"
 ai_strategy_aor1776_french_revolution_war:0 "Porter la guerre contre la Grande-Bretagne"
 ai_strategy_aor1776_french_revolution_war_desc:0 "Développer l’armée, la flotte et les chantiers navals pour vaincre la Grande-Bretagne. L’objectif de guerre français demande l’occupation de sa capitale."
 ai_strategy_aor1776_spanish_revolution_war:0 "Reconquérir les possessions disputées"
 ai_strategy_aor1776_spanish_revolution_war_desc:0 "Renforcer l’armée et la flotte pour reprendre les possessions britanniques revendiquées par l’Espagne."
 aor1776_break_british_power:0 "Briser la puissance britannique"
 war_goal_aor1776_break_british_power:0 "Briser la puissance britannique"
 war_goal_aor1776_break_british_power_type_name:0 "Briser la puissance britannique"
 war_goal_aor1776_break_british_power_desc:0 "Imposer une humiliation à la Grande-Bretagne. Cet objectif demande de contrôler sa capitale et ne cède aucun territoire."
 war_goal_aor1776_break_british_power_type_desc:0 "Imposer une humiliation à la Grande-Bretagne. Cet objectif demande de contrôler sa capitale et ne cède aucun territoire."
 war_goal_aor1776_break_british_power_sway_desc:0 "Imposer une humiliation à la Grande-Bretagne. Cet objectif demande de contrôler sa capitale et ne cède aucun territoire."
 aor1776_support_supplies_effects_desc:0 "$aor1776_support_supplies_desc$"
 aor1776_support_supplies_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] fournit des armes à [TARGET_COUNTRY.GetNameNoFormatting]"
 aor1776_deferred_debt_proposal_notification_name:0 "Offre de prêt à remboursement différé"
 aor1776_deferred_debt_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] propose un prêt de 10 000 £ sans intérêts, remboursable à l’issue de dix ans d’engagement. Refuser alors le paiement nous coûtera 10 d’infamie et 40 points de relations."
 aor1776_deferred_debt_proposal_accepted_name:0 "Prêt accepté"
 aor1776_deferred_debt_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepte notre prêt de 10 000 £ et son remboursement après dix ans."
 aor1776_deferred_debt_proposal_declined_name:0 "Prêt refusé"
 aor1776_deferred_debt_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] refuse notre proposition de prêt. Aucune somme n’est avancée."
 aor1776_deferred_debt_proposal_third_party_accepted_name:0 "Accord de crédit conclu"
 aor1776_deferred_debt_proposal_third_party_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepte le prêt de [INITIATOR_COUNTRY.GetName], avec remboursement différé."
 aor1776_deferred_debt_proposal_third_party_declined_name:0 "Accord de crédit refusé"
 aor1776_deferred_debt_proposal_third_party_declined_desc:0 "[TARGET_COUNTRY.GetName] refuse le prêt proposé par [INITIATOR_COUNTRY.GetName]."
 aor1776_r3_offer_still_valid_tt:0 "La proposition est encore valable, aucun autre crédit n’est ouvert et la France dispose de 30 000 £ de réserves sans être en défaut."
 aor1776_r3_no_existing_debt_tt:0 "Le pays destinataire n’a aucun accord de crédit à remboursement différé en cours."
 aor1776_r3_no_pending_demand_tt:0 "Aucune demande de remboursement de cette dette n’attend déjà une réponse."
 aor1776_american_diplomacy.3.d_high:0 "Le Congrès demande 30 000 £ par semaine pendant dix ans, quinze unités d’armes légères, une unité d’artillerie et des instructeurs. Il promet une obligation et une reconnaissance de dette sur le financement prévu, avec 5 % d’intérêts à l’échéance. Notre accord lui adressera une offre qu’il pourra encore refuser."
 aor1776_support_money_effects_desc:0 "$aor1776_support_money_desc$"
 aor1776_support_money_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] verse 30 000 £ par semaine à [TARGET_COUNTRY.GetNameNoFormatting]"
 aor1776_r4_debt_unbound_tt:0 "Les dix ans d’engagement sont terminés et aucun traité portant cette reconnaissance de dette ne lie encore les deux pays."
 aor1776_deferred_debt_action_notification_break_name:0 "Accord de dette clos"
 aor1776_deferred_debt_action_notification_break_desc:0 "L’accord de dette entre [INITIATOR_COUNTRY.GetName] et [TARGET_COUNTRY.GetName] a pris fin."
 aor1776_deferred_debt_action_notification_third_party_break_name:0 "Accord de dette clos"
 aor1776_deferred_debt_action_notification_third_party_break_desc:0 "L’accord de dette entre [INITIATOR_COUNTRY.GetName] et [TARGET_COUNTRY.GetName] a pris fin."
 aor1776_call_family_compact:0 "Appeler l’allié du Pacte de famille"
 aor1776_call_family_compact_desc:0 "Demander à l’Espagne, notre alliée, de rejoindre notre camp dans la guerre américaine. Son acceptation ratifie une clause d’entrée en guerre. Elle peut refuser selon sa situation ; l’appel n’entraîne aucune participation automatique avant son accord."
 aor1776_call_family_compact_action_name:0 "Appeler l’Espagne en guerre"
 aor1776_call_family_compact_action_propose_name:0 "Appeler l’Espagne en guerre"
 aor1776_call_family_compact_action_notification_name:0 "L’Espagne répond à l’appel"
 aor1776_call_family_compact_action_notification_desc:0 "[TARGET_COUNTRY.GetName] accepte l’appel de [INITIATOR_COUNTRY.GetName] et rejoint son camp dans la guerre américaine."
 aor1776_call_family_compact_action_notification_third_party_name:0 "L’Espagne répond à l’appel"
 aor1776_call_family_compact_action_notification_third_party_desc:0 "[TARGET_COUNTRY.GetName] rejoint la guerre américaine à la demande de [INITIATOR_COUNTRY.GetName], au nom de leur alliance."
 aor1776_call_family_compact_proposal_notification_name:0 "Un appel au nom du Pacte de famille"
 aor1776_call_family_compact_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] nous demande de rejoindre son camp dans la guerre américaine contre la Grande-Bretagne. L’alliance ne nous oblige pas à accepter cet appel."
 aor1776_call_family_compact_proposal_accepted_name:0 "L’appel aux armes est accepté"
 aor1776_call_family_compact_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepte notre appel et rejoint notre camp dans la guerre américaine."
 aor1776_call_family_compact_proposal_declined_name:0 "L’appel aux armes est refusé"
 aor1776_call_family_compact_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] refuse notre appel et ne rejoint pas la guerre américaine."
 aor1776_call_family_compact_proposal_third_party_accepted_name:0 "L’Espagne entre en guerre"
 aor1776_call_family_compact_proposal_third_party_accepted_desc:0 "[TARGET_COUNTRY.GetName] accepte l’appel de son allié [INITIATOR_COUNTRY.GetName] dans la guerre américaine."
 aor1776_call_family_compact_proposal_third_party_declined_name:0 "L’Espagne décline l’appel"
 aor1776_call_family_compact_proposal_third_party_declined_desc:0 "[TARGET_COUNTRY.GetName] refuse de rejoindre son allié [INITIATOR_COUNTRY.GetName] dans la guerre américaine."
 aor1776_family_compact_call_treaty:0 "Appel aux armes du Pacte de famille"
 aor1776_american_diplomacy.4.t_high:0 "L’offre de Versailles — intérêts à 5 %"
 aor1776_american_diplomacy.4.c:0 "Ratifier le prêt avec 5 % d’intérêts."
 aor1776_r5_ratification_no_interest_tt:0 "Signer le traité : 30 000 £ par semaine pendant dix ans, quinze armes légères, une artillerie et des instructeurs. Une obligation est consentie à la France. Le capital prévu, environ 15,6 millions de livres, sera remboursable après l’engagement, sans intérêts."
 aor1776_r5_ratification_interest_tt:0 "Signer le traité : 30 000 £ par semaine pendant dix ans, quinze armes légères, une artillerie et des instructeurs. Une obligation est consentie à la France. Le remboursement prévu après l’engagement atteint environ 16,4 millions de livres : le même capital, augmenté une seule fois de 5 % d’intérêts."
 aor1776_r5_american_intervention_stake_tt:0 "Pour intervenir dans la guerre américaine, le pays doit avoir un intérêt actif sur la côte atlantique, soutenir les insurgés comme la France ou l’Espagne, soutenir le camp britannique comme allié portugais, ou combattre la Grande-Bretagne en tant que rival."
