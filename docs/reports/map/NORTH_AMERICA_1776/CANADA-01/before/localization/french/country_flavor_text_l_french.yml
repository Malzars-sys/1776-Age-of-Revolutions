 GENERIC_FLAVOR_TEXT:0 "Le XVIIIe siècle est une époque d’industrie et d’exploitation, de révolution et de réaction. Quels nouveaux défis les temps apporteront-ils ?"
 REV_GENERIC_FLAVOR_TEXT:1 "Mécontents de la direction prise par le gouvernement établi, ces révolutionnaires ont pris les armes pour le renverser. Réussiront-ils à s’emparer du pouvoir ou seront-ils écrasés ?"
 DECENTRALIZED_FLAVOR_TEXT:0 "Enserré par des puissances mieux organisées, ce pays lutte pour conserver son autonomie. Verra-t-il l’aube d’un nouveau siècle, ou son nom ne survivra-t-il que dans les livres d’histoire ?"

