 OMA_FLAVOR_TEXT:0 "Ruling over both Oman and Zanzibar, the Sultanate is establishing an intercontinental’empire. Can Oman remain united’"

 KOR_FLAVOR_TEXT:0 "Known as Little China. Korea under the Joseon dynasty looks inward, consumed by its factional politics. Will changing times force Korea to consider the outside world’"
 NOR_FLAVOR_TEXT:0 "La Norvège a passé plusieurs siècles sous domination danoise et suédoise, mais rêve aujourd’hui de souveraineté. Parviendra-t-elle néanmoins à gagner son indépendance ?"
 FIN_FLAVOR_TEXT:0 "Jusqu’ici, la Finlande a toujours bénéficié d’une relative autonomie sous la domination de l’Empire russe. Mais les tsars sont capricieux... Comment les Russes décideront-ils de traiter la Finlande ?"
  
  #South and Central America
 UCA_FLAVOR_TEXT:0 "L’Amérique espagnole observe avec intérêt la Révolution américaine. Si elle réussit, l’Espagne pourra-t-elle garder ces colonies sous sa coupe ?"
