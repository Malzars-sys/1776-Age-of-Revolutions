 HOL_FLAVOR_TEXT:0 "$GERMAN_FLAVOR_TEXT$"
 
 # Poland
 KRA_FLAVOR_TEXT:1 "La destinée du peuple polonais pèse lourdement sur les épaules de l’État libre de Cracovie, dont les puissances constituantes se méfient et qui est occupé par l’Autriche. L’État polonais peut-il renaître de ses cendres ?"
  
  # North America
 QUE_FLAVOR_TEXT:0 "Ancienne colonie de la Nouvelle-France, le Bas-Canada est désormais sous autorité britannique. Les tensions entre la population majoritairement française et le gouvernement colonial menacent de s’intensifier dans un avenir proche, ne laissant que peu de chances à une résolution pacifique. Le Québec gagnera-t-il sa liberté ?"
 ONT_FLAVOR_TEXT:0 "Encouragés par les tensions croissantes au Bas-Canada, les habitants de la province du Haut-Canada se préparent à résister au gouvernement colonial. L’Ontario gagnera-t-il sa liberté ?"
 HBC_FLAVOR_TEXT:0 "La Compagnie de la Baie d’Hudson est prête à tout pour protéger son monopole sur la traite des fourrures. La Compagnie conclut et rompt des accords comme bon lui semble avec les Premières Nations, sans autre considération que le profit. Cette méthode sera-t-elle suffisante pour garantir la survie de la Compagnie ?"
 NBS_FLAVOR_TEXT:0 "La colonie du Nouveau-Brunswick s’est fait un nom dans l’industrie florissante de la construction navale, des colons arrivant tout droit d’Écosse et d’Irlande pour travailler le bois. Le Nouveau-Brunswick sera-t-il le chef de file d’un Canada uni ?"
 ORG_FLAVOR_TEXT:0 "Actuellement sous administration relativement autonome, la Compagnie de la Baie d’Hudson et le gouvernement américain s’intéressent tous deux au district contesté du Columbia. L’une de ces deux puissances triomphera-t-elle, ou le territoire de l’Oregon gagnera-t-il son indépendance ?"
 TEX_FLAVOR_TEXT:0 "La nouvelle République du Texas est engagée dans une guerre apparemment impossible contre les suzerains mexicains. Un miracle sauvera-t-il l’État de l’étoile solitaire ?"
 HAI_FLAVOR_TEXT:0 "Haïti est une colonie esclavagiste d’une brutalité particulière, où les propriétaires d’esclaves français vivent dans la crainte constante d’une révolte. Restera-t-elle une simple tirelire de ressources, ou connaîtra-t-elle un avenir plus libéral ?"
 CUB_FLAVOR_TEXT:0 "Les relations de Cuba avec ses suzerains espagnols se sont tendues. Les demandes de représentation au Parlement espagnol et la résistance à l’abolition de l’esclavage se heurtent à l’hostilité de Madrid. Une révolution cubaine est-elle inévitable ?"
  
  #Central Asia
 KHI_FLAVOR_TEXT:0 "Défiant à la fois la Perse et la Russie, le khanat de Khiva est une puissance indépendante florissante sous le règne des khans. Réussira-t-il à protéger son indépendance ?"
 BUK_FLAVOR_TEXT:0 "Contrairement aux khanats voisins, les émirats de Boukhara ont adopté la loi islamique plutôt que de fonder leur légitimité sur la descendance de Genghis Khan. La foi l’emportera-t-elle ?"
 KOK_FLAVOR_TEXT:0 "Le khanat de Kokand lutte contre la désunion et la discorde au sein de la cour du khan. Pourra-t-il s’imposer comme une puissance dominante en Asie centrale ?"
 KAB_FLAVOR_TEXT:1 "La chute de l’Empire durrani a plongé le pays dans une guerre civile permanente opposant des prétendants au trône. L’ambitieux émir Dost Mohammad pourra-t-il réunifier l’Afghanistan et asseoir la dynastie Barakzai au pouvoir ?"
 HER_FLAVOR_TEXT:1 "La guerre civile en Afghanistan a laissé l’émirat de Hérat comme dernier bastion du pouvoir durrani. Les héritiers de la dynastie pourront-ils résister aux incursions perses et réunifier l’Afghanistan sous leur empire restauré ?"
 KAN_FLAVOR_TEXT:1 "The Principality of Kandahar declared independence from Afghanistan in 1818, but soon fell into infighting between its confederal rulers. Can the reigning Dil brothers settle their differences, and eclipse the Emir of Kabul’"
 AFGHAN_MINOR_FLAVOR_TEXT: "La chute de l’Empire durrani a plongé le pays dans une guerre civile permanente opposant des prétendants au trône. Les khanats du nord réussiront-ils à affirmer leur indépendance au milieu des princes afghans en guerre et à fonder leurs propres empires ?"
 MAI_FLAVOR_TEXT: "$AFGHAN_MINOR_FLAVOR_TEXT$"
 KUN_FLAVOR_TEXT: "$AFGHAN_MINOR_FLAVOR_TEXT$"
 CHT_FLAVOR_TEXT: "La chute de l’Empire durrani a plongé le pays dans une guerre civile permanente opposant des prétendants au trône. L’État de Chitral réussira-t-il à faire face à l’Empire sikh, à la renaissance des États afghans et à l’expansion britannique dans l’Hindou Kouch ?"
 KAF_FLAVOR_TEXT: "Entouré de puissances islamiques de plus en plus belliqueuses, le royaume dit des « infidèles » de l’Hindou Kouch fait face à un avenir incertain. Le Kafiristan pourra-t-il préserver ses coutumes, ou sera-t-il relégué aux notes de bas de page de l’histoire ?"
 MAK_FLAVOR_TEXT: "L’État de Kalat s’est forgé une sphère d’influence à la suite de la chute de l’Empire durrani. Les tribus de Makran réussiront-elles à préserver leur territoire face aux menaces que représentent la Perse et les princes afghans ?"
 KAL_FLAVOR_TEXT: "L’État de Kalat s’est forgé une sphère d’influence à la suite de la chute de l’Empire durrani. Réussira-t-il à maintenir la souveraineté à laquelle il aspire depuis longtemps et à étendre son empire pour rivaliser avec ses voisins ?"
 TRM_FLAVOR_TEXT: "$DECENTRALIZED_FLAVOR_TEXT$"
 ZHUZ_FLAVOR_TEXT: "L’expansion russe dans la steppe kazakhe a pris une nouvelle forme depuis que le tsar de Russie a récemment promulgué des décrets abolissant la position et les pouvoirs des khans. Les jüz kazakhs se libéreront-ils, ou glisseront-ils plus encore sous la domination russe ?"
 KZH_FLAVOR_TEXT: "$ZHUZ_FLAVOR_TEXT$"
 OZH_FLAVOR_TEXT: "$ZHUZ_FLAVOR_TEXT$"
 UZH_FLAVOR_TEXT: "$ZHUZ_FLAVOR_TEXT$"
 ARB_FLAVOR_TEXT: "Le règne du cheikh Jaber al-Kaabi a donné au cheikhat de Muhammarah une souveraineté de fait. Muhammarah conservera-t-elle son statut privilégié et deviendra-t-elle un centre de pouvoir à part entière ?"
  
  # Maghreb
 TRI_FLAVOR_TEXT:1 "Suivant une longue période d’indépendance de facto, la Tripolitaine est retombée sous l’autorité de l’Empire ottoman. Est-ce le retour des Barbaresques ?"
 TUN_FLAVOR_TEXT:0 "Après avoir été contrainte de mettre un terme au financement des raids barbaresques, l’économie tunisienne a commencé à plonger. Le bey réussira-t-il à restaurer la prospérité de son pays ?"
 ALD_FLAVOR_TEXT:0 "Après les guerres barbaresques, l’Algérie a perdu une grande partie de son littoral au profit de la France. Les vestiges de la nation pourront-ils repousser de nouvelles incursions françaises ?"
 MOR_FLAVOR_TEXT:0 "N’étant plus sous protection ottomane, le Maroc est maintenant vulnérable aux politiques d’expansionnisme française et espagnole. Le Maroc survivra-t-il à l’assaut impérialiste ?"
  # Africa
 SOK_FLAVOR_TEXT:0 "Sous la bannière des Peuls, le califat de Sokoto est en pleine expansion. Mais pourra-t-il réunir l’Afrique de l’Ouest et résister aux puissances occidentales ?"
 GREAT_LAKES_FLAVOR_TEXT:0 "Les peuples des Grands Lacs ont établi de jeunes empires, dominant l’eau comme la terre. Une grande nation naîtra-t-elle parmi eux ?"
 BUG_FLAVOR_TEXT:1 "$GREAT_LAKES_FLAVOR_TEXT$"
 ACH_FLAVOR_TEXT:1 "$GREAT_LAKES_FLAVOR_TEXT$"
 BNY_FLAVOR_TEXT:1 "$GREAT_LAKES_FLAVOR_TEXT$"
 ANK_FLAVOR_TEXT:1 "$GREAT_LAKES_FLAVOR_TEXT$"
 TGR_FLAVOR_TEXT:0 "L’Éthiopie traverse l’Ère des Princes. L’empereur à Gondar ne détient aucun pouvoir effectif et les seigneurs locaux se partagent le pays. L’empire sera-t-il un jour réuni ?"
 WLO_FLAVOR_TEXT:0 "$TGR_FLAVOR_TEXT$"
 BGM_FLAVOR_TEXT:0 "$TGR_FLAVOR_TEXT$"
 GJM_FLAVOR_TEXT:0 "$TGR_FLAVOR_TEXT$"
 WLG_FLAVOR_TEXT:0 "$TGR_FLAVOR_TEXT$"
 KFA_FLAVOR_TEXT:0 "$TGR_FLAVOR_TEXT$"
 SHW_FLAVOR_TEXT:0 "$TGR_FLAVOR_TEXT$"
 SDM_FLAVOR_TEXT:0 "$TGR_FLAVOR_TEXT$"
 BRN_FLAVOR_TEXT:0 "$TGR_FLAVOR_TEXT$"
 HAR_FLAVOR_TEXT:0 "$TGR_FLAVOR_TEXT$"
 AWS_FLAVOR_TEXT:0 "$TGR_FLAVOR_TEXT$"
 SAF_FLAVOR_TEXT:0 "Originally a Dutch trading post, the Cape Colony has recently become a British Crown Colony with most of its former autonomy curtailed. Now, tensions are rising between the British crown and the Boer states to the north, while in the east, the power of the Zulu Empire is growing. How will the Cape Colony weather the struggles ahead’"
  
  # India
 BIC_FLAVOR_TEXT:0 "D’abord établie comme factorerie, l’Inde devient le joyau de la couronne du jeune Empire britannique. Tandis que l’Empire moghol décline rapidement et que la Confédération marathe gagne du terrain, la Compagnie des Indes orientales peut-elle obtenir l’hégémonie sur ce vaste espace tout en satisfaisant ses actionnaires ?"
 JAS_FLAVOR_TEXT:0 "L’Empire moghol est tombe, et la Confédération marathe comme diverses puissances européennes se disputent le sous-continent. Les nawabs conservent une forte autorité locale, mais devront repondre a l’hegemon du moment."
 JOD_FLAVOR_TEXT:0 "$JAS_FLAVOR_TEXT$"
 BIK_FLAVOR_TEXT:0 "$JAS_FLAVOR_TEXT$"
 JAI_FLAVOR_TEXT:0 "$JAS_FLAVOR_TEXT$"
