 BCE_FLAVOR_TEXT:0 "Après la fin des guerres kandyennes, les plateaux fertiles de Ceylan ont vu naître de nombreuses plantations, alimentées en partie par l’importation d’ouvriers tamoules venus du continent. Ceylan parviendra-t-il à suivre cette dynamique, ou succombera-t-il aux conflits internes ?"
 MLD_FLAVOR_TEXT:0 "Relativement isolées, les Maldives ont prospéré sous protection britannique, à l’abri des pirates qui menaçaient autrefois leurs côtes. Y aura-t-il un jour du changement pour cette petite nation insulaire ?"
  
  # Middle-East
 EGY_FLAVOR_TEXT:0 "Sous les mamelouks, l’Égypte dispose d’une large autonomie dans ses affaires internes. Alors que l’Empire ottoman semble décliner, l’Égypte peut-elle devenir plus qu’une simple province ottomane ?"
 HDJ_FLAVOR_TEXT:0 "À mesure que l’Empire ottoman décline, l’avenir de l’Arabie devient plus incertain. Une nouvelle puissance surgira-t-elle du désert ?"
