l_french:
  # Modded Countries
 IREK_FLAVOR_TEXT:0 "L’Irlande vit dans une union mal assurée avec la Grande-Bretagne, liée par la Couronne au-delà de la mer d’Irlande. Le Parlement irlandais siège a Dublin, mais le pouvoir appartient a l’Ascendance protestante."

 DEI_FLAVOR_TEXT:0 "La Compagnie néerlandaise des Indes orientales est devenue un succès éclatant et suscite la jalousie de l’Europe. Son objectif est de monopoliser les routes commerciales et le commerce des épices."

 DWI_FLAVOR_TEXT:0 "La Compagnie néerlandaise des Indes occidentales détient un monopole des Amériques a l’Afrique de l’Ouest, afin de défier les Portugais et les Espagnols dans l’Atlantique."

 LOU_FLAVOR_TEXT:0 "Ancienne colonie française remise à l’Espagne, la Louisiane se trouve juste à côté des colonies rebelles des États-Unis. Quelle sera sa place dans l’Empire espagnol ?"

 PLC_FLAVOR_TEXT:0 "La République des Deux Nations, autrefois grande puissance européenne, a décliné jusqu’à devenir presque un protectorat de la Russie tsariste. Sans réforme, peut-elle survivre à ce siècle ?"

 CRI_FLAVOR_TEXT:0 "Le khanat de Crimée est tout ce qui reste de la Horde d’Or, désormais sous protection ottomane. La Russie convoite ses terres ; ce vieux vestige de l’empire mongol peut-il durer ?"

 VEN_FLAVOR_TEXT:0 "La République marchande de Venise traverse une période réactionnaire après un fort déclin. Venise peut-elle ressurgir et redevenir la grande puissance commerciale de l’Europe ?"

 MLT_FLAVOR_TEXT:0 "L’Ordre souverain militaire de Malte est le dernier État croisé de son espèce. Les chevaliers et l’Église tiennent fermement l’île. Sa souveraineté survivra-t-elle ?"

 DUR_FLAVOR_TEXT:0 "L’Empire durrani, mosaïque de confédérations afghanes, s’est imposé au Moyen-Orient. Mais ses fondations restent fragiles face à la Perse, aux Sikhs et aux Marathes."

 MARATH_FLAVOR_TEXT:0 "La Confédération marathe est devenue un acteur majeur de la lutte pour l’hégémonie sur le sous-continent indien. Peut-elle maintenir l’équilibre des puissances en Inde ?"
 
 # Base Game Countries
 
 GBR_FLAVOR_TEXT:0 "La Grande-Bretagne est entrée dans le XVIIIe siècle en remportant la guerre de Sept Ans. Protégée par les mers et par sa marine, elle est bien placée pour bâtir un empire outre-mer, mais les Treize Colonies se sont révoltées."

 BEL_FLAVOR_TEXT:0 "En Belgique, la révolution industrielle bat son plein. Le joug néerlandais a été rejeté il y a seulement six ans, et le pays devance déjà ses anciens maîtres avec la construction du premier chemin de fer d’Europe continentale. Que lui réserve l’avenir ?"

 CHI_FLAVOR_TEXT:1 "La dynastie Qing contrôle environ un tiers de la population mondiale après l’apogée de sa puissance sous l’empereur Qianlong. Mais l’isolationnisme et l’avance technologique européenne menacent son équilibre."

 TIB_FLAVOR_TEXT:0 "Le jeune dalaï-lama est le chef théocratique du Tibet. Le bouddhisme restera-t-il au cœur du pouvoir politique ?"

 FRA_FLAVOR_TEXT:0 "La France panse encore ses plaies après l’humiliante défaite de la guerre de Sept Ans. Louis XV peut-il la ramener parmi les grandes puissances, ou l’avenir sera-t-il plus libéral ?"

 RUS_FLAVOR_TEXT:0 "Catherine la Grande a saisi le trône russe et ouvre une période de modernisation et d’expansion. La Russie vivra-t-elle a la hauteur de sa réputation ?"

 PRU_FLAVOR_TEXT:0 "La Prusse est un cœur technologique et militaire du Saint-Empire, tout en étant une grande puissance indépendante. Peut-elle unifier l’Allemagne ?"

 JAP_FLAVOR_TEXT:0 "Le shogunat Tokugawa a unifié le Japon sous ses seigneurs féodaux, mais le monde change autour d’un Japon isolationniste. Peut-il préserver sa culture et sa souveraineté ?"

 PER_FLAVOR_TEXT:0 "La Perse se remet de quarante années de guerre civile. Karim Khan Zand a ramené la stabilité, mais survivra-t-elle à sa mort ?"

 AUS_FLAVOR_TEXT:0 "L’Autriche est de jure empereur du Saint-Empire, mais le déclin de l’Empire inquiète. Peut-elle le relever ou tout est-il perdu ?"

 USA_FLAVOR_TEXT:1 "Les Treize Colonies se sont déclarées États-Unis d’Amérique indépendants. Obtiendront-elles la liberté, ou la mort ?"

 TUR_FLAVOR_TEXT:0 "L’Empire ottoman recule depuis l’échec du siège de Vienne. Peut-il survivre à cette époque, voire prospérer ?"

 SPA_FLAVOR_TEXT:1 "Charles III a apporté l’esprit des Lumières à l’Espagne et renforcé la couronne. Mais avec la Révolution américaine, l’Espagne peut-elle garder ses possessions américaines ?"

 BRZ_FLAVOR_TEXT:0 "Le Brésil est la plus précieuse possession coloniale du Portugal, vaste et riche en ressources. Obtiendra-t-il le statut de royaume ou suivra-t-il sa propre voie ?"

 MEX_FLAVOR_TEXT:0 "La Nouvelle-Espagne est l’un des joyaux de la Couronne espagnole. Restera-t-elle loyale avec les États-Unis rebelles à sa porte ?"

 NET_FLAVOR_TEXT:0 "Les Pays-Bas se trouvent au cœur de l’Europe et possèdent encore un empire outre-mer par leurs compagnies. Peuvent-ils retrouver leur grandeur commerciale ?"

 POR_FLAVOR_TEXT:0 "Le Portugal possède un vaste empire, mais celui-ci exige une vaste protection. Peut-il revenir plus fort ?"

 SAR_FLAVOR_TEXT:0 "Dirigée par la maison de Savoie entre les grandes puissances européennes, la Sardaigne-Piémont peut-elle survivre et nourrir de grandes ambitions ?"

 PAN_FLAVOR_TEXT:0 "L’Empire sikh est en période de conquête. Que lui réserve l’avenir ?"

 DENNOR_FLAVOR_TEXT:0 "Le Danemark-Norvège forme un État unitaire qui pèse plus lourd que sa taille grâce au commerce, aux détroits et à ses colonies. Peut-il poursuivre ses succès ?"

 SWE_FLAVOR_TEXT:0 "La Suède a perdu son statut de grande puissance après ses affrontements avec la Russie. Le regagnera-t-elle ou est-il perdu pour toujours ?"
  
  # South-East Asia
 LAN_FLAVOR_TEXT:0 "La République de Lanfang a été fondée par un syndicat démocratique de mineurs chinois espérant exploiter les réserves d’or de Bornéo. Lanfang pourra-t-elle résister aux avancées néerlandaises et atteindre la prospérité qu’elle recherche ?"
 ACE_FLAVOR_TEXT:0 "Le sultanat d’Aceh connaît un renforcement de son pouvoir grâce aux efforts du Raja Muda. Aceh réussira-t-il à restaurer son empire et à affirmer son indépendance face à la croissance néerlandaise ?"
 BRU_FLAVOR_TEXT:0 "Brunei a jusqu’ici repoussé les tentatives des puissances coloniales de porter atteinte à sa souveraineté. Tombera-t-il dans le déclin et l’obscurité, ou redeviendra-t-il une puissance régionale ?"
 JOH_FLAVOR_TEXT:0 "Johor occupe une position précaire, puisque les Britanniques et les Néerlandais convoitent ce territoire. Cet État réussira-t-il à conserver le peu de souveraineté qu’il lui reste ?"
 SIA_FLAVOR_TEXT:0 "Sous la dynastie de Rattanakosin, le Siam s’est imposé comme la puissance régionale dominante d’Asie du Sud-Est. Mais réussira-t-il à réformer son économie et sa société pour les adapter à l’époque moderne ?"
 DAI_FLAVOR_TEXT:0 "Un Vietnam récemment réunifié émerge de siècles de divisions et de conflits. Le Dai Nam se consolidera-t-il pour bâtir une grande nation, ou est-il destiné à se diviser de nouveau ?"
 BUR_FLAVOR_TEXT:0 "Il a fallu bon nombre de conflits sanglants pour former le troisième Empire birman, et la lutte semble encore loin d’être terminée face aux intérêts britanniques. La Birmanie deviendra-t-elle une autre colonie britannique, ou se montrera-t-elle assez forte devant les envahisseurs étrangers ?"
 CAM_FLAVOR_TEXT:0 "Le Cambodge est tombé bien bas depuis l’âge d’or de l’empire khmer. Peut-il encore renaître de ses cendres ou est-il condamné à vivre dans l’ombre ?"
 LUA_FLAVOR_TEXT:0 "Ancienne capitale du puissant royaume du Lan Xang, Luang Prabang n’est plus que l’ombre d’elle-même. Situé entre les puissances régionales du Dai Nam et du Siam, son peuple pourra-t-il néanmoins gagner son indépendance ?"
  
  # Australia
 UNT_FLAVOR_TEXT:0 "$GENERIC_FLAVOR_TEXT$"
 NSW_FLAVOR_TEXT:0 "Passant d’une colonie pénitentiaire à une colonie de la Couronne, la Nouvelle-Galles du Sud a vu son territoire se réduire à mesure que les autres provinces obtenaient leur propre administration. Que réserve l’avenir à l’Australie ?"
 SAS_FLAVOR_TEXT:0 "L’Australie-Méridionale a obtenu sa propre administration il y a seulement deux ans en se séparant de la Nouvelle-Galles du Sud. Que réserve l’avenir à l’Australie ?"
 WAS_FLAVOR_TEXT:0 "Les colons de la Swan ont envahi les terres traditionnelles des aborigènes, provoquant la bataille de Pinjarra deux ans auparavant. Comment la colonie va-t-elle régler ce conflit ?"
 TAS_FLAVOR_TEXT:0 "La Terre de Van Diemen est la principale colonie pénitentiaire d’Australie britannique. Qu’est-ce que l’avenir réserve à cette colonie de bagnards ?"

  # Balkans
 SER_FLAVOR_TEXT:0 "La Serbie a longuement lutté pour obtenir son indépendance, et devra certainement continuer à se battre pour la conserver. Située au milieu de grandes puissances, la Serbie deviendra-t-elle la poudrière de l’Europe ?"
 GRE_FLAVOR_TEXT:0 "Au terme d’un conflit sanglant, la Grèce a obtenu son indépendance vis-à-vis de l’Empire ottoman. Réussira-t-elle maintenant à étendre ses frontières ?"
 WAL_FLAVOR_TEXT:0 "Les appels à l’unification et à l’indépendance politique de la Roumanie ne font que compliquer la politique régionale, puisque la Russie et les Ottomans ont un intérêt à appliquer le statu quo. La Roumanie parviendra-t-elle à gagner sa liberté ?"
 MOL_FLAVOR_TEXT:0 "Les appels à l’unification et à l’indépendance politique de la Roumanie ne font que compliquer la politique régionale, puisque la Russie et les Ottomans ont un intérêt à appliquer le statu quo. La Roumanie parviendra-t-elle à gagner sa liberté ?"
 ION_FLAVOR_TEXT:0 "Au cours des 30 dernières années, les Îles sont passées de la domination ottomane à la domination russe, française et enfin britannique. Les insulaires peuvent-ils s’unir avec le nouvel État grec ou chercheront-ils une nouvelle voie sous la direction des Britanniques ?"
  
  # Italy
 PAP_FLAVOR_TEXT:0 "Bien que le pouvoir politique de l’Église catholique se soit affaibli au fil des siècles, le pape préside toujours les États pontificaux. Mais la foi anime-t-elle encore le cœur des hommes ?"
 TUS_FLAVOR_TEXT:0 "$GENERIC_FLAVOR_TEXT$"
 SIC_FLAVOR_TEXT:0 "La répression politique des libéraux et des séparatistes siciliens s’est avérée inefficace, puisque les deux mouvements ne cessent de gagner de l’ampleur et des partisans. À quoi ressemblera le royaume des Deux-Siciles quand la situation aura inévitablement atteint le point de non-retour ?"
 PAR_FLAVOR_TEXT:0 "$GENERIC_FLAVOR_TEXT$"
 LUC_FLAVOR_TEXT:1 "$GENERIC_FLAVOR_TEXT$"
 MOD_FLAVOR_TEXT:1 "Le duché de Modène est à la fois gouverné et politiquement soumis aux Habsbourg et à l’Empire autrichien. Modène arrivera-t-elle à se libérer des chaînes de la loyauté familiale ?"
  
  # Germans
 BAV_FLAVOR_TEXT:0 "$GERMAN_FLAVOR_TEXT$"
 SWI_FLAVOR_TEXT:0 "La Suisse suit une stricte politique extérieure de puissance neutre, ce qui lui offre une certaine sécurité sur le théâtre politique européen. Préservera-t-elle sa neutralité ou choisira-t-elle une autre voie ?"
 HAN_FLAVOR_TEXT:0 "Bien que le royaume de Hanovre soit actuellement gouverné par la monarchie britannique, les différends liés à la succession du trône indiquent la fin imminente de cette union. Qu’adviendra-t-il du royaume de Hanovre ?"
 GERMAN_FLAVOR_TEXT:0 "Les États allemands font en pratique partie du Saint-Empire romain, mais l’Empire est très faible et ils agissent comme des États indépendants. Ces petits États peuvent-ils survivre ?"

