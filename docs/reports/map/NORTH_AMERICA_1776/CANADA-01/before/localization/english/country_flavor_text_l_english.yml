 MOD_FLAVOR_TEXT:1 "The Duchy of Modena is both ruled by, and politically subservient to, the Hapsburgs and the Austrian Empire. Will Modena shake off these chains of family loyalty, or do the ties that bind restrict too much?"
  
  # Germans
 BAV_FLAVOR_TEXT:0 "$GERMAN_FLAVOR_TEXT$"
 SWI_FLAVOR_TEXT:0 "Switzerland has a strict foreign policy as a neutral power, affording some degree of safety in the theatre of European politics. Will Switzerland preserve its neutrality, or strike a different path?"
 HAN_FLAVOR_TEXT:0 "Hanover through inheritence now rules over the British Empire, but is effectively a state in it's own right, will this luxirious position be kept?"
 GERMAN_FLAVOR_TEXT:0 "The German states in practice are apart of the Holy Roman Empire, but the Empire is very weak and they act like fully independent states, not even joining eachothers wars or sometimes fighting eachother! Can these small states survive under these ideals?"

