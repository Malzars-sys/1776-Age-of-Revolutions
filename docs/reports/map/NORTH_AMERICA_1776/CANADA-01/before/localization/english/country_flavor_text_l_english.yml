l_english:
  # Modded Countries
 IREK_FLAVOR_TEXT:0 "Ireland stands in uneasy union with Great Britain, bound by the Crown from across the Irish Sea. While the Irish Parliament sits in Dublin, its power is held by the Protestant Ascendancy. The Catholic majority is excluded from political life. Resentment simmers, reformers whisper of autonomy, radicals dream of a Republic. Can Great Britain keep it's influence?"

 DEI_FLAVOR_TEXT:0 "The Dutch East India Company has became a burning success and the jealousy of Europe with many pretenders, it's goal to monopolise trade routes and the spice trade. The Cape Colony originally supposed to be a trading post has expanded into a Settler Colony and it's became unrestful with the power hungry Boers, the Mughal Empire declining in India has other powers looking at Ceylon and certainly if it falls the East Indies would be next, can the Company come out on top?"

 DWI_FLAVOR_TEXT:0 "The Dutch West India Company has a charter monopoly on all places from the Americas to West Africa, it's primary purpose is to challenge the Portuguese and Spanish in the Atlantic and to exploit the rich resources of the Americas and partake in the trans-atlantic slave trade. Can the Company take the same prominence of the East India Company?"

 LOU_FLAVOR_TEXT:0 "Originally a French Colony has been handed over to Spain, right next to the rebellious colony of the United States, the Cajun population are wondering what is it's own place in the Spanish Empire?"

 PLC_FLAVOR_TEXT:0 "The Polish-Lithuanian Commonwealth once a European Great Power has declined to becoming almost a protectorate of Tsarist Russia. Polish Nobles declared an uprising to get rid of Russian influence but it failed. The power of the Nobles with their Veto in the Sejm Parliament, who are easily bribed and have old grudges against eachother, means making any decision is not only a challenge, but nigh impossible. Without reform and having no natural defences being on the European Plains and surrounded by several expansionist Empires, can it survive this century?"

 CRI_FLAVOR_TEXT:0 "The Crimean Khanate is all that remains of the Golden Horde, now under Ottoman protection, grown rich controlling the Black Sea trade routes and raiding neighbours for slaves, but the fun might come to a end as Russia eyes control of the lands. Can this old remnant of the Mongol Empire last?"

 VEN_FLAVOR_TEXT:0 "The Merchant Republic of Venice is going through a reactionary period because of a steep decline, loss of monopolised trade routes and barely holding everything together. Can Venice resurge and become the trading powerhouse of Europe again?"

 MLT_FLAVOR_TEXT:0 "The Soverign Military Order of Malta is the last of it's kind of Crusader States, the Knights and Church have a firm grip on it's island while nominally being under protection of the Bourbons. Will the strategically placed island maintain it's soverignty?"

 DUR_FLAVOR_TEXT:0 "The Durrani Empire, a patchwork of tribal Afghan confederacies, has burst out and made it's mark on the Middle East. Kabul and Kandahar serve as shifting centers of power, while Qandahar’s tribal councils, the Ghilzai and Abdali Pashtuns, hold the keys to legitimacy. Yet the empire’s foundations are brittle with Persia to the west, the Sikhs in Punjab, and the Marathas in India all eye the Durrani lands, will the Afghans grip weaken?"

 MARATH_FLAVOR_TEXT:0 "Fierce battle for hegemony over the Indian subcontinent is ongoing with the Maratha Confederacy becoming a major contender. The traditional way of light horseman raiding and looting for their pay has been upended with Europeans coming with their new technologies, Sepoys armed in the European style are more effective but costly, if Maratha can't afford to become a single hegemon can it atleast still keep a delicate balance of power in India?"
 
 # Base Game Countries
 
 GBR_FLAVOR_TEXT:0 "Great Britain had roared into the 18th Century winning the Seven Years War, protected by waters like a fortress with a navy that rules the seas it's in a priviledged position for Overseas Empire. But, alas. George III of Hannover is of increasingly senile mind and wants Parliament to fully take over ruling, the Thirteen Colonies in America have rebelled, supported by Spain and France, could this new threat end the British Empire?"

 BEL_FLAVOR_TEXT:0 "In Belgium the industrial revolution is in full swing. The yoke of Dutch oppression was cast aside just six years ago and the country is bounding ahead of their former masters, with the construction of the first railroad in continental Europe. What does the future hold for them?"

 CHI_FLAVOR_TEXT:1 "The Qing Dynasty has ruled in China for almost one hundred years and controls a third of the world's population, after the apex of its power under the Qianlong Emperor. However, isolationism and being surpassed technologically by European powers threatens the Dynasty’s period of internal balance. What will the future of China look like?"

 TIB_FLAVOR_TEXT:0 "The young Dalai Lama is the theocratic leader of Tibet. Will Buddhism remain at the center of political power, or will it be displaced?"

 FRA_FLAVOR_TEXT:0 "France has been licking it wounds since the humiliating defeat in the Seven Years War, losing colonial holdings in the Americas and India, resentment simmers under the Absolutist Bourbon Monarchy, can Louis XV pull France back on the right path as a Great Power or will France have a more liberal future?"

 RUS_FLAVOR_TEXT:0 "Catherine The Great seized the Russian throne and has all the beginnings of a Golden Age of Modernisation and Expansion, Russia has made itself known as a true European Great Power and from colonising Asiatic Tatar Lands is now the largest country on Earth, inspiring fear in it's foes and rumours start that it's simply invincible, will Russia live up to this reputation?"

 PRU_FLAVOR_TEXT:0 "Prussia is one of the technological and military strategy heartlands of the Holy Roman Empire, while being an independent Great Power at the same time from the burning successes of good rule and ingenious people. With sights firmly set on expansion, will Prussia continue along this path and perhaps even truly unite Germany?"

 JAP_FLAVOR_TEXT:0 "The Tokugawa Shogunate unified Japan under it's feudal lords, but the world is changing around isolationist Japan with European Powers looking to expand their influence, can Japan keep it's culture and sovereignty under the strong rule of the Samurai?"

 PER_FLAVOR_TEXT:0 "Persia is reeling from the devasatation of 40 long years of civil war, including the loss of territories and a new rival in the Duranni Empire, while Russia is looking to press further into the Caucuses which were historically in the Persian Sphere of Influence, but now a heroic figure Karim Khan Zand has taken control of the country and finally brought stability, but will it last past his death?"

 AUS_FLAVOR_TEXT:0 "Austria is de jure the Emperor of the Holy Roman Empire, but de facto the Empires decline and weakness is worrying, some say it's not Holy, nor Roman, nor an Empire anymore. Can Austria bring it back and possibly even unify the Empire or is it all lost?"

 USA_FLAVOR_TEXT:1 "The Thirteen Colonies have declared themselves as the newly independent United States of America. Does it gain liberty, or does it gain death?"

 TUR_FLAVOR_TEXT:0 "The Ottoman Empire has been on the backfoot since the failed siege of Vienna, Europeans sailed to the new world to forego Ottoman controlled Silk Road and Spice trade routes leading to a revenue decline and now just trying to maintain what it still has, now Egypt is worringly defying Ottoman grip. They say if you're not growing, you're dying, can the Ottomans survive or even thrive this era?"

 SPA_FLAVOR_TEXT:1 "Charles III boldly marched to Italy at the age of 18 to press his claims to the various thrones and did it without bloodshed, the experience learned from ruling Sicily and Naples for 25 years was valuable for now ruling the vast Spanish Empire. Charles has been a reformist leader and bringer of the enlightenment to Spain, increasing revenues to the crown, expanding the army and navy, while increasing his autocractic rule. Although now chucking his weight behind the American Revolution, can Spain control it's own holdings in the Americas, which it so depends on?"

 BRZ_FLAVOR_TEXT:0 "Brazil is Portugals most prized colonial posession, large and extremely rich in resources. Although Colonial Rule has became increasingly unpopular, Colonial Mercantalism makes it so Brazils trade surplus goes to Portugal, where the raw materials are made into finished goods and sold on from Portuguese ports, giving limited economic oppurtunities for Brazilians, will Brazil get an upgrade to Kingdom status or go it's own way?"

 MEX_FLAVOR_TEXT:0 "New Spain is one of the brightest jewels of the Spanish Crown, a absolutely huge landmass to be exploited and settle. Will they stay loyal with the rebellious United States next door?"

 NET_FLAVOR_TEXT:0 "Netherlands stands at the heart of Europe next to one of the busiest Shipping Routes in the world the English Channel, despite it's small size it has a sizeable overseas Empire through it's companies, although it has slowly lost it's previous dominance of world trade to Great Britain and Great Power status, could it still make a resurgence?"

 POR_FLAVOR_TEXT:0 "Portugal has a vast Empire, but it needs vast protection, already the Dutch has taken Ceylon and the East Indies. Can care be taken and even perhaps come back stronger?"

 SAR_FLAVOR_TEXT:0 "Ruled by the House of Savoy and nestled between Europe’s great powers, Sardinia-Piedmont uses both careful diplomacy and a capable army to survive, can this small Kingdom gain grand ambitions and perhaps unify Italy?"

 PAN_FLAVOR_TEXT:0 "The Sikh Empire is in a period of conquest, winning engagement after engagement. But what does the future hold for this empire?"

 DENNOR_FLAVOR_TEXT:0 "Denmark-Norway has been formed as a Unitary state and pushes above it's weight in trade, controlling narrow straits, with colonies in Africa and even India, using it's neutral status as a prime business opportunity. Recently the Great Powers have recognised it's trading monopoly over Greenland, can Denmark-Norway continue it's successes?"

 SWE_FLAVOR_TEXT:0 "Sweden has been losing Great Power status after intense clashes with Russia and it's coalition partners, losing the baltics and Karelia in The Great Northern Wars. Will Sweden reclaim it or is it gone forever?"
  
  # South-East Asia
 LAN_FLAVOR_TEXT:0 "The Republic of Lanfang was established by a democratic syndicate of Chinese miners hoping to exploit the gold reserves of Borneo. Can Lanfang resist the advances of the Dutch and achieve the prosperity it seeks?"
 ACE_FLAVOR_TEXT:0 "The Aceh Sultanate is experiencing a resurgence in power due to the efforts of the Raja Muda. Can Aceh restore its empire and assert its independence in the face of Dutch expansion?"
 BRU_FLAVOR_TEXT:0 "Brunei has so far repelled the attempts of colonial powers to infringe upon its sovereignty. Will Brunei fall into decline and obscurity, or could it once more become a regional power?"
 JOH_FLAVOR_TEXT:0 "Johor occupies a precarious position as both the British and the Dutch greedily eye their territory. Will Johor manage to retain what little sovereignty it has left?"
 SIA_FLAVOR_TEXT:0 "Siam has established itself as the dominant regional power in South-East Asia under the Rattanakosin dynasty. But will Siam manage to reform its economy and society for the modern age?"
 DAI_FLAVOR_TEXT:0 "A newly reunited Vietnam emerges from centuries of division and strife. Will Dai Nam consolidate itself and build a great nation, or is it destined to be divided once more?"
 BUR_FLAVOR_TEXT:0 "It took many bloody conflicts to establish the Third Burmese Empire, and it seems that the struggle is far from over as the British Empire makes its ambitions known. Will Burma become yet another British colony, or will it stand strong against the foreign invaders?"
 CAM_FLAVOR_TEXT:0 "Cambodia has fallen far since the golden age of the Khmer Empire. Can the Khmer state rise once more, or will this dark age last forever?"
 LUA_FLAVOR_TEXT:0 "Once the seat of the mighty Kingdom of Lan Xang, Luang Prabang is a shadow of its former self. Split between the regional powers of Dai Nam and Siam, can the Lao people emerge strong and independent?"
  
  # Australia
 UNT_FLAVOR_TEXT:0 "$GENERIC_FLAVOR_TEXT$"
 NSW_FLAVOR_TEXT:0 "In its transition from penal colony to Crown Colony, New South Wales has seen its territory reduced as the other provinces gained their own administrations. What does the future hold for Australia?"
 SAS_FLAVOR_TEXT:0 "South Australia was granted its own administration only two years ago, separating from New South Wales. What does the future hold for Australia?"
 WAS_FLAVOR_TEXT:0 "The Swan River colonists impose upon the traditional lands of the aboriginal people, culminating in the Pinjarra massacre only two years ago. How will the colony settle this conflict?"
 TAS_FLAVOR_TEXT:0 "Van Diemen's Land is the primary penal colony in British Australia. What does the future hold for this colony of convicts?"

  # Balkans
 SER_FLAVOR_TEXT:0 "Serbia has been under Ottoman control for centuries and despises Ottoman rule. Wedged between great powers, will Serbia become the powder keg of Europe?"
 GRE_FLAVOR_TEXT:0 "Through a bloody struggle, Greece has won its independence from the Ottoman Empire. Can Greece expand its borders?"
 WAL_FLAVOR_TEXT:0 "Calls for Romanian unification and political independence complicate regional politics, as both Russia and the Ottomans have an interest in enforcing the status quo. Can Romania win its freedom?"
 MOL_FLAVOR_TEXT:0 "Calls for Romanian unification and political independence complicate regional politics, as both Russia and the Ottomans have an interest in enforcing the status quo. Can Romania win its freedom?"
 ION_FLAVOR_TEXT:0 "The Islands have passed from Ottoman to Russian, French and finally British control within the past 30 years. Can the Islanders achieve Enosis with the new Greek state or will they seek a new path forward under British guidance?"
  
  # Italy
 PAP_FLAVOR_TEXT:0 "Though the political power of the Catholic Church has waned over the centuries, the Pope still presides over the Papal States. Does faith still rule the hearts of men?"
 TUS_FLAVOR_TEXT:0 "$GENERIC_FLAVOR_TEXT$"
 SIC_FLAVOR_TEXT:0 "Sicily and Naples is ruled by a Cadet Branch of the Bourbons, nominally under Spanish control. Can this Kingdom use this powerful Familial Alliance to rise the ranks?"
