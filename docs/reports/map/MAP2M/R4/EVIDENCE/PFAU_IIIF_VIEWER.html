<body>
<div id="securedContent"  class="contentIE" >   <link rel="stylesheet" type="text/css" href="https://mirabilia.amu.edu.pl/formats/iiif/uv.css">
<script type="text/javascript" src="https://mirabilia.amu.edu.pl/formats/iiif/umd/UV.js"></script>

<style>
	html, body, #securedContent, .uv {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		background: #000;
	}

	iframe {
		vertical-align: top
	}

	.uv .mainPanel {
		padding-bottom: 0px;
	}

	.uv .overlay.adjustImage input[type="range"] {
		width: 300px;
	}

	.uv-iiif-extension-host.uv-openseadragon-extension .centerPanel .content .annotationRect {
		background-color: #880;
	}

	.uv-iiif-extension-host.uv-openseadragon-extension .centerPanel .content .annotationRect.current {
		background-color: #830;
	}

	.uv .footerPanel .searchResults {
		z-index: 20;
	}
}
</style>






<div id="uv" class="uv"></div>

<script>
	const data = {
		root: "https://mirabilia.amu.edu.pl/formats/iiif",
		manifest: "https://mirabilia.amu.edu.pl/iiif/manifest/588634.json",
		canvasIndex: 0,
		locales: [{name: "en-GB"}]
	};

	uv = UV.init("uv", data);

	uv.on("configure", function ({ config, cb }) {
		cb({
			options: {
				rightPanelEnabled: false,
				zoomToBoundsEnabled: false
			},
			modules: {
				footerPanel: {
					options: {
						downloadEnabled: true
					}
				},
				mobileFooterPanel: {
					options: {
						downloadEnabled: true
					}
				},
				searchFooterPanel: {
					options: {
						downloadEnabled: true
					}
				}
			}
		});
	});
</script>

</div>
<div id="info">
</div>
