l_french:
 building_aor1776_visual_rail_probe: "PROTOTYPE — Témoin ferroviaire"
 building_aor1776_visual_rail_probe_desc: "Témoin technique sans production, emplois ni apport d’infrastructure. Un niveau sert uniquement à tester le déclenchement des rails par le moteur. Ne pas utiliser dans une vraie campagne."
 bg_aor1776_visual_rail_probe: "PROTOTYPE — Diagnostic ferroviaire"
 pmg_aor1776_visual_rail_probe: "Diagnostic du paysage"
 pm_aor1776_visual_rail_probe: "Témoin sans activité économique"
 aor1776_ilp_force_rails: "PROTOTYPE — Forcer le témoin ferroviaire dans la capitale"
 aor1776_ilp_force_rails_desc: "Crée un témoin de niveau 1 sans changer le PM ni les infrastructures économiques. Observer les rails au sol, pas seulement les trains. Les rails ne sont pas garantis : c’est le point testé."
 aor1776_ilp_remove_rails: "PROTOTYPE — Retirer le témoin ferroviaire de la capitale"
 aor1776_ilp_remove_rails_desc: "Retire uniquement le bâtiment de diagnostic. Les vrais bâtiments restent intacts. Vérifier si les rails disparaissent ; patienter puis dézoomer et rezoomer."
 aor1776_ilp_auto_rails: "PROTOTYPE — Revenir au suivi automatique des PM"
 aor1776_ilp_auto_rails_desc: "Dans la capitale, le témoin sera présent seulement si les infrastructures régionales utilisent un véritable PM ferroviaire. Les autres États sont déjà suivis automatiquement."
