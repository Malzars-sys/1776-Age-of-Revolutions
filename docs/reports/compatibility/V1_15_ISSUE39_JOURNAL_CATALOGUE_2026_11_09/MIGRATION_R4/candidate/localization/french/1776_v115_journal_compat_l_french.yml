l_french:
 je_5_year_plan:0 "Le plan quinquennal"
 je_5_year_plan_reason:0 "Le gouvernement veut donner une direction commune à l’économie. La croissance doit soutenir cet effort sans épuiser les finances du pays."
 je_australia_aus:0 "La fédération australienne"
 je_australia_aus_reason:0 "Les territoires australiens restent partagés entre plusieurs administrations. Leur réunion donnerait à la fédération une assise durable."
 je_australia_gbr:0 "Unir les colonies australiennes"
 je_australia_gbr_reason:0 "Les colonies australiennes entretiennent des liens étroits, mais restent gouvernées séparément. Leur réunion sous une même administration ouvrirait la voie à une fédération."
 je_caucasian_war_circassia:0 "La résistance circassienne"
 je_caucasian_war_circassia_reason:0 "La présence russe dans le Kouban menace notre indépendance. La résistance doit obtenir son retrait pour assurer l’avenir du pays."
 je_caucasian_war_imamate:0 "La résistance de l’imamat"
 je_caucasian_war_imamate_reason:0 "L’indépendance de l’imamat reste liée au sort des territoires du Caucase. Le retrait des forces russes donnerait à notre résistance une issue durable."
 je_codify_chinese_border:0 "Fixer la frontière avec la Chine"
 je_codify_chinese_border_reason:0 "Les possessions et les revendications se chevauchent le long de la frontière. Un règlement durable exige une autorité territoriale claire et la fin des prétentions concurrentes."
 je_communist_welfare:0 "Le bien-être socialiste"
 je_communist_welfare_reason:0 "Le nouvel ordre doit assurer davantage que la seule transformation du pouvoir. Écoles, soins, retraites et protection des travailleurs donneront un contenu concret à ses promesses."
 je_consolidate_afghanistan_objective:0 "Consolider les frontières afghanes"
 je_consolidate_afghanistan_objective_reason:0 "Les rivalités autour de l’Afghanistan rendent son avenir incertain. Un État établi et des frontières stabilisées dans la région offriraient une base plus solide au règlement."
 je_consolidate_central_asia:0 "Consolider l’Asie centrale"
 je_consolidate_central_asia_reason:0 "Les conquêtes et les accords ne suffisent pas à établir une autorité durable. Les territoires d’Asie centrale doivent former un ensemble que le gouvernement puisse réellement administrer."
 je_pacify_kazakh_steppes:0 "Pacifier les steppes kazakhes"
 je_pacify_kazakh_steppes_reason:0 "Le sort des steppes reste disputé. L’issue de la campagne déterminera si le gouvernement peut y affermir son autorité."
 je_secure_persian_border:0 "Sécuriser la frontière persane"
 je_secure_persian_border_reason:0 "La situation du Caucase entretient l’incertitude le long de la frontière persane. Le règlement de ce conflit doit donner une assise durable à notre position."
 je_terakoya:0 "Développer l’enseignement"
 je_terakoya_reason:0 "Le réseau scolaire doit s’étendre au-delà des initiatives locales. Un enseignement mieux organisé donnera à cette entreprise une assise durable."
 je_the_paris_commune_communards:0 "Défendre la Commune"
 je_the_paris_commune_communards_reason:0 "Le pouvoir de la Commune demeure contesté. Ses partisans doivent affermir leur position face aux forces qui veulent rétablir l’ancien gouvernement."
 je_the_paris_commune_france:0 "Rétablir l’autorité à Paris"
 je_the_paris_commune_france_reason:0 "La Commune conteste l’autorité du gouvernement. Le règlement de cette lutte décidera qui gouvernera Paris et quel ordre pourra s’y maintenir."
 je_unify_afghanistan_objective:0 "Unifier l’Afghanistan"
 je_unify_afghanistan_objective_reason:0 "Les pouvoirs rivaux empêchent l’établissement d’une autorité commune. La réunion du pays doit transformer ces ambitions dispersées en un seul État."
 je_vanguard:0 "L’avant-garde révolutionnaire"
 je_vanguard_reason:0 "Le nouvel ordre cherche une direction politique capable de le maintenir. Rassembler ses soutiens au sein des groupes influents doit affermir le régime."
