l_english:
 je_5_year_plan:0 "The Five-Year Plan"
 je_5_year_plan_reason:0 "The government seeks to give the economy a common direction. Growth must sustain this effort without exhausting the country’s finances."
 je_australia_aus:0 "Australian Federation"
 je_australia_aus_reason:0 "The Australian territories remain divided between several administrations. Their union would give the federation a lasting foundation."
 je_australia_gbr:0 "Uniting the Australian Colonies"
 je_australia_gbr_reason:0 "The Australian colonies share close ties but remain separately governed. Bringing them under one administration would open the way to a federation."
 je_caucasian_war_circassia:0 "Circassian Resistance"
 je_caucasian_war_circassia_reason:0 "The Russian presence in the Kuban threatens our independence. The resistance must secure its withdrawal to safeguard the country’s future."
 je_caucasian_war_imamate:0 "Resistance of the Imamate"
 je_caucasian_war_imamate_reason:0 "The independence of the imamate remains bound to the fate of the Caucasian territories. A Russian withdrawal would give our resistance a lasting settlement."
 je_codify_chinese_border:0 "Settling the Chinese Frontier"
 je_codify_chinese_border_reason:0 "Possessions and claims overlap along the frontier. A lasting settlement requires clear territorial authority and an end to competing claims."
 je_communist_welfare:0 "Socialist Welfare"
 je_communist_welfare_reason:0 "The new order must deliver more than a change of power. Schools, healthcare, pensions and protection for workers will give substance to its promises."
 je_consolidate_afghanistan_objective:0 "Consolidating Afghan Borders"
 je_consolidate_afghanistan_objective_reason:0 "Rivalries surrounding Afghanistan leave its future uncertain. An established state and a settled regional frontier would provide a firmer basis for an agreement."
 je_consolidate_central_asia:0 "Consolidating Central Asia"
 je_consolidate_central_asia_reason:0 "Conquests and agreements alone cannot establish lasting authority. The Central Asian territories must form a domain that the government can effectively administer."
 je_pacify_kazakh_steppes:0 "Pacifying the Kazakh Steppes"
 je_pacify_kazakh_steppes_reason:0 "Control of the steppes remains contested. The outcome of the campaign will determine whether the government can consolidate its authority there."
 je_secure_persian_border:0 "Securing the Persian Frontier"
 je_secure_persian_border_reason:0 "The situation in the Caucasus sustains uncertainty along the Persian frontier. A settlement of the conflict must give our position a lasting foundation."
 je_terakoya:0 "Developing Education"
 je_terakoya_reason:0 "The school system must extend beyond local initiatives. Better-organized education will give this undertaking a lasting foundation."
 je_the_paris_commune_communards:0 "Defending the Commune"
 je_the_paris_commune_communards_reason:0 "The Commune’s authority remains contested. Its supporters must strengthen their position against the forces seeking to restore the former government."
 je_the_paris_commune_france:0 "Restoring Authority in Paris"
 je_the_paris_commune_france_reason:0 "The Commune challenges the government’s authority. The outcome of this struggle will decide who governs Paris and what order can endure there."
 je_unify_afghanistan_objective:0 "Unifying Afghanistan"
 je_unify_afghanistan_objective_reason:0 "Rival powers prevent the establishment of a common authority. Uniting the country must bring these competing ambitions into a single state."
 je_vanguard:0 "The Revolutionary Vanguard"
 je_vanguard_reason:0 "The new order needs political leadership capable of sustaining it. Rallying its supporters among the influential groups must strengthen the regime."
