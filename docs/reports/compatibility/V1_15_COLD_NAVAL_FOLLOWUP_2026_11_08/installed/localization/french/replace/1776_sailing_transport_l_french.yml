 ship_type_early_troop_ship:0 "Cogue"
 ship_type_early_troop_ship_desc:0 "Navire marchand des mers du Nord et de la Baltique, la cogue a accompagné l'essor du commerce hanséatique au Moyen Âge. Sa coque et sa cale accueillent des cargaisons importantes. Réquisitionnée par la marine, elle transporte troupes, vivres et matériel et soutient les débarquements."
