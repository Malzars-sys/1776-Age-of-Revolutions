 aor1776_japan_granary_policy_tt:0 "Reserve purchases temporarily withdraw grain from the market and can raise its price. Every currently owned state receives a permanent granary network, granting +15 percentage points of food security. This buffers hunger without changing the weather or fixing food prices."
 aor1776_japan_domain_stocks_tt:0 "The domains must withdraw grain from the market for one year to establish reserves. They can only be released after procurement is complete."
 aor1776_japan_reserves_ready_tt:0 "Grain reserves have been established and procurement is complete."
 aor1776_japan_release_tt:0 "Reserved grain is released onto the market for one year. This uses up the available emergency reserves; any permanent granary network remains in place."
