l_french:
 pmg_aor1776_utensils:0 "Fabrication de quincaillerie"
 pm_aor1776_no_utensils:0 "Aucune fabrication de quincaillerie"
 pm_aor1776_no_utensils_desc:0 "Les ateliers se consacrent à leur production habituelle de meubles."
 pm_aor1776_wrought_iron_utensils:0 "Quincaillerie forgée et moulée"
 pm_aor1776_wrought_iron_utensils_desc:0 "Les forgerons façonnent des crochets et des tisonniers en fer, tandis que les fondeurs coulent des boutons, des ferrures et des ustensiles en alliage."
 pm_aor1776_copper_brass_utensils:0 "Quincaillerie de cuivre et laiton"
 pm_aor1776_copper_brass_utensils_desc:0 "Les chaudronniers travaillent le cuivre, tandis que les fondeurs coulent des bougeoirs et des ferrures en alliage. Les pièces en fer complètent cet assortiment domestique."
 pm_aor1776_machined_utensils:0 "Quincaillerie usinée"
 pm_aor1776_machined_utensils_desc:0 "Les tours et les outils mécaniques façonnent des pièces régulières en acier, en cuivre et en alliage. Le plomb sert aux poids et aux garnitures de petits objets domestiques."
 pm_aor1776_industrial_utensils:0 "Quincaillerie industrialisée"
 pm_aor1776_industrial_utensils_desc:0 "Des ateliers spécialisés fabriquent en série des ustensiles en aluminium, des accessoires en acier et des objets en cuivre ou en alliage. Des poids en plomb complètent leur assortiment."
 pm_aor1776_bronze_artillery:0 "Artillerie en bronze"
 pm_aor1776_bronze_artillery_desc:0 "Les fondeurs coulent les tubes des canons en bronze. Les affûts et leurs ferrures emploient du bois dur et du fer."
 aor1776_hardware:0 "Quincaillerie"
 aor1776_hardware_desc:0 "Ustensiles, ferrures, couverts et petits objets métalliques d'usage courant dans les foyers et les ateliers."
 goods_output_aor1776_hardware_add:0 "Production de quincaillerie @aor1776_hardware!"
 goods_output_aor1776_hardware_add_desc:0 "La quantité de quincaillerie @aor1776_hardware! produite par les bâtiments."
