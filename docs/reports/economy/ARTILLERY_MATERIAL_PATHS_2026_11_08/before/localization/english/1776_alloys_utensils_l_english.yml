l_english:
 pmg_aor1776_utensils:0 "Hardware Manufacturing"
 pm_aor1776_no_utensils:0 "No Hardware Manufacturing"
 pm_aor1776_no_utensils_desc:0 "The workshops concentrate on their usual furniture production."
 pm_aor1776_wrought_iron_utensils:0 "Forged and Cast Hardware"
 pm_aor1776_wrought_iron_utensils_desc:0 "Smiths forge iron hooks and pokers while founders cast alloy knobs, fittings and utensils."
 pm_aor1776_copper_brass_utensils:0 "Copper and Brass Hardware"
 pm_aor1776_copper_brass_utensils_desc:0 "Coppersmiths shape copper vessels while founders cast alloy candlesticks and fittings. Iron pieces complete this assortment of household goods."
 pm_aor1776_machined_utensils:0 "Machined Hardware"
 pm_aor1776_machined_utensils_desc:0 "Lathes and mechanical tools shape uniform steel, copper and alloy parts. Lead supplies weights and fittings for small household objects."
 pm_aor1776_industrial_utensils:0 "Industrial Hardware"
 pm_aor1776_industrial_utensils_desc:0 "Specialized workshops turn out aluminium utensils, steel accessories and copper or alloy objects in series. Lead weights complete their assortment."
 pm_aor1776_bronze_artillery:0 "Bronze Artillery"
 pm_aor1776_bronze_artillery_desc:0 "Founders cast bronze gun barrels. The carriages and their fittings use hardwood and iron."
 aor1776_hardware:0 "Hardware"
 aor1776_hardware_desc:0 "Utensils, fittings, cutlery and small metal objects used daily in households and workshops."
