<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <!-- Auxiliary geometry guide, not a game asset. One orthographic cylindrical axis. -->
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b68b4c"/>
      <stop offset="0.42" stop-color="#caa16a"/>
      <stop offset="1" stop-color="#514131"/>
    </linearGradient>
  </defs>
  <rect width="1254" height="1254" fill="#eee9df"/>
  <g transform="translate(430 540) rotate(-2.5)" stroke="#312d27" stroke-width="4">
    <!-- Back face is hidden. Only its left silhouette is visible. -->
    <path d="M 0 -140 L 600 -140 A 50 140 0 0 1 600 140 L 0 140 A 50 140 0 0 1 0 -140 Z" fill="url(#bronze)"/>
    <!-- All hoops are parallel cross-sections of the same cylinder. -->
    <g fill="none" stroke="#58452e" stroke-width="12">
      <path d="M 120 -140 A 50 140 0 0 0 120 140"/>
      <path d="M 225 -140 A 50 140 0 0 0 225 140"/>
      <path d="M 565 -140 A 50 140 0 0 0 565 140"/>
    </g>
    <path d="M 135 -140 v -18 a 20 20 0 0 1 40 0 v 18" fill="none" stroke-width="9"/>
    <path d="M 285 -140 v -18 a 20 20 0 0 1 40 0 v 18" fill="none" stroke-width="9"/>
    <ellipse cx="600" cy="0" rx="50" ry="140" fill="#a88249"/>
    <ellipse cx="600" cy="0" rx="34" ry="105" fill="#292827"/>
    <!-- Diagram guide only: coaxial bore, muzzle, closed breech. -->
    <path d="M -45 0 H 660" fill="none" stroke="#3d7387" stroke-width="3" stroke-dasharray="13 10"/>
  </g>
</svg>
